<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Infographic Viewer</title>
<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t); }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* The binding chart as a normal canvas WIDGET (Sub, 2026-07-24) instead of the old full-screen
     always-click-through window: it's a reference you glance at, so it should be a panel you place
     and size like everything else. The old full-screen window still exists behind the same hotkey
     for anyone who wants the whole-screen version.
     Theme tokens + surface treatments come from the shared /widget-theme.css. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 620px; height: 340px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    /* Fill, border tint, shadow and blur live in widget-theme.css (#panel.wpanel), which
       multiplies each one's alpha by --wsurf so the panel fades independently of its text. */
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  .head { flex: none; display: flex; align-items: center; gap: 7px; padding: 7px 10px 7px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .dia { width: 7px; height: 7px; flex: none; background: var(--cyan-bright); transform: rotate(45deg);
    box-shadow: 0 0 8px var(--cyan); }
  .h-title { flex: 1; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--cyan-text); }
  .hbtn { font-family: var(--sans); font-size: 10px; font-weight: 600; color: var(--cyan-bright);
    background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 7px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.active { background: rgba(var(--accent-rgb), 0.28); border-color: var(--cyan); }

  /* The chart itself. "Fit" letterboxes the whole chart into the widget; "1:1" shows it at native
     size and lets you pan — a dense binding chart is unreadable shrunk to a small panel. */
  #wrap { flex: 1; min-height: 0; overflow: auto; position: relative; z-index: 4; }
  #wrap.fit { overflow: hidden; display: grid; place-items: center; }
  #chart { display: block; }
  #wrap.fit #chart { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  #wrap.actual #chart { max-width: none; max-height: none; }
  .empty { padding: 30px 20px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.8; }
  .empty b { color: var(--cyan-dim); }
</style>
</head>
<body>
  <div id="panel" class="wpanel">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title">Infographic Viewer</span>
      <button id="fitBtn" class="hbtn active" type="button" title="Fit the whole chart into the widget">Fit</button>
      <button id="oneBtn" class="hbtn" type="button" title="Show at full size and scroll around it">1:1</button>
      <button id="reloadBtn" class="hbtn" type="button" title="Re-read the PNG from disk">⟳</button>
      <button id="swapBtn" class="hbtn" type="button" title="Choose a different image" style="display:none">Change…</button>
    </div>
    <div id="wrap" class="fit">
      <img id="chart" alt="Binding chart" />
      <div class="empty" id="emptyState" style="display:none">
        No infographic picked yet.<br>
        <span id="pickWrap" style="display:none"><button id="pickBtn" class="hbtn" type="button" style="margin-top:12px">Choose a PNG…</button></span>
        <span id="pickHint">Choose a PNG in <b>Settings</b>, then it shows up here.</span>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  // 🔑 __bindingChartHost, not __bindingHost. The canvas exposes the bridge as
  // "__" + the registry KEY + "Host", and this widget's key is bindingChart — so every call
  // through here had been a silent no-op since the bridge was introduced (optional chaining
  // meant summoning the global cog just quietly did nothing). Found 2026-08-11 while giving
  // this widget its own PNG picker, which needs the bridge to work.
  const host = () => (EMBEDDED && window.parent) ? window.parent.__bindingChartHost : null;

  // The sidecar serves the user's chosen PNG; bust the cache so a re-exported chart shows up.
  function reload() {
    const img = $("chart");
    img.src = "/api/binding-image?v=" + Date.now();
  }
  $("chart").addEventListener("load", () => {
    $("chart").style.display = "";
    $("emptyState").style.display = "none";
    $("swapBtn").style.display = canPick() ? "" : "none";
  });
  $("chart").addEventListener("error", () => {
    // 404 = no bindingPng configured yet.
    $("chart").style.display = "none";
    $("emptyState").style.display = "";
    $("swapBtn").style.display = "none";
    // Re-checked here, not only at parse time: this page can finish loading before the canvas has
    // published its host bridge, and the empty state is exactly when the button matters.
    armPicker();
  });

  // ── Choosing the image, from the widget itself ──────────────────────────────────────────
  // It used to be a row in global Settings; it belongs to the thing it fills. Only offered when
  // there is a shell to open a file dialog — standalone (a browser source, the product page) the
  // page can only tell you where to go, so the empty state keeps its original wording there.
  const canPick = () => typeof host()?.pickPng === "function";
  function armPicker() {
    const on = canPick();
    $("pickWrap").style.display = on ? "" : "none";
    $("pickHint").style.display = on ? "none" : "";
  }
  $("pickBtn").addEventListener("click", async () => {
    host()?.summonCog?.();
    const p = await host()?.pickPng?.();
    if (p) reload();            // the host has already saved it
  });
  $("swapBtn").addEventListener("click", async () => {
    host()?.summonCog?.();
    const p = await host()?.pickPng?.();
    if (p) reload();
  });
  armPicker();

  function setMode(fit) {
    $("wrap").classList.toggle("fit", fit);
    $("wrap").classList.toggle("actual", !fit);
    $("fitBtn").classList.toggle("active", fit);
    $("oneBtn").classList.toggle("active", !fit);
  }
  $("fitBtn").addEventListener("click", () => setMode(true));
  $("oneBtn").addEventListener("click", () => setMode(false));
  $("reloadBtn").addEventListener("click", reload);
  // Re-read whenever the widget is shown again, so a changed PNG is picked up without a restart.
  window.__bindingReload = reload;

  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  reload();
  try { host()?.ready?.(); } catch { /* not embedded */ }
</script>
</body>
</html>
