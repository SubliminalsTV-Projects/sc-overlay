<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Twitch Chat</title>
<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t); }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Twitch chat rendered in OUR design language — not Twitch's embed. Messages arrive over
     Twitch's anonymous IRC-over-WebSocket (no login, no API key, works for any viewer), and
     every row is our own markup, so the widget reads as part of the overlay.
     (Mission Control's chat overlay takes chat off a LOCAL Streamer.bot socket, which only the
     broadcaster has — hence IRC here. The emote/badge treatment follows MC's.)
     Theme tokens come from the shared /widget-theme.css. */
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 340px; height: 460px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    /* Fill, border tint, shadow and blur live in widget-theme.css (#panel.wpanel), which
       multiplies each one's alpha by --wsurf so the panel fades independently of its text. */
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  /* Scanlines / Esperia mesh / Origin stitching come from the shared widget-theme.css
     via .wpanel, so every widget carries the theme's surface treatment. */
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  /* Header — a live dot doubles as the connection state. */
  .head { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; min-height: 40px; }
  .dia { width: 7px; height: 7px; flex: none; background: var(--faint); transform: rotate(45deg); transition: background 0.3s; }
  #panel.on .dia { background: var(--cyan-bright); box-shadow: 0 0 8px var(--cyan); }
  #chanTag { flex: 1; font-size: 12px; font-weight: 600; color: var(--gold); overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .hbtn { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.sm { padding: 4px 7px; font-size: 10px; }
  .hbtn.active { background: rgba(var(--accent-rgb), 0.28); border-color: var(--cyan); }

  /* Message list */
  #log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 4;
    padding: 6px 0; font-size: var(--chat-fs, 12.5px); line-height: 1.5; }
  .msg { padding: 3px 12px; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg:hover { background: rgba(var(--accent-rgb), 0.05); }
  .msg .nm { font-weight: 700; color: var(--cyan-bright); }
  .msg .sep { color: var(--faint); margin-right: 3px; }
  .msg .tx { color: var(--cyan-text); }
  .msg.action .tx { font-style: italic; color: var(--cyan-bright); }
  .msg img.em { height: calc(var(--chat-fs, 12.5px) * 1.6); vertical-align: middle; margin: 0 1px; }
  /* Badges are drawn as small themed chips rather than Twitch's images — resolving badge art
     needs an API key, and chips sit better in the HUD anyway. */
  .bdg { display: inline-block; font-size: 8.5px; font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; border-radius: 3px; padding: 1px 3px; margin-right: 3px;
    vertical-align: middle; color: #06121a; background: var(--cyan-dim); }
  .bdg.b { background: var(--red); color: #1a0603; }        /* broadcaster */
  .bdg.m { background: var(--green); color: #04170f; }       /* moderator */
  .bdg.v { background: #C486FF; color: #16061f; }            /* vip */
  .bdg.s { background: var(--gold); color: #1a1204; }        /* subscriber */
  /* System notices (connecting, joined, errors) read as quiet italics. */
  .sys { padding: 3px 12px; font-size: 11px; color: var(--faint); font-style: italic; }

  /* Send box — only usable once the user links a Twitch login (see the note in setup). */
  #sendbar { flex: none; display: none; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--divider);
    position: relative; z-index: 4; }
  #panel.cansend #sendbar { display: flex; }
  #sendInput { flex: 1; min-width: 0; font-family: var(--sans); font-size: 12px; color: var(--cyan-bright);
    background: rgba(0, 0, 0, 0.25); border: 1px solid var(--divider); border-radius: 6px;
    padding: 6px 8px; outline: none; }
  #sendInput:focus { border-color: var(--cyan); }
  #sendInput::placeholder { color: var(--faint); }

  /* Setup / empty state — also the "change channel" form. */
  #setup { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center;
    gap: 10px; padding: 22px 18px; overflow-y: auto;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bot)); z-index: 5; }
  #panel.setup #setup { display: flex; }
  #setup .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  #setup .hint { font-size: 11px; line-height: 1.6; color: var(--cyan-dim); }
  #chanInput { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--cyan-bright);
    background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 10px; outline: none; width: 100%; }
  #chanInput:focus { border-color: var(--cyan); }
  #chanInput::placeholder { color: var(--faint); font-weight: 500; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .hbtn { flex: 1; text-align: center; padding: 8px 10px; }

  /* Sign-in block. Reading chat never needs an account — this exists only to unhide the send bar,
     so it sits below the channel form and stays out of the way until someone wants it. */
  .acct { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--divider);
    margin-top: 4px; padding-top: 12px; }
  /* The device code the user types on twitch.tv/activate — big enough to read off a second
     monitor, and selectable so it can be copied even though everything else in the chrome isn't. */
  #acctCode { display: none; user-select: text; -webkit-user-select: text;
    font-family: var(--mono); font-size: 21px; font-weight: 700; letter-spacing: 0.2em;
    text-align: center; color: var(--cyan-bright); background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border); border-radius: 7px; padding: 9px 6px; }
</style>
</head>
<body>
  <div id="panel" class="wpanel setup">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title">Chat</span>
      <span id="chanTag" class="h-sub"></span>
      <button id="fsDown" class="hbtn sm" type="button" title="Smaller text">A−</button>
      <button id="fsUp" class="hbtn sm" type="button" title="Larger text">A+</button>
      <button id="chanBtn" class="hbtn sm" type="button" title="Change channel">⌕</button>
    </div>

    <div id="log"></div>

    <div id="sendbar">
      <input id="sendInput" type="text" placeholder="Send a message…" maxlength="480" autocomplete="off" spellcheck="false" />
      <button id="sendBtn" class="hbtn sm" type="button">Send</button>
    </div>

    <div id="setup">
      <div class="lbl">Twitch channel</div>
      <input id="chanInput" type="text" placeholder="e.g. subliminalstv" maxlength="40" spellcheck="false" autocomplete="off" />
      <div class="row">
        <button id="typeBtn" class="hbtn" type="button" title="Typing mode: grab keyboard focus so you can type in-game">✎ Type mode</button>
        <button id="saveBtn" class="hbtn" type="button">Read chat</button>
      </div>
      <div class="hint">Read any live channel's chat, styled to match the overlay. Use <b>✎ Type mode</b> to enter the name without alt-tabbing out of the game.</div>

      <div class="acct">
        <div class="lbl">Sending</div>
        <div id="acctMsg" class="hint"></div>
        <div id="acctCode"></div>
        <div class="row">
          <button id="acctBtn" class="hbtn" type="button"></button>
          <button id="acctAlt" class="hbtn" type="button"></button>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__twitchChatHost : null;

  const MAX_ROWS = 250;      // trim the DOM so a busy channel can't grow unbounded
  const EMOTE_TTL = 10 * 60_000;

  let channel = "";
  let ws = null;
  let reconnectAt = 1000;    // backoff, reset on a clean connect
  let reconnectTimer = null;
  let thirdParty = {};       // 7TV/BTTV/FFZ  name -> image url
  let fontScale = 1;

  // ── helpers ──────────────────────────────────────────────────────────────────
  // Twitch logins are alphanumeric + underscore. Accept a pasted URL or an @handle too.
  function normalizeChannel(raw) {
    let s = String(raw || "").trim();
    s = s.replace(/^https?:\/\/(www\.)?twitch\.tv\//i, "").replace(/^@/, "");
    s = s.split(/[/?#]/)[0];
    return /^[A-Za-z0-9_]{2,40}$/.test(s) ? s.toLowerCase() : "";
  }
  const atBottom = () => {
    const el = $("log");
    return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  };
  function append(node) {
    const el = $("log");
    const stick = atBottom();       // only auto-scroll if the reader hasn't scrolled up
    el.appendChild(node);
    while (el.childElementCount > MAX_ROWS) el.removeChild(el.firstChild);
    if (stick) el.scrollTop = el.scrollHeight;
  }
  function sys(text) {
    const d = document.createElement("div");
    d.className = "sys";
    d.textContent = text;
    append(d);
  }

  // ── IRCv3 line parsing ───────────────────────────────────────────────────────
  // "@k=v;k2=v2 :nick!nick@nick.tmi.twitch.tv PRIVMSG #chan :hello world"
  function parseIrc(line) {
    let rest = line, tags = {};
    if (rest.startsWith("@")) {
      const sp = rest.indexOf(" ");
      for (const kv of rest.slice(1, sp).split(";")) {
        const i = kv.indexOf("=");
        const k = i < 0 ? kv : kv.slice(0, i);
        const v = i < 0 ? "" : kv.slice(i + 1);
        // IRCv3 escapes: \s space, \: semicolon, \\ backslash, \r \n
        tags[k] = v.replace(/\\s/g, " ").replace(/\\:/g, ";").replace(/\\r/g, "").replace(/\\n/g, "").replace(/\\\\/g, "\\");
      }
      rest = rest.slice(sp + 1);
    }
    let prefix = "";
    if (rest.startsWith(":")) {
      const sp = rest.indexOf(" ");
      prefix = rest.slice(1, sp);
      rest = rest.slice(sp + 1);
    }
    const sp = rest.indexOf(" ");
    const command = sp < 0 ? rest : rest.slice(0, sp);
    let params = sp < 0 ? "" : rest.slice(sp + 1);
    let trailing = "";
    const t = params.indexOf(" :");
    if (params.startsWith(":")) { trailing = params.slice(1); params = ""; }
    else if (t >= 0) { trailing = params.slice(t + 2); params = params.slice(0, t); }
    return { tags, prefix, command, params, trailing };
  }

  // Twitch's `emotes` tag: "25:0-4,12-16/1902:6-10" — ids with CODEPOINT ranges (not UTF-16),
  // so the message is split with Array.from before slicing.
  function nativeEmotes(tag) {
    if (!tag) return [];
    const out = [];
    for (const group of tag.split("/")) {
      const [id, ranges] = group.split(":");
      if (!id || !ranges) continue;
      for (const r of ranges.split(",")) {
        const [a, b] = r.split("-").map(Number);
        if (Number.isFinite(a) && Number.isFinite(b)) {
          out.push({ start: a, end: b, url: "https://static-cdn.jtvnw.net/emoticons/v2/" + id + "/default/dark/2.0" });
        }
      }
    }
    return out.sort((x, y) => x.start - y.start);
  }

  // Build the message body: native emotes by index first, then whitespace-preserving
  // word replacement for third-party (7TV/BTTV/FFZ) emote names. Mirrors MC's buildParts.
  function renderBody(text, emotes) {
    const frag = document.createDocumentFragment();
    const chars = Array.from(text);
    const emoteImg = (url, name) => {
      const img = document.createElement("img");
      img.className = "em"; img.src = url; img.alt = name; img.title = name;
      return img;
    };
    const words = (str) => {
      for (const tok of str.split(/(\s+)/)) {
        if (!tok) continue;
        const url = thirdParty[tok];
        if (url) frag.appendChild(emoteImg(url, tok));
        else frag.appendChild(document.createTextNode(tok));
      }
    };
    let i = 0;
    for (const e of emotes) {
      if (e.start < i) continue;
      if (e.start > i) words(chars.slice(i, e.start).join(""));
      frag.appendChild(emoteImg(e.url, chars.slice(e.start, e.end + 1).join("")));
      i = e.end + 1;
    }
    words(chars.slice(i).join(""));
    return frag;
  }

  const BADGES = [["broadcaster", "b", "host"], ["moderator", "m", "mod"], ["vip", "v", "vip"], ["subscriber", "s", "sub"]];
  function renderBadges(tag) {
    const frag = document.createDocumentFragment();
    if (!tag) return frag;
    const have = new Set(tag.split(",").map((b) => b.split("/")[0]));
    for (const [key, cls, label] of BADGES) {
      if (!have.has(key)) continue;
      const s = document.createElement("span");
      s.className = "bdg " + cls; s.textContent = label;
      frag.appendChild(s);
    }
    return frag;
  }

  function addMessage(p) {
    const tags = p.tags;
    const login = (p.prefix.split("!")[0] || "").trim();
    const name = tags["display-name"] || login;
    if (!name) return;
    let text = p.trailing || "";
    // "/me" arrives as ACTION <text> — unwrap it and render the row in italics.
    const act = text.match(/^ACTION ([\s\S]*?)?$/);
    const action = !!act;
    if (act) text = act[1];

    const row = document.createElement("div");
    row.className = "msg" + (action ? " action" : "");
    row.appendChild(renderBadges(tags.badges));
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = name;
    // Twitch gives each chatter a colour; fall back to the theme accent when they have none.
    if (tags.color) nm.style.color = tags.color;
    row.appendChild(nm);
    if (!action) {
      const sep = document.createElement("span");
      sep.className = "sep"; sep.textContent = ":";
      row.appendChild(sep);
    } else row.appendChild(document.createTextNode(" "));
    const tx = document.createElement("span");
    tx.className = "tx";
    tx.appendChild(renderBody(text, nativeEmotes(tags.emotes)));
    row.appendChild(tx);
    append(row);
  }

  // ── connection ───────────────────────────────────────────────────────────────
  // Anonymous read: Twitch lets any client read chat as "justinfan<n>" with no token, which is
  // what makes this work for a VIEWER (Mission Control's Streamer.bot route is broadcaster-only).
  function connect() {
    disconnect();
    if (!channel) return;
    const chan = channel;
    sys("Connecting to #" + chan + "…");
    let sock;
    try { sock = new WebSocket("wss://irc-ws.chat.twitch.tv:443"); }
    catch { scheduleReconnect(); return; }
    ws = sock;
    sock.onopen = () => {
      if (ws !== sock) return;
      reconnectAt = 1000;
      sock.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      sock.send("NICK justinfan" + Math.floor(10000 + Math.random() * 80000));
      sock.send("JOIN #" + chan);
    };
    sock.onmessage = (ev) => {
      if (ws !== sock) return;
      for (const line of String(ev.data).split("\r\n")) {
        if (!line) continue;
        const p = parseIrc(line);
        switch (p.command) {
          case "PING": sock.send("PONG :" + p.trailing); break;
          case "PRIVMSG": addMessage(p); break;
          case "JOIN":
            if ((p.prefix || "").startsWith("justinfan")) {
              $("panel").classList.add("on");
              sys("Connected to #" + chan + ".");
            }
            break;
          case "CLEARCHAT": if (!p.params) clearLog(); break;
          case "NOTICE": sys(p.trailing || "Twitch notice"); break;
          default: break;
        }
      }
    };
    sock.onclose = () => { if (ws !== sock) return; $("panel").classList.remove("on"); scheduleReconnect(); };
    sock.onerror = () => { /* onclose handles the retry */ };
  }
  function disconnect() {
    clearTimeout(reconnectTimer);
    if (ws) { const s = ws; ws = null; try { s.onclose = null; s.close(); } catch { /* already gone */ } }
    $("panel").classList.remove("on");
  }
  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    sys("Disconnected — reconnecting…");
    reconnectTimer = setTimeout(connect, reconnectAt);
    reconnectAt = Math.min(Math.round(reconnectAt * 1.7), 15000);
  }
  function clearLog() { $("log").textContent = ""; }

  // ── third-party emotes (7TV / BTTV / FFZ) ────────────────────────────────────
  // All public + CORS-friendly, no credentials. The channel sets are keyed by Twitch user id,
  // which ivr.fi resolves from a login without an API key (same source MC uses for avatars).
  async function j(url) {
    const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }
  async function loadEmotes(login) {
    const map = {};
    const add = (n, u) => { if (n && u) map[n] = u.startsWith("//") ? "https:" + u : u; };
    let userId = null;
    try {
      const d = await j("https://api.ivr.fi/v2/twitch/user?login=" + encodeURIComponent(login));
      userId = String((Array.isArray(d) ? d[0] : d)?.id || "") || null;
    } catch { /* channel emotes will be skipped */ }

    const sevenTv = (set) => {
      for (const e of set?.emotes ?? []) {
        const files = e?.data?.host?.files ?? [];
        const pick = files.find((f) => f.name === "2x.webp") || files.find((f) => f.name === "1x.webp") || files[0];
        if (pick && e.data.host.url) add(e.name, e.data.host.url + "/" + pick.name);
      }
    };
    const tasks = [
      j("https://7tv.io/v3/emote-sets/global").then(sevenTv),
      j("https://api.betterttv.net/3/cached/emotes/global").then((d) => {
        for (const e of d ?? []) add(e.code, "https://cdn.betterttv.net/emote/" + e.id + "/2x");
      }),
      j("https://api.frankerfacez.com/v1/set/global").then((d) => {
        for (const set of Object.values(d?.sets ?? {})) for (const e of set.emoticons ?? []) {
          const u = e.animated?.[2] || e.animated?.[1] || e.urls?.[2] || e.urls?.[1] || e.urls?.[4];
          add(e.name, u);
        }
      }),
    ];
    if (userId) {
      tasks.push(
        j("https://7tv.io/v3/users/twitch/" + userId).then((d) => sevenTv(d?.emote_set)),
        j("https://api.betterttv.net/3/cached/users/twitch/" + userId).then((d) => {
          for (const e of [...(d?.channelEmotes ?? []), ...(d?.sharedEmotes ?? [])]) add(e.code, "https://cdn.betterttv.net/emote/" + e.id + "/2x");
        }),
        j("https://api.frankerfacez.com/v1/room/id/" + userId).then((d) => {
          for (const set of Object.values(d?.sets ?? {})) for (const e of set.emoticons ?? []) {
            const u = e.animated?.[2] || e.animated?.[1] || e.urls?.[2] || e.urls?.[1] || e.urls?.[4];
            add(e.name, u);
          }
        }),
      );
    }
    // Every provider is best-effort: chat must render even if all three are down.
    await Promise.allSettled(tasks);
    thirdParty = map;
  }

  // ── channel selection ────────────────────────────────────────────────────────
  function render() {
    $("chanTag").textContent = channel ? "#" + channel : "";
    $("panel").classList.toggle("setup", !channel);
  }
  function openSetup() {
    $("chanInput").value = channel;
    $("panel").classList.add("setup");
  }
  async function saveChannel() {
    const ch = normalizeChannel($("chanInput").value);
    if (!ch) { $("chanInput").focus(); return; }
    const changed = ch !== channel;
    channel = ch;
    if (typing) setTyping(false);
    render();
    if (changed) { clearLog(); thirdParty = {}; loadEmotes(channel); connect(); }
    try {
      await fetch("/api/config", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ twitchChannel: channel }),
      });
    } catch { /* best-effort; the widget still works this session */ }
  }
  async function loadChannel() {
    let scale = 1;
    try {
      const c = await (await fetch("/api/config", { cache: "no-store" })).json();
      if (typeof c.twitchChannel === "string") channel = normalizeChannel(c.twitchChannel);
      if (typeof c.twitchChatFontScale === "number" && isFinite(c.twitchChatFontScale)) scale = c.twitchChatFontScale;
    } catch { /* no channel yet */ }
    setFontScale(scale, false);
    render();
    if (channel) { loadEmotes(channel); connect(); }
    else openSetup();
  }

  // ── text size ────────────────────────────────────────────────────────────────
  let fsSaveTimer = null;
  function setFontScale(v, persist) {
    fontScale = Math.max(0.8, Math.min(2, Math.round(v * 10) / 10));
    $("panel").style.setProperty("--chat-fs", (12.5 * fontScale).toFixed(1) + "px");
    $("fsDown").disabled = fontScale <= 0.8001;
    $("fsUp").disabled = fontScale >= 1.9999;
    if (!persist) return;
    clearTimeout(fsSaveTimer);
    fsSaveTimer = setTimeout(() => {
      fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ twitchChatFontScale: fontScale }) }).catch(() => { /* best-effort */ });
    }, 400);
  }

  // ── typing mode ──────────────────────────────────────────────────────────────
  // The shell grabs keyboard focus + suspends the interact key so a field can be typed into over
  // a focused game (shared with the Notepad widget; see main.cjs).
  let typing = false;
  function setTyping(on) {
    typing = !!on;
    const b = $("typeBtn");
    b.textContent = typing ? "✓ Done" : "✎ Type mode";
    b.classList.toggle("active", typing);
    if (typing) { if (host()) host().editStart(); else focusField(); }
    else { if (host()) host().editEnd(); const a = document.activeElement; if (a && a.blur) a.blur(); }
  }
  function focusField() {
    ($("panel").classList.contains("setup") ? $("chanInput") : $("sendInput")).focus();
  }
  window.__twitchChatFocus = () => { if (typing) focusField(); };
  window.__twitchChatExitTyping = () => { if (typing) setTyping(false); };

  // ── sign-in, for sending ─────────────────────────────────────────────────────
  // Reading is anonymous and always works; this exists only to unhide the send bar. The whole
  // OAuth flow lives in the sidecar and the token never comes back to this page — sending is a
  // POST to /api/twitch/send, not an authenticated IRC connection (see overlay-server.ts).
  let acct = { state: "idle" };
  let acctTimer = null;

  function renderAcct() {
    const msg = $("acctMsg"), code = $("acctCode"), btn = $("acctBtn"), alt = $("acctAlt");
    code.style.display = "none";
    alt.style.display = "none";
    $("panel").classList.toggle("cansend", acct.state === "ok");
    if (acct.state === "ok") {
      msg.textContent = "Signed in as " + acct.login + ".";
      btn.textContent = "Sign out";
    } else if (acct.state === "pending") {
      msg.textContent = "Enter this code on Twitch to finish signing in:";
      code.textContent = acct.userCode || "";
      code.style.display = "block";
      btn.textContent = "Open Twitch";
      alt.textContent = "Cancel";
      alt.style.display = "";
    } else if (acct.state === "error") {
      msg.textContent = acct.message || "Sign-in failed.";
      btn.textContent = "Try again";
    } else {
      msg.textContent = "Sign in with Twitch to send messages without leaving the game.";
      btn.textContent = "Sign in to Twitch";
    }
  }
  function pollAcct() {
    clearTimeout(acctTimer);
    if (acct.state !== "pending") return;
    acctTimer = setTimeout(async () => {
      try { acct = await (await fetch("/api/twitch/login", { cache: "no-store" })).json(); }
      catch { /* the sidecar will answer on the next tick */ }
      renderAcct();
      pollAcct();
    }, 2500);
  }
  async function acctAction() {
    if (acct.state === "pending") {                     // "Open Twitch"
      const url = acct.verificationUri || "https://www.twitch.tv/activate";
      if (host()) host().openUrl(url); else window.open(url, "_blank", "noopener");
      return;
    }
    const signOut = acct.state === "ok";
    $("acctBtn").disabled = true;
    $("acctMsg").textContent = signOut ? "Signing out…" : "Asking Twitch for a code…";
    try {
      acct = await (await fetch("/api/twitch/login", { method: signOut ? "DELETE" : "POST" })).json();
    } catch {
      acct = { state: "error", message: "Couldn't reach the overlay service." };
    }
    $("acctBtn").disabled = false;
    renderAcct();
    pollAcct();
  }
  async function loadAcct() {
    try { acct = await (await fetch("/api/twitch/login", { cache: "no-store" })).json(); }
    catch { acct = { state: "idle" }; }
    renderAcct();
    pollAcct();
  }
  async function send() {
    const el = $("sendInput");
    const text = el.value.trim();
    if (!text) return;
    el.value = "";
    try {
      const r = await fetch("/api/twitch/send", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
      });
      const d = await r.json().catch(() => null);
      // Twitch can accept the request and still drop the message (AutoMod, followers-only, a ban),
      // so say what happened and put the text back rather than letting it vanish.
      if (!r.ok || !d?.ok) { sys(d?.message || "Couldn't send that message."); el.value = text; }
    } catch {
      sys("Couldn't reach the overlay service.");
      el.value = text;
    }
  }

  $("acctBtn").addEventListener("click", acctAction);
  $("acctAlt").addEventListener("click", async () => {   // Cancel a pending sign-in
    clearTimeout(acctTimer);
    try { acct = await (await fetch("/api/twitch/login", { method: "DELETE" })).json(); }
    catch { acct = { state: "idle" }; }
    renderAcct();
  });
  $("sendBtn").addEventListener("click", send);
  $("sendInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });

  $("chanBtn").addEventListener("click", openSetup);
  $("saveBtn").addEventListener("click", saveChannel);
  $("typeBtn").addEventListener("click", () => setTyping(!typing));
  $("fsDown").addEventListener("click", () => setFontScale(fontScale - 0.1, true));
  $("fsUp").addEventListener("click", () => setFontScale(fontScale + 0.1, true));
  $("chanInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); saveChannel(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && typing) { e.preventDefault(); setTyping(false); } });

  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  loadChannel();
  loadAcct();
  try { host()?.ready?.(); } catch { /* not embedded */ }
</script>
</body>
</html>
