<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SC Feed</title>
<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t);
    /* ?bg=RRGGBB paints an opaque backdrop, for embedding in a THIRD-PARTY host (GameGlass
       and friends). Hex digits only, and applied through CSSOM — a value that is not a colour
       is rejected by the engine rather than landing anywhere it could be read as markup. */
    const b = q.get("bg"); if (b && /^[0-9a-f]{3,8}$/i.test(b)) { r.style.setProperty("--wbg", "#" + b); r.dataset.bg = ""; } }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Star Citizen news toast, fed by sc-feed.subliminal.gg's OmniFeed (proxied + flattened by the
     sidecar — see /api/scfeed). Unlike the other widgets this one is a NOTIFIER, not a panel: it
     stays out of the way and only surfaces when there's genuinely new news, then fades itself
     out. Theme tokens come from the shared /widget-theme.css. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  /* The card is hidden until there's something to say. Opacity (not display) so it can fade,
     with pointer-events off while hidden so it can NEVER intercept a click meant for the game. */
  #card {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; gap: 0;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bot));
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(var(--accent-rgb), 0.05);
    opacity: 0; pointer-events: none; transform: translateY(-6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #card.show { opacity: 1; pointer-events: auto; transform: none; }
  html.amd-lite #card { -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
    background: var(--panel-solid) !important; transition: none; }

  .head { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px;
    border-bottom: 1px solid var(--divider); }
  .dia { width: 7px; height: 7px; flex: none; background: var(--cyan-bright); transform: rotate(45deg);
    box-shadow: 0 0 8px var(--cyan); }
  .count { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.04em; }
  .x { font-size: 13px; line-height: 1; color: var(--cyan-dim); background: transparent; border: 0;
    cursor: pointer; padding: 3px 5px; border-radius: 5px; }
  .x:hover { color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); }

  /* Body — the headline itself is the click target (opens the story). */
  #open { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 5px; justify-content: center;
    text-align: left; padding: 10px 12px 12px; cursor: pointer; background: transparent; border: 0;
    color: inherit; font-family: var(--sans); width: 100%; }
  #open:hover { background: rgba(var(--accent-rgb), 0.07); }
  .meta { display: flex; align-items: center; gap: 7px; }
  .src { font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--cyan-bright); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; flex: none; }
  .when { font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-left: auto; flex: none; }
  .title { font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--cyan-text);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .cta { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan-dim); }

  /* Alert settings, mirroring the Mining Assistant's audio panel: HAL voice on/off, tone on/off,
     master volume, and a custom WAV. */
  #audio { display: none; position: absolute; inset: 0; z-index: 6; flex-direction: column; gap: 7px;
    padding: 10px 12px; background: var(--panel-solid); }
  #card.audio #audio { display: flex; }
  #audio .arow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--cyan-text); }
  #audio .arow label { flex: 1; cursor: pointer; }
  #audio input[type=range] { flex: 1; accent-color: var(--cyan); }
  #audio input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--cyan); }
  #audio .ahead { display: flex; align-items: center; gap: 7px; }
  #audio .ahead .t { flex: 1; font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  #audio .abtn { font-family: var(--sans); font-size: 10px; font-weight: 600; color: var(--cyan-bright);
    background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 7px; cursor: pointer; }
  #audio .abtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
</style>
</head>
<body>
  <div id="card" class="wpanel">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title">SC Feed</span>
      <span class="count h-sub" id="more"></span>
      <button class="x" id="audioBtn" type="button" title="Alert settings">♪</button>
      <button class="x" id="close" type="button" title="Dismiss">✕</button>
    </div>
    <div id="audio">
      <div class="ahead"><span class="t">Alerts</span><button class="abtn" id="audioDone" type="button">Done</button></div>
      <div class="arow"><label for="aVoice">HAL voice</label><input type="checkbox" id="aVoice" /></div>
      <div class="arow"><label for="aSound">Alert tone</label><input type="checkbox" id="aSound" /></div>
      <div class="arow"><span>Volume</span><input type="range" id="aVol" min="0" max="100" step="5" /></div>
      <div class="arow"><button class="abtn" id="aTest" type="button">Test</button><button class="abtn" id="aPick" type="button">Custom tone…</button><button class="abtn" id="aClear" type="button">Reset</button></div>
    </div>
    <button id="open" type="button">
      <div class="meta"><span class="src" id="src"></span><span class="tag" id="tag" style="display:none"></span><span class="when" id="when"></span></div>
      <div class="title" id="title"></div>
      <div class="cta" id="cta">Click to open SC Feed →</div>
    </button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__scFeedHost : null;

  const SITE = "https://sc-feed.subliminal.gg";
  const POLL_MS = 90_000;   // the sidecar caches upstream for 60s, so this is cheap
  // How long a story stays up before fading. User-settable (Settings -> Notifications); the
  // server clamps 3-60s so a hand-edited config can't make it vanish instantly or never leave.
  let SHOW_MS = 12_000;
  const SEEN_KEY = "scfeed.seen";  // ids already surfaced, so a reload doesn't re-pop them
  const MAX_SEEN = 400;

  let seen = new Set();
  let queue = [];           // stories waiting their turn
  let current = null;
  let hideTimer = null;
  let primed = false;       // first fetch only establishes a baseline — no pop storm on launch
  // Alert settings, loaded from config (mirrors the Mining Assistant's model).
  let cfg = { voice: false, sound: true, volume: 0.6, linkTarget: "site" };

  async function loadCfg() {
    try {
      const c = await (await fetch("/api/config", { cache: "no-store" })).json();
      cfg.voice = c.scFeedVoice === true;
      cfg.sound = c.scFeedSound !== false;
      cfg.linkTarget = c.scFeedLinkTarget === "source" ? "source" : "site";
      if (typeof c.scFeedVolume === "number" && isFinite(c.scFeedVolume)) cfg.volume = Math.max(0, Math.min(1, c.scFeedVolume));
      if (typeof c.scFeedShowSeconds === "number" && isFinite(c.scFeedShowSeconds))
        SHOW_MS = Math.max(3, Math.min(60, c.scFeedShowSeconds)) * 1000;
    } catch { /* defaults */ }
    $("aVoice").checked = cfg.voice;
    $("aSound").checked = cfg.sound;
    $("aVol").value = String(Math.round(cfg.volume * 100));
  }
  function saveCfg(patch) {
    Object.assign(cfg, patch);
    const body = {};
    if ("voice" in patch) body.scFeedVoice = cfg.voice;
    if ("sound" in patch) body.scFeedSound = cfg.sound;
    if ("volume" in patch) body.scFeedVolume = cfg.volume;
    fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .catch(() => { /* best-effort */ });
  }

  // ── audio ──────────────────────────────────────────────────────────────────
  // Same approach as mining.html: a lazily-resumed Web Audio context (one created outside a user
  // gesture starts suspended/silent), a master gain for volume, HAL clips decoded once and
  // scheduled back-to-back for gapless concatenative speech, Windows TTS as the fallback.
  let actx = null, master = null;
  function ensureActx() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch { /* no audio */ }
    if (actx && actx.state === "suspended") actx.resume().catch(() => { /* stays suspended — retried on the next gesture */ });
    return actx;
  }
  ["pointerdown", "keydown"].forEach((ev) => window.addEventListener(ev, ensureActx));
  function masterGain() {
    const ax = ensureActx(); if (!ax) return null;
    if (!master) { master = ax.createGain(); master.connect(ax.destination); }
    master.gain.value = cfg.volume;
    return master;
  }
  function tone(freq, ms, type) {
    const dest = masterGain(); if (!dest) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.6, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + ms / 1000);
    o.connect(g); g.connect(dest); o.start(); o.stop(actx.currentTime + ms / 1000 + 0.02);
  }
  let toneBuf = undefined; // undefined = not loaded, null = none, AudioBuffer = custom WAV
  async function loadTone() {
    if (toneBuf !== undefined) return toneBuf;
    const ax = ensureActx();
    try {
      const r = await fetch("/api/scfeed/tone");
      toneBuf = r.ok && ax ? await ax.decodeAudioData(await r.arrayBuffer()) : null;
    } catch { toneBuf = null; }
    return toneBuf;
  }
  async function chime() {
    if (!cfg.sound) return;
    const buf = await loadTone();
    const dest = masterGain(); if (!dest) return;
    if (buf) { const s = actx.createBufferSource(); s.buffer = buf; s.connect(dest); s.start(); return; }
    tone(720, 120); setTimeout(() => tone(1080, 190), 130);
  }
  const clipCache = {};
  async function loadClip(slug) {
    if (slug in clipCache) return clipCache[slug];
    const ax = ensureActx();
    try {
      const buf = await fetch("/tts/" + slug + ".ogg").then((r) => (r.ok ? r.arrayBuffer() : Promise.reject()));
      clipCache[slug] = await ax.decodeAudioData(buf);
    } catch { clipCache[slug] = null; }
    return clipCache[slug];
  }
  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.02; u.volume = cfg.volume;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch { /* no speech synth */ }
  }
  async function speakClips(slugs, fallbackText) {
    if (!cfg.voice) return;
    const dest = masterGain(); if (!dest) { speak(fallbackText); return; }
    const bufs = await Promise.all(slugs.map(loadClip));
    if (bufs.some((b) => !b)) { speak(fallbackText); return; }   // a missing clip => full TTS
    let t = actx.currentTime + 0.04;
    for (const b of bufs) { const s = actx.createBufferSource(); s.buffer = b; s.connect(dest); s.start(t); t += b.duration; }
  }
  // "New news from <source>". The source clip is matched loosely against the channel label so a
  // renamed channel still lands on the right word; unknown sources drop to just "New news".
  const SOURCE_CLIPS = [
    [/pipeline/i, "s_pipeline"], [/spectrum/i, "s_spectrum"], [/tracker/i, "s_tracker"],
    [/reddit/i, "s_reddit"], [/youtube|yt/i, "s_youtube"], [/status/i, "s_status"],
    [/twitter|x\b/i, "s_twitter"], [/leak/i, "s_leaks"], [/patch/i, "s_patchnotes"],
    [/motd|message of the day/i, "s_motd"], [/subliminal/i, "s_subliminal"], [/rsi/i, "s_rsi"],
  ];
  function announce(item) {
    void chime();
    if (!cfg.voice) return;
    const src = String(item.source || "");
    const hit = SOURCE_CLIPS.find(([re]) => re.test(src));
    const slugs = ["c_newsfrom"];
    if (hit) slugs.push(hit[1]); else slugs.push("c_scfeed");
    void speakClips(slugs, "New news from " + (src || "S C Feed"));
  }

  try { seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); } catch { /* fresh */ }
  function remember(id) {
    seen.add(id);
    if (seen.size > MAX_SEEN) seen = new Set([...seen].slice(-MAX_SEEN));
    try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch { /* private mode */ }
  }

  function timeAgo(iso) {
    const t = Date.parse(iso);
    if (!isFinite(t)) return "";
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 90) return "just now";
    if (s < 3600) return Math.round(s / 60) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    return Math.round(s / 86400) + "d ago";
  }

  // Two INDEPENDENT properties of a card, and conflating them is what made the launch
  // placeholder sit on screen forever:
  //   silent - renders without sound or speech. Only genuinely new headlines alert.
  //   sticky - does not auto-hide. ONLY the arrange preview wants this, because you are
  //            positioning the widget and it has to stay put while you drag it.
  // The launch baseline is silent but NOT sticky: it is proof of life, so it behaves like any
  // other card and leaves after SHOW_MS. While a card is up the widget is `.live`, which makes
  // it pointer-events:auto and puts it in the shell's interactive-region list - so one that
  // never hides spends the whole session able to swallow a click meant for the game.
  function show(item, opts) {
    const silent = !!(opts && opts.silent);
    const sticky = !!(opts && opts.sticky);
    current = item;
    $("src").textContent = item.source || "SC Feed";
    $("when").textContent = timeAgo(item.at);
    $("title").textContent = item.title;
    const tag = $("tag");
    if (item.tag) { tag.textContent = item.tag; tag.style.display = ""; } else { tag.style.display = "none"; }
    $("more").textContent = queue.length ? "+" + queue.length + " more" : "";
    $("card").classList.add("show");
    if (!silent) announce(item);
    // Tell the parent this widget is actually on screen. Until it says so, the canvas leaves the
    // widget's rect OUT of the shell's interactive regions, so an idle SC Feed can never swallow
    // a click meant for the game.
    try { host()?.active?.(true); } catch { /* not embedded */ }
    clearTimeout(hideTimer);
    if (!sticky) hideTimer = setTimeout(next, SHOW_MS);
  }
  function hide() {
    clearTimeout(hideTimer);
    current = null;
    $("card").classList.remove("show");
    try { host()?.active?.(false); } catch { /* not embedded */ }
  }
  // Advance to the next queued story, or fade out when the queue is empty.
  function next() {
    if (queue.length) show(queue.shift());
    else hide();
  }
  function dismissAll() { queue = []; hide(); }

  function openStory() {
    // Default target is SC Feed itself (the feed is the product); the user can switch this to the
    // story's own source in settings.
    const url = cfg.linkTarget === "source" ? (current?.url || SITE) : SITE;
    if (host()) host().openUrl(url);
    else window.open(url, "_blank", "noopener");
    next(); // treat "read" as done with this one
  }

  async function poll() {
    let items = [];
    try {
      const r = await fetch("/api/scfeed", { cache: "no-store" });
      items = (await r.json()).items || [];
    } catch { return; } // offline / sidecar restarting — try again next tick
    // Oldest-first so a burst pops in the order it happened.
    const fresh = items.filter((i) => i && i.id && !seen.has(i.id)).reverse();
    for (const i of fresh) remember(i.id);
    if (!primed) {
      // Launch baseline: everything already out there counts as seen, so enabling the widget
      // can't dump 40 stories at once. Show just the single newest one — proof of life, and it
      // tells the user where on screen the widget lives without hunting for arrange mode.
      primed = true;
      const latest = fresh[fresh.length - 1];
      // Silent because nothing here is actually new — but NOT sticky: it shows where the widget
      // lives, then gets out of the way like every other card.
      if (latest && !current) show(latest, { silent: true });
      return;
    }
    if (!fresh.length) return;
    queue.push(...fresh);
    if (!current) next();
  }

  // Arrange mode: the parent shows a sample card so the widget can be positioned even when
  // there's no news (it's invisible the rest of the time by design).
  window.__scFeedPreview = (on) => {
    if (on) {
      if (current) return;
      // sticky: it must hold for as long as arrange mode lasts, or you'd be positioning a
      // widget that vanishes mid-drag. This is the ONLY card that wants that.
      show({ source: "SC Feed", tag: "Preview", title: "New news will appear here when it comes through.", at: new Date().toISOString(), url: SITE },
           { silent: true, sticky: true });
    } else if (!queue.length) hide();
  };

  $("audioBtn").addEventListener("click", (e) => { e.stopPropagation(); ensureActx(); $("card").classList.toggle("audio"); });
  // Per-widget settings for the parent bar's cog: this widget's settings ARE its alert panel.
  window.__widgetSettings = () => { ensureActx(); $("card").classList.add("audio"); };
  window.__widgetSettingsRoot = () => $("audio"); // parent injects its Text size row here
  $("audioDone").addEventListener("click", (e) => { e.stopPropagation(); $("card").classList.remove("audio"); });
  $("aVoice").addEventListener("change", () => saveCfg({ voice: $("aVoice").checked }));
  $("aSound").addEventListener("change", () => saveCfg({ sound: $("aSound").checked }));
  $("aVol").addEventListener("input", () => saveCfg({ volume: (+$("aVol").value || 0) / 100 }));
  $("aTest").addEventListener("click", (e) => {
    e.stopPropagation(); ensureActx();
    void chime();
    void speakClips(["c_newsfrom", "s_pipeline"], "New news from Pipeline");
  });
  $("aPick").addEventListener("click", async (e) => {
    e.stopPropagation();
    const ok = await (host()?.pickTone?.() ?? Promise.resolve(false));
    if (ok) { toneBuf = undefined; void chime(); }
  });
  $("aClear").addEventListener("click", async (e) => {
    e.stopPropagation();
    await (host()?.clearTone?.() ?? Promise.resolve());
    toneBuf = undefined; void chime();
  });
  $("close").addEventListener("click", (e) => { e.stopPropagation(); dismissAll(); });
  $("open").addEventListener("click", openStory);
  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  // ?demo=1 holds a sample card up (headless screenshot / "what does this look like" testing).
  if (new URLSearchParams(location.search).has("demo")) window.__scFeedPreview(true);

  $("cta").textContent = "Click to open SC Feed \u2192";
  loadCfg().then(() => { $("cta").textContent = cfg.linkTarget === "source" ? "Click to read \u2192" : "Click to open SC Feed \u2192"; });
  poll();
  setInterval(poll, POLL_MS);
  try { host()?.ready?.(); } catch { /* not embedded */ }
</script>
</body>
</html>
