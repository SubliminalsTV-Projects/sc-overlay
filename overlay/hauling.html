<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hauling</title>
<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t);
    /* ?bg=RRGGBB paints an opaque backdrop, for embedding in a THIRD-PARTY host (GameGlass
       and friends). Hex digits only, and applied through CSSOM — a value that is not a colour
       is rejected by the engine rather than landing anywhere it could be read as markup. */
    const b = q.get("bg"); if (b && /^[0-9a-f]{3,8}$/i.test(b)) { r.style.setProperty("--wbg", "#" + b); r.dataset.bg = ""; } }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Hauling optimiser: what order to fly the accepted contracts, and where the boxes go on the
     ship. Data comes from /api/hauling/plan (see src/hauling-plan.ts), driven by the /hauling/events
     SSE channel. Theme tokens come from the shared /widget-theme.css. */
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 420px; height: 560px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  .head { min-height: 40px; flex-wrap: wrap; }

  /* 🔴 NARROW IS THE NORMAL CASE, NOT THE EDGE ONE. Sub runs this widget about as narrow as a
     phone, and at that width the head is title + EXPERIMENTAL + five tabs on one non-wrapping
     row — so the tabs ran off the edge and were simply unreachable. Widget pages are their own
     documents sized to their frame, so a plain width query is the right tool here; there is no
     parent page whose width could confuse it.

     Below the breakpoint the EXPERIMENTAL badge drops to its own line (Sub: "move that down to
     another line when stuff starts to collapse"), which buys the tabs the whole first row back.
     The badge is the right thing to move because it is the only element here that is never
     interacted with — losing a tab off-screen costs you the feature, losing a caption a line. */
  @media (max-width: 360px) {
    .expbadge { order: 10; flex-basis: 100%; margin-left: 0; margin-top: 3px; text-align: center; }
    .tabs { flex-wrap: wrap; justify-content: flex-end; row-gap: 3px; }
  }
  /* Narrower still: the tabs get their own row entirely, and the title keeps the first one. */
  @media (max-width: 290px) {
    .tabs { flex-basis: 100%; margin-left: 0; justify-content: flex-start; order: 9; }
    .expbadge { order: 10; }
  }
  .hbtn { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 7px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.on { background: rgba(var(--accent-rgb), 0.3); border-color: var(--cyan); }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  /* Stow is shared by both modes, so it sits third in the markup for Hauling's sake (Rank, Route,
     Stow) and has to be re-ordered for Trading, where Runs is the tab you actually open. `order`
     rather than moving the node, because moving it would mean two buttons for one renderer. */
  .tabs.trading #tabTrade { order: 1; }
  .tabs.trading #tabLookup { order: 2; }
  .tabs.trading #tabJournal { order: 3; }
  .tabs.trading #tabLayout { order: 4; }

  /* ── Trade tab ──────────────────────────────────────────────────────────────
     Rebuilt 2026-08-19 against Sub's review of the first cut. Four of his notes were real BUGS
     rather than taste, and each is fixed here:

     1. The control pills were different SIZES. `.goalseg .hbtn` overrides padding to 1px 6px and
        font-size to 9px, so segment buttons measured 15px tall against a standalone button's 22px.
        This bar therefore does NOT use `.goalseg` — every control is a plain `.hbtn` sibling and
        `.tdbar .hbtn` pins one height, so nothing can drift again.
     2. The commodity input was wrapped in `.psug`, which is `position:absolute; top:100%` — a
        DROPDOWN container. It was being positioned below the panel, which is exactly why Sub had
        to scroll to reach a field that should be the first thing on the screen.
     3. The provenance was two `.note` paragraphs costing 65px before any content appeared. It is
        one pill plus an ⓘ now.
     4. Every chip was the same faint colour, so nothing stood out. Age and warnings now carry
        their meaning in their colour. */

  /* The mode bar: which of the widget's two jobs you are doing. Pinned below the scrolling body,
     so it is always reachable however long the list gets. */
  .modebar { flex: none; display: flex; align-items: center; gap: 4px; padding: 5px 12px;
    border-top: 1px solid var(--divider); background: rgba(var(--accent-rgb), 0.05); }
  .modebar .hbtn { height: 20px; padding: 0 10px; display: inline-flex; align-items: center;
    font-size: 9.5px; }
  /* Attribution, not a button that does work — quiet by default, and it only appears on the side
     of the widget their data actually feeds. */
  .uexbadge { margin-left: auto; background: none; border: 0; padding: 0 2px; cursor: pointer;
    font-family: var(--sans); font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint); }
  .uexbadge b { color: var(--cyan-dim); font-weight: 700; }
  .uexbadge:hover b { color: var(--cyan-bright, #7fe7ff); }
  .uexbadge[hidden] { display: none; }

  .tdbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    padding: 6px 12px 4px; border-bottom: 1px solid var(--divider); }
  /* One height for every control on this tab, whatever its label length. */
  .tdbar .hbtn { height: 21px; padding: 0 8px; display: inline-flex; align-items: center;
    font-size: 9.5px; text-transform: none; letter-spacing: 0.02em; }
  .tdbar .sep { width: 1px; height: 14px; background: var(--divider); margin: 0 2px; }
  .tdbar .lbl { font-size: 9px; color: var(--faint); letter-spacing: 0.06em;
    text-transform: uppercase; }

  /* The source pill. Three states, three colours — "we chose offline", "we tried and failed" and
     "this is fresh" must not look alike. */
  .tdsrc { height: 21px; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px;
    border-radius: 6px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; border: 1px solid; }
  .tdsrc.live { color: var(--green, #7de6a0); border-color: rgba(120, 230, 160, 0.5);
    background: rgba(120, 230, 160, 0.12); }
  .tdsrc.cache { color: var(--gold, #e8c56a); border-color: rgba(var(--value-rgb), 0.5);
    background: rgba(var(--value-rgb), 0.12); }
  .tdsrc.bundled { color: var(--red, #eb7878); border-color: rgba(235, 120, 120, 0.5);
    background: rgba(235, 120, 120, 0.12); }
  .tdsrc .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  /* ⓘ — drawn from a plain ASCII letter in a CSS circle, never a real ⓘ character and never an
     icon font. It is a real <button> driving a POPOVER, because a native `title` cannot be opened
     from script: Sub clicked the first version of an info affordance and nothing happened.
     `title` stays for hover, which costs nothing and cannot regress. */
  .tdi { width: 14px; height: 14px; flex: none; border-radius: 50%; padding: 0;
    border: 1px solid rgba(var(--accent-rgb), 0.55); background: transparent;
    color: var(--cyan-bright, #7fe7ff); font-family: var(--sans); font-size: 9px;
    font-weight: 700; line-height: 1; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; }
  .tdi:hover { background: rgba(var(--accent-rgb), 0.22); border-color: var(--cyan); }
  /* Top layer, so no ancestor's overflow can clip it and it costs nothing in layout. Pinned in
     CSS rather than measured: rAF and ResizeObserver do not fire in a hidden window, and two
     earlier measured popovers in this app died on exactly that. */
  .tdpop { max-width: 290px; margin: 0; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--cyan); background: var(--menu-bg); color: var(--cyan-text);
    font-size: 10.5px; line-height: 1.45; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6); }
  .tdpop:popover-open { position: fixed; inset: auto; left: 12px; bottom: 40px; }

  /* The commodity field. A normal in-flow input — see note 2 above. */
  .tdfind { display: flex; gap: 5px; padding: 8px 12px 4px; }
  .tdfind input { flex: 1; min-width: 0; height: 24px; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(var(--accent-rgb), 0.10);
    color: var(--cyan-text); font-family: var(--sans); font-size: 11.5px; }
  .tdfind input:focus { outline: none; border-color: var(--cyan);
    background: rgba(var(--accent-rgb), 0.18); }
  .tdfind input::placeholder { color: var(--faint); }

  /* A run. `.arow` supplies the frame; these are the parts it has no equivalent for. */
  .tdrow .money { display: flex; align-items: baseline; gap: 5px; margin-top: 2px;
    font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }
  .tdrow .money .k { font-family: var(--sans); font-size: 8.5px; color: var(--faint);
    letter-spacing: 0.06em; text-transform: uppercase; }
  /* 🔴 THE PAIR SUB COULD NOT FIND. The first cut showed what a run COST and never what it sold
     for, so the only way to know the sell price was to subtract. Money out reads as cost, money
     in reads as income. */
  .tdrow .money .buy { color: var(--gold, #e8c56a); }
  .tdrow .money .sell { color: var(--green, #7de6a0); }
  .tdrow .money .arrow { color: var(--faint); }
  .tdrow .money .pct { color: var(--cyan-dim); font-family: var(--sans); font-size: 9.5px; }
  .tdrow .money .qty { margin-left: auto; color: var(--cyan-dim); font-size: 10px;
    font-family: var(--sans); }

  /* The right column: the number, and — the fix for "is that profit?" — a word saying so. */
  .tdcap { flex: none; min-width: 84px; text-align: right; white-space: nowrap; }
  .tdprofit { font-size: 15px; color: var(--cyan-bright, #7fe7ff); line-height: 1.15;
    font-family: var(--mono); }
  .tdcaplbl { font-size: 8px; color: var(--faint); letter-spacing: 0.1em;
    text-transform: uppercase; line-height: 1.4; }
  .tdrate { font-size: 9.5px; color: var(--cyan-dim); line-height: 1.3; }

  /* The Log tab's headline: what today made. Given size because it is the one number the player
     opened this tab for. */
  .tdtot { padding: 6px 12px 2px; display: flex; align-items: baseline; gap: 6px; }
  .tdtot .v { font-family: var(--mono); font-size: 22px; line-height: 1.1; }
  .tdtot .v.up { color: var(--green, #7de6a0); }
  .tdtot .v.down { color: var(--red, #eb7878); }
  .tdtot .k { font-size: 9px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; }
  .tdtotchips { padding: 0 12px 7px; }
  .tdprofit.up { color: var(--green, #7de6a0); }
  .tdprofit.down { color: var(--red, #eb7878); }

  /* Chips that mean something. An age you cannot judge at a glance is an age nobody reads. */
  .badge.age0 { color: var(--green, #7de6a0); border-color: rgba(120, 230, 160, 0.45); }
  .badge.age1 { color: var(--gold, #e8c56a); border-color: rgba(var(--value-rgb), 0.45); }
  .badge.age2 { color: var(--red, #eb7878); border-color: rgba(235, 120, 120, 0.5); }
  .badge.warn { color: var(--gold, #e8c56a); border-color: rgba(var(--value-rgb), 0.55);
    background: rgba(var(--value-rgb), 0.10); }
  .badge.xsys { color: var(--red, #eb7878); border-color: rgba(235, 120, 120, 0.45); }
  .badge.calm { color: var(--cyan-dim); border-color: var(--border); }

  /* ── The ship, and how much of it is used ─────────────────────────────────
     The capacity bar is per GRID, not one pool: a C2 is 8x15x4 plus 6x9x4, and a box that fits
     the first may not fit the second. Segments are sized by each grid's share of the hull. */
  .summary { flex: none; padding: 8px 12px 9px; border-bottom: 1px solid var(--divider);
    position: relative; z-index: 4; }
  .shiprow { display: flex; align-items: center; gap: 6px; }
  /* Both pickers share one rule. #startPick was added without it and rendered as a bare white box
     with white text in it — unreadable, and Sub could not tell what the control even was. */
  #shipPick, #startPick { flex: 1; min-width: 0; font-family: var(--sans); font-size: 11px; color: var(--cyan-bright);
    background: var(--menu-bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 5px; }
  #startPick { margin-top: 5px; }
  /* The sync control sits with the location picker, because that is the field it fills in. */
  #syncLoc { margin-top: 5px; }
  .syncmsg { margin-top: 4px; font-size: 10px; line-height: 1.45; color: var(--cyan-dim); }
  .syncmsg.bad { color: var(--amber); }
  .syncmsg.good { color: var(--green); }
  /* The dropdown's own list is drawn by the OS, which does not inherit the control's colours —
     without this the options render dark-on-dark (or white-on-white) once it is open. */
  #shipPick option, #startPick option { background: var(--menu-bg); color: var(--cyan-bright); }
  .src { flex: none; font-size: 8.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--faint); }
  .caps { display: flex; gap: 3px; margin-top: 7px; height: 13px; }
  .cap { position: relative; border-radius: 4px; background: rgba(0, 0, 0, 0.34);
    border: 1px solid var(--divider); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45); overflow: hidden; }
  .cap i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--cyan), var(--gold)); }
  .cap.over i { background: var(--red); }
  .cap b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono);
    font-size: 8.5px; font-weight: 700; color: var(--cyan-text); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px;
    font-family: var(--mono); font-size: 10px; color: var(--cyan-dim); }
  .facts .v { color: var(--gold); font-weight: 600; }
  .facts .bad { color: var(--red); }
  /* A forecast, not a reading. Same rule as everywhere else on this panel: a number the app worked
     out is never dressed the same as one it was told. */
  .facts .est, .ratebar .est { color: var(--cyan-dim); font-style: italic; }

  /* ── What the run earns, per hour ─────────────────────────────────────────
     Its own strip, ruled off from the board facts above it, because it answers a different
     question. "contracts 3" is a property of what you are holding; "72k aUEC/h" is a property of
     how long the work is taking you. Sub asked for the separation so the second is not read as the
     first — the rate is per hour of RUN, not per contract. */
  .ratebar { display: flex; align-items: baseline; gap: 10px; margin-top: 7px; padding-top: 6px;
    border-top: 1px solid var(--divider); }
  .ratebar .k { flex: none; font-size: 8.5px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint); }
  .ratebar .fig { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--green); }
  .ratebar .fig.est { color: var(--cyan-dim); font-weight: 600; }
  .ratebar .rep { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--gold); }
  .ratebar .rep.est { color: var(--cyan-dim); font-weight: 600; }
  .ratebar .basis { margin-left: auto; font-size: 9px; color: var(--faint); white-space: nowrap; }

  /* ── 🔴 The load checklist ────────────────────────────────────────────────
     Deliberately the loudest thing on the panel: 57% of contracts in the shipped data give a SCU
     RANGE rather than a number, and the only things that pin the real figure are the game's own
     Deliver line and the player typing it in.
     ⚠️ It used to be headed "TRACK THESE IN MOBIGLAS" unconditionally, on the belief that the
     Deliver line was tracking-gated. It is not — it fires on objective ASSIGNMENT and re-tracking
     never replays it — so for an already-tracked contract that heading was an instruction the
     game would not honour. The heading and the per-row state are both computed now; see
     renderTrack(). */
  .track { flex: none; border-bottom: 1px solid var(--divider); position: relative; z-index: 4;
    background: rgba(var(--value-rgb), 0.07); }
  .track .th { display: flex; align-items: baseline; gap: 6px; padding: 8px 12px 3px; }
  .track .th .k { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold); }
  .track .th .n { font-family: var(--mono); font-size: 10px; color: var(--cyan-dim); }
  .track .why { padding: 0 12px 6px; font-size: 10px; line-height: 1.5; color: var(--cyan-dim); }
  .track .list { max-height: 132px; overflow-y: auto; }
  /* Collapsed = answered. Quietened rather than removed: the heading still reports what the plan
     is using, and the whole strip is the click target that brings the type-in boxes back. */
  .track.done { opacity: 0.72; }
  .track .th { cursor: pointer; }
  .track.done .th .k { color: var(--cyan-dim); }
  .trow { display: flex; align-items: center; gap: 7px; padding: 4px 12px; }
  .trow .t { flex: 1; min-width: 0; font-size: 11px; color: var(--cyan-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .rng { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--gold); }
  .trow input { width: 52px; font-family: var(--mono); font-size: 10.5px; text-align: right;
    color: var(--cyan-bright); background: var(--menu-bg); border: 1px solid var(--divider);
    border-radius: 5px; padding: 2px 4px; }
  .trow input:focus { outline: none; border-color: var(--cyan); }

  /* ── Before you leave ─────────────────────────────────────────────────────
     A prompt, not a warning: nothing is wrong, there is just free money in checking the board
     before you burn the fuel. Gold because it is an opportunity, and quiet enough to ignore. */
  .depart { flex: none; padding: 7px 12px 8px; border-bottom: 1px solid var(--divider);
    background: rgba(var(--value-rgb), 0.07); position: relative; z-index: 4; }
  .depart .k { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold); }
  .depart .t { margin-top: 3px; font-size: 11px; line-height: 1.5; color: var(--cyan-text); }
  .depart .t b { font-weight: 600; color: var(--cyan-bright); }
  .depart .x { position: absolute; top: 5px; right: 7px; width: 16px; height: 16px; padding: 0;
    line-height: 1; border: 1px solid rgba(var(--accent-rgb), 0.3); border-radius: 4px;
    background: transparent; color: var(--faint); font-size: 10px; cursor: pointer; }
  .depart .x:hover { color: var(--cyan-bright); border-color: var(--cyan); }

  /* ── Naming a place ───────────────────────────────────────────────────────
     Reuses .track's frame so it reads as the same kind of question as the load checklist, tinted
     cyan rather than gold because it is not a warning — nothing is wrong, the game simply never
     said where this is. */
  /* 🔴 THE SUGGESTION LIST MUST NOT BE CLIPPED. It inherited `.track .list`'s `overflow-y: auto`,
     which is right for the tonnage checklist (many rows, capped height) and fatal here: an
     absolutely-positioned dropdown inside a scrolling box is cut off at the box's edge, which is
     exactly what Sub saw. So this section does NOT scroll — it has at most a handful of rows — and
     the whole strip is raised above #body so the list hangs over the route as far as it likes.
     Sub: "it should just hang as low as it wants to go." */
  .track.places { background: rgba(var(--accent-rgb), 0.06); overflow: visible; z-index: 6; }
  .track.places .list { max-height: none; overflow: visible; }
  .track.places .th .k { color: var(--cyan-bright); }
  .prow { padding: 4px 12px 5px; position: relative; }
  .prow .top { display: flex; align-items: baseline; gap: 6px; }
  .prow .site { flex: none; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .prow .role { flex: 1; min-width: 0; font-size: 10px; color: var(--cyan-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow input { width: 100%; margin-top: 3px; font-family: var(--sans); font-size: 11px;
    color: var(--cyan-bright); background: var(--menu-bg); border: 1px solid var(--divider);
    border-radius: 5px; padding: 3px 6px; }
  .prow input:focus { outline: none; border-color: var(--cyan); }
  /* The suggestions. Absolutely positioned so opening the list never reflows the route underneath
     it — a list that pushes the page down moves the row you are aiming at. */
  .psug { position: absolute; left: 12px; right: 12px; top: 100%; z-index: 9;
    background: var(--menu-bg); border: 1px solid var(--cyan); border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55); overflow: hidden; }
  .psug div { display: flex; align-items: baseline; gap: 6px; padding: 4px 8px; cursor: pointer;
    font-size: 11px; color: var(--cyan-text); }
  .psug div:hover, .psug div.on { background: rgba(var(--accent-rgb), 0.22); }
  .psug .h { margin-left: auto; font-size: 9px; color: var(--faint); white-space: nowrap; }
  /* A name the GAME has used before. It outranks the 1,125 dataset rows for a reason worth
     showing: it is known to be a real hauling stop. */
  .psug .seen { color: var(--green); }

  #body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 4; }
  .sec { display: flex; align-items: baseline; gap: 6px; padding: 9px 12px 5px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .sec .n { font-weight: 500; letter-spacing: 0.04em; text-transform: none; font-family: var(--mono); }
  .empty { padding: 26px 16px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; }
  .note { padding: 5px 12px; font-size: 10px; line-height: 1.5; color: var(--amber); }

  /* ── Route ───────────────────────────────────────────────────────────────── */
  .stop { display: flex; gap: 8px; padding: 6px 12px; border-bottom: 1px solid rgba(var(--accent-rgb), 0.06); }
  /* Done: collected, not yet delivered. Dimmed so it reads as history, not as an instruction —
     but kept in the numbering, because it IS a step of this contract and hiding it made the list
     open mid-sentence. */
  .stop.done { opacity: 0.45; }
  .stop.done .num { border-color: var(--divider); color: var(--faint); }
  .stop .num { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px;
    font-family: var(--mono); font-size: 10px; font-weight: 700; border: 1px solid var(--divider);
    color: var(--cyan-dim); background: rgba(0, 0, 0, 0.22); }
  .stop.pickup .num { border-color: var(--cyan); color: var(--cyan-bright); }
  .stop.dropoff .num { border-color: var(--gold); color: var(--gold); }
  .stop.same .num { border-style: dashed; }
  .stop .mid { flex: 1; min-width: 0; }
  .stop .nm.editable > span:first-child, .stop .nm.editable { }
  .stop .nm .pen { flex: none; margin-left: 5px; font-size: 10px; color: var(--cyan-dim); opacity: 0.75; }
  .stop .nm.editable:hover .pen { color: var(--cyan-bright); opacity: 1; }
  .stop .nm.editable:hover .nmt { text-decoration: underline dotted rgba(var(--accent-rgb), 0.6); }
  .ratereset { margin-left: 8px; background: transparent; border: none; padding: 0; cursor: pointer;
    font-size: 9px; color: var(--faint); text-decoration: underline; }
  .ratereset:hover { color: var(--cyan-bright); }
  /* 🔴 SAY IT WHERE THE THING IS, not in a release note nobody re-reads. Sub: "I want it to be very
     apparent that it is experimental. This isn't like our other apps that I think are pretty much
     fully functional." So the badge rides the widget's own title bar, in the alert colour, and it
     does not go away — it is a property of the widget, not a first-run notice. */
  .expbadge { flex: none; margin-left: 6px; padding: 1px 5px; border-radius: 4px;
    font-size: 8px; font-weight: 700; letter-spacing: 0.09em; cursor: help;
    color: var(--gold); border: 1px solid rgba(var(--value-rgb), 0.5);
    background: rgba(var(--value-rgb), 0.10); }
  .stop .pinbox { width: 46px; margin-left: 5px; font-family: var(--mono); font-size: 10px;
    text-align: right; color: var(--cyan-bright); background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(var(--accent-rgb), 0.5); border-radius: 4px; padding: 0 3px; }
  .stop .pinbox:focus { outline: none; border-color: var(--cyan); }
  .stop .pinderived { margin-left: 5px; font-size: 8.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--cyan); }
  .stop .nminp { font-family: var(--sans); font-size: 12px; font-weight: 600; width: 150px;
    color: var(--cyan-bright); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--cyan);
    border-radius: 4px; padding: 1px 4px; }
  .stop .nminp:focus { outline: none; }
  /* 🔴 THE PENCIL MUST NOT BE WHAT GETS CUT. `.nm` truncated as one string, so narrowing the
     widget ate the pencil first and the row stopped looking editable exactly when there was least
     room to guess. The row is a flex line now: the TITLE shrinks and ellipsises, the pencil is
     flex:none and always present. */
  .stop .nm { display: flex; align-items: baseline; gap: 0;
    font-size: 12px; font-weight: 600; color: var(--cyan-bright); position: relative; }
  .stop .nm .nmt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stop .acts { font-size: 10px; color: var(--cyan-dim); line-height: 1.5; margin-top: 1px; }
  .stop .acts .c { color: var(--cyan-text); }
  .stop .rt { flex: none; text-align: right; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  /* 🔴 THE FIGURE ON A STEP IS THE FIGURE THAT STEP MOVES. This was `loadAfterScu` — what is in the
     hold on LEAVING — so the final drop-off of a run always read "0 SCU", which is true and useless:
     Sub read a step headed DROP OFF next to a zero and reasonably asked what it thought he was
     dropping off. A numbered instruction states its own quantity; where the hold ends up is a
     separate fact and now rides underneath in the faint line. */
  .stop .rt .ld { color: var(--gold); }
  .stop .rt .hold { color: var(--faint); font-size: 9px; }

  /* ── Contract cards ──────────────────────────────────────────────────────── */
  .card { padding: 6px 12px 7px; border-bottom: 1px solid rgba(var(--accent-rgb), 0.06); }
  /* The turn-around, parked in the picture's bottom-left corner. Quiet until hovered — it is a
     control, not part of the diagram — and tinted gold while turned so the state is visible
     without reading the door label. */
  /* A foldable section header. The caret is the affordance; the whole strip is the target. */
  .sec.fold { cursor: pointer; user-select: none; }
  .sec.fold .caret { flex: none; margin-right: 4px; color: var(--faint); font-size: 9px; }
  .sec.fold:hover .caret { color: var(--cyan-bright); }
  /* The "why" reduced to one glyph. The reason stays reachable on hover; it stops eating four
     lines of a small overlay on every render. */
  .whyinfo { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid rgba(var(--accent-rgb), 0.35); color: var(--cyan-dim); font-size: 9px;
    cursor: help; }
  .whyinfo:hover { color: var(--cyan-bright); border-color: var(--cyan); }
  .isowrap { position: relative; }
  .spincorner { position: absolute; left: 4px; bottom: 4px; width: 22px; height: 22px; padding: 0;
    display: grid; place-items: center; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(var(--accent-rgb), 0.28); background: rgba(0, 0, 0, 0.35);
    color: var(--cyan-dim); font-size: 13px; line-height: 1; opacity: 0.55; transition: opacity .12s; }
  .spincorner:hover { opacity: 1; color: var(--cyan-bright); border-color: var(--cyan); }
  .spincorner.on { opacity: 1; color: var(--gold); border-color: var(--gold); }
  .card.done { opacity: 0.6; }
  /* Set aside: dimmed and struck through the title, so it reads as "not part of this run" rather
     than "finished". Still listed — the player has to be able to put it back. */
  .card.setaside { opacity: 0.45; }
  .card.setaside .t { text-decoration: line-through; }
  .card .cardx { flex: none; margin-left: 6px; width: 18px; height: 18px; line-height: 1; padding: 0;
    border: 1px solid rgba(var(--accent-rgb), 0.3); border-radius: 5px; background: transparent;
    color: var(--faint); font-size: 11px; cursor: pointer; }
  .card .cardx:hover { color: var(--red); border-color: var(--red); }
  /* The tick sits at the FRONT of the row, where a list of things you are doing wants it, and the
     ✕ stays at the end where a destructive control belongs. */
  .card .cardtick { flex: none; margin-right: 2px; width: 15px; height: 15px; padding: 0;
    border: 1px solid rgba(var(--accent-rgb), 0.45); border-radius: 4px; background: transparent;
    color: var(--cyan-bright); font-size: 10px; line-height: 1; cursor: pointer; }
  .card .cardtick:hover { border-color: var(--cyan); }
  .card.setaside .cardtick { color: var(--faint); }
  .droprow { display: flex; align-items: center; gap: 8px; padding: 3px 12px 6px;
    font-size: 9.5px; color: var(--faint); }
  .droprow button { background: transparent; border: none; padding: 0; cursor: pointer;
    color: var(--cyan-dim); font-size: 9.5px; text-decoration: underline; }
  .card.setaside .cardx:hover { color: var(--cyan-bright); border-color: var(--cyan); }
  .card .top { display: flex; align-items: baseline; gap: 6px; }
  .card .t { flex: 1; min-width: 0; font-size: 11.5px; color: var(--cyan-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .amt { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--gold); }
  /* 🔴 PROVENANCE IS A COLOUR, NOT A PILL. Every load figure and every box count still has to say
     where it came from — that has been true since the first version — but it was saying it with a
     word in a bordered chip next to the number, and a card carried up to three of them. Sub: "let's
     just change the colour of the SCU count rather than having that pill there." He is right: the
     number IS the thing being qualified, so qualify the number. One key at the foot of the list
     carries the wording that used to be repeated on every row.
     ⚠️ The tooltips move WITH the colour — a hue nobody can name is not provenance. */
  .card .amt.src-log, .card .amt.src-manifest { color: var(--green); }
  .card .amt.src-pinned { color: var(--cyan-bright); }
  /* Arithmetic off a figure the player gave, so it reads as theirs — one shade quieter. */
  .card .amt.src-derived { color: var(--cyan); }
  .card .amt.src-dataset { color: var(--cyan-dim); }
  .card .amt.src-range { color: var(--gold); }
  .card .amt.src-unknown { color: var(--red); }
  .card .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px;
    font-size: 9.5px; color: var(--faint); }
  .card .chips { font-family: var(--mono); font-size: 10px; color: var(--cyan-dim); margin-top: 2px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  /* A box size, and how many. The SIZE is the identity — a box has one shape — so it reads large
     and the count rides beside it as a multiplier. Written as a run of text ("12 × 8") it was read
     as a dimension, and four of them in a row was the busiest thing on the card. */
  .card .boxpill { display: inline-flex; align-items: baseline; gap: 3px; padding: 1px 5px;
    border: 1px solid rgba(var(--accent-rgb), 0.28); border-radius: 999px;
    background: rgba(var(--accent-rgb), 0.06); white-space: nowrap; }
  .card .boxpill b { font-weight: 700; color: var(--cyan-bright); font-size: 10px; }
  .card .boxpill i { font-style: normal; font-size: 9px; color: var(--faint); }
  /* Same rule as the SCU figure: gold = this split was worked out here (the game never logs a box
     breakdown for a cargo haul), green = the game enumerated the boxes itself. Replaces the
     "modelled" badge, which Sub called noise — the counts have been right every time he checked. */
  .card .boxpill.src-partition { border-color: rgba(var(--value-rgb), 0.45); background: rgba(var(--value-rgb), 0.08); }
  .card .boxpill.src-partition b { color: var(--gold); }
  .card .boxpill.src-manifest { border-color: rgba(46, 230, 160, 0.4); background: rgba(46, 230, 160, 0.08); }
  .card .boxpill.src-manifest b { color: var(--green); }
  .card .boxcap { font-size: 9px; color: var(--faint); white-space: nowrap; }
  /* The key. One per list, at the foot, because the colours are only decodable together. */
  .srckey { display: flex; flex-wrap: wrap; gap: 3px 10px; padding: 6px 12px 10px;
    font-size: 9px; color: var(--faint); }
  .srckey span { display: inline-flex; align-items: center; gap: 4px; }
  .srckey i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  /* Now only the load-checklist's row state. The provenance badge that used to share this class is
     gone — a colour on the figure itself says the same thing without a chip per row (.amt.src-*). */
  .badge { flex: none; font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 4px; padding: 1px 4px; border: 1px solid var(--divider); color: var(--faint); }
  .badge.pinned { color: var(--cyan-bright); border-color: var(--border); }
  /* The three states of the track prompt. Only `todo` is an instruction — `waiting` is the state
     where the player has already done everything tracking can do, and colouring it like an action
     is how a prompt starts lying. */
  .badge.todo { color: var(--gold); border-color: rgba(var(--value-rgb), 0.45); }
  .badge.waiting { color: var(--cyan-dim); }
  /* Rank tier + size band, straight off the contract title — how the row is matched to mobiGlas. */
  .trow .bd { flex: none; font-size: 9px; letter-spacing: 0.04em; color: var(--faint);
    white-space: nowrap; }
  .tick { flex: none; font-size: 10px; color: var(--green); }

  /* ── Stow ─────────────────────────────────────────────────────────────────
     The load order first, the picture second. 🔴 The freight elevator UI does not name missions,
     so "load this one first" is only actionable if it comes with a BOX SIGNATURE — the commodity
     plus the exact split — which is how the player finds the right lift among four. */
  .gridwrap { padding: 4px 12px 12px; }

  .steps { padding: 0 12px 4px; }
  .step { display: flex; gap: 8px; padding: 7px 8px; margin-bottom: 5px; border-radius: 8px;
    border: 1px solid var(--divider); background: rgba(0, 0, 0, 0.2); cursor: pointer;
    border-left-width: 3px; }
  .step:hover { border-color: var(--border); }
  .step.on { background: rgba(var(--accent-rgb), 0.11); border-color: var(--cyan); }
  .step .ord { flex: none; width: 20px; height: 20px; display: grid; place-items: center;
    border-radius: 50%; font-family: var(--mono); font-size: 10px; font-weight: 700;
    color: #04121a; }
  .step .mid { flex: 1; min-width: 0; }
  /* The signature. Deliberately the biggest text in the panel — it is the thing the player reads
     off the elevator and matches by eye. */
  .step .sig { font-size: 12px; font-weight: 600; color: var(--cyan-bright); line-height: 1.35; }
  .step .sig .what { color: var(--gold); }
  .step .meta { font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-top: 2px; }
  .step .drops { margin-top: 4px; }
  .drop { display: flex; align-items: baseline; gap: 6px; font-size: 10px; color: var(--cyan-dim);
    line-height: 1.6; }
  .drop i { flex: none; width: 8px; height: 8px; border-radius: 2px; display: inline-block;
    transform: translateY(1px); }
  .drop .d { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--cyan-text); }
  .drop .b { flex: none; font-family: var(--mono); color: var(--cyan-dim); }
  .drop .deep { flex: none; font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--faint); }
  /* ⚠️ Two missions with the same commodity AND the same split are indistinguishable at the
     elevator. Saying so beats issuing an instruction the player cannot follow. */
  .step.clash { border-left-color: var(--amber) !important; }
  .step .clash-why { font-size: 9.5px; color: var(--amber); margin-top: 3px; line-height: 1.45; }

  .glabel { display: flex; align-items: baseline; gap: 6px; font-size: 9.5px; color: var(--faint);
    font-family: var(--mono); margin: 8px 0 2px; }
  .glabel .gn { font-family: var(--sans); font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--cyan-dim); font-size: 9px; }
  .glabel .here { color: var(--cyan-bright); }

  /* The isometric drawing. Everything inside is in CELL units — the viewBox does the scaling — so
     one cell is one SCU at every zoom and two grids on the same page are at the same true scale. */
  .isowrap { background: rgba(0, 0, 0, 0.26); border: 1px solid var(--divider); border-radius: 6px;
    padding: 4px; }
  /* 🔑 No max-height. Height follows width, and the width is set per grid so every hold on the
     ship shares one scale (see renderGrids) — a height cap would letterbox one drawing and quietly
     break that. .isowrap centres whatever it is given. */
  svg.iso { display: block; width: 100%; height: auto; overflow: visible; margin: 0 auto; }
  svg.iso .iso-floor { fill: rgba(var(--accent-rgb), 0.07); stroke: rgba(var(--accent-rgb), 0.3);
    stroke-width: 0.04; }
  svg.iso .iso-wall { fill: rgba(var(--accent-rgb), 0.045); stroke: rgba(var(--accent-rgb), 0.22);
    stroke-width: 0.04; }
  svg.iso .iso-wall-b { fill: rgba(var(--accent-rgb), 0.02); }
  svg.iso .iso-rule { stroke: rgba(var(--accent-rgb), 0.16); stroke-width: 0.025; }
  /* The ramp edge. Gold and heavier than a cell rule, because "which way am I looking" has to be
     answerable at a glance — especially once the view can be spun. */
  svg.iso .iso-door-bar { fill: none; stroke: var(--gold); stroke-width: 0.09; stroke-linecap: round; }
  svg.iso .iso-door-label { fill: var(--gold); font-family: var(--sans); font-size: 0.5px;
    font-weight: 700; letter-spacing: 0.06px; }
  svg.iso .iso-face { stroke: rgba(0, 0, 0, 0.55); stroke-width: 0.03; stroke-linejoin: round; }
  /* A ghosted lift must still read as CARGO IS HERE — the hold is not empty just because you are
     looking at a different lift — while never competing with the one you are being told to load. */
  svg.iso .iso-box.ghost { opacity: 0.45; }
  svg.iso .iso-num { fill: #04121a; font-family: var(--mono); font-weight: 700;
    text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  .legend { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 8px; font-size: 9.5px; color: var(--cyan-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  /* The zone key: one row per drop-off stop, stacked rather than wrapped inline, because each row
     now carries the stop AND what is in it and two of those side by side is unreadable at 420px. */
  .legend.zones { flex-direction: column; gap: 4px; }
  .legend.zones span { align-items: baseline; font-size: 10.5px; color: var(--cyan-text); }
  .legend.zones i { flex: none; transform: translateY(1px); }
  .legend.zones b { font-weight: 400; font-family: var(--mono); font-size: 9px; color: var(--faint); }

  /* ── The advisor ──────────────────────────────────────────────────────────
     "What should I go looking for?" — a ranked list of contract TYPES, matched against the board
     by its TITLE, because the title IS the model: "<Rung> Rank - Direct <Size> Cargo Haul". */
  .stand { padding: 8px 12px; border-bottom: 1px solid var(--divider); }
  .stand .row { display: flex; align-items: center; gap: 6px; }
  .stand select, .stand input { font-family: var(--sans); font-size: 11px; color: var(--cyan-bright);
    background: var(--menu-bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 5px; }
  .stand select { flex: 1; min-width: 0; }
  .stand select option { background: var(--menu-bg); color: var(--cyan-bright); }
  .stand input { width: 74px; font-family: var(--mono); text-align: right; }
  .stand input:focus, .stand select:focus { outline: none; border-color: var(--cyan); }
  /* The headline the whole tab exists for. */
  .climb { margin-top: 7px; font-size: 11px; line-height: 1.5; color: var(--cyan-text); }
  .climb .big { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--gold); }
  .climb .sub { display: block; margin-top: 2px; font-size: 9.5px; color: var(--faint); }
  .climb .none { color: var(--amber); }

  .arow { display: flex; gap: 8px; padding: 6px 12px; border-bottom: 1px solid rgba(var(--accent-rgb), 0.06); }
  /* Locked = above your rung, so it is not on your board at all. Kept in the list because seeing
     what the next rank unlocks is half the reason to grind toward it. */
  .arow.locked { opacity: 0.45; }
  .arow .ph { font-size: 9px; color: var(--cyan-dim); white-space: nowrap; }
  .arow.clickable { cursor: pointer; }
  .arow.clickable:hover { background: rgba(var(--accent-rgb), 0.07); }

  .arow .n { flex: none; width: 18px; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .arow .mid { flex: 1; min-width: 0; }
  .arow .t { font-size: 11.5px; color: var(--cyan-bright); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .arow.locked .t { color: var(--cyan-dim); }
  .arow .m { font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-top: 1px; }
  .arow .r { flex: none; text-align: right; }
  .arow .r .v { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--gold); }
  .arow .r .u { display: block; font-size: 8.5px; color: var(--faint); }
  .lockpill { font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--amber); }
  /* The rep/aUEC switch, in the open where it can be flipped back and forth. Sized down from .hbtn
     because it rides inside a section heading, not a toolbar. */
  .goalseg { display: inline-flex; gap: 3px; margin-left: 4px; }
  .goalseg .hbtn { padding: 1px 6px; font-size: 9px; letter-spacing: 0.02em; text-transform: none; }
  /* The family filter — also in the open, for the same reason as the goal switch. Wraps, because a
     420px panel cannot hold five of these on one line. */
  .typebar { display: flex; flex-wrap: wrap; gap: 3px; padding: 7px 12px 2px;
    border-bottom: 1px solid var(--divider); }
  .typebar .hbtn { padding: 2px 7px; font-size: 9px; letter-spacing: 0.02em; text-transform: none; }

  /* ⛔ Open haulers load themselves. The panel that replaces the whole view for them. */
  .noplan { padding: 30px 20px; text-align: center; }
  .noplan .k { font-size: 13px; font-weight: 600; color: var(--gold); }
  .noplan .why { margin-top: 8px; font-size: 11px; line-height: 1.65; color: var(--cyan-dim); }
</style>
</head>
<body>
  <div id="panel" class="wpanel">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title">Hauling</span><span class="expbadge" id="expBadge" title="EXPERIMENTAL. This widget is new and it will get things wrong — the tonnage the game never states, the order to load in, how long a run takes. Check it against your mobiGlas before you trust it, and tell Sub what it got wrong. Nothing here can affect your contracts or your cargo; it only reads the log.">EXPERIMENTAL</span>
      <span class="tabs">
        <!-- 🔴 RANK LEADS. It is the tab you are on BEFORE you have a board — you read it to decide
             what to accept, and the other two only mean anything once you have accepted something.
             Sub asked for it first; the order now matches the order of the decisions. -->
        <button id="tabAdvisor" class="hbtn on" type="button" title="Which contracts to go looking for, and how far the next rank is">Rank</button>
        <button id="tabRoute" class="hbtn" type="button" title="What order to fly the stops">Route</button>
        <button id="tabLayout" class="hbtn" type="button" title="What to load first, and where it goes on your ship">Stow</button>
        <!-- 🔑 TRADING'S OWN SUB-TABS. Sub's structure (2026-08-19): the widget has two MODES at
             the bottom — contract hauling and commodity trading — and each mode's own tabs live
             up here. Which of these five are shown is decided by `mode`; Stow appears under both
             and is rendered by the SAME `renderStow()`, so the tab is in two places and the code
             is in one. -->
        <button id="tabTrade" class="hbtn" type="button" title="Runs worth flying right now">Runs</button>
        <button id="tabLookup" class="hbtn" type="button" title="Look up one commodity: what it costs, where it sells">Look up</button>
        <button id="tabJournal" class="hbtn" type="button" title="What you actually bought and sold, and what it made">Log</button>
      </span>
    </div>

    <div class="summary">
      <div class="shiprow">
        <select id="shipPick" title="The ship you are flying. The log names it when it can; pick it here when it cannot."></select>
        <span class="src" id="shipSrc"></span>
      </div>
      <!-- 🔴 Where the player is standing. The game does not log it, and without it the optimiser
           has no origin: on mirrored contracts (A→B and B→A) it opens wherever it likes, which
           sent Sub to Baijini EMPTY while the load he wanted was at his feet. -->
      <div class="shiprow">
        <select id="startPick" title="Where you are right now. The route starts here, so it stops sending you to the far end empty."></select>
        <!-- 🔴 ON-DEMAND POSITION READ. Sub: "I don't want the app to rely on having this up on
             screen… maybe we can have a button that they click to sync location." One press, one
             frame, then it stops — nothing here runs on a timer. -->
        <button id="syncLoc" class="hbtn" type="button">Sync</button>
        <span class="whyinfo" id="syncWhy">ⓘ</span>
      </div>
      <div class="syncmsg" id="syncMsg" style="display:none"></div>
      <div class="caps" id="caps"></div>
      <div class="facts" id="facts"></div>
      <!-- 🔴 THE RATES GET THEIR OWN STRIP. Sitting in .facts they read as another property of the
           board, like "contracts 3" — and they are not: they are a rate against TIME, and the time
           is the run you are actually flying, not the contracts you happen to hold. Sub asked for
           them separated so that is understood. -->
      <div class="ratebar" id="ratebar" style="display:none"></div>
    </div>

    <!-- 🔴 Heading and explanation are BOTH filled from the live state — see renderTrack(). A
         fixed "TRACK THESE IN MOBIGLAS" is what shipped a prompt that could not come true. -->
    <div class="track" id="track" style="display:none">
      <!-- 🔑 The ⓘ sits IN the heading, not on a line of its own. It had its own .why row, which
           cost a whole line of a 560px panel to render one glyph out of line with the words it
           explains. Sub: "that's just wasting UI space." -->
      <div class="th" id="trackHead">
        <span class="k" id="trackK"></span><span class="whyinfo" id="trackInfo">ⓘ</span><span class="n" id="trackN"></span>
      </div>
      <div class="list" id="trackList"></div>
    </div>

    <!-- 🔴 Places the game never named. Same shape and same keyboard handling as the load
         checklist above — Sub asked for it as "you know how we have to put in the totals", which
         is exactly the right instinct: it is the same kind of question and belongs in the same
         kind of row. Only a TRACKED drop-off is ever named by the game, so pickups are almost
         always anonymous and this is the only way they ever get a name. -->
    <!-- 🔴 BEFORE YOU LEAVE. Sub: "I'm very forgetful, and I'm sure people using this might be
         too… before I leave a place, remind me to look for missions that pick up from here and
         drop off somewhere I'm already going." It only became buildable once the log gave us the
         player's location — until then the widget could not know you were anywhere. -->
    <div class="depart" id="depart" style="display:none"></div>

    <div class="track places" id="places" style="display:none">
      <div class="th">
        <span class="k">Name these places</span><span class="whyinfo" id="placesInfo">ⓘ</span><span class="n" id="placesN"></span>
      </div>
      <div class="list" id="placesList"></div>
    </div>

    <div id="body"><div class="empty" id="emptyState">Waiting for a hauling contract…</div></div>

    <!-- 🔑 THE MODE BAR. Two things this widget does, and they are different jobs: fly the
         contracts the game gave you, or buy and sell on your own account. Sub's call to split
         them rather than let Trade sit as a fourth peer of Rank/Route/Stow — those three are all
         about one board, and Trade is not about a board at all.
         The UEX credit lives here because this is where their data is on screen: it shows only in
         Trading mode, since nothing on the hauling side comes from them. -->
    <div id="modebar" class="modebar">
      <button id="modeHaul" class="hbtn on" type="button" title="The contracts you have accepted">Hauling</button>
      <button id="modeTrade" class="hbtn" type="button" title="Buy low somewhere, sell high somewhere else">Trading</button>
      <button id="uexCredit" class="uexbadge" type="button" hidden
        title="Commodity prices are community-reported through UEX. Open uexcorp.space">Powered by <b>UEX</b></button>
    </div>

    <div id="wsettings" class="wsettings">
      <div class="ws-sec">Plan for</div>
      <div class="ws-row">
        <button id="objBtn" class="hbtn" type="button" title="Both order a trip by time. This only decides which contracts share a trip when the load needs splitting.">Fastest run</button>
      </div>
      <div class="ws-sec">Stow view</div>
      <div class="ws-row">
        <button id="spinBtn" class="hbtn" type="button" title="Walk round to the other end of the hold. A fixed camera always hides the boxes behind the front row.">Turn around</button>
      </div>
      <!-- ⛔ The rep/aUEC toggle does NOT live here. Sub: "something people might want to literally
           toggle back and forth on to see what the difference is — it shouldn't be hidden behind a
           menu that's not visible all the time." Right: it is a comparison control, not a setting.
           It sits on the Rank tab itself. -->
      <div class="ws-sec">Reminders</div>
      <div class="ws-row">
        <button id="departBtn" class="hbtn" type="button" title="Before you leave a stop, remind me to check the board for a load going the same way.">Departure reminder</button>
      </div>
      <div class="ws-sec">Contracts</div>
      <div class="ws-row">
        <button id="doneBtn" class="hbtn" type="button" title="Show contracts that have already ended">Show finished</button>
      </div>
    </div>
  </div>

<script src="/hauling-stow.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__haulingHost : null;

  let plan = null;
  let ships = [];
  let view = "advisor";
  let objective = "auec-per-hour";
  let showDone = false;
  let shipPick = "";          // "" = trust the log
  /* Which of the widget's two jobs is on screen: "hauling" (the contracts you accepted) or
     "trading" (buying and selling on your own account). Remembered, because a player works one
     of them for hours at a time. */
  const MODE_KEY = "sc-hauling-mode";
  let mode = (() => { try { return localStorage.getItem(MODE_KEY) === "trading" ? "trading" : "hauling"; } catch { return "hauling"; } })();
  // Where the player says they are. localStorage, not config: it is a fact about right now, and a
  // stale one is worse than none — so it is dropped the moment the plan stops containing it.
  const START_KEY = "sc-hauling-start";
  let startPick = (() => { try { return localStorage.getItem(START_KEY) || ""; } catch { return ""; } })();
  // Which end of the hold the stow diagram is drawn from. Remembered, because a player who turned
  // it round did so for a reason and a reset every render would fight them.
  /* Contracts the player has set aside. Kept per-browser like the pins — it is a decision about
     THIS run, not a setting. The game removes an ABANDONED contract on its own; this covers the gap
     before that, when the player has decided to skip one but has not opened mobiGlas yet. */
  const HIDE_KEY = "sc-hauling-hidden";
  let hidden = (() => { try { return JSON.parse(localStorage.getItem(HIDE_KEY) || "[]"); } catch { return []; } })();
  function saveHidden() { try { localStorage.setItem(HIDE_KEY, JSON.stringify(hidden)); } catch { /* private mode */ } }
  /* 🔴 TWO DIFFERENT "NO"S, and they are not the same question.
     The CHECKBOX is "not this run" — the contract stays on the board, greyed, and drops out of the
     route so you can SEE what the route costs without it. Sub's framing: grab five, be unsure
     about one, untick it and watch the plan change. That is a comparison, not a decision.
     The ✕ is "get this off my screen" — for a contract the log never closed out, so it sits there
     forever and cannot be done. That one is a stuck-record escape hatch, not a planning tool.
     Both are reversible; neither touches the game. */
  const DROP_KEY = "sc-hauling-dropped";
  let dropped = (() => { try { return JSON.parse(localStorage.getItem(DROP_KEY) || "[]"); } catch { return []; } })();
  function saveDropped() { try { localStorage.setItem(DROP_KEY, JSON.stringify(dropped)); } catch { /* private mode */ } }
  /* The contracts list folded away. It is reference, not instruction — the route tells you what to
     do — so on a small overlay it is the first thing worth reclaiming. */
  const FOLD_KEY = "sc-hauling-fold-contracts";
  let foldContracts = (() => { try { return localStorage.getItem(FOLD_KEY) === "1"; } catch { return false; } })();
  const SPIN_KEY = "sc-hauling-spin";
  let stowSpin = (() => { try { return localStorage.getItem(SPIN_KEY) === "1"; } catch { return false; } })();
  function saveStart() { try { localStorage.setItem(START_KEY, startPick); } catch { /* private mode */ } }
  /** Which lift the stow diagram is lighting up. Defaults to the first one to load. */
  let focusMission = null;
  /** Hull classes whose boxes the station's arm places for you — they get no stowage plan at all.
   *  From /api/ships, which is the only place the flag lives (see src/hauling-autoload.ts). */
  let autoLoadClasses = new Set();

  /* 🔑 Pins are the player's own reading of a contract they have NOT tracked, so they must survive
     the widget being closed — hiding a widget UNLOADS its iframe (see missions.html unloadFrame),
     which would otherwise throw away typing the player did seconds ago. Keyed by missionId and
     pruned to what is still live, so an old shard's contracts can never accumulate. */
  const PIN_KEY = "sc-hauling-pins";
  const readPins = () => { try { return JSON.parse(localStorage.getItem(PIN_KEY) || "{}"); } catch { return {}; } };
  let pins = readPins();
  function savePins() { try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch { /* private mode */ } }
  function prunePins(liveIds) {
    let changed = false;
    /* 🔴 A PER-PICKUP PIN IS KEYED "<missionId>#pN". Pruning on an exact match would delete every
       one of them on the next poll, which is how the first cut of per-pickup figures silently
       forgot everything the player typed. Judge the mission part. */
    for (const id of Object.keys(pins)) {
      const mission = id.split("#")[0];
      if (!liveIds.has(mission)) { delete pins[id]; changed = true; }
    }
    if (changed) savePins();
  }

  const num = (n) => Number(n || 0).toLocaleString();
  /** "3", "3 and 4", "3, 4 and 7" — a list a person reads rather than an array printed. */
  const list = (xs) => xs.length < 2 ? String(xs[0] ?? "")
    : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
  function fmtMins(min) {
    const m = Math.max(1, Math.round(min || 0));
    if (m < 60) return m + "m";
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + "h " + String(r).padStart(2, "0") + "m" : h + "h";
  }
  /** How a load figure is written. 🔴 A RANGE IS NEVER PRINTED AS A NUMBER — that is the whole
   *  reason the plan tags every figure with a source. */
  function fmtScu(c) {
    if (c.scu == null) return "? SCU";
    if (c.source === "range") return c.minScu + "–" + c.maxScu + " SCU";
    return num(c.scu) + " SCU";
  }
  const BADGE = {
    manifest: ["exact", "The game listed every box for this contract."],
    log: ["stated", "The game stated this tonnage on its own objective line."],
    pinned: ["yours", "You typed this figure in."],
    derived: ["worked out", "The contract total less what you pinned at the other pickups — so this one did not need asking about."],
    dataset: ["data", "The game files state one figure for this contract."],
    range: ["range", "The game files only bound this contract — the real load is somewhere inside it. The game states the exact figure when it assigns the objective; until then, type it in to pin it."],
    unknown: ["unknown", "Neither the log nor the dataset says how much this contract carries."],
  };

  /* 🔑 One MISSION, one hue — and a mission's separate drop-offs shift lightness inside it.
     That is the unit the player thinks in and the unit the freight elevator lifts in, so it has to
     be the unit the eye groups by. Keyed off a leg's group so every call site (route chips,
     contract cards, the stow diagram) lands on the same colour for the same cargo. */
  /* 🔴 ONE COLOUR PER DROP-OFF STOP. This was one hue per MISSION, and Sub found the flaw with a
     board carrying three missions across two destinations: Silicon and Tin both go to Riker but
     belonged to different contracts, so they drew in two different colours and the hold looked like
     it needed three separated regions when it needs two. "All I really need is two areas of the
     cargo grid." Everything for a stop comes off together, so everything for a stop is one colour.
     Depth is dropped from the hue for the same reason — it split a zone that unloads as one. */
  const colourOf = (group) => StowView.shade(StowView.zoneOf(plan, group), 0);
  /** A leg's index within its own contract. Still used by the diagram's per-box shading. */
  const depthOf = (group) => StowView.depthOf(plan, group);

  /**
   * The route's own step number for each drop-off place, so the hold's zones can be named with the
   * numbers already on screen — "② Riker Memorial Spaceport", not a second numbering to reconcile.
   *
   * 🔑 Built by walking the route exactly as renderRoute numbers it, because two numberings that
   * drift apart are worse than none: the whole point is that the zone in the picture and the step
   * in the list are the same thing.
   */
  function dropStepIndex() {
    const byLoc = new Map();
    if (!plan) return byLoc;
    let step = 0;
    for (const [ti, trip] of plan.trips.entries()) {
      if (ti === 0) step += (plan.completedPickups || []).length;
      for (const s of trip.stops) {
        for (const kind of ["dropoff", "pickup"]) {
          const acts = s.actions.filter((a) => a.kind === kind);
          if (!acts.length) continue;
          step++;
          // A stop's id is `<locationId>:<kind>` (see buildStops), and zoneOf returns that same
          // locationId — so stripping the suffix is the join, with no server change needed.
          const loc = String(s.id || "").replace(/:(pickup|dropoff)$/, "");
          if (kind === "dropoff" && !byLoc.has(loc)) byLoc.set(loc, { step, name: s.name });
        }
      }
    }
    return byLoc;
  }

  // ── loading ───────────────────────────────────────────────────────────────
  let pending = null;
  function refresh() {
    // Coalesce: an accept burst emits a dozen CreateMarker lines and therefore a dozen SSE
    // pushes, and re-solving on each one is pure waste.
    clearTimeout(pending);
    pending = setTimeout(load, 120);
  }
  async function load() {
    try {
      const r = await fetch("/api/hauling/plan", {
        method: "POST", headers: { "Content-Type": "application/json" }, cache: "no-store",
        // Both kinds leave the route: unticked is "not this run", dropped is "not at all".
        body: JSON.stringify({ ship: shipPick, objective, pins, startAt: startPick,
                               hidden: hidden.concat(dropped) }),
      });
      if (!r.ok) return;
      plan = await r.json();
      prunePins(new Set(plan.contracts.filter((c) => !c.ended).map((c) => c.missionId)));
      /* 🔑 TRACKING IT AGAIN BRINGS IT BACK — Sub's own suggestion, and better than a restore
         button nobody would find: the player is already in mobiGlas, and selecting a contract there
         is an unambiguous statement that they intend to fly it. Also drop any id the board no
         longer carries, so a finished or abandoned contract does not sit in this list for ever. */
      const live = new Set(plan.contracts.map((c) => c.missionId));
      const restored = plan.contracts.filter((c) => c.trackedNow && hidden.includes(c.missionId)).map((c) => c.missionId);
      const next = hidden.filter((id) => live.has(id) && !restored.includes(id));
      if (next.length !== hidden.length) { hidden = next; saveHidden(); }
      // A dropped contract that has left the board is not dropped any more, it is gone. Keeping
      // the id would silently swallow a NEW contract that happened to reuse it.
      const keptDrop = dropped.filter((id) => live.has(id));
      if (keptDrop.length !== dropped.length) { dropped = keptDrop; saveDropped(); }
      // A start the plan no longer knows about is a place from a finished board. Silently keeping
      // it would route from somewhere that is not on the map any more.
      // 🔴 BUT ONLY ONCE THERE IS A BOARD TO CHECK AGAINST. This ran unguarded and erased the
      // player's position on EVERY app restart: the first plan arrives before the log watcher has
      // read any contracts, so locationNames is `{}`, every id looks unknown, and the saved answer
      // is deleted and written back empty. Sub set his location repeatedly and watched the route
      // revert to opening at Baijini each time — this line was eating it, not the router.
      // An empty board proves nothing about a place. Forget nothing until there is something to
      // compare with.
      const known = plan.locationNames && Object.keys(plan.locationNames).length;
      if (startPick && known && !(startPick in plan.locationNames)) { startPick = ""; saveStart(); }
    } catch { /* sidecar down — keep the last good plan on screen */ }
    render();
  }

  async function loadShips() {
    try {
      const r = await fetch("/api/ships?names=1", { cache: "no-store" });
      if (r.ok) {
        // 🔑 Dedupe by display name. The dataset carries every AI and event variant of a hull as
        // its own class with the SAME name — four "Aegis Idris-P", five "RSI Apollo Triage" — and
        // an unfiltered list is 155 rows most of which are decoys. The store emits the base class
        // first, so keeping the first of each name keeps the hull you can actually fly.
        const all = (await r.json()).ships || [];
        // The auto-load set is built from EVERY row, before the dedupe throws variants away — the
        // log can name a variant class the picker never shows, and that hull still auto-loads.
        autoLoadClasses = new Set(all.filter((s) => s.autoLoad).map((s) => s.className));
        const seen = new Set();
        ships = all.filter((s) => {
          const k = (s.displayName || s.className).toLowerCase();
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
      }
    } catch { /* the picker just stays empty; the log's ship still works */ }
    renderShipPicker();
  }

  /** The saved override, so a fresh widget opens on the hull the player last chose. */
  async function loadConfig() {
    try {
      const r = await fetch("/api/config", { cache: "no-store" });
      if (r.ok) shipPick = (await r.json()).haulingShip || "";
    } catch { /* no sidecar config — the log's ship is the only source */ }
  }
  function saveShip(v) {
    fetch("/api/config", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ haulingShip: v }),
    }).catch(() => { /* the pick still applies to this session */ });
  }

  // ── render ────────────────────────────────────────────────────────────────
  function renderShipPicker() {
    const el = $("shipPick");
    el.textContent = "";
    const auto = document.createElement("option");
    auto.value = "";
    // 🔴 SAY WHAT AUTO ACTUALLY FOUND. "Auto — whatever the log sees" is a promise, not a reading:
    // Sub's C2 was detected correctly and the control gave him no way to know that, so he could not
    // tell a working detector from a silent one. Name the hull when we have it.
    const found = plan && plan.ship && plan.ship.source !== "manual" ? plan.ship.displayName : null;
    auto.textContent = found ? "Auto — " + found : "Auto — nothing detected yet";
    auto.title = found
      ? "Detected from the game. Pick a hull below to override it."
      : "No ship seen yet — the game names it when you board. Pick one below if it stays blank.";
    el.appendChild(auto);
    for (const s of ships) {
      const o = document.createElement("option");
      o.value = s.className;
      o.textContent = (s.displayName || s.className) + "  ·  " + num(s.totalScu) + " SCU";
      el.appendChild(o);
    }
    el.value = shipPick;
  }

  /** Where you are. Options are the places THIS board touches — nowhere else can be an origin the
   *  router understands, and offering the whole star map would be offering places it cannot use. */
  function renderStartPicker() {
    const el = $("startPick");
    el.textContent = "";
    /* 🔴 AUTO NAMES WHAT THE LOG FOUND. The game states where you are every time you open a local
       inventory (`RequestLocationInventory`), which a hauler does at every stop — so this control
       is now a fallback, not the only source. Same rule as the ship picker: say what auto actually
       detected, because "auto" as a bare promise gives no way to tell a working detector from a
       silent one. */
    const sr = (plan && plan.startResolved) || {};
    const found = sr.detected ? (plan.locationNames || {})[sr.detected] : null;
    const auto = document.createElement("option");
    auto.value = "";
    auto.textContent = found ? "Auto — you're at " + found
      : sr.detectedToken ? "Auto — the game says " + sr.detectedToken + " (not on this board)"
      : "Auto — nowhere detected yet";
    auto.title = found
      ? "Read from the game: it names your location whenever you open an inventory there. Pick"
        + " somewhere below to override it."
      : sr.detectedToken
      ? "The game placed you at " + sr.detectedToken + ", which does not match any stop on this"
        + " board — so the route has no origin. Pick where you are below."
      : "The game names your location when you open an inventory somewhere. Until then, pick it here.";
    el.appendChild(auto);
    for (const [id, name] of Object.entries((plan && plan.locationNames) || {})) {
      const o = document.createElement("option");
      o.value = id;
      o.textContent = "I'm at " + name;
      el.appendChild(o);
    }
    el.value = startPick;
  }

  function renderSummary() {
    const ship = plan && plan.ship;
    $("shipPick").value = shipPick;
    $("shipSrc").textContent = !ship ? "no ship" : ship.source === "manual" ? "your pick" : "from log";
    $("shipSrc").title = !ship
      ? "Nothing in the log named a ship, and nothing is picked."
      : ship.source === "manual" ? "You chose this hull." : "The game's vehicle-control lines named this hull.";

    const caps = $("caps");
    caps.textContent = "";
    if (ship) {
      for (const g of ship.grids) {
        const d = document.createElement("div");
        d.className = "cap" + (g.usedScu > g.capacityScu ? " over" : "");
        d.style.flex = g.capacityScu;
        d.title = g.name + " — " + g.w + "x" + g.l + "x" + g.h + " cells, " + num(g.usedScu) + " of " + num(g.capacityScu) + " SCU";
        const fill = document.createElement("i");
        fill.style.width = Math.min(100, (g.usedScu / Math.max(1, g.capacityScu)) * 100) + "%";
        const lbl = document.createElement("b");
        lbl.textContent = num(g.usedScu) + " / " + num(g.capacityScu);
        d.append(fill, lbl);
        caps.appendChild(d);
      }
    }

    const facts = $("facts");
    facts.textContent = "";
    if (!plan) return;
    const t = plan.totals;
    const bits = [];
    bits.push(["to move", num(t.scu) + " SCU", false]);
    /* 🔴 SPLIT "aboard" FROM "on the pad". They were one figure, and that difference is the whole
       complaint: the game completes a pickup when it releases cargo to the lift, so a number
       labelled "aboard" was counting boxes still sitting on the floor beside the ship. */
    const inHold = plan.aboardScu - (plan.onPadScu || 0);
    if (inHold > 0) bits.push(["aboard", num(inHold) + " SCU", false]);
    if (plan.onPadScu > 0) bits.push(["on the pad", num(plan.onPadScu) + " SCU", false]);
    bits.push(["contracts", String(t.liveContracts), false]);
    if (plan.trips.length) {
      const landings = plan.trips.reduce((s, x) => s + x.landings, 0);
      bits.push(["stops", String(landings), false]);
      bits.push(["est. run", fmtMins(t.totalMinutes), false]);
    }
    if (plan.trips.length > 1) bits.push(["trips", String(plan.trips.length), true]);
    if (plan.pack && !plan.pack.fits) bits.push(["won't fit", plan.pack.unplaced.length + " boxes", true]);
    if (t.recentPayout) bits.push(["paid", num(t.recentPayout) + " aUEC", false]);
    for (const [k, v, bad] of bits) {
      const s = document.createElement("span");
      s.textContent = k + " ";
      const b = document.createElement("span");
      b.className = "v" + (bad ? " bad" : "");
      b.textContent = v;
      s.appendChild(b);
      facts.appendChild(s);
    }
    renderRates();
  }

  /**
   * 🔴 WHAT THE RUN IS EARNING — per hour, in both currencies.
   *
   * Two rates, and which one is on screen is never left to be guessed. `actual` is MEASURED: real
   * awards read off the log against real elapsed time. `projected` is what the board ahead is worth
   * against this planner's own run estimate, and is therefore only ever as good as that estimate.
   * Sub asked for the real figure "projected if we don't actually have enough data", so the
   * measured one wins whenever it exists and the wording says which is showing — "earning" for a
   * fact, "should earn" for a forecast.
   *
   * ⚠️ REPUTATION IS NEVER IN THE GAME LOG. Searching a live session finds only the name of the rep
   * gRPC service — no amounts, no deltas. The figure comes off the mission dataset, which states it
   * per contract and reads it from the game files rather than fitting it.
   */
  function renderRates() {
    const bar = $("ratebar");
    bar.textContent = "";
    const r = (plan && plan.rates) || {};
    const rate = r.actual || r.projected;
    if (!rate) { bar.style.display = "none"; return; }
    bar.style.display = "";
    const measured = !!r.actual;
    const est = measured ? "" : " est";
    const per = (v) => (v >= 1000 ? Math.round(v / 1000) + "k" : Math.round(v));

    const k = document.createElement("span");
    k.className = "k";
    k.textContent = measured ? "Earning" : "Should earn";
    bar.appendChild(k);

    const money = document.createElement("span");
    money.className = "fig" + est;
    money.textContent = per(rate.auecPerHour) + " aUEC/h";
    money.title = measured
      ? "Measured — " + num(Math.round(r.actual.auec)) + " aUEC from " + r.actual.contracts
        + " finished contract" + (r.actual.contracts > 1 ? "s" : "") + " over " + fmtMins(r.actual.minutes)
        + " of run. Per hour of RUN TIME, not per contract: flying and loading count against it."
      : "A forecast: nothing has finished yet, so this is what the board ahead is worth against the"
        + " estimated run time. It becomes a measured figure the moment you deliver."
        + (r.payoutModelled ? "  ⚠️ A contract here has a modelled payout, not a stated one." : "");
    bar.appendChild(money);
    /* 🔴 A RESET, BECAUSE AN AVERAGE HAS NO WAY BACK. Even with idle time excluded, a session that
       has been open all day carries a denominator nothing can shift — Sub, parked while we worked:
       "I've been sitting here for a long time and it kind of screws up the counts."
       Only offered on a MEASURED figure: there is nothing to reset about a forecast. */
    if (measured) {
      const rst = document.createElement("button");
      rst.type = "button";
      rst.className = "ratereset";
      rst.textContent = "reset";
      rst.title = "Start the earnings measurement again from now. Your contracts, tracking and"
        + " progress are untouched — this only forgets the elapsed time and what has been banked,"
        + " so the per-hour figures start fresh. The next reading will be over a short window.";
      rst.addEventListener("click", async (e) => {
        e.stopPropagation();
        try { await fetch("/api/hauling/reset-rates", { method: "POST" }); } catch { /* sidecar down */ }
        load();
      });
      bar.appendChild(rst);
    }

    // Suppressed at zero rather than printed as "0/h": Master-rank Large and Bulk hauls genuinely
    // pay no reputation, and a zero there is a fact about the contract, not about the run.
    if (rate.repPerHour > 0) {
      const rep = document.createElement("span");
      rep.className = "rep" + est;
      rep.textContent = per(rate.repPerHour) + " rep/h";
      rep.title = "Reputation per hour, on the same basis. The game never logs reputation in any"
        + " form — this comes from the mission dataset, which states it per contract.";
      bar.appendChild(rep);
    }

    /* 🔑 SAY WHAT THE DENOMINATOR IS. The whole reason this strip exists is that a rate reads like
       a property of the contracts unless something tells you otherwise, and it is not — it is
       against the clock. Naming the window is what makes the number interpretable. */
    const basis = document.createElement("span");
    basis.className = "basis";
    basis.textContent = measured ? "over " + fmtMins(r.actual.minutes) + " of run" : "at the estimated pace";
    basis.title = measured
      ? "Every minute since the first hauling event this session, including the ones spent not hauling."
      : "Against this planner's own estimate for the run ahead.";
    bar.appendChild(basis);
  }

  /* 🔴 THE THREE STATES. The old prompt had one — "TRACK THESE IN MOBIGLAS", shown to every
     contract whose tonnage was unknown — and for most of them that instruction could not come
     true. The game states a contract's tonnage when it ASSIGNS the objective (a fresh accept, a
     spawn-in, a leg changing state); tracking an already-assigned contract replays nothing.
     Sub tracked four contracts, watched this panel keep telling him to track them, and reasonably
     concluded the app was broken. So a row now says which of these it is:

       todo      not tracked in mobiGlas. Tracking is worth doing — the next assignment will
                 carry the figure — but it is a "then", not a "now".
       waiting   tracked already. Nothing further to do; the game has been asked and will not
                 answer again this session. The type-it-in box is the only route to a number.
       pinned    the player typed it. */
  const TRACK_STATE = {
    todo: ["track it", "Not tracked in mobiGlas. Track it and the tonnage arrives with the next objective assignment — at the latest, next time you spawn in. Or type it in now."],
    waiting: ["tracked", "Already tracked — nothing more for you to do here. The game states the tonnage only when it assigns the objective (at accept, or on spawn-in), and re-tracking does not replay it. Type the figure off your mobiGlas to pin it."],
    pinned: ["yours", "You typed this figure in. Clear the box to fall back to what the game files allow."],
  };
  /* 🔴 "WORKED OUT" IS ANSWERED TOO. Pin one pickup of a two-pickup contract and the other is
     derived — the contract is then fully known, but this read only `pinned`, so the card went on
     saying "Load not confirmed" and never collapsed. Sub: "the loadout not confirmed doesn't
     collapse once I put in the number." Both sources came from him; one just took arithmetic. */
  const trackStateOf = (c) => c.source === "pinned" || c.source === "derived" ? "pinned"
    : c.trackedNow ? "waiting" : "todo";
  /** Has the player re-opened the collapsed "all answered" card to edit a figure? Reset whenever a
   *  row needs action again, so a new unanswered contract always arrives expanded. */
  let trackOpen = false;
  /** missionId -> the row's live DOM, kept across renders so an input the player is clicking is
   *  never destroyed underneath them. See renderTrack. */
  const trackRows = new Map();

  // ── the shared keyboard grab ───────────────────────────────────────────────────────────────
  // 🔴 THE GRAB IS PER-WIDGET, NOT PER-FIELD, and it hands focus back through ONE function.
  // Re-entering it while already inside a field is what made every box except the first
  // unreachable: focusing box 2 called editStart again, the shell took window focus and called
  // __haulingFocus to give it back — and that focused `querySelector("input")`, i.e. box 1.
  // Clicking box 2 and TABBING to box 2 both died there, which is the tell: Tab is native
  // behaviour, so nothing in this page's own DOM could have explained it.
  //
  // Two rules fix it, and both are needed:
