  //   1. Remember which box the player actually wants, so the hand-back goes to the right one.
  //   2. Do not tear the grab down and rebuild it when focus moves BETWEEN fields of this widget.
  //      The release is deferred a tick, and a sibling taking focus cancels it — so moving box to
  //      box never re-enters the grab at all, and the shell is never asked to re-focus anything.
  let wantFocus = null;
  let grabHeld = false;
  let releaseTimer = null;
  function grabOn(el) {
    wantFocus = el;
    clearTimeout(releaseTimer); releaseTimer = null;
    if (grabHeld) return;   // already inside a field — re-entering is the bug, not the fix
    grabHeld = true;
    try { host()?.editStart?.(); } catch { /* standalone */ }
  }
  function grabOff() {
    clearTimeout(releaseTimer);
    releaseTimer = setTimeout(() => {
      releaseTimer = null; grabHeld = false; wantFocus = null;
      try { host()?.editEnd?.(); } catch { /* standalone */ }
      // Stepping out of the last box with every figure supplied is the natural moment to put the
      // card away — Sub asked for exactly this, and it beats making him hunt for a control.
      if (allPinnedNow()) { trackOpen = false; render(); }
    }, 0);
  }
  /** Every listed contract carries a figure the player typed. Recomputed rather than remembered:
   *  the board changes underneath this widget constantly.
   *
   *  🔴 UNTICKED AND REMOVED CONTRACTS ARE NOT ASKED ABOUT. Telling a player to go track something
   *  in mobiGlas that they have already said they are not flying is pure noise — and Sub's ruling
   *  on the abandoned case was that it is not even a question: "If they drop the mission, that
   *  should immediately come out of there. You don't even need my call for that." */
  function allPinnedNow() {
    if (!plan) return false;
    const live = plan.contracts.filter((c) => !c.ended && !c.hidden && !dropped.includes(c.missionId)
      && (!c.deliverSeen || c.source === "range" || c.source === "unknown"));
    return live.length > 0 && live.every((c) => trackStateOf(c) === "pinned");
  }

  /** 🔴 The load checklist. Each row names a contract whose tonnage the game has not stated,
   *  says which of the three states it is in, shows the bounds we do have, and offers a box to
   *  type the real figure into. */
  function renderTrack() {
    const el = $("track");
    const live = plan ? plan.contracts.filter((c) => !c.ended && !c.hidden && !dropped.includes(c.missionId)
      && (!c.deliverSeen || c.source === "range" || c.source === "unknown")) : [];
    if (!live.length) { el.style.display = "none"; return; }
    el.style.display = "";
    // The heading is an instruction ONLY while at least one row can act on it.
    // 🔴 THREE row states need THREE headings. This was `todo ? … : "Load not confirmed"`, which
    // told Sub the load was unconfirmed on 2026-08-17 *immediately after he confirmed it himself*.
    // A pinned row never leaves this list — the filter keeps anything the GAME never stated, and
    // pinning cannot change that — so "all pinned" is a normal resting state, not an alarm.
    const todo = live.filter((c) => trackStateOf(c) === "todo").length;
    const allPinned = live.every((c) => trackStateOf(c) === "pinned");
    // 🔴 Nothing outstanding: the player answered every row themselves. The card cannot simply be
    // hidden — the type-in box lives ONLY here, so hiding it strands the one way to correct a
    // wrong figure — so it collapses to its heading and reopens on a click.
    // A pinned row never leaves `live` (the filter keeps whatever the GAME never stated, and
    // pinning cannot change that), which is why "answered" has to be a display state, not a filter.
    if (allPinned && !trackOpen) {
      el.classList.add("done");
      $("trackK").textContent = "Load set by you";
      $("trackInfo").title = "You typed these in and the plan is using your figures. Click the heading to change them.";
      $("trackN").textContent = live.length + " of " + plan.totals.liveContracts;
      $("trackList").textContent = "";
      return;
    }
    el.classList.remove("done");
    $("trackK").textContent = todo ? "Track these in mobiGlas" : allPinned ? "Load set by you" : "Load not confirmed";
    /* 🔴 THE EXPLANATION IS A TOOLTIP, NOT A PARAGRAPH. Sub: "let's just put a circle with an eye
       and put all that information in a tooltip. I want to clean up the UI." He is right — this is
       WHY text, read once and then re-read on every render for the rest of the session. The reason
       has to stay reachable, because "why am I typing this in" is a fair question, but it does not
       have to occupy four lines of a small overlay forever. */
    const why = todo
      ? "The game states a contract's tonnage when it assigns the objective — at accept, or the next time you spawn in. Track the ones below and the next assignment tells us, or type the figure straight off your mobiGlas."
      : allPinned
      ? "The game never stated these, so they stay listed — but you have typed the figures in and the plan is using yours. Clear a box to fall back to what the game files allow."
      : "These are tracked and the game still has not stated their load. It only says the tonnage when it assigns the objective, and re-tracking does not replay that — so type the figure off your mobiGlas, or wait for the next spawn-in.";
    $("trackInfo").title = why;
    $("trackN").textContent = live.length + " of " + plan.totals.liveContracts;
    const list = $("trackList");
    // 🔴 ROWS ARE REUSED, keyed by mission — they used to be torn down and rebuilt on every render,
    // and that made the second box unclickable. Typing in one box and clicking the next fires
    // `change` on blur → load() → render() → `list.textContent = ""`, which DESTROYS the input the
    // player is mid-click on. The click then lands on a detached node and nothing happens; it looks
    // like the field is dead. Sub hit this trying to enter three tonnages in a row.
    // 🔑 A node the player is reaching for must survive the render.
    const seen = new Set();
    for (const c of live) {
      seen.add(c.missionId);
      let r = trackRows.get(c.missionId);
      if (!r) {
        const row = document.createElement("div");
        row.className = "trow";
        const t = document.createElement("div");
        t.className = "t";
        // Rank tier + size band, off the title. Known the moment a contract is accepted, unlike the
        // tonnage — and it is the wording on the board, so it is how this row is matched to the
        // contract in mobiGlas.
        const bd = document.createElement("div");
        bd.className = "bd";
        const st = document.createElement("span");
        const rng = document.createElement("div");
        rng.className = "rng";
        const inp = document.createElement("input");
        inp.type = "number"; inp.min = "1"; inp.step = "1";
        /* 🔴 BOUNDED. With no max, holding the spinner ran the figure to 20 on a contract whose
           whole span was single digits — Sub: "it doesn't need to go any higher than the range or
           lower than the range." A max also ends the click-and-hold ramp on its own, which is the
           other half of the complaint, without giving up the tap-to-step he wants to keep. */
        if (Number.isFinite(c.maxScu) && c.maxScu > 0) inp.max = String(c.maxScu);
        inp.placeholder = "SCU";
        inp.title = "Type the SCU total from your mobiGlas to pin it.";
        // Editing takes the canvas keyboard grab; the shell suspends the interact key while it is
        // on. Held across a move between boxes — see grabOn/grabOff.
        inp.addEventListener("focus", () => grabOn(inp));
        inp.addEventListener("blur", () => grabOff());
        // Pointer-down lands BEFORE the old field blurs, so this is the earliest honest statement
        // of which box the player is going to. Without it, a hand-back that races the focus event
        // has nothing better than "the first one" to aim at.
        inp.addEventListener("pointerdown", () => { wantFocus = inp; });
        // Keyed off the row's OWN missionId, not a captured contract object, because the row now
        // outlives the render that made it.
        const mid = c.missionId;
        inp.addEventListener("change", () => {
          const v = parseInt(inp.value, 10);
          if (Number.isFinite(v) && v > 0) pins[mid] = v; else delete pins[mid];
          savePins();
          load();
        });
        row.append(t, bd, st, rng, inp);
        r = { row, t, bd, st, rng, inp };
        trackRows.set(c.missionId, r);
      }
      r.t.textContent = c.title || c.contractKey;
      r.t.title = (c.giver ? c.giver + " · " : "") + (c.missionType || c.generator);
      if (c.board && (c.board.rank || c.board.size)) {
        r.bd.textContent = [c.board.rank, c.board.size].filter(Boolean).join(" · ");
        r.bd.title = "The rank tier and size band this contract is listed under on the board.";
      } else { r.bd.textContent = ""; r.bd.title = ""; }
      const [label, why] = TRACK_STATE[trackStateOf(c)];
      r.st.className = "badge " + trackStateOf(c);
      r.st.textContent = label;
      r.st.title = why;
      r.rng.textContent = c.minScu != null && c.maxScu != null
        ? (c.minScu === c.maxScu ? num(c.minScu) + " SCU" : c.minScu + "–" + c.maxScu + " SCU")
        : "unknown";
      r.rng.title = c.minScu != null
        ? "What the game files allow for this contract. The real figure is somewhere in here."
        : "The game files carry nothing for this contract key.";
      // ⚠️ Never overwrite a box the player is typing in — a reload mid-edit would eat the digits
      // they have entered so far.
      if (document.activeElement !== r.inp) r.inp.value = pins[c.missionId] != null ? pins[c.missionId] : "";
      list.appendChild(r.row);   // appendChild MOVES an existing node, so this also fixes the order
    }
    for (const [id, r] of trackRows) {
      if (!seen.has(id)) { r.row.remove(); trackRows.delete(id); }
    }
  }

</script>
<script src="/hauling-places.js"></script>
<script src="/hauling-tab-rank.js"></script>
<script>
  /**
   * 🔴 SYNC LOCATION — read the player's real position off the game's debug overlay, once.
   *
   * `r_DisplayInfo 1` prints `CamPos Planet Zone`, which is the player's position in the SAME
   * coordinate frame as every mission marker. So this does not need a name match at all: it snaps
   * to the nearest stop by distance. Checked against Sub's own screenshot, his CamPos sat 2.26 km
   * from Baijini Point's marker while he stood in Baijini's hangar.
   *
   * ⛔ ON DEMAND, DELIBERATELY. Sub was explicit that he does not want the overlay up permanently:
   * "it takes up way too much of the screen. It's distracting. I just want to be more immersed."
   * One press arms one read; nothing polls the screen before or after.
   *
   * ⚠️ IT ALWAYS SAYS WHAT HAPPENED. A silent failure is the worst outcome here, because the most
   * likely cause is simply that `r_DisplayInfo 1` is off — which the player can fix in five
   * seconds if told, and cannot fix at all if the button just does nothing.
   */
  let syncing = false;
  function syncMsg(text, cls) {
    const el = $("syncMsg");
    el.className = "syncmsg" + (cls ? " " + cls : "");
    el.textContent = text || "";
    el.style.display = text ? "" : "none";
  }

  async function syncLocation() {
    if (syncing) return;
    syncing = true;
    $("syncLoc").textContent = "Reading…";
    syncMsg("Looking for the debug overlay…");
    try {
      await fetch("/api/hauling/locate", { method: "POST" });
      // Poll for the capture loop's answer. Its tick is a few seconds, so give it a fair window
      // rather than declaring failure before it has looked once.
      const deadline = Date.now() + 14000;
      let result = null;
      while (Date.now() < deadline) {
        await new Promise((r) => setTimeout(r, 700));
        const res = await fetch("/api/hauling/locate?_=" + Date.now(), { cache: "no-store" });
        if (!res.ok) continue;
        const j = await res.json();
        if (j.result) { result = j.result; break; }
      }
      if (!result) {
        syncMsg("No answer from the screen reader. Is Star Citizen in front, and r_DisplayInfo 1 on?", "bad");
      } else if (!result.ok) {
        syncMsg(result.error || "Could not read the overlay.", "bad");
      } else {
        await load();
        const sr = (plan && plan.startResolved) || {};
        if (sr.detected && sr.detectedBy === "coordinates") {
          const name = (plan.locationNames || {})[sr.detected] || "a stop on your route";
          const km = sr.detectedMetres != null ? " (" + (sr.detectedMetres / 1000).toFixed(1) + " km)" : "";
          syncMsg("You are at " + name + km + ".", "good");
        } else {
          // 🔑 A read that matches nothing is NOT an error — it means you are genuinely nowhere
          // near a stop on this board, which is worth being told plainly rather than dressed up.
          syncMsg("Read your position, but you are not near any stop on this board.", "bad");
        }
      }
    } catch {
      syncMsg("The screen reader is not responding.", "bad");
    }
    $("syncLoc").textContent = "Sync";
    syncing = false;
  }
</script>
<script src="/hauling-tab-route.js"></script>
<script src="/hauling-tab-stow.js"></script>
<script src="/hauling-tab-trade.js"></script>
<script>
  /** Find the leg a packed box belongs to, for its label. */
  function legOf(group) {
    if (!group || !plan) return null;
    for (const c of plan.contracts) for (const l of c.legs) if (l.group === group) return l;
    return null;
  }
  /** locationId -> the name the plan settled on, so the route, the layout legend and the unrouted
   *  list all call a place the same thing — including places the route deliberately never visits. */
  const locNames = () => (plan && plan.locationNames) || {};
  /** Where a leg is going, in the same words the route uses. */
  function destOf(leg, names) {
    if (!leg) return "drop-off";
    return leg.destination || names[leg.toLocation] || "drop-off";
  }
  /** What a leg is carrying. Untracked contracts do not name their commodity, so fall back to the
   *  tonnage rather than printing "cargo" five times in a row. */
  const cargoOf = (leg) => leg && leg.commodity ? leg.commodity : leg && leg.scu != null ? num(leg.scu) + " SCU" : "cargo";

  function render() {
    /* 🔑 TWO MODES, ONE SET OF RENDERERS. `mode` decides which tabs are on offer; `view` still
       decides what gets drawn, exactly as before. Stow is listed under BOTH modes and is drawn by
       the same `renderStow()` — the tab is in two places, the code is in one. */
    const trading = mode === "trading";
    $("tabAdvisor").hidden = trading;
    $("tabRoute").hidden = trading;
    $("tabTrade").hidden = !trading;
    $("tabLookup").hidden = !trading;
    $("tabJournal").hidden = !trading;
    $("modeHaul").classList.toggle("on", !trading);
    $("modeTrade").classList.toggle("on", trading);
    /* Credit UEX only where their data is on screen. */
    $("uexCredit").hidden = !trading;
    document.querySelector(".tabs").classList.toggle("trading", trading);

    $("tabRoute").classList.toggle("on", view === "route");
    $("tabLayout").classList.toggle("on", view === "layout");
    $("tabAdvisor").classList.toggle("on", view === "advisor");
    $("tabTrade").classList.toggle("on", view === "trade" && tradeMode === "routes");
    $("tabLookup").classList.toggle("on", view === "trade" && tradeMode === "commodity");
    $("tabJournal").classList.toggle("on", view === "journal");
    $("objBtn").textContent = objective === "fewest-stops" ? "Fewest stops" : "Fastest run";
    $("doneBtn").textContent = showDone ? "Hide finished" : "Show finished";
    $("departBtn").textContent = departOff ? "Reminder off" : "Reminder on";
    $("departBtn").classList.toggle("on", !departOff);
    $("spinBtn").textContent = stowSpin ? "Turned around" : "Turn around";
    $("spinBtn").classList.toggle("on", stowSpin);
    $("doneBtn").classList.toggle("on", showDone);
    if (!plan) return;
    // 🔴 The auto option NAMES the detected hull, so it has to be redrawn when the plan changes.
    // It was only ever built once, from the ship-list load at startup — before any plan existed —
    // so it printed "nothing detected yet" and stayed that way for the session. Sub boarded his C2,
    // watched the skin turn Crusader, and the picker still claimed nothing was detected.
    renderShipPicker();
    renderSummary();
    renderStartPicker();
    renderTrack();
    renderPlaces();
    renderDepart();
    /* 🔑 AFTER those two, because each sets its own display. The naming and load checklists belong
       to the board you are flying; the advisor is about contracts you have NOT taken. Leaving them
       up opened the Rank tab two screens below its own heading. */
    /* Trade hides the contract furniture for the same reason Rank does: neither tab is about
       the board you are currently flying. */
    if (view === "advisor" || view === "trade" || view === "journal") { $("track").style.display = "none"; $("places").style.display = "none"; }
    if (view === "advisor") renderAdvisor();
    else if (view === "trade") renderTrade();
    else if (view === "journal") renderJournal();
    else if (view === "layout") renderStow();
    else renderRoute();
  }

  // ── wiring ────────────────────────────────────────────────────────────────
  $("tabRoute").addEventListener("click", () => { view = "route"; render(); });
  $("tabLayout").addEventListener("click", () => { view = "layout"; render(); });
  $("tabAdvisor").addEventListener("click", () => { view = "advisor"; if (!advisor) loadAdvisor(); render(); });
  $("tabTrade").addEventListener("click", () => {
    view = "trade"; tradeMode = "routes"; if (!tradeData) openTrade(); render();
  });
  $("tabLookup").addEventListener("click", () => {
    view = "trade"; tradeMode = "commodity"; loadTradeNames(); if (!tradeStatus) loadTradeStatus(); render();
  });
  $("tabJournal").addEventListener("click", () => { view = "journal"; loadJournal(); render(); });

  /* ── mode switching ───────────────────────────────────────────────────────
     🔑 Each mode remembers a SENSIBLE view rather than the last one you were on. Landing in
     Trading on the Stow tab — which is about contract cargo — would look like the switch had
     failed, so Trading opens on Runs unless Stow was deliberately chosen from within it. */
  function setMode(next) {
    if (mode === next) return;
    mode = next;
    try { localStorage.setItem(MODE_KEY, mode); } catch { /* private mode */ }
    if (mode === "trading") {
      if (view !== "layout" && view !== "journal") { view = "trade"; tradeMode = tradeMode || "routes"; }
      if (!tradeData) openTrade();
    } else if (view === "trade" || view === "journal") {
      view = "advisor";
      if (!advisor) loadAdvisor();
    }
    render();
  }
  $("modeHaul").addEventListener("click", () => setMode("hauling"));
  $("modeTrade").addEventListener("click", () => setMode("trading"));
  /* https only, through the shell — never a bare target=_blank, which would put a second
     always-on-top window over the game. */
  $("uexCredit").addEventListener("click", () => {
    try { overlayApi.openUrl("https://uexcorp.space"); } catch { /* standalone: no shell */ }
  });
  $("objBtn").addEventListener("click", () => {
    objective = objective === "fewest-stops" ? "auec-per-hour" : "fewest-stops";
    load();
  });
  $("doneBtn").addEventListener("click", () => { showDone = !showDone; render(); });
  $("departBtn").addEventListener("click", () => {
    departOff = !departOff;
    try { localStorage.setItem(DEPART_KEY, departOff ? "1" : "0"); } catch { /* private mode */ }
    render();
  });
  $("shipPick").addEventListener("change", () => {
    shipPick = $("shipPick").value;
    saveShip(shipPick);
    load();
  });
  $("spinBtn").addEventListener("click", () => {
    stowSpin = !stowSpin;
    try { localStorage.setItem(SPIN_KEY, stowSpin ? "1" : "0"); } catch { /* private mode */ }
    render();
  });
  $("syncLoc").addEventListener("click", syncLocation);
  $("syncLoc").title = "Read your exact position off the game's debug overlay, once.";
  $("syncWhy").title = "Needs the console command r_DisplayInfo 1 to be on — it prints your"
    + " coordinates in the top-right. Turn it on, press Sync, turn it back off. The app never"
    + " reads the screen except while you are pressing this.";
  $("startPick").addEventListener("change", () => {
    startPick = $("startPick").value;
    saveStart();
    load();
  });
  // The heading is the toggle, BOTH ways. It only opened before, so once Sub expanded a finished
  // card he could never put it away again. Bound to the heading, not the whole strip, so clicking
  // a row or typing in a box never collapses the thing you are working in.
  $("trackHead").addEventListener("click", () => {
    if ($("track").classList.contains("done")) { trackOpen = true; render(); return; }
    if (allPinnedNow()) { trackOpen = false; render(); }   // only collapsible once nothing is owed
  });
  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  /* Live contract state. The SSE channel is a CHANGE SIGNAL, not the payload — the plan is
     re-solved server-side on every push because it depends on the player's overrides too. */
  let es = null;
  function connect() {
    try { es?.close(); } catch { /* already gone */ }
    es = new EventSource("/hauling/events");
    es.onmessage = () => refresh();
    // EventSource retries on its own, but a sidecar restart can leave a dead stream — re-arm.
    es.onerror = () => { try { es.close(); } catch { /* ignore */ } setTimeout(connect, 4000); };
  }

  (async () => {
    await loadConfig();
    await loadShips();
    await load();
    connect();
  })();

  try { host()?.ready?.(); } catch { /* not embedded */ }
  // Per-widget settings, opened by the bar's cog. The parent injects its Text size row here too.
  window.__widgetSettings = () => $("wsettings").classList.add("open");
  window.__widgetSettingsRoot = () => $("wsettings");
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#wsettings")) $("wsettings").classList.remove("open");
  });
  /* 🔴 Hiding the widget mid-edit would strand the canvas-wide keyboard grab: the panel goes away,
     the interact key stays suspended, and every click on every display stops reaching the game with
     nothing on screen to explain it. Same rule as notepad/party/chat. */
  window.__haulingExitTyping = () => {
    try { document.activeElement?.blur?.(); } catch { /* nothing focused */ }
    try { host()?.editEnd?.(); } catch { /* not embedded */ }
  };
  // The shell's hand-back after it takes window focus. 🔴 This used to be
  // `querySelector("input")` — ALWAYS the first box — so every attempt to reach box 2 or 3 was
  // dragged back to box 1. Aim at the box the player is actually in; fall back to the first only
  // when we have no idea, which is the cold-start case this was written for.
  window.__haulingFocus = () => {
    try {
      const target = wantFocus && wantFocus.isConnected ? wantFocus : $("trackList").querySelector("input");
      target?.focus();
    } catch { /* none */ }
  };
</script>
</body>
</html>
