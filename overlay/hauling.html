      <span id="uexfresh" class="uexfresh"></span>
    </div>

    <div id="wsettings" class="wsettings">
      <div class="ws-sec">Plan for</div>
      <div class="ws-row">
        <button id="objBtn" class="hbtn" type="button" title="Both order a trip by time. This only decides which contracts share a trip when the load needs splitting.">Fastest run</button>
      </div>
      <div class="ws-sec">Stow view</div>
      <div class="ws-row">
        <button id="spinBtn" class="hbtn" type="button" title="Walk round to the other end of the hold. A fixed camera always hides the boxes behind the front row.">Turn around</button>
      </div>
      <!-- ⛔ The rep/aUEC toggle does NOT live here. Sub: "something people might want to literally
           toggle back and forth on to see what the difference is — it shouldn't be hidden behind a
           menu that's not visible all the time." Right: it is a comparison control, not a setting.
           It sits on the Rank tab itself. -->
      <div class="ws-sec">Reminders</div>
      <div class="ws-row">
        <button id="departBtn" class="hbtn" type="button" title="Before you leave a stop, remind me to check the board for a load going the same way.">Departure reminder</button>
      </div>
      <div class="ws-sec">Contracts</div>
      <div class="ws-row">
        <button id="doneBtn" class="hbtn" type="button" title="Show contracts that have already ended">Show finished</button>
      </div>
    </div>
  </div>

<script src="/hauling-stow.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__haulingHost : null;

  let plan = null;
  let ships = [];
  let view = "advisor";
  let objective = "auec-per-hour";
  let showDone = false;
  let shipPick = "";          // "" = trust the log
  /** How many non-pinned origins the picker offers. Sub's number, 2026-08-25. */
  const START_PICK_MAX = 5;
  /** The sentinel value of the "Show N older places…" row. Not a location id, and it must never be
   *  mistaken for one — it is prefixed so a coordinate key ("@x,y,z") or a buy key can never
   *  collide with it. */
  const SHOW_ALL_PLACES = "__show-all-places";
  /** Set once the player asks for the full list. Deliberately NOT persisted: the cap exists because
   *  the list grows, so it has to come back on the next open or it fixes nothing. */
  let startAll = false;
  /* ⛔ `mode` IS GONE, along with `MODE_KEY` and the localStorage value behind it. It named which
     of two jobs the widget was doing, and the only thing that made them two jobs was having two
     Route surfaces. `view` was always the thing that decided what got drawn; `mode` merely decided
     which tabs were on offer, and the two were restored from different places, which is why
     `hauling.html` needed a line reconciling them at startup.
     ⚠️ A player who last used Trading now opens on Contracts rather than on Runs. That is the
     intended behaviour of a flat row and not a lost preference — the stale `sc-hauling-mode` key
     is simply never read again. */
  // Where the player says they are. localStorage, not config: it is a fact about right now, and a
  // stale one is worse than none — so it is dropped the moment the plan stops containing it.
  const START_KEY = "sc-hauling-start";
  let startPick = (() => { try { return localStorage.getItem(START_KEY) || ""; } catch { return ""; } })();
  // Which end of the hold the stow diagram is drawn from. Remembered, because a player who turned
  // it round did so for a reason and a reset every render would fight them.
  /* Contracts the player has set aside. Kept per-browser like the pins — it is a decision about
     THIS run, not a setting. The game removes an ABANDONED contract on its own; this covers the gap
     before that, when the player has decided to skip one but has not opened mobiGlas yet. */
  const HIDE_KEY = "sc-hauling-hidden";
  let hidden = (() => { try { return JSON.parse(localStorage.getItem(HIDE_KEY) || "[]"); } catch { return []; } })();
  function saveHidden() { try { localStorage.setItem(HIDE_KEY, JSON.stringify(hidden)); } catch { /* private mode */ } }
  /* 🔴 TWO DIFFERENT "NO"S, and they are not the same question.
     The CHECKBOX is "not this run" — the contract stays on the board, greyed, and drops out of the
     route so you can SEE what the route costs without it. Sub's framing: grab five, be unsure
     about one, untick it and watch the plan change. That is a comparison, not a decision.
     The ✕ is "get this off my screen" — for a contract the log never closed out, so it sits there
     forever and cannot be done. That one is a stuck-record escape hatch, not a planning tool.
     Both are reversible; neither touches the game. */
  const DROP_KEY = "sc-hauling-dropped";
  let dropped = (() => { try { return JSON.parse(localStorage.getItem(DROP_KEY) || "[]"); } catch { return []; } })();
  function saveDropped() { try { localStorage.setItem(DROP_KEY, JSON.stringify(dropped)); } catch { /* private mode */ } }
  /* The contracts list folded away. It is reference, not instruction — the route tells you what to
     do — so on a small overlay it is the first thing worth reclaiming. */
  const FOLD_KEY = "sc-hauling-fold-contracts";
  let foldContracts = (() => { try { return localStorage.getItem(FOLD_KEY) === "1"; } catch { return false; } })();
  const SPIN_KEY = "sc-hauling-spin";
  let stowSpin = (() => { try { return localStorage.getItem(SPIN_KEY) === "1"; } catch { return false; } })();
  function saveStart() { try { localStorage.setItem(START_KEY, startPick); } catch { /* private mode */ } }
  /** Which lift the stow diagram is lighting up. Defaults to the first one to load. */
  let focusMission = null;
  /** Hull classes whose boxes the station's arm places for you — they get no stowage plan at all.
   *  From /api/ships, which is the only place the flag lives (see src/hauling-autoload.ts). */
  let autoLoadClasses = new Set();

  /* 🔑 Pins are the player's own reading of a contract they have NOT tracked, so they must survive
     the widget being closed — hiding a widget UNLOADS its iframe (see missions.html unloadFrame),
     which would otherwise throw away typing the player did seconds ago. Keyed by missionId and
     pruned to what is still live, so an old shard's contracts can never accumulate. */
  const PIN_KEY = "sc-hauling-pins";
  const readPins = () => { try { return JSON.parse(localStorage.getItem(PIN_KEY) || "{}"); } catch { return {}; } };
  let pins = readPins();
  function savePins() { try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch { /* private mode */ } }
  function prunePins(liveIds) {
    let changed = false;
    /* 🔴 A PER-PICKUP PIN IS KEYED "<missionId>#pN". Pruning on an exact match would delete every
       one of them on the next poll, which is how the first cut of per-pickup figures silently
       forgot everything the player typed. Judge the mission part. */
    for (const id of Object.keys(pins)) {
      const mission = id.split("#")[0];
      if (!liveIds.has(mission)) { delete pins[id]; changed = true; }
    }
    if (changed) savePins();
  }

  const num = (n) => Number(n || 0).toLocaleString();
  /** "3", "3 and 4", "3, 4 and 7" — a list a person reads rather than an array printed. */
  const list = (xs) => xs.length < 2 ? String(xs[0] ?? "")
    : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
  function fmtMins(min) {
    const m = Math.max(1, Math.round(min || 0));
    if (m < 60) return m + "m";
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + "h " + String(r).padStart(2, "0") + "m" : h + "h";
  }
  /** How a load figure is written. 🔴 A RANGE IS NEVER PRINTED AS A NUMBER — that is the whole
   *  reason the plan tags every figure with a source. */
  function fmtScu(c) {
    if (c.scu == null) return "? SCU";
    if (c.source === "range") return c.minScu + "–" + c.maxScu + " SCU";
    return num(c.scu) + " SCU";
  }
  const BADGE = {
    manifest: ["exact", "The game listed every box for this contract."],
    log: ["stated", "The game stated this tonnage on its own objective line."],
    pinned: ["yours", "You typed this figure in."],
    derived: ["worked out", "The contract total less what you pinned at the other pickups — so this one did not need asking about."],
    dataset: ["data", "The game files state one figure for this contract."],
    range: ["range", "The game files only bound this contract — the real load is somewhere inside it. The game states the exact figure when it assigns the objective; until then, type it in to pin it."],
    unknown: ["unknown", "Neither the log nor the dataset says how much this contract carries."],
  };

  /* 🔑 One MISSION, one hue — and a mission's separate drop-offs shift lightness inside it.
     That is the unit the player thinks in and the unit the freight elevator lifts in, so it has to
     be the unit the eye groups by. Keyed off a leg's group so every call site (route chips,
     contract cards, the stow diagram) lands on the same colour for the same cargo. */
  /* 🔴 ONE COLOUR PER DROP-OFF STOP. This was one hue per MISSION, and Sub found the flaw with a
     board carrying three missions across two destinations: Silicon and Tin both go to Riker but
     belonged to different contracts, so they drew in two different colours and the hold looked like
     it needed three separated regions when it needs two. "All I really need is two areas of the
     cargo grid." Everything for a stop comes off together, so everything for a stop is one colour.
     Depth is dropped from the hue for the same reason — it split a zone that unloads as one. */
  const colourOf = (group) => StowView.shade(StowView.zoneOf(plan, group), 0);
  /** A leg's index within its own contract. Still used by the diagram's per-box shading. */
  const depthOf = (group) => StowView.depthOf(plan, group);

  /**
   * The route's own step number for each drop-off place, so the hold's zones can be named with the
   * numbers already on screen — "② Riker Memorial Spaceport", not a second numbering to reconcile.
   *
   * 🔑 Built by walking the route exactly as renderRoute numbers it, because two numberings that
   * drift apart are worse than none: the whole point is that the zone in the picture and the step
   * in the list are the same thing.
   */
  function dropStepIndex() {
    const byLoc = new Map();
    if (!plan) return byLoc;
    let step = 0;
    for (const [ti, trip] of plan.trips.entries()) {
      if (ti === 0) step += (plan.completedPickups || []).length;
      for (const s of trip.stops) {
        for (const kind of ["dropoff", "pickup"]) {
          const acts = s.actions.filter((a) => a.kind === kind);
          if (!acts.length) continue;
          step++;
          // A stop's id is `<locationId>:<kind>` (see buildStops), and zoneOf returns that same
          // locationId — so stripping the suffix is the join, with no server change needed.
          const loc = String(s.id || "").replace(/:(pickup|dropoff)$/, "");
          if (kind === "dropoff" && !byLoc.has(loc)) byLoc.set(loc, { step, name: s.name });
        }
      }
    }
    return byLoc;
  }

  // ── loading ───────────────────────────────────────────────────────────────
  let pending = null;
  function refresh() {
    // Coalesce: an accept burst emits a dozen CreateMarker lines and therefore a dozen SSE
    // pushes, and re-solving on each one is pure waste.
    clearTimeout(pending);
    pending = setTimeout(load, 120);
  }
  async function load() {
    try {
      const r = await fetch("/api/hauling/plan", {
        method: "POST", headers: { "Content-Type": "application/json" }, cache: "no-store",
        // Both kinds leave the route: unticked is "not this run", dropped is "not at all".
        body: JSON.stringify({ ship: shipPick, objective, pins, startAt: startPick,
                               hidden: hidden.concat(dropped) }),
      });
      if (!r.ok) return;
      plan = await r.json();
      prunePins(new Set(plan.contracts.filter((c) => !c.ended).map((c) => c.missionId)));
      /* 🔑 TRACKING IT AGAIN BRINGS IT BACK — Sub's own suggestion, and better than a restore
         button nobody would find: the player is already in mobiGlas, and selecting a contract there
         is an unambiguous statement that they intend to fly it. Also drop any id the board no
         longer carries, so a finished or abandoned contract does not sit in this list for ever. */
      const live = new Set(plan.contracts.map((c) => c.missionId));
      const restored = plan.contracts.filter((c) => c.trackedNow && hidden.includes(c.missionId)).map((c) => c.missionId);
      const next = hidden.filter((id) => live.has(id) && !restored.includes(id));
      if (next.length !== hidden.length) { hidden = next; saveHidden(); }
      // A dropped contract that has left the board is not dropped any more, it is gone. Keeping
      // the id would silently swallow a NEW contract that happened to reuse it.
      const keptDrop = dropped.filter((id) => live.has(id));
      if (keptDrop.length !== dropped.length) { dropped = keptDrop; saveDropped(); }
      // A start the plan no longer knows about is a place from a finished board. Silently keeping
      // it would route from somewhere that is not on the map any more.
      // 🔴 BUT ONLY ONCE THERE IS A BOARD TO CHECK AGAINST. This ran unguarded and erased the
      // player's position on EVERY app restart: the first plan arrives before the log watcher has
      // read any contracts, so locationNames is `{}`, every id looks unknown, and the saved answer
      // is deleted and written back empty. Sub set his location repeatedly and watched the route
      // revert to opening at Baijini each time — this line was eating it, not the router.
      // An empty board proves nothing about a place. Forget nothing until there is something to
      // compare with.
      const known = plan.locationNames && Object.keys(plan.locationNames).length;
      if (startPick && known && !(startPick in plan.locationNames)) { startPick = ""; saveStart(); }
    } catch { /* sidecar down — keep the last good plan on screen */ }
    render();
  }

  async function loadShips() {
    try {
      const r = await fetch("/api/ships?names=1", { cache: "no-store" });
      if (r.ok) {
        // 🔑 Dedupe by display name. The dataset carries every AI and event variant of a hull as
        // its own class with the SAME name — four "Aegis Idris-P", five "RSI Apollo Triage" — and
        // an unfiltered list is 155 rows most of which are decoys. The store emits the base class
        // first, so keeping the first of each name keeps the hull you can actually fly.
        const all = (await r.json()).ships || [];
        // The auto-load set is built from EVERY row, before the dedupe throws variants away — the
        // log can name a variant class the picker never shows, and that hull still auto-loads.
        autoLoadClasses = new Set(all.filter((s) => s.autoLoad).map((s) => s.className));
        const seen = new Set();
        ships = all.filter((s) => {
          const k = (s.displayName || s.className).toLowerCase();
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
      }
    } catch { /* the picker just stays empty; the log's ship still works */ }
    renderShipPicker();
  }

  /** The saved override, so a fresh widget opens on the hull the player last chose. */
  async function loadConfig() {
    try {
      const r = await fetch("/api/config", { cache: "no-store" });
      if (r.ok) shipPick = (await r.json()).haulingShip || "";
    } catch { /* no sidecar config — the log's ship is the only source */ }
  }
  function saveShip(v) {
    fetch("/api/config", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ haulingShip: v }),
    }).catch(() => { /* the pick still applies to this session */ });
  }

  // ── render ────────────────────────────────────────────────────────────────
  function renderShipPicker() {
    const el = $("shipPick");
    el.textContent = "";
    const auto = document.createElement("option");
    auto.value = "";
    // 🔴 SAY WHAT AUTO ACTUALLY FOUND. "Auto — whatever the log sees" is a promise, not a reading:
    // Sub's C2 was detected correctly and the control gave him no way to know that, so he could not
    // tell a working detector from a silent one. Name the hull when we have it.
    const found = plan && plan.ship && plan.ship.source !== "manual" ? plan.ship.displayName : null;
    auto.textContent = found ? "Auto — " + found : "Auto — nothing detected yet";
    auto.title = found
      ? "Detected from the game. Pick a hull below to override it."
      : "No ship seen yet — the game names it when you board. Pick one below if it stays blank.";
    el.appendChild(auto);
    for (const s of ships) {
      const o = document.createElement("option");
      o.value = s.className;
      o.textContent = (s.displayName || s.className) + "  ·  " + num(s.totalScu) + " SCU";
      el.appendChild(o);
    }
    el.value = shipPick;
  }

  /** Where you are. Options are the places THIS board touches — nowhere else can be an origin the
   *  router understands, and offering the whole star map would be offering places it cannot use. */
  function renderStartPicker() {
    const el = $("startPick");
    el.textContent = "";
    /* 🔴 AUTO NAMES WHAT THE LOG FOUND. The game states where you are every time you open a local
       inventory (`RequestLocationInventory`), which a hauler does at every stop — so this control
       is now a fallback, not the only source. Same rule as the ship picker: say what auto actually
       detected, because "auto" as a bare promise gives no way to tell a working detector from a
       silent one. */
    const sr = (plan && plan.startResolved) || {};
    const found = sr.detected ? (plan.locationNames || {})[sr.detected] : null;
    /* 🔴 THE ASSET NAME IS NOT A PLACE NAME. Sub, at the Nyx gateway on 2026-08-25: "Currently
       right now, the widget says that I'm at RR_JP_NyxCastra. Where are we at with making those
       names more friendly?" The sidecar supplies detectedLabel when it can name the token — for
       this one, "Stanton Gateway", which is what UEX calls it too. It stays null rather than
       guessing, and then the raw token is still shown: a string the app plainly could not
       translate is better than a confident wrong name. See locationTokenLabel. */
    const token = sr.detectedLabel || sr.detectedToken;
    const auto = document.createElement("option");
    auto.value = "";
    auto.textContent = found ? "Auto — you're at " + found
      : token ? "Auto — the game says " + token + " (not on this board)"
      : "Auto — nowhere detected yet";
    auto.title = found
      ? "Read from the game: it names your location whenever you open an inventory there. Pick"
        + " somewhere below to override it."
      : token
      ? "The game placed you at " + token + ", which does not match any stop on this"
        + " board — so the route has no origin. Pick where you are below."
      : "The game names your location when you open an inventory somewhere. Until then, pick it here.";
    el.appendChild(auto);
    /* 🔴 CAPPED AT THE FIVE MOST RECENT, because the list grows forever. Sub, 2026-08-25: "It gives
       a list of all the places that I've been. It's kind of growing pretty large... I feel like we
       should cap it at maybe the most recent five places." Measured on his live board that day: 16
       rows on a board holding ZERO contracts, three of them reading "August Dunlow Spaceport".
       Order and the name-dedupe come from the sidecar — see PlanResult.recentPlaces.

       ⚠️ TWO ROWS ARE PINNED AHEAD OF THE CAP, and both are the cap's own failure mode:
       - WHERE THE GAME SAYS YOU ARE. A cap that can hide the place you are standing at is worse
         than the growth it fixes — that is the whole control, dropped for being old.
       - WHATEVER IS CURRENTLY PICKED. load() already resets startPick when it is not in
         locationNames, so a hidden row would not merely be invisible, it would silently throw the
         player's saved answer away on the next poll. */
    const names = (plan && plan.locationNames) || {};
    const order = (plan && plan.recentPlaces) || Object.keys(names);
    const pinned = [];
    if (sr.detected && names[sr.detected]) pinned.push(sr.detected);
    if (startPick && names[startPick] && !pinned.includes(startPick)) pinned.push(startPick);
    const rest = order.filter((id) => !pinned.includes(id));
    const shown = startAll ? pinned.concat(rest) : pinned.concat(rest.slice(0, START_PICK_MAX));
    for (const id of shown) {
      const o = document.createElement("option");
      o.value = id;
      o.textContent = "I'm at " + names[id];
      el.appendChild(o);
    }
    /* 🔑 THE HIDDEN ROWS ARE SAID, NOT SWALLOWED. A picker that silently drops places reads as the
       app having forgotten them, and there is no other way back to one. This row is an OPTION
       rather than a button so it costs the summary no height — the change handler picks it up. */
    const hidden = pinned.length + rest.length - shown.length;
    if (hidden > 0) {
      const more = document.createElement("option");
      more.value = SHOW_ALL_PLACES;
      more.textContent = "Show " + hidden + " older place" + (hidden === 1 ? "" : "s") + "…";
      el.appendChild(more);
    }
    el.value = startPick;
  }

  function renderSummary() {
    const ship = plan && plan.ship;
    $("shipPick").value = shipPick;

    const caps = $("caps");
    caps.textContent = "";
    if (ship) {
      for (const g of ship.grids) {
        const d = document.createElement("div");
        d.className = "cap" + (g.usedScu > g.capacityScu ? " over" : "");
        d.style.flex = g.capacityScu;
        d.title = g.name + " — " + g.w + "x" + g.l + "x" + g.h + " cells, " + num(g.usedScu) + " of " + num(g.capacityScu) + " SCU";
        const fill = document.createElement("i");
        fill.style.width = Math.min(100, (g.usedScu / Math.max(1, g.capacityScu)) * 100) + "%";
        const lbl = document.createElement("b");
        lbl.textContent = num(g.usedScu) + " / " + num(g.capacityScu);
        d.append(fill, lbl);
        caps.appendChild(d);
      }
    }

    const facts = $("facts");
    facts.textContent = "";
    if (!plan) return;
    const t = plan.totals;
    const bits = [];
    bits.push(["to move", num(t.scu) + " SCU", false]);
    /* 🔴 SPLIT "aboard" FROM "on the pad". They were one figure, and that difference is the whole
       complaint: the game completes a pickup when it releases cargo to the lift, so a number
       labelled "aboard" was counting boxes still sitting on the floor beside the ship. */
    const inHold = plan.aboardScu - (plan.onPadScu || 0);
    if (inHold > 0) bits.push(["aboard", num(inHold) + " SCU", false]);
    if (plan.onPadScu > 0) bits.push(["on the pad", num(plan.onPadScu) + " SCU", false]);
    bits.push(["contracts", String(t.liveContracts), false]);
    if (plan.trips.length) {
      const landings = plan.trips.reduce((s, x) => s + x.landings, 0);
      bits.push(["stops", String(landings), false]);
      bits.push(["est. run", fmtMins(t.totalMinutes), false]);
    }
    if (plan.trips.length > 1) bits.push(["trips", String(plan.trips.length), true]);
    if (plan.pack && !plan.pack.fits) bits.push(["won't fit", plan.pack.unplaced.length + " boxes", true]);
    if (t.recentPayout) bits.push(["paid", num(t.recentPayout) + " aUEC", false]);
    for (const [k, v, bad] of bits) {
      const s = document.createElement("span");
      s.textContent = k + " ";
      const b = document.createElement("span");
      b.className = "v" + (bad ? " bad" : "");
      b.textContent = v;
      s.appendChild(b);
      facts.appendChild(s);
    }
    renderRates();
  }

  /**
   * 🔴 WHAT THE RUN IS EARNING — per hour, in both currencies.
   *
   * Two rates, and which one is on screen is never left to be guessed. `actual` is MEASURED: real
   * awards read off the log against real elapsed time. `projected` is what the board ahead is worth
   * against this planner's own run estimate, and is therefore only ever as good as that estimate.
   * Sub asked for the real figure "projected if we don't actually have enough data", so the
   * measured one wins whenever it exists and the wording says which is showing — "earning" for a
   * fact, "should earn" for a forecast.
   *
   * ⚠️ REPUTATION IS NEVER IN THE GAME LOG. Searching a live session finds only the name of the rep
   * gRPC service — no amounts, no deltas. The figure comes off the mission dataset, which states it
   * per contract and reads it from the game files rather than fitting it.
   */
  function renderRates() {
    const bar = $("ratebar");
    bar.textContent = "";
    const r = (plan && plan.rates) || {};
    const rate = r.actual || r.projected;
    if (!rate) { bar.style.display = "none"; return; }
    bar.style.display = "";
    const measured = !!r.actual;
    const est = measured ? "" : " est";
    const per = (v) => (v >= 1000 ? Math.round(v / 1000) + "k" : Math.round(v));

    const k = document.createElement("span");
    k.className = "k";
    k.textContent = measured ? "Earning" : "Should earn";
    bar.appendChild(k);

    const money = document.createElement("span");
    money.className = "fig" + est;
    money.textContent = per(rate.auecPerHour) + " aUEC/h";
    money.title = measured
      ? "Measured — " + num(Math.round(r.actual.auec)) + " aUEC from " + r.actual.contracts
        + " finished contract" + (r.actual.contracts > 1 ? "s" : "") + " over " + fmtMins(r.actual.minutes)
        + " of run. Per hour of RUN TIME, not per contract: flying and loading count against it."
      : "A forecast: nothing has finished yet, so this is what the board ahead is worth against the"
        + " estimated run time. It becomes a measured figure the moment you deliver."
        + (r.payoutModelled ? "  ⚠️ A contract here has a modelled payout, not a stated one." : "");
    bar.appendChild(money);
    /* 🔴 A RESET, BECAUSE AN AVERAGE HAS NO WAY BACK. Even with idle time excluded, a session that
       has been open all day carries a denominator nothing can shift — Sub, parked while we worked:
       "I've been sitting here for a long time and it kind of screws up the counts."
       Only offered on a MEASURED figure: there is nothing to reset about a forecast. */
    if (measured) {
      const rst = document.createElement("button");
      rst.type = "button";
      rst.className = "ratereset";
      rst.textContent = "reset";
      rst.title = "Start the earnings measurement again from now. Your contracts, tracking and"
        + " progress are untouched — this only forgets the elapsed time and what has been banked,"
        + " so the per-hour figures start fresh. The next reading will be over a short window.";
      rst.addEventListener("click", async (e) => {
        e.stopPropagation();
        try { await fetch("/api/hauling/reset-rates", { method: "POST" }); } catch { /* sidecar down */ }
        load();
      });
      bar.appendChild(rst);
    }

    // Suppressed at zero rather than printed as "0/h": Master-rank Large and Bulk hauls genuinely
    // pay no reputation, and a zero there is a fact about the contract, not about the run.
    if (rate.repPerHour > 0) {
      const rep = document.createElement("span");
      rep.className = "rep" + est;
      rep.textContent = per(rate.repPerHour) + " rep/h";
      rep.title = "Reputation per hour, on the same basis. The game never logs reputation in any"
        + " form — this comes from the mission dataset, which states it per contract.";
      bar.appendChild(rep);
    }

    /* 🔑 SAY WHAT THE DENOMINATOR IS. The whole reason this strip exists is that a rate reads like
       a property of the contracts unless something tells you otherwise, and it is not — it is
       against the clock. Naming the window is what makes the number interpretable. */
    const basis = document.createElement("span");
    basis.className = "basis";
    basis.textContent = measured ? "over " + fmtMins(r.actual.minutes) + " of run" : "at the estimated pace";
    basis.title = measured
      ? "Every minute since the first hauling event this session, including the ones spent not hauling."
      : "Against this planner's own estimate for the run ahead.";
    bar.appendChild(basis);
  }

  /* 🔴 THE THREE STATES. The old prompt had one — "TRACK THESE IN MOBIGLAS", shown to every
     contract whose tonnage was unknown — and for most of them that instruction could not come
     true. The game states a contract's tonnage when it ASSIGNS the objective (a fresh accept, a
     spawn-in, a leg changing state); tracking an already-assigned contract replays nothing.
     Sub tracked four contracts, watched this panel keep telling him to track them, and reasonably
     concluded the app was broken. So a row now says which of these it is:

       todo      not tracked in mobiGlas. Tracking is worth doing — the next assignment will
                 carry the figure — but it is a "then", not a "now".
       waiting   tracked already. Nothing further to do; the game has been asked and will not
                 answer again this session. The type-it-in box is the only route to a number.
       pinned    the player typed it. */
  const TRACK_STATE = {
    todo: ["track it", "Not tracked in mobiGlas. Track it and the tonnage arrives with the next objective assignment — at the latest, next time you spawn in. Or type it in now."],
    waiting: ["tracked", "Already tracked — nothing more for you to do here. The game states the tonnage only when it assigns the objective (at accept, or on spawn-in), and re-tracking does not replay it. Type the figure off your mobiGlas to pin it."],
    pinned: ["yours", "You typed this figure in. Clear the box to fall back to what the game files allow."],
  };
  /* 🔴 "WORKED OUT" IS ANSWERED TOO. Pin one pickup of a two-pickup contract and the other is
     derived — the contract is then fully known, but this read only `pinned`, so the card went on
     saying "Load not confirmed" and never collapsed. Sub: "the loadout not confirmed doesn't
     collapse once I put in the number." Both sources came from him; one just took arithmetic. */
  const trackStateOf = (c) => c.source === "pinned" || c.source === "derived" ? "pinned"
    : c.trackedNow ? "waiting" : "todo";
  /** Has the player re-opened the collapsed "all answered" card to edit a figure? Reset whenever a
   *  row needs action again, so a new unanswered contract always arrives expanded. */
  let trackOpen = false;
  /** missionId -> the row's live DOM, kept across renders so an input the player is clicking is
   *  never destroyed underneath them. See renderTrack. */
  const trackRows = new Map();

  // ── the shared keyboard grab ───────────────────────────────────────────────────────────────
  // 🔴 THE GRAB IS PER-WIDGET, NOT PER-FIELD, and it hands focus back through ONE function.
  // Re-entering it while already inside a field is what made every box except the first
  // unreachable: focusing box 2 called editStart again, the shell took window focus and called
  // __haulingFocus to give it back — and that focused `querySelector("input")`, i.e. box 1.
  // Clicking box 2 and TABBING to box 2 both died there, which is the tell: Tab is native
  // behaviour, so nothing in this page's own DOM could have explained it.
  //
  // Two rules fix it, and both are needed:
  //   1. Remember which box the player actually wants, so the hand-back goes to the right one.
  //   2. Do not tear the grab down and rebuild it when focus moves BETWEEN fields of this widget.
  //      The release is deferred a tick, and a sibling taking focus cancels it — so moving box to
  //      box never re-enters the grab at all, and the shell is never asked to re-focus anything.
  let wantFocus = null;
  let grabHeld = false;
  let releaseTimer = null;
  function grabOn(el) {
    wantFocus = el;
    clearTimeout(releaseTimer); releaseTimer = null;
    if (grabHeld) return;   // already inside a field — re-entering is the bug, not the fix
    grabHeld = true;
    try { host()?.editStart?.(); } catch { /* standalone */ }
  }
  function grabOff() {
    clearTimeout(releaseTimer);
    releaseTimer = setTimeout(() => {
      releaseTimer = null; grabHeld = false; wantFocus = null;
      try { host()?.editEnd?.(); } catch { /* standalone */ }
      // Stepping out of the last box with every figure supplied is the natural moment to put the
      // card away — Sub asked for exactly this, and it beats making him hunt for a control.
      if (allPinnedNow()) { trackOpen = false; render(); }
    }, 0);
  }
  /** Every listed contract carries a figure the player typed. Recomputed rather than remembered:
   *  the board changes underneath this widget constantly.
   *
   *  🔴 UNTICKED AND REMOVED CONTRACTS ARE NOT ASKED ABOUT. Telling a player to go track something
   *  in mobiGlas that they have already said they are not flying is pure noise — and Sub's ruling
   *  on the abandoned case was that it is not even a question: "If they drop the mission, that
   *  should immediately come out of there. You don't even need my call for that." */
  function allPinnedNow() {
    if (!plan) return false;
    const live = plan.contracts.filter((c) => !c.ended && !c.hidden && !dropped.includes(c.missionId)
      && (!c.deliverSeen || c.source === "range" || c.source === "unknown"));
    return live.length > 0 && live.every((c) => trackStateOf(c) === "pinned");
  }

  /** 🔴 The load checklist. Each row names a contract whose tonnage the game has not stated,
   *  says which of the three states it is in, shows the bounds we do have, and offers a box to
   *  type the real figure into. */
  function renderTrack() {
    const el = $("track");
    const live = plan ? plan.contracts.filter((c) => !c.ended && !c.hidden && !dropped.includes(c.missionId)
      && (!c.deliverSeen || c.source === "range" || c.source === "unknown")) : [];
    if (!live.length) { el.style.display = "none"; return; }
    el.style.display = "";
    // The heading is an instruction ONLY while at least one row can act on it.
    // 🔴 THREE row states need THREE headings. This was `todo ? … : "Load not confirmed"`, which
    // told Sub the load was unconfirmed on 2026-08-17 *immediately after he confirmed it himself*.
    // A pinned row never leaves this list — the filter keeps anything the GAME never stated, and
    // pinning cannot change that — so "all pinned" is a normal resting state, not an alarm.
    const todo = live.filter((c) => trackStateOf(c) === "todo").length;
    const allPinned = live.every((c) => trackStateOf(c) === "pinned");
    // 🔴 Nothing outstanding: the player answered every row themselves. The card cannot simply be
    // hidden — the type-in box lives ONLY here, so hiding it strands the one way to correct a
    // wrong figure — so it collapses to its heading and reopens on a click.
    // A pinned row never leaves `live` (the filter keeps whatever the GAME never stated, and
    // pinning cannot change that), which is why "answered" has to be a display state, not a filter.
    if (allPinned && !trackOpen) {
      el.classList.add("done");
      $("trackK").textContent = "Load set by you";
      $("trackInfo").title = "You typed these in and the plan is using your figures. Click the heading to change them.";
      $("trackN").textContent = live.length + " of " + plan.totals.liveContracts;
      $("trackList").textContent = "";
      return;
    }
    el.classList.remove("done");
    $("trackK").textContent = todo ? "Track these in mobiGlas" : allPinned ? "Load set by you" : "Load not confirmed";
    /* 🔴 THE EXPLANATION IS A TOOLTIP, NOT A PARAGRAPH. Sub: "let's just put a circle with an eye
       and put all that information in a tooltip. I want to clean up the UI." He is right — this is
       WHY text, read once and then re-read on every render for the rest of the session. The reason
       has to stay reachable, because "why am I typing this in" is a fair question, but it does not
       have to occupy four lines of a small overlay forever. */
    const why = todo
      ? "The game states a contract's tonnage when it assigns the objective — at accept, or the next time you spawn in. Track the ones below and the next assignment tells us, or type the figure straight off your mobiGlas."
      : allPinned
      ? "The game never stated these, so they stay listed — but you have typed the figures in and the plan is using yours. Clear a box to fall back to what the game files allow."
      : "These are tracked and the game still has not stated their load. It only says the tonnage when it assigns the objective, and re-tracking does not replay that — so type the figure off your mobiGlas, or wait for the next spawn-in.";
    $("trackInfo").title = why;
    $("trackN").textContent = live.length + " of " + plan.totals.liveContracts;
    const list = $("trackList");
    // 🔴 ROWS ARE REUSED, keyed by mission — they used to be torn down and rebuilt on every render,
    // and that made the second box unclickable. Typing in one box and clicking the next fires
    // `change` on blur → load() → render() → `list.textContent = ""`, which DESTROYS the input the
    // player is mid-click on. The click then lands on a detached node and nothing happens; it looks
    // like the field is dead. Sub hit this trying to enter three tonnages in a row.
    // 🔑 A node the player is reaching for must survive the render.
    const seen = new Set();
    for (const c of live) {
      seen.add(c.missionId);
      let r = trackRows.get(c.missionId);
      if (!r) {
        const row = document.createElement("div");
        row.className = "trow";
        const t = document.createElement("div");
        t.className = "t";
        // Rank tier + size band, off the title. Known the moment a contract is accepted, unlike the
        // tonnage — and it is the wording on the board, so it is how this row is matched to the
        // contract in mobiGlas.
        const bd = document.createElement("div");
        bd.className = "bd";
        const st = document.createElement("span");
        const rng = document.createElement("div");
        rng.className = "rng";
        const inp = document.createElement("input");
        inp.type = "number"; inp.min = "1"; inp.step = "1";
        /* 🔴 BOUNDED. With no max, holding the spinner ran the figure to 20 on a contract whose
           whole span was single digits — Sub: "it doesn't need to go any higher than the range or
           lower than the range." A max also ends the click-and-hold ramp on its own, which is the
           other half of the complaint, without giving up the tap-to-step he wants to keep. */
        if (Number.isFinite(c.maxScu) && c.maxScu > 0) inp.max = String(c.maxScu);
        inp.placeholder = "SCU";
        inp.title = "Type the SCU total from your mobiGlas to pin it.";
        // Editing takes the canvas keyboard grab; the shell suspends the interact key while it is
        // on. Held across a move between boxes — see grabOn/grabOff.
        inp.addEventListener("focus", () => grabOn(inp));
        inp.addEventListener("blur", () => grabOff());
        // Pointer-down lands BEFORE the old field blurs, so this is the earliest honest statement
        // of which box the player is going to. Without it, a hand-back that races the focus event
        // has nothing better than "the first one" to aim at.
        inp.addEventListener("pointerdown", () => { wantFocus = inp; });
        // Keyed off the row's OWN missionId, not a captured contract object, because the row now
        // outlives the render that made it.
        const mid = c.missionId;
        inp.addEventListener("change", () => {
          const v = parseInt(inp.value, 10);
          if (Number.isFinite(v) && v > 0) pins[mid] = v; else delete pins[mid];
          savePins();
          load();
        });
        row.append(t, bd, st, rng, inp);
        r = { row, t, bd, st, rng, inp };
        trackRows.set(c.missionId, r);
      }
      r.t.textContent = c.title || c.contractKey;
      r.t.title = (c.giver ? c.giver + " · " : "") + (c.missionType || c.generator);
      if (c.board && (c.board.rank || c.board.size)) {
        r.bd.textContent = [c.board.rank, c.board.size].filter(Boolean).join(" · ");
        r.bd.title = "The rank tier and size band this contract is listed under on the board.";
      } else { r.bd.textContent = ""; r.bd.title = ""; }
      const [label, why] = TRACK_STATE[trackStateOf(c)];
      r.st.className = "badge " + trackStateOf(c);
      r.st.textContent = label;
      r.st.title = why;
      r.rng.textContent = c.minScu != null && c.maxScu != null
        ? (c.minScu === c.maxScu ? num(c.minScu) + " SCU" : c.minScu + "–" + c.maxScu + " SCU")
        : "unknown";
      r.rng.title = c.minScu != null
        ? "What the game files allow for this contract. The real figure is somewhere in here."
        : "The game files carry nothing for this contract key.";
      // ⚠️ Never overwrite a box the player is typing in — a reload mid-edit would eat the digits
      // they have entered so far.
      if (document.activeElement !== r.inp) r.inp.value = pins[c.missionId] != null ? pins[c.missionId] : "";
      list.appendChild(r.row);   // appendChild MOVES an existing node, so this also fixes the order
    }
    for (const [id, r] of trackRows) {
      if (!seen.has(id)) { r.row.remove(); trackRows.delete(id); }
    }
  }

</script>
<script src="/hauling-places.js"></script>
<script src="/hauling-tab-rank.js"></script>
<script src="/hauling-tab-route.js"></script>
<script src="/hauling-tab-stow.js"></script>
<script src="/hauling-tab-trade.js"></script>
<script>
  /** Find the leg a packed box belongs to, for its label. */
  function legOf(group) {
    if (!group || !plan) return null;
    for (const c of plan.contracts) for (const l of c.legs) if (l.group === group) return l;
    /* 🔴 A COMMODITY BUY IS A LEG TOO, and this is the one place that has to know it. `legOf` feeds
       `cargoOf`, `destOf` and the Stow lift labels; without this a bought commodity is drawn in the
       hold as "Cargo 6x 8 SCU" with no idea what it is — which is the same riddle Sub already
       objected to on the route ("the number one pickup says 6 SCU, but it doesn't tell me what of").
       🔑 Adapted to the leg SHAPE rather than handled separately at each call site. Three consumers
       and one adapter, not three special cases that can each be forgotten. */
    for (const b of (plan.buys || [])) {
      if (b.group !== group) continue;
      return {
        group: b.group, commodity: b.commodity, scu: b.scu,
        destination: b.to.terminal || null, toLocation: b.to.locationId || null,
        fromLocation: b.from.locationId || null,
        // The fields a contract leg has and a buy does not. Stated as nulls rather than left
        // undefined, so a consumer reading one gets "no" instead of "undefined".
        missionId: null, boxes: [], boxCount: 0, pickupCount: 1, exact: b.scu != null,
      };
    }
    return null;
  }
  /** locationId -> the name the plan settled on, so the route, the layout legend and the unrouted
   *  list all call a place the same thing — including places the route deliberately never visits. */
  const locNames = () => (plan && plan.locationNames) || {};
  /** Where a leg is going, in the same words the route uses. */
  function destOf(leg, names) {
    if (!leg) return "drop-off";
    return leg.destination || names[leg.toLocation] || "drop-off";
  }
  /** What a leg is carrying. Untracked contracts do not name their commodity, so fall back to the
   *  tonnage rather than printing "cargo" five times in a row. */
  const cargoOf = (leg) => leg && leg.commodity ? leg.commodity : leg && leg.scu != null ? num(leg.scu) + " SCU" : "cargo";

  function render() {
    /* 🔑 ONE ROW, ONE SET OF RENDERERS. Every tab is always on offer now, so the only thing this
       decides is which one is LIT — and `view` alone decides that. The block that used to hide
       four of the six buttons went with the modes. */
    $("tabAdvisor").classList.toggle("on", view === "advisor");
    $("tabTrade").classList.toggle("on", view === "trade");
    $("tabRoute").classList.toggle("on", view === "route");
    $("tabLayout").classList.toggle("on", view === "layout");
    $("tabJournal").classList.toggle("on", view === "journal");
    /* 🔴 CREDIT UEX WHERE THEIR DATA IS ON SCREEN, and nowhere else — that is what makes it an
       attribution rather than a logo. Commodities renders their quotes; the Ledger is the player's
       own log and Route/Stow/Contracts are the game's own data, so none of those may carry it. */
    $("creditbar").hidden = view !== "trade";
    $("objBtn").textContent = objective === "fewest-stops" ? "Fewest stops" : "Fastest run";
    $("doneBtn").textContent = showDone ? "Hide finished" : "Show finished";
    $("departBtn").textContent = departOff ? "Reminder off" : "Reminder on";
    $("departBtn").classList.toggle("on", !departOff);
    $("spinBtn").textContent = stowSpin ? "Turned around" : "Turn around";
    $("spinBtn").classList.toggle("on", stowSpin);
    $("doneBtn").classList.toggle("on", showDone);
    if (!plan) return;
    // 🔴 The auto option NAMES the detected hull, so it has to be redrawn when the plan changes.
    // It was only ever built once, from the ship-list load at startup — before any plan existed —
    // so it printed "nothing detected yet" and stayed that way for the session. Sub boarded his C2,
    // watched the skin turn Crusader, and the picker still claimed nothing was detected.
    renderShipPicker();
    renderSummary();
    renderStartPicker();
    renderTrack();
    renderPlaces();
    renderDepart();
    /* 🔑 AFTER those two, because each sets its own display. The naming and load checklists belong
       to the board you are flying; the advisor is about contracts you have NOT taken. Leaving them
       up opened the Rank tab two screens below its own heading. */
    /* Trade hides the contract furniture for the same reason Rank does: neither tab is about
       the board you are currently flying. */
    if (view === "advisor" || view === "trade" || view === "journal") { $("track").style.display = "none"; $("places").style.display = "none"; }
    if (view === "advisor") renderAdvisor();
    else if (view === "trade") renderTrade();
    else if (view === "journal") renderJournal();
    else if (view === "layout") renderStow();
    else renderRoute();
  }

  // ── wiring ────────────────────────────────────────────────────────────────
  $("tabRoute").addEventListener("click", () => { view = "route"; render(); });
  $("tabLayout").addEventListener("click", () => { view = "layout"; render(); });
  $("tabAdvisor").addEventListener("click", () => { view = "advisor"; if (!advisor) loadAdvisor(); render(); });
  $("tabTrade").addEventListener("click", () => { view = "trade"; if (!tradeData) openTrade(); render(); });
  $("tabJournal").addEventListener("click", () => { view = "journal"; loadJournal(); render(); });

  /* ⛔ `setMode`, the two mode listeners and the startup line that reconciled `mode` with `view`
     are all gone. That reconciliation existed only because two pieces of state were restored from
     different places and could disagree; with one flat row there is one piece of state. */
  /* https only, through the shell — never a bare target=_blank, which would put a second
     always-on-top window over the game. */
  $("uexCredit").addEventListener("click", () => {
    try { overlayApi.openUrl("https://uexcorp.space"); } catch { /* standalone: no shell */ }
  });
  $("objBtn").addEventListener("click", () => {
    objective = objective === "fewest-stops" ? "auec-per-hour" : "fewest-stops";
    load();
  });
  $("doneBtn").addEventListener("click", () => { showDone = !showDone; render(); });
  $("departBtn").addEventListener("click", () => {
    departOff = !departOff;
    try { localStorage.setItem(DEPART_KEY, departOff ? "1" : "0"); } catch { /* private mode */ }
    render();
  });
  $("shipPick").addEventListener("change", () => {
    shipPick = $("shipPick").value;
    saveShip(shipPick);
    load();
  });
  $("spinBtn").addEventListener("click", () => {
    stowSpin = !stowSpin;
    try { localStorage.setItem(SPIN_KEY, stowSpin ? "1" : "0"); } catch { /* private mode */ }
    render();
  });
  $("startPick").addEventListener("change", () => {
    /* 🔴 THE DISCLOSURE ROW IS NOT A PLACE. Taking its value as an origin would save
       "__show-all-places" as the player's start, which no location id can ever match — the route
       would silently lose its origin. Re-render and put the control back on what it was showing. */
    if ($("startPick").value === SHOW_ALL_PLACES) {
      startAll = true;
      renderStartPicker();
      return;
    }
    startPick = $("startPick").value;
    saveStart();
    load();
  });
  // The heading is the toggle, BOTH ways. It only opened before, so once Sub expanded a finished
  // card he could never put it away again. Bound to the heading, not the whole strip, so clicking
  // a row or typing in a box never collapses the thing you are working in.
  $("trackHead").addEventListener("click", () => {
    if ($("track").classList.contains("done")) { trackOpen = true; render(); return; }
    if (allPinnedNow()) { trackOpen = false; render(); }   // only collapsible once nothing is owed
  });
  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  /* Live contract state. The SSE channel is a CHANGE SIGNAL, not the payload — the plan is
     re-solved server-side on every push because it depends on the player's overrides too. */
  let es = null;
  function connect() {
    try { es?.close(); } catch { /* already gone */ }
    es = new EventSource("/hauling/events");
    es.onmessage = () => refresh();
    // EventSource retries on its own, but a sidecar restart can leave a dead stream — re-arm.
    es.onerror = () => { try { es.close(); } catch { /* ignore */ } setTimeout(connect, 4000); };
  }

  (async () => {
    await loadConfig();
    await loadShips();
    await load();
    connect();
  })();

  try { host()?.ready?.(); } catch { /* not embedded */ }
  // Per-widget settings, opened by the bar's cog. The parent injects its Text size row here too.
  window.__widgetSettings = () => $("wsettings").classList.add("open");
  window.__widgetSettingsRoot = () => $("wsettings");
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#wsettings")) $("wsettings").classList.remove("open");
  });
  /* 🔴 Hiding the widget mid-edit would strand the canvas-wide keyboard grab: the panel goes away,
     the interact key stays suspended, and every click on every display stops reaching the game with
     nothing on screen to explain it. Same rule as notepad/party/chat. */
  window.__haulingExitTyping = () => {
    try { document.activeElement?.blur?.(); } catch { /* nothing focused */ }
    try { host()?.editEnd?.(); } catch { /* not embedded */ }
  };
  // The shell's hand-back after it takes window focus. 🔴 This used to be
  // `querySelector("input")` — ALWAYS the first box — so every attempt to reach box 2 or 3 was
  // dragged back to box 1. Aim at the box the player is actually in; fall back to the first only
  // when we have no idea, which is the cold-start case this was written for.
  window.__haulingFocus = () => {
    try {
      const target = wantFocus && wantFocus.isConnected ? wantFocus : $("trackList").querySelector("input");
      target?.focus();
    } catch { /* none */ }
  };
</script>
</body>
</html>
