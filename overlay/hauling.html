    all.addEventListener("click", () => setAdvisorType(""));
    wrap.appendChild(all);
    // Short names: the panel is 420px and "Hauling - Interstellar" four times over is the whole row.
    for (const t of (advisor.types || [])) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "hbtn" + (advisorType === t.name ? " on" : "");
      b.textContent = t.name.replace(/^Hauling\s*-\s*/, "").replace(/^Hauling$/, "Contract");
      b.title = t.name + " — " + t.count + " contract types."
        + (/Interstellar/.test(t.name)
          ? "  ⚠️ A separate economy: its Master tier pays 0-200 rep where every other Master pays 8,000. Do not compare its rates with the others'."
          : "");
      b.addEventListener("click", () => setAdvisorType(t.name));
      wrap.appendChild(b);
    }
    return wrap;
  }

  /** "How long to the next rank", for one giver. */
  function renderClimb(c) {
    const d = document.createElement("div");
    d.className = "climb";
    const who = document.createElement("div");
    who.className = "sub";
    who.style.marginTop = "0";
    who.textContent = c.giver + "  ·  " + c.rung + "  ·  " + num(c.standing) + " rep";
    who.title = "Accrued by this app from your completed contracts. The game never states it — "
      + "mobiGlas only draws the bar.";
    d.appendChild(who);
    if (!c.next) {
      const t = document.createElement("div");
      t.textContent = "Top of the ladder.";
      d.appendChild(t);
      return d;
    }
    /* 🔴 NO RATE, NO TIME. The modelled per-run figure counts only box handling — no flying, no
       quantum, no walk to the elevator — so quoting it as "time to rank" would understate by most
       of the real time. Say the rep and say what would fix it. */
    if (c.hours == null) {
      const t = document.createElement("div");
      t.textContent = num(c.repNeeded) + " rep to " + c.next + ".";
      const s = document.createElement("span"); s.className = "sub";
      s.textContent = "Finish a contract and this becomes a time, from your own rate.";
      t.appendChild(s);
      d.appendChild(t);
      return d;
    }
    const line = document.createElement("div");
    const big = document.createElement("span");
    big.className = "big";
    big.textContent = fmtMins(c.hours * 60);
    line.append(big, document.createTextNode(" to " + c.next));
    const s = document.createElement("span");
    s.className = "sub";
    s.textContent = num(c.repNeeded) + " rep to go · at your " + Math.round(c.repPerHour) + " rep/h";
    s.title = "Against the reputation an hour you are actually earning, which includes the flying"
      + " and the loading — not a model of either.";
    line.appendChild(s);
    // Runs of the best contract open to you WITH THIS GIVER, and a measured time per run when
    // enough contracts have finished to have one.
    const rb = advisor.runsOfBest;
    if (rb && rb.runs && rb.giver === c.giver) {
      const r = document.createElement("span");
      r.className = "sub";
      const rm = advisor.runMinutes;
      r.textContent = "≈ " + rb.runs + " × " + rb.title
        + (rm ? "  ·  ~" + fmtMins(rm.median) + " each" : "");
      r.title = "Runs of the best contract open to you with this giver, at " + num(rb.rep) + " rep each."
        + (rm ? "  Run time is the median of your own " + rm.samples + " finished contract(s), accept to turn-in." : "");
      line.appendChild(r);
    }
    d.appendChild(line);
    return d;
  }

  function renderRoute() {
    const body = $("body");
    body.textContent = "";
    for (const n of plan.notes) {
      const d = document.createElement("div"); d.className = "note"; d.textContent = n;
      body.appendChild(d);
    }
    if (!plan.trips.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = plan.contracts.length
        ? "Nothing left to fly — every accepted leg is delivered."
        : "Accept a hauling contract and it shows up here.";
      body.appendChild(d);
    }
    plan.trips.forEach((trip, ti) => {
      const sec = document.createElement("div");
      sec.className = "sec";
      const h = document.createElement("span");
      h.textContent = plan.trips.length > 1 ? "Trip " + (ti + 1) : "Route";
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = trip.landings + " stops · " + fmtMins(trip.totalMinutes) + " · peak " + num(trip.peakScu) + " SCU";
      // The optimiser falls back to a heuristic past 14 visits — say so rather than imply optimal.
      if (trip.method === "heuristic") n.textContent += " · approx.";
      sec.append(h, n);
      body.appendChild(sec);
      // ⛔ NO "you are here" row. It was added on the theory that a route should name its origin,
      // and Sub rejected it flatly: he knows where he is standing — he is standing there. Step 1
      // must be the next thing he DOES, not a restatement of the present. A numbered list that
      // spends its first line on something requiring no action is one step of pure noise.
      // 🔴 ONE NUMBERED STEP = ONE ACTION. A landing that unloads and then loads used to be a
      // single row carrying every chip at once, which Sub described exactly right: "a bunch of
      // shit written in number one — I don't know what I need to drop off or what I need to pick
      // up". Numbering is what a player follows, so the numbers have to match the things they do.
      // Drop-offs lead at a landing: that is the order at a freight elevator, and it is what the
      // solver models. So a mixed landing becomes "1. DROP OFF … / 2. PICK UP …", same place,
      // marked as one landing so it never reads as two flights.
      let step = 0;
      // Already collected, not yet delivered. Greyed, ahead of the live steps, because that is
      // where they happened — the contract then reads start to finish and the interim state is
      // visible instead of having to be inferred from a route that opens mid-sentence.
      if (ti === 0) {
        for (const cp of (plan.completedPickups || [])) {
          step++;
          const row = document.createElement("div");
          row.className = "stop pickup done";
          const numEl = document.createElement("div");
          numEl.className = "num";
          numEl.textContent = "✓";
          numEl.title = "Already collected — it is in your hold.";
          const mid = document.createElement("div");
          mid.className = "mid";
          const nm = document.createElement("div");
          nm.className = "nm";
          nm.textContent = step + ". PICKED UP — " + (plan.locationNames[cp.locationId] || cp.locationId || "unknown");
          const acts = document.createElement("div");
          acts.className = "acts";
          const chip = document.createElement("span");
          const dot = document.createElement("i");
          dot.style.cssText = "display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;background:" + colourOf(cp.group);
          chip.appendChild(dot);
          const c = document.createElement("span");
          c.className = "c";
          c.textContent = (cp.commodity ? cp.commodity + " " : "") + num(cp.scu) + " SCU  ·  aboard";
          chip.title = cp.title || "";
          chip.appendChild(c);
          acts.appendChild(chip);
          const rt = document.createElement("div");
          rt.className = "rt";
          rt.textContent = "—";
          mid.append(nm, acts);
          row.append(numEl, mid, rt);
          body.appendChild(row);
        }
      }
      trip.stops.forEach((s, i) => {
        const groups = [
          { kind: "dropoff", verb: "DROP OFF", acts: s.actions.filter((a) => a.kind === "dropoff") },
          { kind: "pickup", verb: "PICK UP", acts: s.actions.filter((a) => a.kind === "pickup") },
        ].filter((g) => g.acts.length);
        groups.forEach((g, gi) => {
          // Only the first row of a landing owns the flight time; a second action at the same
          // place is not another journey.
          const sameLanding = (s.sameSpot && i > 0) || gi > 0;
          step++;
          const row = document.createElement("div");
          row.className = "stop " + g.kind + (sameLanding ? " same" : "");
          const numEl = document.createElement("div");
          numEl.className = "num";
          numEl.textContent = g.kind === "dropoff" ? "↓" : "↑";
          numEl.title = g.kind === "dropoff" ? "Unload here" : "Load here";
          const mid = document.createElement("div");
          mid.className = "mid";
          const nm = document.createElement("div");
          nm.className = "nm";
          nm.textContent = step + ". " + g.verb + " — " + s.name;
          if (sameLanding) nm.textContent += "  (same landing)";
          const acts = document.createElement("div");
          acts.className = "acts";
          for (const a of g.acts) {
            const chip = document.createElement("span");
            const dot = document.createElement("i");
            dot.style.cssText = "display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;background:" + colourOf(a.group);
            chip.appendChild(dot);
            const c = document.createElement("span");
            c.className = "c";
            // An untracked contract does not name its commodity, so the tonnage carries the row and
            // the contract's title goes in the tooltip rather than swamping the line.
            c.textContent = (a.commodity ? a.commodity + " " : "") + num(a.scu) + " SCU";
            chip.title = a.title || "";
            chip.appendChild(c);
            acts.appendChild(chip);
            acts.appendChild(document.createTextNode("   "));
          }
          const rt = document.createElement("div");
          rt.className = "rt";
          rt.textContent = sameLanding ? "—" : fmtMins(s.minutes);
          // 🔴 THE STEP'S OWN TONNAGE. A step headed DROP OFF states how much comes off; a step
          // headed PICK UP states how much goes on. See the .ld note in the stylesheet.
          const moved = g.acts.reduce((n, a) => n + (a.scu || 0), 0);
          const ld = document.createElement("div");
          ld.className = "ld";
          ld.textContent = num(moved) + " SCU";
          ld.title = g.kind === "dropoff" ? "Comes off here." : "Goes on here.";
          rt.appendChild(ld);
          // Where the hold ends up is a fact about the LANDING, not about this action, so it is
          // stated once, quietly, on the landing's last row.
          if (gi === groups.length - 1) {
            const hold = document.createElement("div");
            hold.className = "hold";
            hold.textContent = "hold " + num(s.loadAfterScu);
            hold.title = "In the hold when you leave this stop.";
            rt.appendChild(hold);
          }
          mid.append(nm, acts);
          row.append(numEl, mid, rt);
          body.appendChild(row);
        });
      });
    });
    if (plan.stranded.length) {
      const d = document.createElement("div");
      d.className = "note";
      d.textContent = plan.stranded.length + " contract(s) will not fit this ship even on their own.";
      body.appendChild(d);
    }
    /* 🔴 Legs that must be carried but could not be routed. Never folded away: a route that is
       missing legs while presenting itself as THE route is the one failure that would make this
       widget worse than no widget. */
    if (plan.unrouted.length) {
      const names = locNames();
      const sec = document.createElement("div");
      sec.className = "sec";
      const h = document.createElement("span"); h.textContent = "Not in the route";
      const n = document.createElement("span"); n.className = "n"; n.textContent = plan.unrouted.length + " leg(s)";
      sec.append(h, n);
      body.appendChild(sec);
      for (const u of plan.unrouted) {
        const d = document.createElement("div");
        d.className = "note";
        const leg = legOf(u.group);
        d.textContent = (u.destination || destOf(leg, names)) + " · " + num(u.scu) + " SCU — " + u.reason + ".";
        body.appendChild(d);
      }
    }
    renderContracts(body);
  }

  /** The board itself: what is accepted, how much it is, and how sure we are. */
  function renderContracts(body) {
    const list = plan.contracts.filter((c) => showDone || !c.ended);
    if (!list.length) return;
    const sec = document.createElement("div");
    sec.className = "sec fold" + (foldContracts ? " closed" : "");
    const caret = document.createElement("span"); caret.className = "caret"; caret.textContent = foldContracts ? "▸" : "▾";
    const h = document.createElement("span"); h.textContent = "Contracts";
    const n = document.createElement("span"); n.className = "n"; n.textContent = list.length + " on the board";
    sec.append(caret, h, n);
    sec.title = "Show or hide the contract details.";
    sec.addEventListener("click", () => {
      foldContracts = !foldContracts;
      try { localStorage.setItem(FOLD_KEY, foldContracts ? "1" : "0"); } catch { /* private mode */ }
      render();
    });
    body.appendChild(sec);
    if (foldContracts) return;
    for (const c of list) {
      const card = document.createElement("div");
      card.className = "card" + (c.ended ? " done" : "") + (c.hidden ? " setaside" : "");
      const top = document.createElement("div");
      top.className = "top";
      const t = document.createElement("div"); t.className = "t"; t.textContent = c.title || c.contractKey;
      // 🔴 The figure carries its own provenance, in its colour. The badge that used to sit beside
      // it is gone — see the .amt.src-* note in the stylesheet — but the reason it existed has not
      // changed, so the same wording is still on the number as a tooltip.
      const amt = document.createElement("div");
      amt.className = "amt src-" + (c.source || "unknown");
      amt.textContent = fmtScu(c);
      amt.title = (BADGE[c.source] || BADGE.unknown)[1];
      top.append(t, amt);
      /* 🔴 SET ASIDE. A player decides to skip a contract long before they open mobiGlas to abandon
         it, and until then it drags the route and the hold around with it. The game reports a real
         abandon on its own (`CompletionType[Abandon]`), which ends the contract outright — this is
         only the gap before that, and it is reversible: track it in mobiGlas and it comes straight
         back. Not offered on an ended contract, which is already out of the plan. */
      if (!c.ended) {
        const x = document.createElement("button");
        x.type = "button";
        x.className = "cardx";
        x.textContent = c.hidden ? "＋" : "✕";
        x.title = c.hidden
          ? "Put this contract back in the plan."
          : "Set aside — drop it from the route and the hold. Track it in mobiGlas to bring it back.";
        x.addEventListener("click", (e) => {
          e.stopPropagation();
          hidden = c.hidden ? hidden.filter((id) => id !== c.missionId) : hidden.concat([c.missionId]);
          saveHidden();
          load();
        });
        top.appendChild(x);
      }
      const sub = document.createElement("div");
      sub.className = "sub";
      const where = [];
      if (c.giver) where.push(c.giver);
      if (c.missionType) where.push(c.missionType);
      const done = c.legs.filter((l) => l.dropoffState === "completed").length;
      where.push(done + "/" + c.legs.length + " delivered");
      if (c.ended) where.push(c.completion || "ended");
      if (c.payout != null) where.push(num(c.payout) + " aUEC");
      for (const w of where) { const s = document.createElement("span"); s.textContent = w; sub.appendChild(s); }
      card.append(top, sub);
      // Box chips per leg. ⚠️ A partitioned split is a MODEL of what the game will hand you, not a
      // reading of it — the engine partitions server-side and logs nothing for SCU hauls.
      for (const l of c.legs) {
        if (!l.boxLabel && !l.boxCount) continue;
        const chips = document.createElement("div");
        chips.className = "chips";
        const dot = document.createElement("i");
        dot.style.cssText = "display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;background:" + colourOf(l.group);
        chips.appendChild(dot);
        const txt = document.createElement("span");
        const parts = [];
        if (l.destination) parts.push("→ " + l.destination);
        if (l.commodity) parts.push(l.commodity);
        txt.textContent = parts.join("  ·  ");
        chips.appendChild(txt);
        // 🔴 ONE PILL PER BOX SIZE — the SIZE reads large, the COUNT is a small multiplier beside it.
        // As a run of text, "12 × 8" was read as a box DIMENSION, and a row of four of them was the
        // most cluttered thing on the card. A box has one shape, so its size is its whole identity;
        // how many of them is secondary. Falls back to the flat label when a leg has no breakdown.
        if (l.boxes && l.boxes.length) {
          for (const b of l.boxes) {
            const pill = document.createElement("span");
            pill.className = "boxpill src-" + (l.boxSource || "partition");
            const size = document.createElement("b");
            size.textContent = b.scu + " SCU";
            const mult = document.createElement("i");
            mult.textContent = "×" + b.count;
            pill.append(size, mult);
            pill.title = b.count + " box" + (b.count > 1 ? "es" : "") + " of " + b.scu + " SCU";
            chips.appendChild(pill);
          }
        } else if (l.boxCount) {
          const pill = document.createElement("span");
          pill.className = "boxpill src-" + (l.boxSource || "partition");
          pill.textContent = l.boxCount + " boxes";
          chips.appendChild(pill);
        }
        if (l.maxContainerScu != null) {
          const cap = document.createElement("span");
          cap.className = "boxcap";
          cap.textContent = "max " + l.maxContainerScu + (l.capSource === "assumed" ? "?" : "");
          cap.title = l.capSource === "assumed"
            ? "No cap declared for this contract — the largest box that exists was assumed."
            : "The largest box size this contract declares.";
          chips.appendChild(cap);
        }
        if (l.boxSource === "partition") {
          chips.title = "Provisional: the game never logs the box split for a cargo haul, so this is the"
            + " largest-box-first model against this contract's own container cap.";
        } else if (l.boxSource === "manifest") {
          chips.title = "Read from the log — the game enumerated every box for this contract.";
        }
        if (l.dropoffState === "completed") {
          const tick = document.createElement("span"); tick.className = "tick"; tick.textContent = "  ✓";
          chips.appendChild(tick);
        }
        card.appendChild(chips);
      }
      body.appendChild(card);
    }
    body.appendChild(sourceKey(list));
  }

  /** The key for the provenance colours. Built from what is actually on screen — a legend listing
   *  states no card is in is a legend nobody reads twice. */
  function sourceKey(list) {
    const key = document.createElement("div");
    key.className = "srckey";
    const seen = new Set(list.map((c) => c.source || "unknown"));
    for (const l of list.flatMap((c) => c.legs)) if (l.boxLabel || l.boxCount) seen.add("box:" + (l.boxSource || "partition"));
    const ROWS = [
      ["log", "var(--green)", "SCU stated by the game"],
      ["manifest", "var(--green)", "SCU listed box by box"],
      ["pinned", "var(--cyan-bright)", "SCU you typed in"],
      ["dataset", "var(--cyan-dim)", "SCU from the game files"],
      ["range", "var(--gold)", "SCU only bounded"],
      ["unknown", "var(--red)", "SCU unknown"],
      ["box:manifest", "var(--green)", "boxes listed by the game"],
      ["box:partition", "var(--gold)", "boxes worked out here"],
    ];
    for (const [id, colour, label] of ROWS) {
      if (!seen.has(id)) continue;
      const s = document.createElement("span");
      const i = document.createElement("i"); i.style.background = colour;
      s.append(i, document.createTextNode(label));
      key.appendChild(s);
    }
    return key;
  }

  /**
   * 🔴 THE STOWAGE VIEW — what to load first, and where every box goes.
   *
   * The order comes first and the picture second, because the picture is not the instruction. The
   * instruction is "go to the elevator and lift THIS mission", and the freight elevator UI does not
   * name missions — it lists cargo. So each step leads with its BOX SIGNATURE (commodity + the
   * exact split) which is the only handle the player has on which lift is which.
   *
   * Focus is the answer to the many-grid problem. A Caterpillar has 14 grids, a Carrack 9, an Idris
   * 25; drawing every box on every grid at once is wallpaper. Step 1 is focused on open, so the
   * first thing on screen is the first thing to do, and everything else is still visible behind it.
   */
  function renderStow() {
    const body = $("body");
    body.textContent = "";
    if (!plan.ship) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "Pick the ship you are flying and the stowage plan appears here.";
      body.appendChild(d);
      return;
    }
    const m = StowView.model(plan, { autoLoadClasses: autoLoadClasses });

    /* ⛔ Open haulers load themselves — the station's arm places every box and the player never
       touches one. A stowage diagram for a Hull C describes work that does not exist, so it is not
       drawn at all rather than drawn and ignored. */
    if (m.autoLoad) {
      const d = document.createElement("div");
      d.className = "noplan";
      const k = document.createElement("div"); k.className = "k";
      k.textContent = (plan.ship.displayName || plan.ship.className) + " loads itself.";
      const why = document.createElement("div"); why.className = "why";
      why.textContent = "It is an open hauler, so the station's loading arm places every box for you"
        + " — there is nothing to stow by hand and no order to load in. Use the Route tab for where"
        + " to fly.";
      d.append(k, why);
      body.appendChild(d);
      return;
    }

    if (!m.boxes.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = plan.pack
        ? "Nothing to load — no accepted contract has a known load yet."
        : "Waiting for the packer.";
      body.appendChild(d);
      return;
    }

    // Focus survives a re-render, but only while its mission is still on the board.
    if (!m.steps.some((s) => s.missionId === focusMission)) focusMission = m.steps[0].missionId;

    body.appendChild(renderSteps(m));
    body.appendChild(renderGrids(m));
  }

  /** The ordered load list. Step 1 is what to lift first — its boxes end up deepest in the hold. */
  function renderSteps(m) {
    const wrap = document.createElement("div");
    wrap.className = "steps";
    const sec = document.createElement("div");
    sec.className = "sec";
    const h = document.createElement("span"); h.textContent = "Load in this order";
    const n = document.createElement("span"); n.className = "n";
    n.textContent = m.steps.length + " lift" + (m.steps.length > 1 ? "s" : "") + " · "
      + m.boxes.length + " boxes";
    n.title = m.derivedOrder
      ? "Read off the packer's own placement order — the last drop-off sits deepest, so it is lifted first."
      : "Stated by the stowage planner.";
    sec.append(h, n);
    wrap.appendChild(sec);

    m.steps.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "step" + (s.missionId === focusMission ? " on" : "") + (s.ambiguous ? " clash" : "");
      row.style.borderLeftColor = StowView.shade(s.missionId, 0);
      row.title = "Show only this lift in the diagram.";
      const ord = document.createElement("div");
      ord.className = "ord";
      ord.style.background = StowView.shade(s.missionId, 0);
      ord.textContent = String(s.n);
      const mid = document.createElement("div");
      mid.className = "mid";

      /* 🔴 The signature. Commodity first, because that is the column the elevator shows, then the
         exact box split, because two Processed Food hauls are told apart by 10x8+1x1 vs 4x16. */
      const sig = document.createElement("div");
      sig.className = "sig";
      const what = document.createElement("span"); what.className = "what";
      const parts = s.signature.split(" — ");
      what.textContent = parts[0];
      sig.append(what);
      if (parts[1]) sig.appendChild(document.createTextNode("  " + parts[1]));
      sig.title = "Find this at the freight elevator — it does not name missions, so its contents"
        + " are how you identify it." + (s.title ? "  (" + s.title + ")" : "");

      const meta = document.createElement("div");
      meta.className = "meta";
      const bits = [num(s.scu) + " SCU"];
      if (i === 0 && m.steps.length > 1) bits.push("deepest in the hold");
      if (i === m.steps.length - 1 && m.steps.length > 1) bits.push("last on, first off");
      if (s.grids.length) bits.push(s.grids.map((g) => StowView.gridLabel(g, plan.ship && plan.ship.className)).join(" + "));
      meta.textContent = bits.join("  ·  ");
      mid.append(sig, meta);

      /* Within one mission, which destination's boxes go in first. Same rule one level down: the
         last drop-off is loaded first, so the drops are listed in load order too. */
      if (s.drops.length > 1) {
        const drops = document.createElement("div");
        drops.className = "drops";
        s.drops.forEach((d, di) => {
          const r = document.createElement("div");
          r.className = "drop";
          const dot = document.createElement("i"); dot.style.background = d.colour;
          const nm = document.createElement("span"); nm.className = "d";
          nm.textContent = "→ " + (d.destination || "drop-off");
          const bx = document.createElement("span"); bx.className = "b";
          bx.textContent = d.boxes.map((b) => b.count + "×" + b.scu).join(" · ");
          r.append(dot, nm, bx);
          if (di === 0) {
            const dp = document.createElement("span"); dp.className = "deep"; dp.textContent = "first in";
            dp.title = "This destination is delivered last, so its boxes are loaded deepest.";
            r.appendChild(dp);
          }
          drops.appendChild(r);
        });
        mid.appendChild(drops);
      }

      /* ⚠️ An instruction the player cannot act on is worse than no instruction — but so is the
         same paragraph six times. One line, naming the lifts it collides with, and the reasoning
         in the tooltip. */
      if (s.ambiguous) {
        const c = document.createElement("div");
        c.className = "clash-why";
        c.textContent = "Same signature as lift " + list(s.clashWith) + " — any order between them"
          + (s.clashFixable ? ", or track them to learn the commodity." : ".");
        c.title = "The freight elevator lists cargo, not missions, so two lifts with the same"
          + " commodity and the same box split are indistinguishable there.";
        mid.appendChild(c);
      }

      row.append(ord, mid);
      row.addEventListener("click", () => { focusMission = s.missionId; render(); });
      wrap.appendChild(row);
    });
    return wrap;
  }

  /** The isometric holds. Only grids that received cargo are drawn; the rest are counted. */
  function renderGrids(m) {
    const names = locNames();
    const wrap = document.createElement("div");
    wrap.className = "gridwrap";
    const svgs = [];
    const focused = m.steps.find((s) => s.missionId === focusMission);
    const sec = document.createElement("div");
    sec.className = "sec";
    const h = document.createElement("span"); h.textContent = "Where it goes";
    const n = document.createElement("span"); n.className = "n";
    n.textContent = focused ? "lift " + focused.n + " lit up" : "";
    sec.append(h, n);
    wrap.appendChild(sec);

    for (const g of m.grids) {
      const mine = focused ? g.boxes.filter((b) => b.missionId === focusMission).length : 0;
      const lbl = document.createElement("div");
      lbl.className = "glabel";
      const gn = document.createElement("span"); gn.className = "gn";
      gn.textContent = g.label;
      const meta = document.createElement("span");
      meta.textContent = g.spec.w + "×" + g.spec.l + "×" + g.spec.h + " · "
        + num(g.spec.usedScu) + "/" + num(g.spec.capacityScu) + " SCU · " + g.boxes.length + " boxes";
      lbl.append(gn, meta);
      if (mine) {
        const here = document.createElement("span");
        here.className = "here";
        here.textContent = "· " + mine + " from this lift";
        lbl.appendChild(here);
      }
      wrap.appendChild(lbl);

      const box = document.createElement("div");
      box.className = "isowrap";
      const svg = StowView.iso(g.spec, g.boxes, { focus: focusMission, depthOf: depthOf, spin: stowSpin });
      box.appendChild(svg);
      /* 🔑 The turn-around sits ON the picture, bottom-left, because that is the only thing it acts
         on and a whole toolbar row for one control was wasted space. Sub asked for rotation twice
         while a header button for it was already shipping — he never found it up there. */
      const turn = document.createElement("button");
      turn.type = "button";
      turn.className = "spincorner" + (stowSpin ? " on" : "");
      turn.innerHTML = "&#8635;";
      turn.title = stowSpin
        ? "Looking from the far end — the door is behind you. Click to turn back."
        : "Turn the hold around. A fixed camera always hides the boxes behind the front row.";
      turn.addEventListener("click", () => {
        stowSpin = !stowSpin;
        try { localStorage.setItem(SPIN_KEY, stowSpin ? "1" : "0"); } catch { /* private mode */ }
        render();
      });
      box.appendChild(turn);
      svgs.push(svg);
      wrap.appendChild(box);
    }
    /* 🔑 ONE SCALE ACROSS THE PAGE. Each drawing takes the share of the panel width its own footprint
       deserves against the biggest hold on the ship, so a cell is a cell everywhere and the C2's
       6x9 cubby visibly IS the smaller hold. Sized by ratio rather than by measuring the panel, so
       it survives a resize with no relayout. */
    const widest = Math.max.apply(null, svgs.map((s) => Number(s.dataset.vbw)));
    for (const s of svgs) s.style.width = (Number(s.dataset.vbw) / widest * 100) + "%";

    // Which colour is which drop — without it the diagram is pretty and unreadable.
    const legend = document.createElement("div");
    legend.className = "legend";
    for (const s of m.steps) {
      for (const d of s.drops) {
        const leg = legOf(d.group);
        const el = document.createElement("span");
        const i = document.createElement("i"); i.style.background = d.colour;
        el.appendChild(i);
        el.appendChild(document.createTextNode(cargoOf(leg) + " → " + destOf(leg, names)));
        legend.appendChild(el);
      }
    }
    wrap.appendChild(legend);

    if (m.emptyGrids > 0) {
      const d = document.createElement("div");
      d.className = "note";
      d.style.color = "var(--faint)";
      d.textContent = m.emptyGrids + " more grid" + (m.emptyGrids > 1 ? "s" : "")
        + " on this hull got nothing, so " + (m.emptyGrids > 1 ? "they are" : "it is") + " not drawn.";
      wrap.appendChild(d);
    }
    for (const w of m.warnings) {
      const d = document.createElement("div"); d.className = "note"; d.textContent = w;
      wrap.appendChild(d);
    }
    if (m.unplaced.length) {
      const d = document.createElement("div");
      d.className = "note";
      d.textContent = m.unplaced.length + " boxes ("
        + num(m.unplaced.reduce((s, u) => s + u.scu, 0)) + " SCU) do not fit — this is more than one trip.";
      wrap.appendChild(d);
    }
    return wrap;
  }

  /** Find the leg a packed box belongs to, for its label. */
  function legOf(group) {
    if (!group || !plan) return null;
    for (const c of plan.contracts) for (const l of c.legs) if (l.group === group) return l;
    return null;
  }
  /** locationId -> the name the plan settled on, so the route, the layout legend and the unrouted
   *  list all call a place the same thing — including places the route deliberately never visits. */
  const locNames = () => (plan && plan.locationNames) || {};
  /** Where a leg is going, in the same words the route uses. */
  function destOf(leg, names) {
    if (!leg) return "drop-off";
    return leg.destination || names[leg.toLocation] || "drop-off";
  }
  /** What a leg is carrying. Untracked contracts do not name their commodity, so fall back to the
   *  tonnage rather than printing "cargo" five times in a row. */
  const cargoOf = (leg) => leg && leg.commodity ? leg.commodity : leg && leg.scu != null ? num(leg.scu) + " SCU" : "cargo";

  function render() {
    $("tabRoute").classList.toggle("on", view === "route");
    $("tabLayout").classList.toggle("on", view === "layout");
    $("tabAdvisor").classList.toggle("on", view === "advisor");
    $("objBtn").textContent = objective === "fewest-stops" ? "Fewest stops" : "Fastest run";
    $("doneBtn").textContent = showDone ? "Hide finished" : "Show finished";
    $("spinBtn").textContent = stowSpin ? "Turned around" : "Turn around";
    $("spinBtn").classList.toggle("on", stowSpin);
    $("doneBtn").classList.toggle("on", showDone);
    if (!plan) return;
    // 🔴 The auto option NAMES the detected hull, so it has to be redrawn when the plan changes.
    // It was only ever built once, from the ship-list load at startup — before any plan existed —
    // so it printed "nothing detected yet" and stayed that way for the session. Sub boarded his C2,
    // watched the skin turn Crusader, and the picker still claimed nothing was detected.
    renderShipPicker();
    renderSummary();
    renderStartPicker();
    renderTrack();
    renderPlaces();
    /* 🔑 AFTER those two, because each sets its own display. The naming and load checklists belong
       to the board you are flying; the advisor is about contracts you have NOT taken. Leaving them
       up opened the Rank tab two screens below its own heading. */
    if (view === "advisor") { $("track").style.display = "none"; $("places").style.display = "none"; }
    if (view === "advisor") renderAdvisor();
    else if (view === "layout") renderStow();
    else renderRoute();
  }

  // ── wiring ────────────────────────────────────────────────────────────────
  $("tabRoute").addEventListener("click", () => { view = "route"; render(); });
  $("tabLayout").addEventListener("click", () => { view = "layout"; render(); });
  $("tabAdvisor").addEventListener("click", () => { view = "advisor"; if (!advisor) loadAdvisor(); render(); });
  $("objBtn").addEventListener("click", () => {
    objective = objective === "fewest-stops" ? "auec-per-hour" : "fewest-stops";
    load();
  });
  $("doneBtn").addEventListener("click", () => { showDone = !showDone; render(); });
  $("shipPick").addEventListener("change", () => {
    shipPick = $("shipPick").value;
    saveShip(shipPick);
    load();
  });
  $("spinBtn").addEventListener("click", () => {
    stowSpin = !stowSpin;
    try { localStorage.setItem(SPIN_KEY, stowSpin ? "1" : "0"); } catch { /* private mode */ }
    render();
  });
  $("startPick").addEventListener("change", () => {
    startPick = $("startPick").value;
    saveStart();
    load();
  });
  // The heading is the toggle, BOTH ways. It only opened before, so once Sub expanded a finished
  // card he could never put it away again. Bound to the heading, not the whole strip, so clicking
  // a row or typing in a box never collapses the thing you are working in.
  $("trackHead").addEventListener("click", () => {
    if ($("track").classList.contains("done")) { trackOpen = true; render(); return; }
    if (allPinnedNow()) { trackOpen = false; render(); }   // only collapsible once nothing is owed
  });
  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  /* Live contract state. The SSE channel is a CHANGE SIGNAL, not the payload — the plan is
     re-solved server-side on every push because it depends on the player's overrides too. */
  let es = null;
  function connect() {
    try { es?.close(); } catch { /* already gone */ }
    es = new EventSource("/hauling/events");
    es.onmessage = () => refresh();
    // EventSource retries on its own, but a sidecar restart can leave a dead stream — re-arm.
    es.onerror = () => { try { es.close(); } catch { /* ignore */ } setTimeout(connect, 4000); };
  }

  (async () => {
    await loadConfig();
    await loadShips();
    await load();
    connect();
  })();

  try { host()?.ready?.(); } catch { /* not embedded */ }
  // Per-widget settings, opened by the bar's cog. The parent injects its Text size row here too.
  window.__widgetSettings = () => $("wsettings").classList.add("open");
  window.__widgetSettingsRoot = () => $("wsettings");
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#wsettings")) $("wsettings").classList.remove("open");
  });
  /* 🔴 Hiding the widget mid-edit would strand the canvas-wide keyboard grab: the panel goes away,
     the interact key stays suspended, and every click on every display stops reaching the game with
     nothing on screen to explain it. Same rule as notepad/party/chat. */
  window.__haulingExitTyping = () => {
    try { document.activeElement?.blur?.(); } catch { /* nothing focused */ }
    try { host()?.editEnd?.(); } catch { /* not embedded */ }
  };
  // The shell's hand-back after it takes window focus. 🔴 This used to be
  // `querySelector("input")` — ALWAYS the first box — so every attempt to reach box 2 or 3 was
  // dragged back to box 1. Aim at the box the player is actually in; fall back to the first only
  // when we have no idea, which is the cold-start case this was written for.
  window.__haulingFocus = () => {
    try {
      const target = wantFocus && wantFocus.isConnected ? wantFocus : $("trackList").querySelector("input");
      target?.focus();
    } catch { /* none */ }
  };
</script>
</body>
</html>
