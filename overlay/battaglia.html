<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event Tracker</title>
  <div id="wsettings" class="wsettings">
    <div class="ws-sec">View</div>
    <div class="ws-row">
      <button id="modeBtn" class="hbtn" type="button" title="Switch between the reward ladder and the mission list">Missions</button>
    </div>
    <div class="ws-row">
      <button id="doneBtn" class="hbtn" type="button" title="Show tiers you have already finished">Show done</button>
    </div>
    <div class="ws-sec">Elsewhere</div>
    <div class="ws-row">
      <button id="siteBtn" class="hbtn" type="button" title="Open this giver's full track on subliminal.gg">Track on the web ↗</button>
    </div>
  </div>

<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t);
    /* ?bg=RRGGBB paints an opaque backdrop, for embedding in a THIRD-PARTY host (GameGlass
       and friends). Hex digits only, and applied through CSSOM — a value that is not a colour
       is rejected by the engine rather than landing anywhere it could be read as markup. */
    const b = q.get("bg"); if (b && /^[0-9a-f]{3,8}$/i.test(b)) { r.style.setProperty("--wbg", "#" + b); r.dataset.bg = ""; } }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Grind tracker for a mission giver's reputation track — built for Recco Battaglia, whose
     standing gates three SHIPS (Golem @ Prestige 1, Prospector @ Prestige 2, MOLE @ Prestige 3).
     Data comes from /api/grind-track (dataset ranks + rep scope ladder + your witnessed rep).
     Theme tokens come from the shared /widget-theme.css. */
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 360px; height: 470px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    /* Fill, border tint, shadow and blur live in widget-theme.css (#panel.wpanel), which
       multiplies each one's alpha by --wsurf so the panel fades independently of its text. */
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  /* Scanlines / Esperia mesh / Origin stitching come from the shared widget-theme.css
     via .wpanel, so every widget carries the theme's surface treatment. */
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  .head { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; min-height: 40px; }
  .dia { width: 7px; height: 7px; flex: none; background: var(--cyan-bright); transform: rotate(45deg);
    box-shadow: 0 0 8px var(--cyan); }
  .hbtn { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 7px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.active { background: rgba(var(--accent-rgb), 0.28); border-color: var(--cyan); }

  /* Standing + progress to the next rank. */
  .standing { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .standing .k { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .standing .now { font-size: 16px; font-weight: 700; color: var(--gold); margin-top: 1px; }
  /* The track has to be VISIBLE or there's no way to judge how far 100% is - it read as a
     floating coloured stub before. Inset border + a lighter trough gives it an end. */
  .rb { position: relative; height: 14px; border-radius: 7px; margin-top: 7px;
    background: rgba(0, 0, 0, 0.34); border: 1px solid var(--divider);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45); overflow: hidden; }
  .rb-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold));
    border-radius: 6px 0 0 6px; transition: width 0.4s ease; }
  .rb-pct { position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--cyan-text);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85); letter-spacing: 0.04em; }
  .standing .sub { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px;
    font-family: var(--mono); font-size: 10px; color: var(--cyan-dim); }
  .standing .sub .to { color: var(--cyan-bright); }
  .standing .est { font-size: 10px; color: var(--faint); margin-top: 5px; line-height: 1.5; }

  #body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 4; }
  .sec { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); padding: 9px 12px 5px; }

  /* Ship / guaranteed-item ladder — the reason to chase a rank. */
  .ship { display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.08); }
  .ship .tier { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    border: 1px solid var(--divider); color: var(--faint); background: rgba(0, 0, 0, 0.2); }
  .ship.have .tier { border-color: var(--green); color: var(--green); background: rgba(46, 230, 160, 0.12); }
  .ship.open .tier { border-color: var(--gold); color: var(--gold); background: rgba(var(--value-rgb), 0.10); }
  details.done .ship { opacity: 0.75; }
  .ship .who { flex: 1; min-width: 0; }
  .ship .nm { font-size: 12.5px; font-weight: 600; color: var(--cyan-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ship.have .nm, .ship.open .nm { color: var(--cyan-bright); }
  .ship .at { font-size: 10px; color: var(--faint); margin-top: 1px; }
  .ship .st { flex: none; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); }
  .ship.have .st { color: var(--green); }
  .ship.open .st { color: var(--gold); }

  /* Mission rows for the selected rank. */
  .mrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.06); }
  .mrow .t { flex: 1; min-width: 0; font-size: 12px; color: var(--cyan-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .bp { flex: none; font-size: 9.5px; color: var(--cyan-dim); }
  .mrow .rp { flex: none; font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--gold); }
  .mrow.best { background: rgba(var(--accent-rgb), 0.07); }
  .mrow.linked { cursor: pointer; }
  .mrow.linked:hover { background: rgba(var(--accent-rgb), 0.14); }
  .mrow.linked:hover .t { color: var(--cyan-bright); }

  /* Rank picker */
  /* The rep-per-hour rows appended under the ladder. The rate holds the right column so the
     ranking is scannable without reading the captions. */
  .grow { display: flex; align-items: center; gap: 8px; padding: 5px 10px; }
  .grow.linked { cursor: pointer; }
  .grow.linked:hover { background: rgba(var(--accent-rgb), 0.08); }
  .grow.best { background: rgba(var(--accent-rgb), 0.1); }
  .gleft { flex: 1 1 auto; min-width: 0; }
  .grow .t { font-size: 11.5px; color: var(--cyan-text); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .grow.best .t { color: var(--cyan-bright); }
  .gmeta { font-size: 9.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .rate { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--gold); }

  /* Top-level view switcher (giver track vs each event). Sits above .standing, so it uses a
     heavier weight than the rank .tab strip below it to read as the outer level. */
  .vnav { flex: none; display: flex; gap: 5px; flex-wrap: wrap; padding: 8px 12px 0; }
  .vt { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--cyan-dim); background: transparent; cursor: pointer;
    padding: 4px 9px; border: 1px solid var(--divider); border-radius: 3px; transition: all .12s; }
  .vt:hover { border-color: var(--cyan); color: var(--cyan-bright); }
  .vt.on { background: rgba(var(--accent-rgb), 0.26); border-color: var(--cyan); color: var(--cyan-bright); }

  /* Event contribution ladder: what percent pays what loot. */
  .evbarwrap { position: relative; margin: 4px 12px 26px; }
  .evtrack { height: 16px; border-radius: 9px; border: 1px solid rgba(var(--accent-rgb), 0.45);
    background: rgba(0,0,0,0.35); overflow: hidden; }
  .evfill { height: 100%; border-radius: 9px; background: rgba(var(--accent-rgb), 0.55);
    box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.35); transition: width .4s; }
  .evtick { position: absolute; top: 0; transform: translateX(-50%); display: flex;
    flex-direction: column; align-items: center; pointer-events: none; }
  .evtick .stem { width: 1px; height: 16px; background: rgba(var(--accent-rgb), 0.5); }
  .evtick.hit .stem { background: var(--gold); }
  .evtick .lbl { margin-top: 2px; font-family: var(--mono); font-size: 9px; color: var(--faint); }
  .evtick.hit .lbl { color: var(--gold); font-weight: 700; }
  .evrow { display: flex; align-items: baseline; gap: 9px; margin: 9px 12px 3px; padding-bottom: 3px;
    border-bottom: 1px solid var(--divider); }
  .evrow .pc { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--gold);
    font-variant-numeric: tabular-nums; min-width: 38px; }
  .evrow.hit .pc { text-shadow: 0 0 10px rgba(var(--value-rgb), 0.4); }
  .evrow .at { font-family: var(--mono); font-size: 9.5px; color: var(--faint); }
  .evrow .sp { flex: 1; }
  /* "We have this wrong" — one per tier, so a correction can be made at the moment the player
     SEES the mistake rather than only in the two minutes after they cross that threshold. */
  .evfix { flex: none; font-family: var(--sans); font-size: 9px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint);
    background: transparent; border: 1px solid var(--divider); border-radius: 4px;
    padding: 2px 6px; cursor: pointer; }
  .evfix:hover { color: var(--cyan-bright); border-color: var(--cyan); }
  .evloot { margin: 0 12px 8px 59px; font-size: 11px; line-height: 1.55; color: var(--cyan-text); }
  .evloot .it { display: block; }
  .evloot .it.owned { color: var(--green); }
  .evloot .unk { color: var(--faint); font-style: italic; }
  /* 🔴 A GUESS MUST NOT LOOK LIKE A MEASUREMENT. Sub's ruling, 2026-08-22, is that the candidates
     found online may now be SHOWN — not that they may be shown as rewards. Three separate signals
     carry the difference, because any one of them alone is a signal somebody can miss: a dim,
     italic, dashed-underlined name (nothing else in this widget is drawn that way), a leading "?"
     where a confirmed reward has "·" or "✔", and the word UNCONFIRMED beside it. The colour is
     deliberately NOT the green a collected reward gets — a candidate has no ownership state,
     because we do not know the name to check. */
  .evloot .it.cand { color: var(--faint); font-style: italic;
    text-decoration: underline dotted rgba(var(--accent-rgb), 0.45); text-underline-offset: 3px; }
  .evloot .it.cand .tag { font-style: normal; font-size: 8.5px; font-weight: 700;
    letter-spacing: 0.1em; color: var(--gold); margin-left: 5px; }
  /* Said once under the ladder rather than on every row — six repetitions of the same sentence is
     how a caveat stops being read. */
  .evkey { margin: 2px 12px 10px; font-size: 10px; line-height: 1.5; color: var(--faint); }
  .evkey b { color: var(--gold); font-weight: 700; }
  .evmeta { margin: 10px 12px; padding: 8px 10px; font-size: 10.5px; line-height: 1.5;
    color: var(--cyan-text); background: rgba(var(--accent-rgb), 0.06);
    border: 1px solid var(--divider); border-radius: 4px; }
  .evwarn { color: var(--gold); }
  /* The purge sits under the caveats, right-aligned and quiet at rest — it is a repair, not a
     feature anyone should reach for by accident. Armed, it takes the alert colour. */
  .evreset { margin-top: 8px; display: flex; justify-content: flex-end; }
  /* Same treatment as .evfix, deliberately NOT the same class — see renderEvent. */
  .evrst { flex: none; font-family: var(--sans); font-size: 9px; font-weight: 700;
           letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
           color: var(--dim); background: transparent; padding: 2px 6px; border-radius: 3px;
           border: 1px solid color-mix(in srgb, var(--dim) 45%, transparent); }
  .evrst:hover { color: var(--red); border-color: var(--red); }
  /* --red and --green are the only two tokens whose meaning holds in all 16 skins. */
  .evrst.armed { color: var(--red); border-color: var(--red); }
  /* ── "You just crossed a tier — is this what you got?" ─────────────────────────────────
     🔑 It sits ABOVE the body rather than inside it, so switching view tabs cannot scroll the
     question away or replace it. Sub's brief: a pop-up, non-blocking, up for two minutes. */
  .rwcard { flex: none; margin: 8px 12px 0; padding: 9px 10px; border-radius: 6px;
    border: 1px solid var(--gold); background: rgba(var(--value-rgb), 0.10);
    position: relative; z-index: 5; }
  .rwcard[hidden] { display: none; }
  .rwcard .rwq { font-size: 11.5px; line-height: 1.5; color: var(--cyan-text); }
  .rwcard .rwq b { color: var(--gold); }
  /* ⚠️ A GUESS AND A SIGHTING MUST NOT LOOK THE SAME. The candidate is an unverified name from
     a third party; the observation is what the log actually saw. Both appear inside the
     question, and the caption below the name says which one this is — in words, because a
     colour difference is not something a player can be expected to decode. */
  .rwcard .rwname { display: block; margin: 5px 0 2px; font-size: 12.5px; font-weight: 700;
    color: var(--cyan-bright); word-break: break-word; }
  .rwcard .rwsrc { display: block; font-size: 9.5px; color: var(--faint); }
  .rwcard .rwrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 8px; }
  .rwcard .rwbtn { font-family: var(--sans); font-size: 10.5px; font-weight: 700;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.16);
    border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; cursor: pointer; }
  .rwcard .rwbtn:hover { background: rgba(var(--accent-rgb), 0.28); border-color: var(--cyan); }
  .rwcard .rwbtn.yes { color: var(--gold); border-color: var(--gold); }
  .rwcard .rwtext { flex: 1; min-width: 130px; font-family: var(--sans); font-size: 11px;
    color: var(--cyan-text); background: rgba(0, 0, 0, 0.32);
    border: 1px solid var(--divider); border-radius: 5px; padding: 4px 6px; }
  .rwcard .rwfoot { margin-top: 7px; font-size: 9.5px; line-height: 1.45; color: var(--faint); }
  .rwcard .rwclock { font-family: var(--mono); }
  .rwcard .rwx { position: absolute; top: 4px; right: 6px; font-size: 12px; line-height: 1;
    color: var(--faint); background: none; border: 0; cursor: pointer; padding: 2px 4px; }
  .rwcard .rwx:hover { color: var(--cyan-bright); }


  .tabs { flex: none; display: flex; gap: 4px; flex-wrap: wrap; padding: 7px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .tab { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--cyan-dim);
    background: rgba(var(--accent-rgb), 0.08); border: 1px solid var(--divider); border-radius: 5px;
    padding: 3px 7px; cursor: pointer; }
  .tab:hover { border-color: var(--cyan); color: var(--cyan-bright); }
  .tab.on { background: rgba(var(--accent-rgb), 0.26); border-color: var(--cyan); color: var(--cyan-bright); }
  .tab.locked { opacity: 0.5; }

  .empty { padding: 26px 16px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; }
  /* Completed rewards collapse into a disclosure rather than vanishing, so you can still
     check what you've already earned. */
  details.done > summary { list-style: none; cursor: pointer; padding: 9px 12px 5px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); }
  details.done > summary::-webkit-details-marker { display: none; }
  details.done > summary:hover { color: var(--cyan-dim); }
  details.done > summary::before { content: "\25b8 "; display: inline-block; transition: transform 0.15s; }
  details.done[open] > summary::before { transform: rotate(90deg); }
</style>
</head>
<body>
  <div id="panel" class="wpanel">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title" id="who">Battaglia</span>
    </div>

    <!-- Top-level view switcher: the giver's grind track, plus one tab per live event.
         Distinct from #tabs below, which selects a RANK within the giver track. Hidden
         entirely when there is only one view, so a single-track user sees no chrome. -->
    <div class="vnav" id="vnav" style="display:none"></div>

    <div class="standing" id="standingBox">
      <div class="k">Standing</div>
      <div class="now" id="stNow">—</div>
      <div class="rb"><div class="rb-fill" id="stFill" style="width:0%"></div><div class="rb-pct" id="stPct"></div></div>
      <div class="sub"><span id="stCur"></span><span class="to" id="stNext"></span></div>
      <div class="est" id="stEst"></div>
    </div>

    <div class="tabs" id="tabs" style="display:none"></div>
    <div id="rwcard" class="rwcard" hidden>
      <button id="rwx" class="rwx" type="button" title="Dismiss without answering">✕</button>
      <div id="rwq" class="rwq"></div>
      <div id="rwrow" class="rwrow"></div>
      <div id="rwfoot" class="rwfoot"></div>
    </div>
    <div id="body"><div class="empty" id="emptyState">Loading Battaglia track…</div></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__battagliaHost : null;

  /* Hand off to the companion site. Embedded, the shell opens the real browser (https only);
     standalone in a browser tab, a normal new tab does the job. */
  const SITE = "https://subliminal.gg";
  function openSite(path) {
    const url = SITE + path;
    if (host()) host().openUrl(url);
    else window.open(url, "_blank", "noopener");
  }
  /* Giver -> the site's /factions slug: lowercase, non-alphanumerics collapse to a dash. */
  const giverSlug = (name) => String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

  const POLL_MS = 20_000;
  const GIVER = new URLSearchParams(location.search).get("giver") || "";

  let track = null;
  let events = [];        // dynamic-event progress from /api/events (see EventProgress in missions.ts)
  let feed = null;        // where that event DATA came from: live / cache / bundled (EventFeedState)
  // Mirrors RECEIPT_WINDOW_MS / PROMPT_DWELL_MS in src/event-rewards.ts. The sidecar is the
  // authority on whether a prompt is due; these only drive the visible countdown, so a drift
  // costs a second on a clock rather than a card that will not go away.
  const RW_WINDOW_MS = 3000;
  const RW_DWELL_MS = 120000;
  let view = "giver";     // "giver" = the grind track; otherwise an event id
  // Has the player picked a tab themselves? Until they do, a live event claims the widget (see
  // renderVNav). After they do, nothing may move them — a 20-second poll that kept dragging the
  // view back to the event would make the giver track unreadable.
  let viewPinned = false;
  let mode = "rewards";   // "rewards" = the ship/item ladder, "missions" = per-rank mission list
  let tab = null;         // selected rank in mission mode
  let showDone = false;   // hide tiers already cleared, so the widget shows what is NEXT

  const num = (n) => Number(n || 0).toLocaleString();

  async function load() {
    try {
      const r = await fetch("/api/grind-track" + (GIVER ? "?giver=" + encodeURIComponent(GIVER) : ""), { cache: "no-store" });
      // 🔑 `track = null` on a 404 must REACH the renderer. See render()'s comment: this widget
      // used to leave the previous giver's ladder on screen forever in exactly this case.
      track = r.ok ? await r.json() : null;
    } catch { /* network blip — keep the last good track rather than blanking a working widget */ }
    // Events are independent of the giver track: a 404 on one must not blank the other, so this
    // is its own try/catch and its own state.
    try {
      const re = await fetch("/api/events", { cache: "no-store" });
      if (re.ok) {
        const j = await re.json();
        events = j.events || [];
        // Provenance of the reward/tier data itself — see src/event-feed.ts. The ladder is
        // fetched from subliminal.gg so a reward confirmed mid-event reaches players without an
        // app release; when that fetch is failing the player has to be able to tell.
        feed = j.feed || null;
        rwReporting = !!j.reporting;
        // Only ever REPLACE the card from a poll when the sidecar still says one is due. A
        // player halfway through typing an answer must not have the box yanked out from under
        // them by a routine refresh, so an unchanged prompt id is left alone.
        // 🔑 A LOCALLY-OPENED CORRECTION IS NOT THE SIDECAR'S TO CLOSE. The player pressed
        // "Wrong?" a second ago; the sidecar has no prompt for it and never will, so the plain
        // `if (!j.rewardPrompt) rwHide()` would close the card under them on the next tick.
        if (rwPrompt && rwPrompt.local) { /* the player's own question — leave it alone */ }
        else if (!j.rewardPrompt) rwHide();
        else if (!rwPrompt || rwPrompt.id !== j.rewardPrompt.id) rwRender(j.rewardPrompt);
      }
    } catch { /* keep the last good event list */ }
    render();
  }

  /** The rank you have actually reached. Prefer `reachedRank` — the highest tier the giver has
   *  been OBSERVED offering a mission at, which is a fact from the log. The rep ladder is only a
   *  fallback: that estimate is witnessed-only, so it reads LOW and would under-report the tier. */
  function currentRank() {
    let cur = typeof track?.reachedRank === "number" ? track.reachedRank : -1;
    if (track?.bar) for (const r of track.ranks) if (track.bar.estimate >= r.minRep) cur = Math.max(cur, r.rank);
    return cur;
  }

  function renderStanding() {
    const b = track?.bar;
    if (!b) {
      $("stNow").textContent = "—";
      $("stFill").style.width = "0%";
      $("stPct").textContent = "";
      $("stCur").textContent = ""; $("stNext").textContent = "";
      $("stEst").textContent = track ? "No completions witnessed yet — run Verify from logs." : "";
      return;
    }
    $("stNow").textContent = b.standing;
    const span = (b.nextMin ?? b.curMin) - b.curMin;
    const pct = b.max || span <= 0 ? 100 : Math.max(0, Math.min(100, ((b.estimate - b.curMin) / span) * 100));
    $("stFill").style.width = pct.toFixed(1) + "%";
    $("stPct").textContent = b.max ? "MAX" : pct.toFixed(0) + "%";
    // 🔴 EVERY FIGURE ON THIS BAR IS A BOUND, AND IT USED TO BE PRINTED AS A READING.
    // Sub, 2026-08-22: "since we don't know how much rep we're going to get per mission, this rep
    // ladder is pretty broken, right?" He is right, and it is worse than he said — the app cannot
    // read reputation from the game AT ALL. What it has are two floors (rep summed from witnessed
    // completions, and the rank the giver has been seen offering work at), and `estimate` is the
    // higher of them. A floor under where you are is a CEILING on what is left, so "2,400 to
    // Associate" and "12 runs" were both upper bounds wearing the clothes of exact figures.
    // They now say so. No number was removed — a bound is genuinely useful, and it is honest.
    $("stCur").textContent = "at least " + num(b.estimate) + " rep";
    $("stNext").textContent = b.max ? "max standing" : "≤" + num(Math.max(0, (b.nextMin ?? 0) - b.estimate)) + " to " + b.nextName;
    // Which evidence the floor rests on changes what the player should read into it, so say which.
    $("stEst").textContent = track.repFloorFromRank
      ? "The game never reports reputation to the app. This is the floor of the rank you have been seen working at — you are somewhere above it, and nothing in the log says how far."
      : "The game never reports reputation to the app. This is summed from completions this tracker witnessed, so it is a floor — everything left is 'at most'.";
  }

  /** A collapsed <details> holding rewards already received — visible, just out of the way. */
  function appendDoneSection(title, items, gated) {
    if (!items.length) return;
    const d = document.createElement("details");
    d.className = "done";
    const sum = document.createElement("summary");
    sum.textContent = title + " (" + items.length + ")";
    d.appendChild(sum);
    for (const r of items) {
      const rank = gated ? track.ranks.find((x) => x.rank === r.rank) : null;
      const row = document.createElement("div");
      row.className = "ship have";
      const tier = document.createElement("div"); tier.className = "tier";
      tier.textContent = gated ? "R" + r.rank : "✓";
      const who = document.createElement("div"); who.className = "who";
      const nm = document.createElement("div"); nm.className = "nm";
      nm.textContent = r.name + (r.amount > 1 ? " ×" + r.amount : "");
      const at = document.createElement("div"); at.className = "at";
      at.textContent = (rank ? rank.name + " · " : "") + r.mission;
      who.append(nm, at);
      const st = document.createElement("div"); st.className = "st"; st.textContent = "received";
      row.append(tier, who, st);
      d.appendChild(row);
    }
    $("body").appendChild(d);
  }

  function renderRewards() {
    const body = $("body");
    body.textContent = "";
    const cur = currentRank();
    // Rank-gated first (the ships), then the ungated intro gear.
    const gated = track.rewards.filter((r) => r.rank != null);
    const free = track.rewards.filter((r) => r.rank == null);
    const section = (label) => { const d = document.createElement("div"); d.className = "sec"; d.textContent = label; body.appendChild(d); };

    // Three DISTINCT states. Reaching a tier only gets the mission OFFERED; you do not have the
    // reward until the mission is COMPLETED. (Proven from the log: the rank-3 Golem mission was
    // accepted and then abandoned, so the tier was reached but no ship was ever received.)
    const state = (r) => r.received ? "have" : (cur >= r.rank ? "open" : "locked");
    const shown = showDone ? gated : gated.filter((r) => state(r) !== "have");
    const hidden = gated.length - shown.length;
    if (shown.length) {
      section("Rank-gated rewards");
      for (const r of shown) {
        const rank = track.ranks.find((x) => x.rank === r.rank);
        const st8 = state(r);
        const row = document.createElement("div");
        row.className = "ship " + st8;
        const tier = document.createElement("div"); tier.className = "tier"; tier.textContent = "R" + r.rank;
        const who = document.createElement("div"); who.className = "who";
        const nm = document.createElement("div"); nm.className = "nm";
        nm.textContent = r.name + (r.amount > 1 ? " ×" + r.amount : "");
        const at = document.createElement("div"); at.className = "at";
        at.textContent = (rank ? rank.name + " · " + num(rank.minRep) + " rep" : "rank " + r.rank) + " · " + r.mission;
        who.append(nm, at);
        const st = document.createElement("div"); st.className = "st";
        st.textContent = st8 === "have" ? (r.unsure ? "probably" : "received")
          : st8 === "open" ? "do the job"
          // "≤", for the same reason as the standing bar: the estimate is a floor, so the gap it
          // implies is a ceiling. Printing it bare said "exactly this much left", which the app
          // has no way to know.
          : (track.bar ? "≤" + num(Math.max(0, (rank?.minRep ?? 0) - track.bar.estimate)) + " to go" : "locked");
        st.title = st8 === "have"
          ? (r.unsure
              ? "A mission with this exact title was completed, but another mission shares that title, so this one can't be confirmed."
              : "Mission completed - the reward was granted.")
          : st8 === "open" ? "Tier reached, so she offers this mission. Complete it to get the reward."
          : "Rank not reached yet. The game never tells the app your reputation, so this is at most how much is left — probably less.";
        row.append(tier, who, st);
        body.appendChild(row);
      }
    }
    // Sub's ask: don't just hide what's done — tuck it into a closed "Completed" section so it's
    // still checkable. `showDone` (the header toggle) forces everything back into the main list.
    if (!showDone && hidden) {
      appendDoneSection("Completed rewards", gated.filter((r) => state(r) === "have"), true);
    }
    // These missions carry NO rank in the dataset — which means the field is absent, NOT that the
    // mission is ungated. 992 of 2763 missions are like this, and givers use rank 0 and null side
    // by side, so "no rank listed" is the only claim the data supports. Don't call them "intro" or
    // imply they're the start of the track. Their only honest state is: done yet or not?
    const freeShown = showDone ? free : free.filter((r) => !r.received);
    const freeHidden = free.length - freeShown.length;
    if (freeShown.length) {
      section("Guaranteed · rank not listed");
      for (const r of freeShown) {
        const row = document.createElement("div");
        row.className = "ship " + (r.received ? "have" : "open");
        const tier = document.createElement("div"); tier.className = "tier";
        tier.textContent = r.received ? "✓" : "—";
        const who = document.createElement("div"); who.className = "who";
        const nm = document.createElement("div"); nm.className = "nm";
        nm.textContent = r.name + (r.amount > 1 ? " ×" + r.amount : "");
        const at = document.createElement("div"); at.className = "at"; at.textContent = r.mission;
        who.append(nm, at);
        const st = document.createElement("div"); st.className = "st";
        st.textContent = r.received ? (r.unsure ? "probably" : "received") : "do the job";
        if (r.unsure) st.title = "Another mission shares this title, so this can't be confirmed.";
        row.append(tier, who, st);
        body.appendChild(row);
      }
    }
    if (!showDone && freeHidden) {
      appendDoneSection("Completed · rank not listed", free.filter((r) => r.received), false);
    }
    if (!shown.length && !freeShown.length && (hidden || freeHidden)) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "Everything on this track is received.";
      body.appendChild(d);
    } else if (!gated.length && !free.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "No guaranteed rewards on this track.";
      body.appendChild(d);
    }
  }

  function renderMissions() {
    const body = $("body");
    body.textContent = "";
    const list = tab === "intro"
      ? track.intro
      : (track.ranks.find((r) => r.rank === tab)?.missions ?? []);
    if (!list.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = tab === "intro" ? "No unranked missions on this track." : "No missions at this rank.";
      body.appendChild(d);
      return;
    }
    const bestRep = Math.max(...list.map((m) => m.rep));
    for (const m of list) {
      const row = document.createElement("div");
      row.className = "mrow" + (m.rep === bestRep && bestRep > 0 ? " best" : "");
      const t = document.createElement("div"); t.className = "t";
      t.textContent = (m.completed > 0 ? "✓ " : "") + m.title + (m.items.length ? "  ★" : "");
      if (m.completed > 0) t.title = "Completed " + m.completed + "x";
      const bp = document.createElement("div"); bp.className = "bp";
      bp.textContent = m.poolCount ? m.poolCount + " bp" : "";
      const rp = document.createElement("div"); rp.className = "rp";
      rp.textContent = m.rep ? "+" + num(m.rep) : "";
      row.append(t, bp, rp);
      // The full mission breakdown (pools, payout, rep, rewards) lives on the site — the widget
      // only has room for a summary, so clicking a row hands off to the page that has the detail.
      if (m.key) {
        row.classList.add("linked");
        row.title = "Open this mission on subliminal.gg";
        row.addEventListener("click", () => openSite("/missions/" + encodeURIComponent(m.key)));
      }
      body.appendChild(row);
    }
  }

  function renderTabs() {
    const el = $("tabs");
    el.textContent = "";
    if (mode !== "missions") { el.style.display = "none"; return; }
    el.style.display = "flex";
    const cur = currentRank();
    const mk = (label, key, locked) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (tab === key ? " on" : "") + (locked ? " locked" : "");
      b.textContent = label;
      b.addEventListener("click", () => { tab = key; render(); });
      el.appendChild(b);
    };
    if (track.intro.length) mk("Unranked", "intro", false);
    for (const r of track.ranks) {
      if (!r.missions.length) continue;
      mk("R" + r.rank, r.rank, cur >= 0 && r.rank > cur);
    }
  }

  // ── What one run of each mission is worth ─────────────────────────────────────────────────
  // Sub, 2026-08-15: keep the reward ladder exactly as it is and APPEND the fastest way to the
  // next rank underneath it. So this is not a second view — it is one screen that answers both
  // "what am I chasing" and "what do I run to get there".
  //
  // 🔑 WHY IT IS WORTH THE SPACE. Measured over Recco Battaglia’s 33 contracts: 33 carry a
  // payout, 32 a run length, 32 a difficulty. The useful part is not any single figure — it is
  // that REP PER HOUR VARIES FOUR-FOLD across her own board (4,800/hr on "Extra Special Job"
  // against 1,200/hr on most rank 0-2 work). The widget could always show where you stood; it
  // could never say which mission to run, which is the question a grind tracker exists for.
  //
  // 🔴 EVERY aUEC FIGURE IS MODELLED, not read from the game (payoutEstimated is true for all 33),
  // so it carries a tilde exactly as the mission panel’s does. Never print one bare.
  /** Minutes → "10m" / "1h 10m". */
  function fmtMins(min) {
    const m = Math.max(1, Math.round(min));
    if (m < 60) return m + "m";
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + "h " + String(r).padStart(2, "0") + "m" : h + "h";
  }
  /** Compact aUEC. */
  function fmtK(v) {
    const n = Number(v) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "m";
    if (n >= 10000) return Math.round(n / 1000) + "k";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(Math.round(n));
  }
  /** Every mission on the track, flattened, with its rank carried along. */
  function allTrackMissions() {
    const out = [];
    for (const m of track.intro || []) out.push({ ...m, atRank: null });
    for (const r of track.ranks || []) for (const m of r.missions) out.push({ ...m, atRank: r.rank });
    // ⚠️ DEDUPE BY CONTRACT KEY. A mission with no rank listed appears in `intro` AND under the
    // rank buckets, so a flat list shows it twice — "Ship In Distress" and "Minor Mining Job" both
    // rendered twice in the first pass. Keep the RANKED copy where both exist: it is the one whose
    // gate decides whether she will actually offer it to you.
    const byKey = new Map();
    for (const m of out) {
      const k = m.key || m.title;
      const had = byKey.get(k);
      if (!had || (had.atRank == null && m.atRank != null)) byKey.set(k, m);
    }
    return [...byKey.values()];
  }
  /** Missions you can actually be offered right now, scored by rep per hour.
   *  🔑 GATED BY YOUR STANDING, because a route through a mission she will not offer you is not a
   *  route. `currentRank()` is the same reached-rank the reward ladder already trusts. */
  function takeableByRate() {
    const cur = currentRank();
    return allTrackMissions()
      .filter((m) => m.rep > 0 && m.durMin && (m.atRank == null || cur < 0 || m.atRank <= cur))
      .map((m) => ({ ...m, repHr: (m.rep / m.durMin) * 60, auecHr: m.payMax ? (m.payMax / m.durMin) * 60 : null }))
      .sort((a, b) => b.repHr - a.repHr);
  }
  /** The fastest way to the next rank, appended under the reward ladder.
   *
   *  🔑 SCOPED TO THE NEXT RANK, not to the whole track. "Best rep per hour" in the abstract is
   *  trivia; "best rep per hour toward Prestige 2, and that is 7 runs" is a plan. The runs column
   *  is what makes each row a decision rather than a statistic.
   *  ⚠️ Self-hides at max standing and when nothing on the track carries a run length — there is
   *  no route to show, and a heading over an empty list is worse than no heading. */
  function renderBestRate() {
    const bar = track.bar;
    if (!bar || bar.max || bar.nextMin == null) return;
    const gap = Math.max(0, bar.nextMin - bar.estimate);
    if (gap <= 0) return;
    const list = takeableByRate();
    if (!list.length) return;
    const body = $("body");
    const sec = document.createElement("div");
    sec.className = "sec";
    sec.textContent = "Best rep per hour → " + (bar.nextName || "next rank");
    body.appendChild(sec);
    // 🔴 THE "N RUNS" FIGURE IS THE ONE SUB CALLED BROKEN, and it is the sharpest case of it:
    // exact-looking integer arithmetic on a starting point the app cannot read. Said ONCE here
    // rather than in three row tooltips nobody opens, and the rows themselves now carry "≤".
    const why = document.createElement("div");
    why.className = "est";
    why.style.padding = "0 12px 4px";
    why.textContent = "The game never tells the app your reputation, so these counts start from a floor: "
      + "at most this many runs, and likely fewer.";
    body.appendChild(why);
    // Three. The top row is the answer and the two under it are the evidence that it is the
    // answer — a longer list turns a recommendation back into a table to read.
    for (const m of list.slice(0, 3)) {
      const row = document.createElement("div");
      row.className = "grow" + (m === list[0] ? " best" : "");
      const left = document.createElement("div"); left.className = "gleft";
      const t = document.createElement("div"); t.className = "t";
      t.textContent = (m.completed > 0 ? "✓ " : "") + m.title + (m.items.length ? "  ★" : "");
      const meta = document.createElement("div"); meta.className = "gmeta";
      const bits = ["+" + num(m.rep), fmtMins(m.durMin)];
      if (m.payMax) bits.push((m.payoutEstimated ? "~" : "") + fmtK(m.payMax));
      const runs = Math.ceil(gap / m.rep);
      bits.push("≤" + runs + " runs · ≤" + fmtMins(runs * m.durMin));
      meta.textContent = bits.join(" · ");
      left.append(t, meta);
      const rate = document.createElement("div"); rate.className = "rate";
      rate.textContent = num(Math.round(m.repHr)) + "/hr";
      row.append(left, rate);
      row.title = "Rep per hour from this contract's own award and the game's expected run length."
        + " The aUEC figure is modelled, not read from the game."
        + " The run count is a ceiling — your real standing is at or above the figure it counts from.";
      if (m.key) {
        row.classList.add("linked");
        row.addEventListener("click", () => openSite("/missions/" + encodeURIComponent(m.key)));
      }
      body.appendChild(row);
    }
  }

  /* Only events worth a tab: a finished one is history, not a track to run. */
  function liveEvents() { return events.filter((e) => e.status !== "past"); }

  /**
   * The top-level tab strip.
   *
   * 🔑 EVENTS COME FIRST, AND THE FIRST ONE IS SELECTED. Sub, 2026-08-22, looking at this widget:
   * *"On the event tracker tab, I want to put Siege of Orison first."* Order alone would have been
   * cosmetic — the widget still opened on the giver track, so the event was still a click away —
   * so the default selection moves with it. The giver track is now the LAST tab.
   *
   * 🔑 The ordering WITHIN the events is the sidecar's (`allEventProgress()`: current → upcoming →
   * past, then label), not a hard-coded "Orison first". Siege of Orison is first today because it
   * is the only live event; when a second one starts, a running event outranking an upcoming one
   * is the rule Sub actually wants, and it needs no edit here.
   */
  function renderVNav() {
    const evs = liveEvents();
    const nav = $("vnav");
    // One view = no switcher. A lone "Battaglia" button is chrome that explains nothing.
    if (!evs.length) { nav.style.display = "none"; nav.textContent = ""; return; }
    nav.style.display = "";
    nav.textContent = "";
    const add = (id, label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "vt" + (view === id ? " on" : "");
      b.textContent = label;
      b.addEventListener("click", () => { view = id; viewPinned = true; render(); });
      nav.appendChild(b);
    };
    for (const e of evs) add(e.id, e.label);
    add("giver", (track && track.faction) ? track.faction : "Track");
  }

  function render() {
    // If the selected event disappeared (it ended, or events.json changed under us), fall back
    // rather than rendering nothing — a dangling selection is how a widget goes silently blank.
    if (view !== "giver" && !liveEvents().some((e) => e.id === view)) view = "giver";
    // Open on the live event, not on the giver track. Only until the player picks a tab: after
    // that `viewPinned` holds, and the event does not steal the view back on the next poll.
    // ⚠️ This lives HERE rather than beside the initial `let view`, because the events arrive from
    // /api/events after first paint — a default set at parse time has nothing to choose from.
    if (!viewPinned) { const first = liveEvents()[0]; if (first) view = first.id; }
    renderVNav();
    if (view !== "giver") { renderEvent(events.find((e) => e.id === view)); return; }

    $("standingBox").style.display = "";
    setGiverControls(true);
    if (!track) {
      // 🔴 THIS USED TO BE `$("emptyState") && (…)`, WHICH IS A DEAD GUARD AFTER THE FIRST
      // SUCCESSFUL RENDER. #emptyState exists only in the initial markup and the first
      // renderRewards()/renderMissions() wipes #body, so the element is gone forever after —
      // and the message was then never written. A later 404 (the giver retires in a patch, or
      // the dataset swaps mid-session) left the PREVIOUS giver's full ladder on screen, poll
      // after poll, with the standing bar still showing a number. Reproduced against a live
      // sidecar: 404-before-first-render showed the message correctly; 404-after showed a
      // stale Battaglia ladder and no message at all. Concretely 4.10-shaped: the event's own
      // giver, "Conerstone Developments", has no rep scope and 404s today.
      $("tabs").style.display = "none";
      $("standingBox").style.display = "none";
      $("body").innerHTML = '<div class="empty">This track isn\'t in the loaded dataset.<br>It arrives with the patch dataset.</div>';
      return;
    }
    $("who").textContent = track.faction || "Battaglia";
    $("modeBtn").textContent = mode === "rewards" ? "Missions" : "Rewards";
    $("doneBtn").textContent = showDone ? "Hide done" : "Show done";
    $("doneBtn").classList.toggle("active", showDone);
    $("doneBtn").style.display = mode === "rewards" ? "" : "none";
    if (tab === null) tab = currentRank() >= 0 ? currentRank() : (track.intro.length ? "intro" : 0);
    renderStanding();
    renderTabs();
    if (mode === "missions") { renderMissions(); return; }
    renderRewards();
    // 🔑 APPENDED, not a separate view (Sub, 2026-08-15). The ladder says what you are chasing;
    // this says what to run to get there. One screen, both questions.
    renderBestRate();
  }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  /**
   * The event contribution ladder — WHAT PERCENT PAYS WHAT LOOT. Sub's ruling, 2026-08-19:
   * this is the Event Tracker's job, and the Mission & BP Tracker keeps showing the actual
   * mission report instead of being replaced by this.
   *
   * 🔑 EVERY NUMBER HERE IS HEDGED, because the game does not tell the client its own figure.
   * Event points ride the same server-side ReputationService as reputation, so the percentage is
   * accumulated from completions this widget witnessed and priced from data/events.json. It is a
   * LOWER BOUND, it says so, and it points the player at the Journal for the real number.
   */
  /* The Rewards/Missions and Show-done buttons act on the GIVER track only, so they are hidden
     in an event view rather than left sitting there doing nothing. */
  function setGiverControls(shown) {
    for (const id of ["modeBtn", "doneBtn"]) {
      const row = $(id) && $(id).closest(".ws-row");
      if (row) row.style.display = shown ? "" : "none";
    }
  }

  /** Rough "how long ago", in the largest unit that is still honest. */
  function ago(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 90) return "just now";
    const m = Math.round(s / 60);
    if (m < 90) return m + " minute" + (m === 1 ? "" : "s") + " ago";
    const h = Math.round(m / 60);
    if (h < 48) return h + " hour" + (h === 1 ? "" : "s") + " ago";
    return Math.round(h / 24) + " days ago";
  }

  /**
   * One line, only when the player is genuinely looking at a FALLBACK reward table.
   *
   * 🔑 SILENT WHEN HEALTHY, on purpose. The tiers and rewards are fetched from subliminal.gg so a
   * discovery lands without an app release; a successful (or merely quiet) fetch needs no words,
   * and a banner on every render is the clutter Sub has ruled against elsewhere. It speaks in
   * exactly the two cases the player cannot otherwise distinguish from "there is no reward":
   * the shipped table with no successful fetch behind it, and a downloaded table that has since
   * gone stale because the site is unreachable.
   */
  function feedCaveat(f) {
    // `undefined` means "use whatever the last poll gave us" (the production call); an
    // explicit null means "there is no feed", which is what a suite needs to be able to say.
    f = f === undefined ? feed : f;
    if (!f) return "";
    if (f.source === "bundled") {
      // No error yet means the first check has simply not returned. Saying anything then would
      // be crying wolf on a request that is about to succeed.
      if (!f.lastError) return "";
      return '<span class="evwarn">This reward list is the one the app shipped with</span> — subliminal.gg is unreachable, so a reward confirmed since this build won\'t appear yet.';
    }
    if (f.lastError) {
      return '<span class="evwarn">Reward list may be out of date</span> — downloaded ' +
        (f.fetchedAt ? ago(f.fetchedAt) : "earlier") + ", and subliminal.gg is unreachable right now.";
    }
    return "";
  }

  function renderEvent(ev) {
    if (!ev) return;
    $("tabs").style.display = "none";
    $("standingBox").style.display = "none";
    setGiverControls(false);
    $("who").textContent = ev.label;

    const html = [];
    const known = ev.pct != null;
    // The bar only fills from a figure we can defend. With no total declared there is nothing
    // honest to draw, so the track renders empty rather than implying zero progress.
    html.push('<div class="evbarwrap"><div class="evtrack"><div class="evfill" style="width:' +
      (known ? Math.max(0, Math.min(100, ev.pct)).toFixed(2) : 0) + '%"></div></div>');
    for (const t of ev.tiers) {
      html.push('<div class="evtick' + (t.reached ? " hit" : "") + '" style="left:' + t.pct + '%">' +
        '<div class="stem"></div><div class="lbl">' + t.pct + '%</div></div>');
    }
    html.push("</div>");

    // What we can say about the estimate, in plain words. Ordered worst-caveat-first so a
    // reader who stops after one line has the important one.
    const meta = [];
    if (!known) {
      meta.push("<b>Progress isn't known yet.</b> This event has no point total recorded, so no percentage is shown.");
    } else {
      meta.push("<b>" + ev.pct.toFixed(1) + "%</b> — about " + num(ev.points) + " of " + num(ev.total) +
        ", counted from " + ev.contributions.length + " completion" + (ev.contributions.length === 1 ? "" : "s") + " this tracker saw.");
    }
    if (ev.unpriced > 0) {
      meta.push('<span class="evwarn">' + ev.unpriced + " completion" + (ev.unpriced === 1 ? " is" : "s are") +
        " not counted yet</span> — those contracts' point values haven't been measured, so the figure above is LOW.");
    }
    // 🔴 THE LINE THAT ANSWERS "HOW MANY MISSIONS IS A TIER?" WITH "WE CANNOT SAY."
    // Sub, 2026-08-22: "since we don't know how much rep we're going to get per mission, this rep
    // ladder is pretty broken, right?" He is right, and the honest fix is not a better estimate.
    // Every point value in events.json came from a human reading their in-game Journal before and
    // after ONE contract; interpolating the other nine would invent exactly the precision he is
    // objecting to. So the ladder states its own coverage and stops there — no missions-to-go
    // figure is offered anywhere, deliberately.
    // ⚠️ Distinct from `unpriced` above, which is about completions we WATCHED. This is about the
    // board, and it is non-zero even for a player who has run nothing.
    if (ev.contractsKnown > 0 && ev.contractsPriced < ev.contractsKnown) {
      meta.push('<span class="evwarn">Point values are measured for ' + ev.contractsPriced + " of " +
        ev.contractsKnown + " contracts</span> in this event, so the app can't tell you how many missions a tier is.");
    }
    // 🔴 SAY WHAT IS BEING HELD BACK, or the number drops with no explanation.
    // Sub patched off 4.10 PTU onto 4.10 live and the widget still read 15% — progress earned
    // entirely on the test server, because contributions were bucketed by the event's journal
    // name with no environment dimension. They are scoped now; this is the other half of that
    // fix. A player who tracked an event on the PTU and then patches to live watches the counter
    // fall to zero, and "your points vanished" with nothing on screen is the same silent failure
    // arriving from the opposite direction.
    if (ev.otherEnv > 0) {
      meta.push('<span class="evwarn">' + ev.otherEnv + " completion" + (ev.otherEnv === 1 ? "" : "s") +
        " from a different game environment " + (ev.otherEnv === 1 ? "is" : "are") + " not counted here</span>" +
        " — test-server progress is separate from live, and is kept rather than deleted.");
    }
    meta.push("The game never reports your event points to the app. Check your in-game Journal for the real number.");
    const stale = feedCaveat();
    if (stale) meta.push(stale);
    // The purge. See MissionTracker.resetEventProgress for why it has to exist: the app can never
    // observe a server-side wipe, so after a reset or a season restart this counter goes on
    // showing a number that was true last month and nothing can tell it otherwise.
    // 🔑 Two clicks, never one — it is unrecoverable. Nothing can rebuild a contribution: the
    // startup replay only reaches 12 hours back, and "Verify from logs" cannot see a journal
    // entry at all.
    html.push('<div class="evmeta">' + meta.join("<br>") +
      // 🔴 ITS OWN CLASS, NOT `.evfix`. The widget suite counts `#body .evfix` to assert every
      // tier carries a correction button and then clicks them BY INDEX — so borrowing that class
      // for a button that is not a per-tier control makes the count read 4 instead of 3 and sends
      // the index-clicks to the wrong element. It did exactly that: seven assertions red, none of
      // them about anything this change touches. `tools/widget-dom-test.cjs` is part of these
      // pages' public surface; grep it before reusing a class name.
      '<div class="evreset"><button type="button" class="evrst" id="evResetBtn" ' +
      'title="Forget the progress this app has recorded for this event and start again from zero">' +
      "Reset my progress</button></div></div>");

    // The ladder. This is the part Sub asked for: percent -> loot.
    //
    // 🔴 TWO SOURCES, RENDERED FROM TWO SEPARATE ARRAYS, NEVER CONCATENATED. `t.rewards` is what a
    // real log saw (or the site corroborated); `t.candidates` is `events.json`'s `rewardCandidates`
    // — five names a viewer relayed from a chatbot answer, which nobody has verified. Sub's ruling,
    // 2026-08-22: publish them anyway, because five italic maybes beat six blanks, AND give players
    // a way to tell us we are wrong. Merging the two arrays here is the single edit that would turn
    // the rumour into a fact, and nothing downstream would notice.
    let anyCandidate = false;
    for (const t of ev.tiers) {
      html.push('<div class="evrow' + (t.reached ? " hit" : "") + '"><span class="pc">' + t.pct + "%</span>" +
        (t.points != null ? '<span class="at">' + num(t.points) + "</span>" : "") +
        '<span class="sp"></span>' +
        // The correction path, on every tier — including the ones we have measured, because "we
        // have this one wrong" is exactly the report that is worth the most.
        '<button type="button" class="evfix" data-fixtier="' + t.pct + '" title="Tell us what this tier actually gave you">Wrong?</button>' +
        "</div>");
      const parts = [];
      for (const r of t.rewards) {
        parts.push('<span class="it' + (r.owned ? " owned" : "") + '">' + (r.owned ? "✔ " : "· ") + esc(r.name) + "</span>");
      }
      for (const c of (t.candidates || [])) {
        anyCandidate = true;
        // No ✔ and no owned state, ever: we cannot check a collection against a name nobody has
        // confirmed, and a green tick beside a guess is the exact failure this separation prevents.
        parts.push('<span class="it cand">? ' + esc(c.name) + '<span class="tag">UNCONFIRMED</span></span>');
      }
      if (!parts.length) parts.push('<span class="unk">Reward not known yet</span>');
      html.push('<div class="evloot">' + parts.join("") + "</div>");
    }
    if (anyCandidate) {
      html.push('<div class="evkey"><b>UNCONFIRMED</b> rewards are what we found reported online. ' +
        "Nobody has verified them against a real log, so treat them as a lead, not a promise — " +
        'press <b>Wrong?</b> on any tier to tell us what it really gave you.</div>');
    }
    $("body").innerHTML = html.join("");
  }

  // Delegated, because renderEvent() builds the ladder as a string and replaces #body wholesale —
  // a listener bound to a button would be thrown away by the next 20-second poll.
  $("body").addEventListener("click", (e) => {
    const b = e.target && e.target.closest ? e.target.closest(".evfix, .evrst") : null;
    if (!b) return;
    const ev = events.find((x) => x.id === view);
    if (b.classList.contains("evrst")) { if (ev) resetClick(b, ev); return; }
    const tier = Number(b.getAttribute("data-fixtier"));
    const t = ev && ev.tiers.find((x) => x.pct === tier);
    if (ev && t) rwOpenCorrection(ev, t);
  });

  /**
   * Reset, in two clicks. The first arms the button and states the consequence on its face; the
   * second does it.
   *
   * 🔑 A CONFIRM ON THE BUTTON ITSELF rather than a modal. Everything else that raises a card here
   * lives outside `#body` precisely because the 20-second poll rebuilds `#body` wholesale — but a
   * one-shot confirm does not need to survive that. If the poll lands mid-decision the button
   * simply reverts to its resting state, which is the safe outcome: an armed destructive control
   * quietly disarming is right, and it cannot fire on its own.
   */
  let resetArmed = null;
  function resetClick(btn, ev) {
    if (resetArmed !== ev.id) {
      resetArmed = ev.id;
      btn.textContent = "Really reset? This cannot be undone";
      btn.classList.add("armed");
      // Disarm on its own, so a mis-click does not leave a live destructive control sitting there.
      setTimeout(() => { if (resetArmed === ev.id) { resetArmed = null; try { btn.textContent = "Reset my progress"; btn.classList.remove("armed"); } catch { /* re-rendered */ } } }, 6000);
      return;
    }
    resetArmed = null;
    doReset(ev.id);
  }

  async function doReset(id) {
    try {
      await fetch("/api/events/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ event: id }),
      });
    } catch { /* nothing useful to say; the reload below shows whatever really happened */ }
    load();
  }

  $("modeBtn").addEventListener("click", () => { mode = mode === "rewards" ? "missions" : "rewards"; render(); });
  $("doneBtn").addEventListener("click", () => { showDone = !showDone; render(); });
  $("siteBtn").addEventListener("click", () => openSite("/factions/" + giverSlug(track?.faction || "Recco Battaglia")));
  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  load();
  setInterval(load, POLL_MS);
  try { host()?.ready?.(); } catch { /* not embedded */ }
  // Per-widget settings, opened by the bar's cog. Controls that used to crowd the header live
  // here; the parent injects its Text size row into this same sheet.
  // Diagnostic hook so the widget suite can drive the events-feed caveat with a KNOWN feed
  // state. The page's own `feed` is filled from /api/events and is whatever the live sidecar
  // happens to be doing, which is not something an assertion can pin.

  // ── "You just crossed a tier — is this what you got?" ────────────────────────────────────
  //
  // The sidecar decides WHETHER to ask (src/event-rewards.ts); this only asks. Three states,
  // and they are genuinely different questions rather than one question with a blank:
  //
  //   observed             -> one click. "It looks like you received X. Is that right?"
  //   candidate, no sight  -> still one click, but the name is an UNCONFIRMED guess and the
  //                           card says so in words. Confirming it is what promotes it.
  //   neither              -> open question. Nothing to agree with, so no Yes button at all —
  //                           a Yes here would be agreeing with nothing.
  //
  // 🔴 A CANDIDATE MUST NEVER READ AS A FACT. It comes from a viewer relaying a chatbot answer.
  // Inside this question is the only place it may appear, because the question is what turns it
  // into a measurement.
  let rwPrompt = null;      // the prompt the sidecar says is due
  let rwReporting = false;  // is crowdsourced reporting switched on for this player
  let rwTyping = false;     // do we currently hold the canvas-wide keyboard grab
  let rwTick = null;

  // ⚠️ The free-text field takes the canvas-wide keyboard grab, which makes the WHOLE overlay
  // swallow clicks and keys on every monitor until it is released. So: one deliberate act takes
  // it, and every exit path gives it back — answering, dismissing, the card expiring, and the
  // widget being hidden (which unloads the iframe, stranding the grab with no UI left to lower
  // it). See __battExitTyping and the registry's onHide.
  function rwSetTyping(on) {
    const want = !!on;
    if (want === rwTyping) return;
    rwTyping = want;
    try {
      if (want) { if (host()) host().editStart(); else rwFocusInput(); }
      else if (host()) host().editEnd();
    } catch { /* standalone, no host bridge */ }
    if (!want) { const a = document.activeElement; if (a && a.blur) a.blur(); }
  }
  function rwFocusInput() {
    const el = document.getElementById("rwtext");
    if (el) { try { el.focus({ preventScroll: true }); } catch { el.focus(); } }
  }

  /**
   * "Wrong?" on a ladder row — the same question card, raised by the player instead of by a tier
   * crossing.
   *
   * 🔑 IT REUSES THE CARD RATHER THAN GROWING A SECOND SURFACE, and that is not only tidiness: the
   * card already lives OUTSIDE #body, so it survives the 20-second poll that rebuilds the ladder,
   * and it already owns the canvas-wide keyboard grab and every release path for the text field.
   * An inline row inside #body would have been destroyed mid-typing by the next refresh, with the
   * grab stranded and no UI left to lower it.
   *
   * 🔑 It asks about whatever we are currently SHOWING for that tier — a measured reward if we
   * have one, otherwise the unconfirmed candidate, otherwise nothing — because the thing the
   * player is disagreeing with is what is on their screen.
   */
  function rwOpenCorrection(ev, t) {
    const known = (t.rewards && t.rewards[0]) ? t.rewards[0].name : null;
    const cand = (t.candidates && t.candidates[0]) ? t.candidates[0].name : null;
    rwRender({
      local: true,
      id: "local:" + ev.id + ":" + t.pct,
      eventId: ev.id,
      eventLabel: ev.label,
      tier: t.pct,
      // `observed` stays null and means what it always means: the log witnessed nothing. Nothing
      // was witnessed here — the player opened this themselves — and the sidecar sends that
      // distinction to the site untouched, so a self-reported name is never weighted as a sighting.
      observed: null,
      known: known,
      candidate: cand,
    });
  }
  window.__battFocus = () => { if (rwTyping) rwFocusInput(); };
  window.__battExitTyping = () => rwSetTyping(false);

  /** Seconds left before the card retires itself. Derived from the crossing time rather than a
   *  timer started on render, so a poll that arrives late shows the REAL time remaining. */
  function rwSecondsLeft(p) {
    const ends = p.crossedAtMs + RW_WINDOW_MS + RW_DWELL_MS;
    return Math.max(0, Math.round((ends - Date.now()) / 1000));
  }

  function rwHide() {
    rwSetTyping(false);
    rwPrompt = null;
    const c = document.getElementById("rwcard");
    if (c) c.hidden = true;
    if (rwTick) { clearInterval(rwTick); rwTick = null; }
  }

  async function rwAnswer(source, name) {
    const p = rwPrompt;
    if (!p) return;
    rwHide();
    try {
      await fetch("/api/events/reward", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Two shapes, one route (see /api/events/reward). A crossing card answers by prompt id;
        // a ladder correction has no prompt behind it, so it names the event and tier instead.
        body: JSON.stringify(p.local
          ? { event: p.eventId, tier: p.tier, source: source, name: name || null }
          : { id: p.id, source: source, name: name || null }),
      });
    } catch { /* the sidecar keeps the answer queued; nothing useful to say here */ }
    load();
  }

  function rwRender(p) {
    if (!p) { rwHide(); return; }
    // A new prompt replaces an old one outright rather than queueing: two questions stacked over
    // a game is a modal by accident.
    if (rwPrompt && rwPrompt.id !== p.id) rwSetTyping(false);
    rwPrompt = p;
    $("rwcard").hidden = false;

    const q = $("rwq");
    q.textContent = "";
    const lead = document.createElement("span");
    lead.appendChild(document.createTextNode(p.local ? "The " : "You just passed "));
    const pct = document.createElement("b");
    pct.textContent = p.tier + "%";
    lead.appendChild(pct);
    lead.appendChild(document.createTextNode((p.local ? " reward for " : " of ") + p.eventLabel + "."));
    q.appendChild(lead);

    // A locally-raised correction asks about whatever the ladder is SHOWING for that tier, which
    // may be a measured reward — the crossing card never has one, because a tier whose reward is
    // already measured is never asked about (shouldAsk in src/event-rewards.ts).
    const guess = p.observed || (p.local ? (p.known || p.candidate) : p.candidate) || null;
    const src = document.createElement("span");
    src.className = "rwsrc";
    if (guess) {
      const nm = document.createElement("span");
      nm.className = "rwname";
      nm.textContent = guess;
      q.appendChild(nm);
      // The distinction that matters, said plainly. One of these is a sighting, one is a rumour,
      // and one is what we already publish as fact — a player answering deserves to know which
      // they are being asked about.
      src.textContent = p.observed
        ? "The app saw this arrive a moment after you crossed. Is it the tier reward?"
        : (p.local && p.known)
          ? "This is what we list for this tier. Is it right?"
          : "This is an UNCONFIRMED guess — nobody has verified it. Did you get it?";
    } else {
      src.style.marginTop = "5px";
      src.textContent = p.local
        ? "Nobody has reported this tier's reward. What did it give you?"
        : "The app did not see what you received. What did this tier give you?";
    }
    q.appendChild(src);

    const row = $("rwrow");
    row.textContent = "";
    const btn = (label, cls, fn) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "rwbtn" + (cls ? " " + cls : "");
      b.textContent = label;
      b.addEventListener("click", fn);
      row.appendChild(b);
      return b;
    };
    const textEntry = (source) => {
      row.textContent = "";
      const input = document.createElement("input");
      input.id = "rwtext";
      input.className = "rwtext";
      input.type = "text";
      input.placeholder = "Name of what you received";
      input.maxLength = 120;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") rwAnswer(source, input.value); });
      row.appendChild(input);
      btn("Send", "yes", () => rwAnswer(source, input.value));
      // 🔑 "I got nothing" is a real ANSWER, not a dismissal. A tier that grants no blueprint is
      // a thing that can be true, and no amount of waiting for a positive report establishes it.
      btn("I got nothing", "", () => rwAnswer("none", null));
      rwSetTyping(true);
      setTimeout(rwFocusInput, 0);
    };

    if (guess) {
      // 🔑 "Yes" means the same thing to the player either way, but NOT to the data: agreeing
      // with a sighting had two independent witnesses, agreeing with a guess had one. The
      // sidecar records which, and the site weights them differently.
      btn("Yes", "yes", () => rwAnswer(p.observed ? "confirmed" : "corrected", guess));
      btn("No — it was…", "", () => textEntry("corrected"));
    } else {
      // Typing is the only route here, so the box is up front rather than behind a click that
      // would just say "yes, I really do want to type in this text box".
      textEntry("typed");
    }

    rwFoot();
    if (rwTick) clearInterval(rwTick);
    // 🔑 NO CLOCK ON A CARD THE PLAYER OPENED. The two-minute dwell exists because a crossing card
    // arrives unbidden mid-game and must retire itself; this one was asked for, so taking it away
    // on a timer would be losing the player's own work. It closes on an answer or on ✕.
    // (`crossedAtMs` is also absent here, so the countdown would read NaN:NaN.)
    // ⚠️ THE GUARD THE SUITE ACTUALLY TESTS IS THE ONE IN `rwFoot()` — that is what draws the
    // clock. This early return is belt-and-braces (it stops a pointless 1 Hz timer on a card with
    // no deadline) and removing it is a control that comes back GREEN, verified 2026-08-22. Do not
    // read that green as coverage of this line.
    if (p.local) return;
    rwTick = setInterval(() => {
      if (!rwPrompt) return;
      if (rwSecondsLeft(rwPrompt) <= 0) { rwHide(); return; }
      rwFoot();
    }, 1000);
  }

  function rwFoot() {
    if (!rwPrompt) return;
    const foot = $("rwfoot");
    foot.textContent = "";
    // Say what the answer is FOR and what happens to it. Reporting is opt-in and rides the same
    // switch as every other crowdsourced signal, so a player with sync off must not be told
    // their answer is helping everyone — it is only filling in their own ladder.
    foot.appendChild(document.createTextNode(rwReporting
      ? "Your answer helps fill in this event's reward list for everyone. One report is a claim, not a fact — it needs a second player to agree before it ships. "
      : "Connect the tracker in Settings to share this with other players. For now it only fills in your own ladder. "));
    if (rwPrompt.local) return;
    const s = rwSecondsLeft(rwPrompt);
    const mm = Math.floor(s / 60);
    const ss = String(s % 60).padStart(2, "0");
    const clock = document.createElement("span");
    clock.className = "rwclock";
    clock.textContent = mm + ":" + ss;
    foot.appendChild(clock);
  }

  $("rwx").addEventListener("click", () => rwHide());

  window.__eventFeedCaveat = (f) => feedCaveat(f);
  // ...and a way to force a poll, so a suite can stub fetch and see the result THIS tick
  // rather than waiting out POLL_MS.
  window.__battReload = () => load();
  window.__widgetSettings = () => $("wsettings").classList.add("open");
  window.__widgetSettingsRoot = () => $("wsettings");
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#wsettings")) $("wsettings").classList.remove("open");
  });
</script>
</body>
</html>
