<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event Tracker</title>
  <div id="wsettings" class="wsettings">
    <div class="ws-sec">View</div>
    <div class="ws-row">
      <button id="modeBtn" class="hbtn" type="button" title="Switch between the reward ladder and the mission list">Missions</button>
    </div>
    <div class="ws-row">
      <button id="doneBtn" class="hbtn" type="button" title="Show tiers you have already finished">Show done</button>
    </div>
    <div class="ws-sec">Elsewhere</div>
    <div class="ws-row">
      <button id="siteBtn" class="hbtn" type="button" title="Open this giver's full track on subliminal.gg">Track on the web ↗</button>
    </div>
  </div>

<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t);
    /* ?bg=RRGGBB paints an opaque backdrop, for embedding in a THIRD-PARTY host (GameGlass
       and friends). Hex digits only, and applied through CSSOM — a value that is not a colour
       is rejected by the engine rather than landing anywhere it could be read as markup. */
    const b = q.get("bg"); if (b && /^[0-9a-f]{3,8}$/i.test(b)) { r.style.setProperty("--wbg", "#" + b); r.dataset.bg = ""; } }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Grind tracker for a mission giver's reputation track — built for Recco Battaglia, whose
     standing gates three SHIPS (Golem @ Prestige 1, Prospector @ Prestige 2, MOLE @ Prestige 3).
     Data comes from /api/grind-track (dataset ranks + rep scope ladder + your witnessed rep).
     Theme tokens come from the shared /widget-theme.css. */
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 360px; height: 470px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    /* Fill, border tint, shadow and blur live in widget-theme.css (#panel.wpanel), which
       multiplies each one's alpha by --wsurf so the panel fades independently of its text. */
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  /* Scanlines / Esperia mesh / Origin stitching come from the shared widget-theme.css
     via .wpanel, so every widget carries the theme's surface treatment. */
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  .head { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; min-height: 40px; }
  .dia { width: 7px; height: 7px; flex: none; background: var(--cyan-bright); transform: rotate(45deg);
    box-shadow: 0 0 8px var(--cyan); }
  .hbtn { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 7px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.active { background: rgba(var(--accent-rgb), 0.28); border-color: var(--cyan); }

  /* Standing + progress to the next rank. */
  .standing { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .standing .k { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .standing .now { font-size: 16px; font-weight: 700; color: var(--gold); margin-top: 1px; }
  /* The track has to be VISIBLE or there's no way to judge how far 100% is - it read as a
     floating coloured stub before. Inset border + a lighter trough gives it an end. */
  .rb { position: relative; height: 14px; border-radius: 7px; margin-top: 7px;
    background: rgba(0, 0, 0, 0.34); border: 1px solid var(--divider);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45); overflow: hidden; }
  .rb-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold));
    border-radius: 6px 0 0 6px; transition: width 0.4s ease; }
  .rb-pct { position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--cyan-text);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85); letter-spacing: 0.04em; }
  .standing .sub { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px;
    font-family: var(--mono); font-size: 10px; color: var(--cyan-dim); }
  .standing .sub .to { color: var(--cyan-bright); }
  .standing .est { font-size: 10px; color: var(--faint); margin-top: 5px; line-height: 1.5; }

  #body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 4; }
  .sec { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); padding: 9px 12px 5px; }

  /* Ship / guaranteed-item ladder — the reason to chase a rank. */
  .ship { display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.08); }
  .ship .tier { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    border: 1px solid var(--divider); color: var(--faint); background: rgba(0, 0, 0, 0.2); }
  .ship.have .tier { border-color: var(--green); color: var(--green); background: rgba(46, 230, 160, 0.12); }
  .ship.open .tier { border-color: var(--gold); color: var(--gold); background: rgba(var(--value-rgb), 0.10); }
  details.done .ship { opacity: 0.75; }
  .ship .who { flex: 1; min-width: 0; }
  .ship .nm { font-size: 12.5px; font-weight: 600; color: var(--cyan-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ship.have .nm, .ship.open .nm { color: var(--cyan-bright); }
  .ship .at { font-size: 10px; color: var(--faint); margin-top: 1px; }
  .ship .st { flex: none; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); }
  .ship.have .st { color: var(--green); }
  .ship.open .st { color: var(--gold); }

  /* Mission rows for the selected rank. */
  .mrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.06); }
  .mrow .t { flex: 1; min-width: 0; font-size: 12px; color: var(--cyan-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .bp { flex: none; font-size: 9.5px; color: var(--cyan-dim); }
  .mrow .rp { flex: none; font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--gold); }
  .mrow.best { background: rgba(var(--accent-rgb), 0.07); }
  .mrow.linked { cursor: pointer; }
  .mrow.linked:hover { background: rgba(var(--accent-rgb), 0.14); }
  .mrow.linked:hover .t { color: var(--cyan-bright); }

  /* Rank picker */
  /* ── TEMPORARY: mockup scaffolding (goes with the switcher) ─────────────────────────── */
  .mockbar { display: flex; align-items: center; gap: 4px; padding: 4px 10px 0; opacity: 0.55; }
  .mk-l { font-size: 8px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--faint); margin-right: 2px; }
  .mk-b { font-family: var(--mono); font-size: 9px; line-height: 1; padding: 2px 5px;
    color: var(--cyan-dim); background: transparent; border: 1px solid var(--border);
    border-radius: 3px; cursor: pointer; }
  .mk-b.on { color: var(--bg, #05121a); background: var(--cyan); border-color: var(--cyan); }

  /* 1 — the costed route under a locked rank. Caption weight: it qualifies the row above it. */
  .route { font-size: 10px; color: var(--cyan-dim); padding: 0 10px 6px 44px; margin-top: -4px; }

  /* 2 — the rep-per-hour table. The rate holds the right column so the ranking is scannable. */
  .grow { display: flex; align-items: center; gap: 8px; padding: 5px 10px; }
  .grow.linked { cursor: pointer; }
  .grow.linked:hover { background: rgba(var(--accent-rgb), 0.08); }
  .grow.best { background: rgba(var(--accent-rgb), 0.1); }
  .gleft { flex: 1 1 auto; min-width: 0; }
  .grow .t { font-size: 11.5px; color: var(--cyan-text); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .grow.best .t { color: var(--cyan-bright); }
  .gmeta { font-size: 9.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .rate { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--gold); }

  /* 3 — the next ship, given the room to be the point of the widget. */
  .hero { padding: 8px 10px 10px; border-bottom: 1px solid var(--border); }
  .hero-n { font-size: 15px; color: var(--gold); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .hero-s { font-size: 10px; color: var(--faint); margin-top: 2px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .hero-m { font-size: 10px; color: var(--cyan-dim); margin-top: 5px; }
  .hero-c { font-size: 12px; color: var(--cyan-bright); margin-top: 6px; }
  .hero-c.go { color: var(--gold); font-weight: 700; }
  .after { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px; font-size: 11px; }
  .an { flex: 1 1 auto; min-width: 0; color: var(--cyan-text); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .aw { flex: none; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .tabs { flex: none; display: flex; gap: 4px; flex-wrap: wrap; padding: 7px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .tab { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--cyan-dim);
    background: rgba(var(--accent-rgb), 0.08); border: 1px solid var(--divider); border-radius: 5px;
    padding: 3px 7px; cursor: pointer; }
  .tab:hover { border-color: var(--cyan); color: var(--cyan-bright); }
  .tab.on { background: rgba(var(--accent-rgb), 0.26); border-color: var(--cyan); color: var(--cyan-bright); }
  .tab.locked { opacity: 0.5; }

  .empty { padding: 26px 16px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; }
  /* Completed rewards collapse into a disclosure rather than vanishing, so you can still
     check what you've already earned. */
  details.done > summary { list-style: none; cursor: pointer; padding: 9px 12px 5px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); }
  details.done > summary::-webkit-details-marker { display: none; }
  details.done > summary:hover { color: var(--cyan-dim); }
  details.done > summary::before { content: "\25b8 "; display: inline-block; transition: transform 0.15s; }
  details.done[open] > summary::before { transform: rotate(90deg); }
</style>
</head>
<body>
  <div id="panel" class="wpanel">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title" id="who">Battaglia</span>
    </div>

    <div class="standing">
      <div class="k">Standing</div>
      <div class="now" id="stNow">—</div>
      <div class="rb"><div class="rb-fill" id="stFill" style="width:0%"></div><div class="rb-pct" id="stPct"></div></div>
      <div class="sub"><span id="stCur"></span><span class="to" id="stNext"></span></div>
      <div class="est" id="stEst"></div>
    </div>

    <div class="mockbar" id="mockbar"></div>
    <div class="tabs" id="tabs" style="display:none"></div>
    <div id="body"><div class="empty" id="emptyState">Loading Battaglia track…</div></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__battagliaHost : null;

  /* Hand off to the companion site. Embedded, the shell opens the real browser (https only);
     standalone in a browser tab, a normal new tab does the job. */
  const SITE = "https://subliminal.gg";
  function openSite(path) {
    const url = SITE + path;
    if (host()) host().openUrl(url);
    else window.open(url, "_blank", "noopener");
  }
  /* Giver -> the site's /factions slug: lowercase, non-alphanumerics collapse to a dash. */
  const giverSlug = (name) => String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

  const POLL_MS = 20_000;
  const GIVER = new URLSearchParams(location.search).get("giver") || "";

  let track = null;
  let mode = "rewards";   // "rewards" = the ship/item ladder, "missions" = per-rank mission list
  let tab = null;         // selected rank in mission mode
  let showDone = false;   // hide tiers already cleared, so the widget shows what is NEXT

  const num = (n) => Number(n || 0).toLocaleString();

  async function load() {
    try {
      const r = await fetch("/api/grind-track" + (GIVER ? "?giver=" + encodeURIComponent(GIVER) : ""), { cache: "no-store" });
      if (!r.ok) { track = null; render(); return; }
      track = await r.json();
    } catch { /* keep the last good track */ }
    render();
  }

  /** The rank you have actually reached. Prefer `reachedRank` — the highest tier the giver has
   *  been OBSERVED offering a mission at, which is a fact from the log. The rep ladder is only a
   *  fallback: that estimate is witnessed-only, so it reads LOW and would under-report the tier. */
  function currentRank() {
    let cur = typeof track?.reachedRank === "number" ? track.reachedRank : -1;
    if (track?.bar) for (const r of track.ranks) if (track.bar.estimate >= r.minRep) cur = Math.max(cur, r.rank);
    return cur;
  }

  function renderStanding() {
    const b = track?.bar;
    if (!b) {
      $("stNow").textContent = "—";
      $("stFill").style.width = "0%";
      $("stPct").textContent = "";
      $("stCur").textContent = ""; $("stNext").textContent = "";
      $("stEst").textContent = track ? "No completions witnessed yet — run Verify from logs." : "";
      return;
    }
    $("stNow").textContent = b.standing;
    const span = (b.nextMin ?? b.curMin) - b.curMin;
    const pct = b.max || span <= 0 ? 100 : Math.max(0, Math.min(100, ((b.estimate - b.curMin) / span) * 100));
    $("stFill").style.width = pct.toFixed(1) + "%";
    $("stPct").textContent = b.max ? "MAX" : pct.toFixed(0) + "%";
    $("stCur").textContent = num(b.estimate) + " rep";
    $("stNext").textContent = b.max ? "max standing" : num((b.nextMin ?? 0) - b.estimate) + " to " + b.nextName;
    $("stEst").textContent = "Estimated from missions this tracker has seen you complete — a lower bound.";
  }

  /** A collapsed <details> holding rewards already received — visible, just out of the way. */
  function appendDoneSection(title, items, gated) {
    if (!items.length) return;
    const d = document.createElement("details");
    d.className = "done";
    const sum = document.createElement("summary");
    sum.textContent = title + " (" + items.length + ")";
    d.appendChild(sum);
    for (const r of items) {
      const rank = gated ? track.ranks.find((x) => x.rank === r.rank) : null;
      const row = document.createElement("div");
      row.className = "ship have";
      const tier = document.createElement("div"); tier.className = "tier";
      tier.textContent = gated ? "R" + r.rank : "✓";
      const who = document.createElement("div"); who.className = "who";
      const nm = document.createElement("div"); nm.className = "nm";
      nm.textContent = r.name + (r.amount > 1 ? " ×" + r.amount : "");
      const at = document.createElement("div"); at.className = "at";
      at.textContent = (rank ? rank.name + " · " : "") + r.mission;
      who.append(nm, at);
      const st = document.createElement("div"); st.className = "st"; st.textContent = "received";
      row.append(tier, who, st);
      d.appendChild(row);
    }
    $("body").appendChild(d);
  }

  function renderRewards() {
    const body = $("body");
    body.textContent = "";
    const cur = currentRank();
    // Rank-gated first (the ships), then the ungated intro gear.
    const gated = track.rewards.filter((r) => r.rank != null);
    const free = track.rewards.filter((r) => r.rank == null);
    const section = (label) => { const d = document.createElement("div"); d.className = "sec"; d.textContent = label; body.appendChild(d); };

    // Three DISTINCT states. Reaching a tier only gets the mission OFFERED; you do not have the
    // reward until the mission is COMPLETED. (Proven from the log: the rank-3 Golem mission was
    // accepted and then abandoned, so the tier was reached but no ship was ever received.)
    const state = (r) => r.received ? "have" : (cur >= r.rank ? "open" : "locked");
    const shown = showDone ? gated : gated.filter((r) => state(r) !== "have");
    const hidden = gated.length - shown.length;
    if (shown.length) {
      section("Rank-gated rewards");
      for (const r of shown) {
        const rank = track.ranks.find((x) => x.rank === r.rank);
        const st8 = state(r);
        const row = document.createElement("div");
        row.className = "ship " + st8;
        const tier = document.createElement("div"); tier.className = "tier"; tier.textContent = "R" + r.rank;
        const who = document.createElement("div"); who.className = "who";
        const nm = document.createElement("div"); nm.className = "nm";
        nm.textContent = r.name + (r.amount > 1 ? " ×" + r.amount : "");
        const at = document.createElement("div"); at.className = "at";
        at.textContent = (rank ? rank.name + " · " + num(rank.minRep) + " rep" : "rank " + r.rank) + " · " + r.mission;
        who.append(nm, at);
        const st = document.createElement("div"); st.className = "st";
        st.textContent = st8 === "have" ? (r.unsure ? "probably" : "received")
          : st8 === "open" ? "do the job"
          : (track.bar ? num(Math.max(0, (rank?.minRep ?? 0) - track.bar.estimate)) + " to go" : "locked");
        st.title = st8 === "have"
          ? (r.unsure
              ? "A mission with this exact title was completed, but another mission shares that title, so this one can't be confirmed."
              : "Mission completed - the reward was granted.")
          : st8 === "open" ? "Tier reached, so she offers this mission. Complete it to get the reward."
          : "Rank not reached yet.";
        row.append(tier, who, st);
        body.appendChild(row);
        // TEMPORARY (mockup 1): what closing this gap actually costs, in runs, time and aUEC.
        if (battMock() === "route" && st8 === "locked" && rank) {
          const rl = routeLineFor(rank.minRep);
          if (rl) body.appendChild(rl);
        }
      }
    }
    // Sub's ask: don't just hide what's done — tuck it into a closed "Completed" section so it's
    // still checkable. `showDone` (the header toggle) forces everything back into the main list.
    if (!showDone && hidden) {
      appendDoneSection("Completed rewards", gated.filter((r) => state(r) === "have"), true);
    }
    // These missions carry NO rank in the dataset — which means the field is absent, NOT that the
    // mission is ungated. 992 of 2763 missions are like this, and givers use rank 0 and null side
    // by side, so "no rank listed" is the only claim the data supports. Don't call them "intro" or
    // imply they're the start of the track. Their only honest state is: done yet or not?
    const freeShown = showDone ? free : free.filter((r) => !r.received);
    const freeHidden = free.length - freeShown.length;
    if (freeShown.length) {
      section("Guaranteed · rank not listed");
      for (const r of freeShown) {
        const row = document.createElement("div");
        row.className = "ship " + (r.received ? "have" : "open");
        const tier = document.createElement("div"); tier.className = "tier";
        tier.textContent = r.received ? "✓" : "—";
        const who = document.createElement("div"); who.className = "who";
        const nm = document.createElement("div"); nm.className = "nm";
        nm.textContent = r.name + (r.amount > 1 ? " ×" + r.amount : "");
        const at = document.createElement("div"); at.className = "at"; at.textContent = r.mission;
        who.append(nm, at);
        const st = document.createElement("div"); st.className = "st";
        st.textContent = r.received ? (r.unsure ? "probably" : "received") : "do the job";
        if (r.unsure) st.title = "Another mission shares this title, so this can't be confirmed.";
        row.append(tier, who, st);
        body.appendChild(row);
      }
    }
    if (!showDone && freeHidden) {
      appendDoneSection("Completed · rank not listed", free.filter((r) => r.received), false);
    }
    if (!shown.length && !freeShown.length && (hidden || freeHidden)) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "Everything on this track is received.";
      body.appendChild(d);
    } else if (!gated.length && !free.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "No guaranteed rewards on this track.";
      body.appendChild(d);
    }
  }

  function renderMissions() {
    const body = $("body");
    body.textContent = "";
    const list = tab === "intro"
      ? track.intro
      : (track.ranks.find((r) => r.rank === tab)?.missions ?? []);
    if (!list.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = tab === "intro" ? "No unranked missions on this track." : "No missions at this rank.";
      body.appendChild(d);
      return;
    }
    const bestRep = Math.max(...list.map((m) => m.rep));
    for (const m of list) {
      const row = document.createElement("div");
      row.className = "mrow" + (m.rep === bestRep && bestRep > 0 ? " best" : "");
      const t = document.createElement("div"); t.className = "t";
      t.textContent = (m.completed > 0 ? "✓ " : "") + m.title + (m.items.length ? "  ★" : "");
      if (m.completed > 0) t.title = "Completed " + m.completed + "x";
      const bp = document.createElement("div"); bp.className = "bp";
      bp.textContent = m.poolCount ? m.poolCount + " bp" : "";
      const rp = document.createElement("div"); rp.className = "rp";
      rp.textContent = m.rep ? "+" + num(m.rep) : "";
      row.append(t, bp, rp);
      // The full mission breakdown (pools, payout, rep, rewards) lives on the site — the widget
      // only has room for a summary, so clicking a row hands off to the page that has the detail.
      if (m.key) {
        row.classList.add("linked");
        row.title = "Open this mission on subliminal.gg";
        row.addEventListener("click", () => openSite("/missions/" + encodeURIComponent(m.key)));
      }
      body.appendChild(row);
    }
  }

  function renderTabs() {
    const el = $("tabs");
    el.textContent = "";
    if (mode !== "missions") { el.style.display = "none"; return; }
    el.style.display = "flex";
    const cur = currentRank();
    const mk = (label, key, locked) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (tab === key ? " on" : "") + (locked ? " locked" : "");
      b.textContent = label;
      b.addEventListener("click", () => { tab = key; render(); });
      el.appendChild(b);
    };
    if (track.intro.length) mk("Unranked", "intro", false);
    for (const r of track.ranks) {
      if (!r.missions.length) continue;
      mk("R" + r.rank, r.rank, cur >= 0 && r.rank > cur);
    }
  }

  // ── TEMPORARY: three Event Tracker mockups, switchable live ───────────────────────────────
  // ⚠️ SCAFFOLDING. Sub asked (2026-08-15) for three ways the widget could use the data that has
  // landed since it was built — per-contract payout, run length and difficulty. Once he picks one
  // the switcher and the two losers come out; nothing else should build on `mock`.
  //
  // 🔑 WHAT THE NEW DATA ACTUALLY BUYS. Measured over Recco Battaglia's 33 contracts: 33 carry a
  // payout, 32 a run length, 32 a difficulty. The useful part is not any single number, it is that
  // REP PER HOUR VARIES FOUR-FOLD across her own board — 4,800/hr on "Extra Special Job" against
  // 1,200/hr on most rank 0-2 work. The widget could show you where you stood but never which
  // mission to run, and that is the question a grind tracker exists to answer.
  //
  // 🔴 EVERY aUEC FIGURE HERE IS MODELLED, not read from the game (payoutEstimated is true for all
  // 33), so it carries a tilde exactly as the mission panel's does. Never print one bare.
  const BATT_MOCKS = [
    { id: "route",  n: "1", t: "Route — the ladder you have, plus what each locked rank costs from here" },
    { id: "grind",  n: "2", t: "Best grind — every mission you can take, ranked by rep per hour" },
    { id: "ship",   n: "3", t: "Next ship — the one you are actually grinding for, given the room" },
  ];
  const BATT_MOCK_KEY = "scBattMock";
  function battMock() {
    try {
      const s = localStorage.getItem(BATT_MOCK_KEY);
      if (BATT_MOCKS.some((m) => m.id === s)) return s;
    } catch { /* private mode */ }
    return "route";
  }
  function renderMockSwitcher() {
    const el = $("mockbar");
    if (!el) return;
    const cur = battMock();
    el.textContent = "";
    const lab = document.createElement("span");
    lab.className = "mk-l"; lab.textContent = "mockup";
    el.appendChild(lab);
    for (const m of BATT_MOCKS) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mk-b" + (m.id === cur ? " on" : "");
      b.textContent = m.n; b.title = m.t;
      b.addEventListener("click", () => {
        try { localStorage.setItem(BATT_MOCK_KEY, m.id); } catch { /* session only */ }
        render();
      });
      el.appendChild(b);
    }
  }

  /** Minutes → "10m" / "1h 10m". */
  function fmtMins(min) {
    const m = Math.max(1, Math.round(min));
    if (m < 60) return m + "m";
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + "h " + String(r).padStart(2, "0") + "m" : h + "h";
  }
  /** Compact aUEC. */
  function fmtK(v) {
    const n = Number(v) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "m";
    if (n >= 10000) return Math.round(n / 1000) + "k";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(Math.round(n));
  }
  /** Every mission on the track, flattened, with its rank carried along. */
  function allTrackMissions() {
    const out = [];
    for (const m of track.intro || []) out.push({ ...m, atRank: null });
    for (const r of track.ranks || []) for (const m of r.missions) out.push({ ...m, atRank: r.rank });
    // ⚠️ DEDUPE BY CONTRACT KEY. A mission with no rank listed appears in `intro` AND under the
    // rank buckets, so a flat list shows it twice — "Ship In Distress" and "Minor Mining Job" both
    // rendered twice in the first pass. Keep the RANKED copy where both exist: it is the one whose
    // gate decides whether she will actually offer it to you.
    const byKey = new Map();
    for (const m of out) {
      const k = m.key || m.title;
      const had = byKey.get(k);
      if (!had || (had.atRank == null && m.atRank != null)) byKey.set(k, m);
    }
    return [...byKey.values()];
  }
  /** Missions you can actually be offered right now, scored by rep per hour.
   *  🔑 GATED BY YOUR STANDING, because a route through a mission she will not offer you is not a
   *  route. `currentRank()` is the same reached-rank the reward ladder already trusts. */
  function takeableByRate() {
    const cur = currentRank();
    return allTrackMissions()
      .filter((m) => m.rep > 0 && m.durMin && (m.atRank == null || cur < 0 || m.atRank <= cur))
      .map((m) => ({ ...m, repHr: (m.rep / m.durMin) * 60, auecHr: m.payMax ? (m.payMax / m.durMin) * 60 : null }))
      .sort((a, b) => b.repHr - a.repHr);
  }
  /** What it costs to get from where you are to `minRep`, running the best mission available.
   *  Returns null when there is no scoreable mission or nothing left to earn. */
  function routeTo(minRep) {
    const bar = track.bar;
    if (!bar || minRep == null) return null;
    const gap = Math.max(0, minRep - bar.estimate);
    if (gap <= 0) return null;
    const best = takeableByRate()[0];
    if (!best) return { gap, best: null };
    const runs = Math.ceil(gap / best.rep);
    return {
      gap, best, runs,
      mins: runs * best.durMin,
      auec: best.payMax ? runs * best.payMax : null,
      estimated: best.payoutEstimated !== false,
    };
  }

  // ── MOCKUP 1 · "Route" ────────────────────────────────────────────────────────────────────
  // The ladder that already works, with one line added under each rank you have not reached: what
  // closing that gap costs in RUNS, TIME and aUEC. The conservative option — it changes nothing
  // that is already earning its place and answers "how far is that really" in situ.
  function routeLineFor(minRep) {
    const r = routeTo(minRep);
    if (!r) return null;
    const d = document.createElement("div");
    d.className = "route";
    if (!r.best) {
      d.textContent = num(r.gap) + " rep to go";
      return d;
    }
    const bits = [r.runs + " × " + r.best.title, "~" + fmtMins(r.mins)];
    if (r.auec != null) bits.push((r.estimated ? "~" : "") + fmtK(r.auec) + " aUEC");
    d.textContent = bits.join(" · ");
    d.title = "Running the best mission she currently offers you ("
      + Math.round(r.best.repHr) + " rep/hr). Run lengths are the game's own estimate;"
      + " the aUEC figure is modelled, not read from the game.";
    return d;
  }

  // ── MOCKUP 2 · "Best grind" ───────────────────────────────────────────────────────────────
  // 🔑 The whole board at once, ranked by rep per hour, instead of per-rank tabs you have to page
  // through. This is the layout the four-fold spread argues for: the top row IS the answer, and
  // the rows below it are the evidence that it is the answer.
  function renderGrind() {
    const body = $("body");
    body.textContent = "";
    const list = takeableByRate();
    if (!list.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "No mission on this track carries a run length yet.";
      body.appendChild(d); return;
    }
    const bar = track.bar;
    const gap = bar && !bar.max && bar.nextMin != null ? Math.max(0, bar.nextMin - bar.estimate) : 0;
    const sec = document.createElement("div"); sec.className = "sec";
    sec.textContent = gap ? "Best rep per hour · " + num(gap) + " to " + bar.nextName : "Best rep per hour";
    body.appendChild(sec);
    for (const m of list.slice(0, 8)) {
      const row = document.createElement("div");
      row.className = "grow" + (m === list[0] ? " best" : "");
      const t = document.createElement("div"); t.className = "t";
      t.textContent = (m.completed > 0 ? "✓ " : "") + m.title + (m.items.length ? "  ★" : "");
      const meta = document.createElement("div"); meta.className = "gmeta";
      const bits = ["+" + num(m.rep), fmtMins(m.durMin)];
      if (m.payMax) bits.push((m.payoutEstimated ? "~" : "") + fmtK(m.payMax));
      // 🔑 Runs to the NEXT RANK, per mission — the column that makes the table a decision rather
      // than a statistic. Omitted at max standing, where there is nothing to count toward.
      if (gap) bits.push(Math.ceil(gap / m.rep) + " runs");
      meta.textContent = bits.join(" · ");
      const rate = document.createElement("div"); rate.className = "rate";
      rate.textContent = num(Math.round(m.repHr)) + "/hr";
      const left = document.createElement("div"); left.className = "gleft";
      left.append(t, meta);
      row.append(left, rate);
      if (m.key) {
        row.classList.add("linked");
        row.title = "Open this mission on subliminal.gg";
        row.addEventListener("click", () => openSite("/missions/" + encodeURIComponent(m.key)));
      }
      body.appendChild(row);
    }
  }

  // ── MOCKUP 3 · "Next ship" ────────────────────────────────────────────────────────────────
  // The opinionated one. Nobody grinds Battaglia for the standing — they grind her for the Golem,
  // the Prospector and the MOLE, so the widget leads with the next one you have not got and says
  // exactly what stands between you and it. Everything else drops to one line.
  // ⚠️ REACHING THE RANK IS NOT HAVING THE SHIP. The mission still has to be COMPLETED — proven
  // from Sub's own log, where the rank-3 Golem mission was accepted and abandoned. So an
  // in-reach ship says "go do it", never "unlocked".
  function renderNextShip() {
    const body = $("body");
    body.textContent = "";
    const cur = currentRank();
    const gated = (track.rewards || []).filter((r) => r.rank != null && !r.received)
      .sort((a, b) => a.rank - b.rank);
    if (!gated.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "Every rank-gated reward on this track is received.";
      body.appendChild(d); return;
    }
    const next = gated[0];
    const rank = (track.ranks || []).find((x) => x.rank === next.rank);
    const inReach = cur >= next.rank;

    const hero = document.createElement("div");
    hero.className = "hero" + (inReach ? " open" : "");
    const nm = document.createElement("div"); nm.className = "hero-n"; nm.textContent = next.name;
    const sub = document.createElement("div"); sub.className = "hero-s";
    sub.textContent = (rank ? rank.name : "Rank " + next.rank) + " · " + next.mission;
    hero.append(nm, sub);

    const call = document.createElement("div"); call.className = "hero-c";
    if (inReach) {
      // She already offers it — the only thing left is to run it, so say how long that takes.
      const mission = allTrackMissions().find((m) => m.title === next.mission);
      call.textContent = mission && mission.durMin
        ? "Go do it · ~" + fmtMins(mission.durMin)
        : "Go do it";
      call.classList.add("go");
    } else {
      const r = routeTo(rank ? rank.minRep : null);
      call.textContent = r && r.best
        ? r.runs + " × " + r.best.title + " · ~" + fmtMins(r.mins)
        : (r ? num(r.gap) + " rep to go" : "");
      if (r && r.auec != null) {
        const money = document.createElement("div"); money.className = "hero-m";
        money.textContent = "earns " + (r.estimated ? "~" : "") + fmtK(r.auec) + " aUEC on the way";
        hero.appendChild(money);
      }
    }
    hero.appendChild(call);
    body.appendChild(hero);

    if (gated.length > 1) {
      const sec = document.createElement("div"); sec.className = "sec"; sec.textContent = "After that";
      body.appendChild(sec);
      for (const r of gated.slice(1)) {
        const rk = (track.ranks || []).find((x) => x.rank === r.rank);
        const row = document.createElement("div"); row.className = "after";
        const a = document.createElement("div"); a.className = "an"; a.textContent = r.name;
        const b = document.createElement("div"); b.className = "aw";
        b.textContent = track.bar && rk
          ? num(Math.max(0, rk.minRep - track.bar.estimate)) + " to go"
          : (rk ? rk.name : "rank " + r.rank);
        row.append(a, b);
        body.appendChild(row);
      }
    }
  }

  function render() {
    if (!track) {
      $("emptyState") && ($("body").innerHTML = '<div class="empty">Battaglia missions aren\'t in the loaded dataset.<br>They arrive with the patch dataset.</div>');
      return;
    }
    $("who").textContent = track.faction || "Battaglia";
    $("modeBtn").textContent = mode === "rewards" ? "Missions" : "Rewards";
    $("doneBtn").textContent = showDone ? "Hide done" : "Show done";
    $("doneBtn").classList.toggle("active", showDone);
    $("doneBtn").style.display = mode === "rewards" ? "" : "none";
    if (tab === null) tab = currentRank() >= 0 ? currentRank() : (track.intro.length ? "intro" : 0);
    renderStanding();
    renderMockSwitcher();
    renderTabs();
    // TEMPORARY: while Sub is choosing, the mockup switcher stands in for the rewards view. The
    // Missions mode (the header toggle) is untouched and still reachable.
    const mk = battMock();
    if (mode === "missions") renderMissions();
    else if (mk === "grind") renderGrind();
    else if (mk === "ship") renderNextShip();
    else renderRewards();
  }

  $("modeBtn").addEventListener("click", () => { mode = mode === "rewards" ? "missions" : "rewards"; render(); });
  $("doneBtn").addEventListener("click", () => { showDone = !showDone; render(); });
  $("siteBtn").addEventListener("click", () => openSite("/factions/" + giverSlug(track?.faction || "Recco Battaglia")));
  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  load();
  setInterval(load, POLL_MS);
  try { host()?.ready?.(); } catch { /* not embedded */ }
  // Per-widget settings, opened by the bar's cog. Controls that used to crowd the header live
  // here; the parent injects its Text size row into this same sheet.
  window.__widgetSettings = () => $("wsettings").classList.add("open");
  window.__widgetSettingsRoot = () => $("wsettings");
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#wsettings")) $("wsettings").classList.remove("open");
  });
</script>
</body>
</html>
