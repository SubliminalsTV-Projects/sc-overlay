<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Page</title>
<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t); }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Put any web page on the canvas — a wiki, a trade tool, a spreadsheet, a Discord widget.
     Theme tokens + surface treatments come from the shared /widget-theme.css. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 420px; height: 520px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    /* Fill, border tint, shadow and blur live in widget-theme.css (#panel.wpanel), which
       multiplies each one's alpha by --wsurf so the panel fades independently of its text.
       🔑 The web CONTENT is a native view the shell paints ABOVE all page content, so only
       this chrome fades — the site itself never does. */
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  .head { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 10px 8px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; min-height: 38px; }
  .dia { width: 7px; height: 7px; flex: none; background: var(--cyan-bright); transform: rotate(45deg);
    box-shadow: 0 0 8px var(--cyan); }
  #siteTag { flex: 1; min-width: 0; font-size: 11.5px; font-weight: 600; color: var(--gold);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 7px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.active { background: rgba(var(--accent-rgb), 0.28); border-color: var(--cyan); }

  #body { flex: 1; min-height: 0; position: relative; }
  /* The hole the shell's view fills. Transparent on purpose — anything painted here would sit
     behind the view and only ever show through as a flash while a page loads. */
  #frame { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
  #frame.hide { display: none; }
  /* Only ever seen when there's no shell to paint the view (a plain browser tab). */
  #frameNote { display: none; margin: 0; padding: 22px 18px; font-size: 11px; line-height: 1.6; color: var(--faint); }
  body:not(.embedded) #frameNote { display: block; }

  #setup { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center;
    gap: 10px; padding: 22px 18px; background: linear-gradient(180deg, var(--panel-top), var(--panel-bot)); z-index: 5; }
  #panel.setup #setup { display: flex; }
  #setup .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  #setup .hint { font-size: 11px; line-height: 1.6; color: var(--cyan-dim); }
  #urlInput { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--cyan-bright);
    background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 10px; outline: none; width: 100%; }
  #urlInput:focus { border-color: var(--cyan); }
  #urlInput::placeholder { color: var(--faint); font-weight: 500; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .hbtn { flex: 1; text-align: center; padding: 8px 10px; font-size: 11px; }
  .quick { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip { font-size: 10.5px; font-weight: 600; color: var(--cyan-text); background: rgba(var(--accent-rgb), 0.1);
    border: 1px solid var(--divider); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
  .chip:hover { border-color: var(--cyan); color: var(--cyan-bright); }
  .warn { font-size: 10.5px; line-height: 1.5; color: var(--amber); }
</style>
</head>
<body>
  <div id="panel" class="wpanel setup">
    <div class="head">
      <span class="dia"></span>
      <span id="siteTag"></span>
      <button id="reloadBtn" class="hbtn" type="button" title="Reload">⟳</button>
      <button id="editBtn" class="hbtn" type="button" title="Change the page">⌕</button>
    </div>

    <div id="body">
      <!-- Not an iframe any more. The site is a native view the shell paints over this exact
           rectangle, because an iframe can only show sites willing to be framed and the RSI site
           is not one of them (it delivers the document and then renders nothing). This element is
           the HOLE: it stays empty and transparent, and its position is reported to the shell.
           Standalone (no shell — a browser tab, the test harness), it shows why it's blank. -->
      <div id="frame" class="hide">
        <p id="frameNote">The web page is drawn by the app itself, so this widget only works inside SC Overlay.</p>
      </div>
      <div id="setup">
        <div class="lbl">Web page</div>
        <input id="urlInput" type="text" placeholder="e.g. subliminal.gg/blueprints" spellcheck="false" autocomplete="off" />
        <div class="row">
          <button id="typeBtn" class="hbtn" type="button" title="Typing mode: grab keyboard focus so you can type in-game">✎ Type mode</button>
          <button id="goBtn" class="hbtn" type="button">Open</button>
        </div>
        <div class="quick" id="quick"></div>
        <div class="warn" id="warn"></div>
        <div class="hint">Any site works here now, including the ones that refuse to be embedded — the <b>RSI site</b>, <b>UEX</b>, <b>erkul</b>, <b>starcitizen.tools</b>. Sign-ins work too, in their own cookie jar, separate from your browser.</div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__webViewHost : null;
  const host_ = host; // alias: `host` is shadowed by a local in go()

  // A few SC-flavoured starting points so the empty state isn't a bare box. These used to be
  // restricted to sites VERIFIED to allow framing (uexcorp.space sends X-Frame-Options:
  // SAMEORIGIN, starcitizen.tools sends DENY) — but the page is top-level in the shell's view
  // now, not framed, so the ones that were excluded are exactly the ones worth offering.
  const QUICK = [
    ["Blueprints", "https://subliminal.gg/blueprints"],
    ["RSI", "https://robertsspaceindustries.com"],
    ["UEX", "https://uexcorp.space"],
    ["erkul", "https://www.erkul.games"],
    ["SPViewer", "https://www.spviewer.eu"],
    ["SC Feed", "https://sc-feed.subliminal.gg"],
  ];

  let url = "";

  /** Accept "uexcorp.space" as readily as a full URL; only http(s) is ever loaded. */
  function normalizeUrl(raw) {
    let s = String(raw || "").trim();
    if (!s) return "";
    if (!/^https?:\/\//i.test(s)) s = "https://" + s;
    try {
      const u = new URL(s);
      if (u.protocol !== "http:" && u.protocol !== "https:") return "";
      return u.toString();
    } catch { return ""; }
  }

  function render() {
    const f = $("frame");
    $("siteTag").textContent = url ? (() => { try { return new URL(url).host; } catch { return url; } })() : "No page set";
    if (url) {
      if (f.dataset.for !== url) { host()?.viewLoad?.(url); f.dataset.for = url; }
      f.classList.remove("hide");
      $("panel").classList.remove("setup");
    } else {
      f.classList.add("hide");
      $("panel").classList.add("setup");
    }
    reportHole();
  }

  /** Tell the shell where to paint the page — this element's box, in THIS page's coordinates.
   *  The canvas adds the widget's own position before passing it on. */
  function reportHole() {
    const f = $("frame");
    const h = host();
    if (!h) return;                                   // standalone: there is no view to place
    if (f.classList.contains("hide")) { h.viewShow?.(false); return; }
    const r = f.getBoundingClientRect();
    h.viewBounds?.({ x: r.left, y: r.top, width: r.width, height: r.height });
  }
  // The hole moves when the widget is resized (the page reflows inside a fixed frame), so watch
  // the element itself rather than trying to catch every cause.
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(reportHole).observe(document.documentElement);
  window.addEventListener("resize", reportHole);

  function openSetup() {
    $("urlInput").value = url;
    $("panel").classList.add("setup");
    // The form has to be readable: with the site up, the shell's view would cover it.
    $("frame").classList.add("hide");
    reportHole();
  }

  async function go() {
    const u = normalizeUrl($("urlInput").value);
    if (!u) { $("warn").textContent = "That doesn't look like a web address."; $("urlInput").focus(); return; }
    // No embeddability check any more: the page is loaded as top-level content in the shell's own
    // view, so X-Frame-Options and frame-ancestors don't apply and the sites this used to refuse
    // (the RSI site, UEX, starcitizen.tools) now work. Standalone, there's no view to load into.
    if (!host()) {
      $("warn").textContent = "";
      const msg = document.createElement("span");
      msg.textContent = "This widget draws its page through the app — open it in SC Overlay. ";
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = "Open in browser";
      b.addEventListener("click", () => window.open(u, "_blank", "noopener"));
      $("warn").append(msg, b);
      return;
    }
    $("warn").textContent = "";
    url = u;
    if (typing) setTyping(false);
    render();
    try {
      await fetch("/api/config", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ webViewUrl: url }),
      });
    } catch { /* best-effort; still shown this session */ }
  }

  async function load() {
    try {
      const c = await (await fetch("/api/config", { cache: "no-store" })).json();
      if (typeof c.webViewUrl === "string") url = normalizeUrl(c.webViewUrl);
    } catch { /* none set */ }
    for (const [label, href] of QUICK) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = label;
      b.addEventListener("click", () => { $("urlInput").value = href; go(); });
      $("quick").appendChild(b);
    }
    if (!url) openSetup();
    render();
  }

  // Typing mode — the shell grabs keyboard focus + suspends the interact key so the address can be
  // typed over a focused game (shared with the Notepad widget; see main.cjs).
  let typing = false;
  function setTyping(on) {
    typing = !!on;
    const b = $("typeBtn");
    b.textContent = typing ? "✓ Done" : "✎ Type mode";
    b.classList.toggle("active", typing);
    if (typing) { if (host()) host().editStart(); else $("urlInput").focus(); }
    else { if (host()) host().editEnd(); const a = document.activeElement; if (a && a.blur) a.blur(); }
  }
  window.__webViewFocus = () => { if (typing) $("urlInput").focus(); };
  window.__webViewExitTyping = () => { if (typing) setTyping(false); };

  $("editBtn").addEventListener("click", openSetup);
  $("goBtn").addEventListener("click", go);
  $("reloadBtn").addEventListener("click", () => { if ($("frame").dataset.for) host()?.viewReload?.(); });
  $("typeBtn").addEventListener("click", () => setTyping(!typing));
  $("urlInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && typing) { e.preventDefault(); setTyping(false); } });

  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  load();
  try { host()?.ready?.(); } catch { /* not embedded */ }
</script>
</body>
</html>
