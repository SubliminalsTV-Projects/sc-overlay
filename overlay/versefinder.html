<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verse Finder</title>
<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t);
    /* ?bg=RRGGBB paints an opaque backdrop, for embedding in a THIRD-PARTY host (GameGlass
       and friends). Hex digits only, and applied through CSSOM — a value that is not a colour
       is rejected by the engine rather than landing anywhere it could be read as markup. */
    const b = q.get("bg"); if (b && /^[0-9a-f]{3,8}$/i.test(b)) { r.style.setProperty("--wbg", "#" + b); r.dataset.bg = ""; } }</script>
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Verse Finder: type an item name, get the shops that sell it. Fed by /api/verse/search (see
     src/verse-routes.ts). Theme tokens come from the shared /widget-theme.css, so this widget
     retints with the flown ship like every other one.

     🔴 THE HONESTY CONSTRAINT IS THE DESIGN, not a caption bolted on. Prices are per-terminal and
     the readings are old, so:
       · a result NEVER shows one price — it shows a shop, and a row per shop;
       · every row carries the age of its own reading;
       · the panel says out loud that stock is unknowable, because the source has no stock field
         at all and a player who flies out can still find the shelf empty;
       · when the table is a fallback (cache/bundle), the footer says so rather than staying quiet.
     A UI that implies false precision here is worse than no UI (Sub, repeatedly). */
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 460px; height: 480px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  .head { min-height: 38px; gap: 6px; }

  /* The search box IS the widget — one control, given the room. */
  #q { flex: 1; min-width: 40px; font-family: var(--sans); font-size: 12px;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.07);
    border: 1px solid var(--divider); border-radius: 6px; padding: 5px 8px; outline: none; }
  #q:focus { border-color: var(--cyan); background: rgba(var(--accent-rgb), 0.13); }
  #q::placeholder { color: var(--faint); }

  #results { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 0 8px; }

  /* ── One item ─────────────────────────────────────────────────────────────── */
  /* 🔑 LEFT AND RIGHT ARE NOT THE SAME JOB, so they are no longer the same number (Sub, 2026-08-22:
     "too much left padding… it looks off"). The right edge carries the price column, which is
     right-ALIGNED and therefore already ends short of the border — a matching 12px there reads as
     a wide, empty gutter on the left where text starts hard. 7px on the left puts the item name
     near the panel edge the eye scans down; the right keeps its 12px so the prices are not jammed
     against the frame. */
  .item { border-bottom: 1px solid var(--divider); padding: 9px 12px 10px 7px; }
  .item:last-child { border-bottom: 0; }
  .iname { font-size: 13px; font-weight: 600; color: var(--cyan-bright); line-height: 1.3;
    overflow-wrap: anywhere; }
  /* The category, riding the name. Lighter weight and dimmer so the NAME still reads as the answer
     to what was typed — this is context, not a second title. */
  .icat { font-weight: 500; color: var(--cyan-dim); }

  /* Manufacturer / category / size / craftability as CHIPS, matching the tracker's `.mi-chip`
     rather than inventing a look: same 5px radius, same divider border, same accent tint. They
     wrap instead of truncating, which is what lets a narrow widget keep every fact.
     🔑 Deliberately NOT a 999px capsule — Sub ruled on that for the payout pill ("the same round"):
     a full capsule beside 5px chips reads as a different species. */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--cyan-text); background: rgba(var(--accent-rgb), 0.10);
    border: 1px solid var(--divider); border-radius: 5px; padding: 2px 7px; white-space: nowrap; }
  /* Components are named BARE ("Burst" is a quantum drive), so the manufacturer is identity here,
     not decoration — it gets the brighter treatment. */
  .chip.mk { color: var(--cyan-bright); }
  .chip.sz { color: var(--cyan-bright); border-color: rgba(var(--accent-rgb), 0.45);
    background: rgba(var(--accent-rgb), 0.14); }
  /* The craft cross-link — the one thing no other SC tool can say. Only drawn when the item's
     UUID really matches a blueprint we track, never on a name resemblance. Dashed while you do NOT
     own it, matching the tracker's convention for "not from your own collection". */
  .chip.craft { border-style: dashed; color: var(--cyan-dim); }
  .chip.craft.own { border-style: solid; color: var(--green);
    border-color: color-mix(in srgb, var(--green) 45%, transparent);
    background: color-mix(in srgb, var(--green) 12%, transparent); }

  /* ── The shops ────────────────────────────────────── */
  .shops { margin-top: 7px; display: flex; flex-direction: column; }

  /* ══ GROUPED BY PLACE ══════════════════════════════════════════════════════════════════════
     One heading per place, then a bare row per shop. The heading carries everything the shops in
     it share — where it is, how far, which tier — so the rows carry only what differs. */
  .grp { margin-top: 6px; }
  .ghead { display: flex; align-items: center; gap: 7px; padding: 4px 0 3px;
    border-top: 1px solid rgba(var(--accent-rgb), 0.14); }
  .grp:first-child .ghead { border-top: 0; }
  /* The place is the heading, so it takes the uppercase treatment the widget uses for titles.
     It may truncate — the full string is on the row's own hover, and at 320px the shop names
     matter more than the last word of a long station name. */
  .gplace { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 62%; }
  .grule { flex: 1; height: 1px; min-width: 6px; background: rgba(var(--accent-rgb), 0.14); }
  .gdist { flex: none; font-family: var(--mono); font-size: 9px; font-weight: 600;
    letter-spacing: 0.02em; color: var(--cyan-dim); white-space: nowrap; }

  /* 🔴 THE TWO-LINE PILL Sub spotted in the mockup — and the cause is NOT what it looks like.
     The obvious diagnosis is flex-shrink (a flex item defaults to `flex: 0 1 auto`, so a narrow
     row squeezes the box below its content). Controlled at 320px, that alone does NOT reproduce
     it. The real cause is two defaults acting together:
       · `align-items` defaults to STRETCH, so every child grows to the tallest item in the row;
       · a shop name allowed to WRAP makes the row two lines tall.
     The pill then stretches to match, while its own text still sits on one line. Re-injecting
     exactly those two turns 9 of the pills tall; either one alone leaves it green.
     🔑 So the fix is `align-items: center` plus a name that truncates instead of wrapping. The
     `flex: none` below is belt-and-braces on top of that, not the load-bearing part — worth
     keeping, but do not mistake it for the reason this works. */
  .grow { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 9px;
    font-size: 11px; line-height: 1.35; }
  .grow + .grow { border-top: 1px solid rgba(var(--accent-rgb), 0.06); }
  .gshop { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--cyan-text); }

  .price { flex: none; font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-weight: 600; font-size: 11.5px; color: var(--gold); white-space: nowrap; }
  /* The currency, dimmed and lighter. Present on every row because a bare number is ambiguous in a
     widget that also prints distances and ages — but subordinate, because what the eye compares
     down the column is the amount, not the unit repeated five times. */
  .unit { font-size: 9px; font-weight: 500; opacity: 0.62; letter-spacing: 0.02em; }

  /* Age of THIS reading, as a chip in the same family as the ones above. Never omitted, never
     averaged into anything, and never rolled up to the table's age — each shop's price was
     reported at its own moment.
     🔑 Colour is set by a band class and the border/background derive from `currentColor` via
     color-mix, so all four bands retint with every manufacturer skin instead of pinning four
     colours of their own. */
  .age { flex: none; font-family: var(--mono); font-size: 9px; font-weight: 600;
    letter-spacing: 0.02em; font-variant-numeric: tabular-nums; padding: 1px 5px;
    border-radius: 5px; line-height: 1.35;
    border: 1px solid color-mix(in srgb, currentColor 40%, transparent);
    background: color-mix(in srgb, currentColor 12%, transparent); white-space: nowrap; }
  .more { font-size: 9.5px; color: var(--faint); margin-top: 6px; padding-top: 5px;
    border-top: 1px solid rgba(var(--accent-rgb), 0.07); }

  .empty { padding: 26px 18px; text-align: center; color: var(--faint); font-size: 11.5px; line-height: 1.7; }
  .empty b { color: var(--cyan-text); font-weight: 600; }

  /* ── Footer ───────────────────────────────────────────────────────────────────
     Carries the two things that stop a confident-looking answer being a lie: where the table came
     from, and that stock is not a thing we can know. */
  /* ── How far, and the eye that says how much to trust it ────────────────────────────────────
     🔴 The distance column is deliberately NOT styled like the price. A price is a fact about a
     shop; a distance is a claim about where the PLAYER is, and those two deserve different
     confidence on sight. Minutes are dim and monospaced, containment is quieter still. */
  .cpill { flex: none; display: inline-block; padding: 1px 6px; border-radius: 5px;
    font-family: var(--sans); font-size: 9px; font-weight: 600;
    letter-spacing: 0.01em; white-space: nowrap; line-height: 1.35;
    border: 1px solid color-mix(in srgb, currentColor 38%, transparent);
    background: color-mix(in srgb, currentColor 12%, transparent); }
  /* 🔴 THE TIER LADDER — four steps of "how far", read as colour before it is read as words.
     Green you are standing there, cyan same body, gold same system, red another system. All four
     are the shared semantic tokens, so they retint with every manufacturer skin rather than
     pinning colours of their own.
     ⚠️ Only the three known tiers are lowercased. The far one prints a SYSTEM NAME — "Pyro",
     "Stanton" — and forcing a proper noun to lower case would read as a typo. */
  .cpill.t-here { color: var(--green); text-transform: lowercase; }
  .cpill.t-body { color: var(--cyan); text-transform: lowercase; }
  .cpill.t-sys  { color: var(--gold); text-transform: lowercase; }
  .cpill.t-away { color: var(--red); }

  /* 🔴 A CIRCLED "i", NOT AN EYE (Sub, 2026-08-22: "the letter I with a circle around it").
     An eye reads as a visibility toggle — show/hide this thing — which is exactly the wrong verb
     for a control whose whole job is "there is more to read here, click or hover". The tracker
     already learned this once: an eye glyph beside the reputation figure "read as something else
     entirely" and was replaced by a circled i for the same reason.

     Still INLINE SVG, and still never a glyph, for the reason the eye was: this page links
     widget-theme.css so a real ⓘ WOULD render, but only by pulling the 4.8 MB colour-emoji face,
     and the text-presentation form is at the mercy of the OS font — the trap that made `o7` render
     as a box. It is also drawn as a circle plus two strokes rather than SVG <text>, so it does not
     depend on a font at all. */
  .eyebtn { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0;
            padding: 1px 3px; margin: 0; cursor: pointer; font: inherit; color: var(--dim);
            border-radius: 3px; }
  .eyebtn:hover { background: rgba(255,255,255,0.06); }
  .eyebtn svg { width: 12px; height: 12px; flex: none; }
  .eyebtn .lbl { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
                 max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Three states, and they are the three claims — precise, approximate, none. */
  .eyebtn.precise { color: var(--green); }
  .eyebtn.rough   { color: var(--amber); }
  /* 🔴 "WE DO NOT KNOW WHERE YOU ARE" IS THE STATE THAT WANTS THE PLAYER TO ACT, so it can no
     longer be the quietest thing in the footer. It used to render at `--dim` with the icon knocked
     back to 55% opacity — dimmer than the two states that need nothing from anybody. The ladder
     was backwards: precise (green) is good news and can recede, rough (amber) is a caveat, and
     unknown is the only one with an instruction behind it. It now takes the amber-family accent
     and full-strength icon, and keeps the neutral LABEL colour so it reads as "attention", not as
     an error — nothing is broken, we simply cannot see you yet. */
  .eyebtn.none    { color: var(--amber); }
  .eyebtn.none .lbl { color: var(--cyan-text); }

  /* 🔴 A POPOVER, in the TOP LAYER. It is immune to every ancestor's overflow and takes NO space
     in layout, which is what stops it growing the panel — a plain absolutely-positioned box here
     measured the panel 541px -> 743px in an earlier widget. Anchored in CSS, never by measuring:
     rAF and ResizeObserver do not fire in a window the compositor considers hidden. */
  .eyepop { position: absolute; margin: 0; inset: auto; border: 1px solid var(--line);
            background: var(--panel-top, #10161c); color: var(--fg); border-radius: 5px;
            padding: 8px 10px; max-width: 260px; font-family: var(--sans); font-size: 10.5px;
            line-height: 1.45; box-shadow: 0 6px 18px rgba(0,0,0,0.45);
            position-anchor: --eyeanchor; position-area: top span-right;
            position-try-fallbacks: bottom span-right, top span-left, bottom span-left; }
  .eyepop:popover-open { display: block; }
  .eyepop b { color: var(--cyan-dim); font-weight: 700; }
  .eyepop .sep { display: block; height: 1px; background: var(--line); margin: 6px 0; }
  .eyebtn { anchor-name: --eyeanchor; }

  /* The one sentence naming what the order means. Rendered verbatim from the server so the UI
     cannot assemble a claim the data does not support. */
  .ordernote { flex: none; padding: 3px 10px 0; font-family: var(--sans); font-size: 9.5px;
               color: var(--dim); letter-spacing: 0.01em; }

  /* 🔴 A BIGGER FOOTER, TO GIVE UEX ROOM (Sub, 2026-08-22). His framing is the design note:
     "this is really mainly just them. All we're doing is putting up a wrapper for it." So the
     credit is not a 9px afterthought squeezed against two other things — it is the second most
     important thing in the panel after the results, and it gets height, its own line, and the
     brand mark. 9px mono at 5px padding was a legal footnote; this is a credit. */
  .foot { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 10px 9px 7px;
    border-top: 1px solid var(--divider); position: relative; z-index: 4;
    font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.03em; }
  #src { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }
  /* 🔴 UEX'S OWN "Powered by UEX" BADGE, supplied by Sub 2026-08-22 — so it is used UNMODIFIED,
     which is the entire point of a brand badge. It is not tinted, not recoloured by the
     manufacturer skins, and not clipped: an attribution that changes to suit our theme stops being
     an attribution. It carries the words "Powered by UEX" itself, which is why there is no
     separate wordmark beside it — repeating the name would read as a status line rather than a
     credit.

     🔑 SHIPPED AT 202x60 FOR A 17px SLOT. The original is 3840x1138 / 118 KB, which is 40x more
     pixels than this can ever show and would be paid on every widget load by every user. Trimmed
     and resampled to 4x the display height it is 3.1 KB — the same reasoning that keeps the
     colour-emoji face out of this page.

     ⚠️ If it cannot load it is REPLACED by the words, never merely removed — see the markup. A
     broken-image glyph would be ugly, but an attribution that silently disappears is worse. */
  #uexmark { flex: none; height: 17px; width: auto; display: block; border-radius: 3px; }
  #uexname { flex: none; font-family: var(--sans); font-weight: 700; font-size: 10px;
    letter-spacing: 0.04em; color: var(--cyan-text); white-space: nowrap; }
  #srctext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #src.fallback #srctext { color: var(--amber); }
  #nostock { flex: none; }
</style>
</head>
<body>
  <div id="panel" class="wpanel selectable">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title">Verse Finder</span>
      <input id="q" type="text" placeholder="item name…" spellcheck="false" autocomplete="off" maxlength="60" />
    </div>

    <div id="results"></div>

    <!-- What the ordering means, in one sentence, straight from the server. -->
    <div id="ordernote" class="ordernote" hidden></div>

    <div class="foot">
      <!-- 🔑 A real <button> with popovertarget, so toggle, light-dismiss and Escape are the
           browser's job and not a handler of ours that can get stuck — this widget family has
           already shipped a cog that could only ever OPEN. It also earns Enter/Space for free.
           `title` stays for hover: there is no API to open a native tooltip from script, so the
           popover carries the click and the two coexist rather than one replacing the other. -->
      <button id="eye" class="eyebtn none" type="button" popovertarget="eyepop">
        <!-- The circled i, drawn: ring, dot, stem. No <text>, so no font can fail to have it. -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5" />
          <path d="M12 11v5.5" />
          <path d="M12 7.6v0.1" stroke-width="2.6" />
        </svg>
        <span class="lbl" id="eyelbl">Location unknown</span>
      </button>
      <div id="eyepop" class="eyepop" popover="auto"></div>
      <!-- 🔴 THE CREDIT, not a source line. Sub: "this is really mainly just them. All we're doing
           is putting up a wrapper for it." The mark is a drop-in (see #uexmark) and the wordmark
           stands alone until it exists, so the attribution is never absent. -->
      <span id="src">
        <!-- ⚠️ The fallback REPLACES rather than removes: an attribution that can vanish because an
             image 404'd is not an attribution. If the badge cannot load, the words take its place. -->
        <img id="uexmark" src="/logos/uex-powered.png" alt="Powered by UEX"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{id:'uexname',textContent:'Powered by UEX'}))" />
        <span id="srctext">…</span>
      </span>
      <!-- 🔴 "stock unknown" was the first wording and Sub had to ask what it meant, which is the
           whole test failed: it reads like a loading state rather than a statement about the data.
           The label now says the CONSEQUENCE for the player — a shop listed here can still be
           sold out — and the tooltip carries why we cannot know. -->
      <span id="nostock" title="Nobody tracks shop stock levels: UEX has no stock field for items at all, so nothing here can tell you whether a shop actually has one right now. These rows mean 'this shop sells it at this price', not 'it is on the shelf today'.">may be sold out</span>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__verseFinderHost : null;

  // How many shops to draw per item before summarising the rest. The full count always travels
  // and is always stated, so a truncation can never read as "this is everywhere it is sold".
  const SHOPS_SHOWN = 5;
  // Debounce: the player is flying. Every keystroke hitting the sidecar would be a request per
  // frame of typing, over a game.
  const DEBOUNCE_MS = 160;

  let timer = null;
  let seq = 0;            // response ordering — a slow early request must not overwrite a fast late one
  let lastQuery = "";
  // The origin from the most recent response, held only so a distance tooltip can name what the
  // figure is measured FROM. Never used to compute anything.
  let lastOrigin = null;

  const fmt = (n) => n.toLocaleString("en-US");

  const daysSince = (sec) => Math.floor((Date.now() / 1000 - sec) / 86400);

  /** Age of one reading, in the plainest words that are still true.
   *  🔑 Rendered per QUOTE, never rolled up: each shop's price was reported at its own moment. */
  function ageOf(sec) {
    const days = daysSince(sec);
    if (days <= 0) return "today";
    if (days === 1) return "1d";
    if (days < 60) return days + "d";
    return Math.floor(days / 30) + "mo";
  }

  /** Which colour band a reading falls in.
   *
   *  🔑 THE CUTS COME FROM THE REAL DISTRIBUTION, not from round numbers. Measured over all 23,747
   *  quotes: p25 is 36 days, the median 83, p90 93, the oldest 142. Round thresholds (30/90/365)
   *  would have dropped almost every row into one bucket, and a pill that is always the same
   *  colour is just a slower way of saying nothing.
   *
   *  ⚠️ Read the colour as "how recently someone checked", NOT as "how wrong this might be". Shop
   *  prices in SC are fixed, not a market: 99.6% of rows were never once observed to move over a
   *  month. An amber pill means nobody has looked lately, which is a different and much milder
   *  claim than a stale commodity price. The tooltip says so, because the colour alone implies
   *  more risk than the data supports. */
  function ageBand(sec) {
    const d = daysSince(sec);
    if (d <= 7) return "fresh";
    if (d <= 45) return "recent";
    if (d <= 100) return "stale";
    return "ancient";
  }

  /**
   * Metres as the GAME writes them — km, Mm, Gm — because that is the ladder on the player's own
   * HUD and quantum target list. Anything else makes them convert in their head to compare the
   * widget against the screen behind it.
   *
   * 🔑 THE UNIT IS ALWAYS PRESENT AND ALWAYS SPELLED. This is the direct lesson of Sub reading
   * "New Babbage 4M away" as a distance when it was the age of his position fix: a bare number or
   * a single-letter suffix next to a place name gets read as distance whatever it actually is.
   * One decimal only below 10 of a unit, where the difference is legible; none above, where it is
   * false precision on a straight-line figure.
   */
  function fmtDist(m) {
    if (m < 1000) return "<1 km";
    const km = m / 1000;
    if (km < 1000) return Math.round(km).toLocaleString() + " km";
    const Mm = m / 1e6;
    if (Mm < 1000) return (Mm < 10 ? Mm.toFixed(1) : Math.round(Mm).toLocaleString()) + " Mm";
    const Gm = m / 1e9;
    return (Gm < 10 ? Gm.toFixed(1) : Math.round(Gm).toLocaleString()) + " Gm";
  }

  /**
   * 🔴 HOW FAR, AS A COLOURED TIER — and the far tier NAMES THE SYSTEM (Sub, 2026-08-22:
   * "instead of saying out of system, just put Nyx or Pyro").
   *
   * "elsewhere" was a non-answer. The player knows they are in Stanton; being told a shop is
   * "elsewhere" costs a glance and returns nothing, whereas "Pyro" is the actual decision — it is
   * a jump away and you either want to go or you do not.
   *
   * 🔑 THE COLOUR IS THE LADDER, so the four tiers read at a glance without being read as words:
   * green (you are standing there) → cyan (same body) → gold (same system) → red (another system).
   * All four are the shared semantic tokens, so they retint with every manufacturer skin.
   *
   * 🔴 NO PILL AT ALL WHEN `containment` IS NULL. That means the server made no claim about where
   * the player is, and colouring a tier we did not compute would be inventing one. It is not the
   * same as "elsewhere", which is a real finding.
   */
  const TIER = {
    "same-place":  { text: "here",      cls: "t-here" },
    "same-body":   { text: "same body", cls: "t-body" },
    "same-system": { text: "in system", cls: "t-sys" },
  };
  function tierPill(g) {
    const c = g.first.containment;
    if (!c) return null;
    let text, cls, why;
    if (TIER[c]) {
      ({ text, cls } = TIER[c]);
      why = "This shop is " + text + ", relative to the last place the game told us about.";
    } else {
      // "elsewhere" — another system. Name it rather than restating that it is not here.
      text = g.system || "another system";
      cls = "t-away";
      why = "Another system" + (g.system ? " — " + g.system : "")
        + ". Getting there means a wormhole transit, so it is a different kind of trip from "
        + "anything in your own system, not just a longer one.";
    }
    const s = document.createElement("span");
    s.className = "cpill " + cls;
    s.textContent = text;
    s.title = why;
    return s;
  }

  /**
   * 🔴 DROP THE PLACE OFF THE SHOP NAME — it is already the group heading (Sub, 2026-08-22).
   *
   * UEX writes terminals as "Shop - Building - Place": "Pharmacy - Seraphim",
   * "Covalex Shipping - Providence Platform - Orison". Under a heading that already says the
   * place, the tail is the same word twice, and it is the width the name needs at 320px.
   *
   * 🔑 MEASURED BEFORE SHIPPING, because name-matching is where this codebase keeps getting
   * caught: across all 461 terminals, 449 shorten, 0 are emptied, and — the property that
   * actually matters — 0 COLLIDE, meaning no two shops at the same place end up reading
   * identically. A collision would silently merge two different shops in the player's eyes.
   *
   * ⚠️ The prefix rule ("Seraphim" for "Seraphim Station") needs the 4-character floor. Without it
   * a two-letter segment matches the start of almost any place name and strips real words.
   */
  function shortName(terminal, place, body) {
    const parts = String(terminal || "").split(" - ").map((s) => s.trim()).filter(Boolean);
    if (parts.length < 2) return terminal;
    const k = (s) => String(s || "").toLowerCase().replace(/\s*\([^)]*\)\s*$/, "").replace(/[^a-z0-9]/g, "");
    const pk = k(place), bk = k(body);
    const redundant = (seg) => {
      const s = k(seg);
      if (!s) return false;
      if (pk && (s === pk || (pk.indexOf(s) === 0 && s.length >= 4))) return true;
      if (bk && (s === bk || (bk.indexOf(s) === 0 && s.length >= 4))) return true;
      return false;
    };
    const out = parts.slice();
    // 🔑 Never strip everything. A shop whose whole name is the place still needs a label.
    while (out.length > 1 && redundant(out[out.length - 1])) out.pop();
    return out.join(" - ");
  }

  /**
   * 🔴 IT SAYS HOW WELL WE CAN SEE YOU — and since 2026-08-22 it wears a circled i, not an eye.
   *
   * Three states because there are exactly three claims: we know where you are (green), we know
   * roughly or the reading has aged (amber), we do not know (also amber now — it is the one state
   * asking the player for something, so it may not be the quietest thing on screen; see the CSS).
   * The label is the server's own `summary`, and the popover carries `from` and `howToImprove`
   * verbatim. Sub's requirement for the hover was that it says what the player can DO about it,
   * not merely that it is uncertain.
   *
   * 🔴 THE THREE-QUANTITY TRAP, and why the summary is rewritten below. Sub read "New Babbage
   * 4M away" as a distance. It was neither a distance nor minutes to New Babbage — `order.note`
   * said "Nearest first, from Orison (seen 4m ago)" and that `4m` was the AGE OF HIS POSITION FIX.
   * Three different quantities were on screen in similar shapes and they merged. The rows now
   * carry a spelled-out distance unit, and every AGE in this footer is spelled "min ago" / "h ago"
   * so no bare `4m` can sit beside a place name and be read as how far away it is.
   */
  function renderEye(origin, order) {
    const btn = $("eye"), lbl = $("eyelbl"), pop = $("eyepop");
    if (!btn || !lbl || !pop) return;
    const o = origin || { tier: "unknown", summary: "Location unknown", from: "", howToImprove: "", stale: true };
    const state = o.tier === "unknown" ? "none"
      : (o.tier === "place" && !o.stale) ? "precise" : "rough";
    btn.className = "eyebtn " + state;
    lbl.textContent = o.summary || "Location unknown";

    const parts = [];
    parts.push("<b>" + escapeHtml(o.summary || "Location unknown") + "</b>");
    if (o.from) parts.push(escapeHtml(cap(o.from)) + ".");
    if (order && order.note) parts.push('<span class="sep"></span>' + escapeHtml(order.note));
    if (o.howToImprove) parts.push('<span class="sep"></span>' + escapeHtml(o.howToImprove));
    pop.innerHTML = parts.join(" ");

    // Hover gets the same words as the click. There is no API to open a native tooltip from
    // script, so these are two affordances for one explanation rather than a duplication.
    btn.title = [o.summary, o.from ? cap(o.from) + "." : "", order && order.note ? order.note : "",
                 o.howToImprove].filter(Boolean).join("  ");

    const note = $("ordernote");
    if (note) {
      // Only worth a line of its own when the order is NOT the plain one — otherwise it is a
      // sentence explaining that nothing happened.
      const show = order && order.basis && order.basis !== "none";
      note.hidden = !show;
      note.textContent = show ? order.note : "";
    }
  }

  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function itemNode(r) {
    const el = document.createElement("div");
    el.className = "item";

    // 🔑 THE CATEGORY RIDES THE NAME (Sub, 2026-08-22: "CRUZ Lux dash drinks"). Item names in this
    // catalogue are frequently uninformative on their own — "CRUZ Lux" does not say drink, and
    // components are named bare ("Burst" is a quantum drive) — so the category is what makes the
    // row identifiable at a glance. As a chip it read as one more attribute among four; appended
    // to the name it reads as part of the identity, which is what it actually is.
    // ⚠️ It is a CHILD SPAN, not string concatenation, so it can be styled down. The name is the
    // thing being searched for and must stay dominant; the category is context.
    const name = document.createElement("div");
    name.className = "iname";
    name.textContent = r.name;
    if (r.category) {
      const cat = document.createElement("span");
      cat.className = "icat";
      cat.textContent = " – " + r.category;
      name.appendChild(cat);
    }
    el.appendChild(name);

    // Chips, in the tracker's own idiom. The manufacturer leads because for ship components it IS
    // the identity — the item itself is often a single bare word.
    const chips = document.createElement("div");
    chips.className = "chips";
    const chip = (cls, text, title) => {
      const c = document.createElement("span");
      c.className = "chip " + cls;
      c.textContent = text;
      if (title) c.title = title;
      chips.appendChild(c);
    };
    if (r.company) chip("mk", r.company);
    // ⚠️ NO category chip — it MOVED onto the name above, it was not duplicated. Showing it in both
    // places is the "mirror it and you have two writers" mistake in visual form: the reader sees
    // the same fact twice and starts wondering what the difference is.
    if (r.size) chip("sz", "Size " + r.size);
    if (r.craft) {
      chip("craft" + (r.craft.owned ? " own" : ""),
        r.craft.owned ? "✦ blueprint owned" : "✦ craftable",
        r.craft.owned
          ? "This item is also a blueprint in your collection — you can fabricate it instead of buying it."
          : "This item is also a craftable blueprint, though you have not unlocked it yet.");
    }
    if (chips.childNodes.length) el.appendChild(chips);

    // ══ SHOPS, GROUPED BY PLACE (Sub picked this shape 2026-08-22) ══════════════════════════
    //
    // 🔴 THE REASON IT IS A GROUP AND NOT A COLUMN. Results are already ordered by proximity, so
    // shops at the same place are already adjacent — and the distance to all of them is by
    // definition identical. The flat layout printed that same fact once per row: in the MedPen
    // result, 5 shops fall in 2 places, so "same body" was drawn four times. Stating it once as a
    // heading is not just tidier, it is what frees the width the shop name needs at 320px.
    //
    // 🔑 AND IT LETS THE PLACE COME OFF THE SHOP NAME. "Pharmacy - Seraphim" under a heading that
    // already says Seraphim Station is the same word twice. `shortName()` strips it — measured
    // across the whole table: 449 of 461 shortened, 0 emptied, and 0 collisions (no two shops at
    // one place end up reading identically), which is the property that makes it safe.
    const shops = document.createElement("div");
    shops.className = "shops";

    // Consecutive-run grouping, NOT a map keyed by place: the incoming order is the proximity
    // order and must be preserved exactly. Bucketing by name would silently re-sort the results.
    const groups = [];
    for (const q of r.quotes.slice(0, SHOPS_SHOWN)) {
      const last = groups[groups.length - 1];
      if (last && last.place === q.place && last.system === q.system) last.quotes.push(q);
      else groups.push({ place: q.place, body: q.body, system: q.system, first: q, quotes: [q] });
    }

    for (const g of groups) {
      const gEl = document.createElement("div");
      gEl.className = "grp";

      const head = document.createElement("div");
      head.className = "ghead";
      const pl = document.createElement("span");
      pl.className = "gplace";
      pl.textContent = g.place || "Unknown location";
      // The body and system stay available without spending a line on them.
      pl.title = [g.place, g.body, g.system].filter(Boolean).join(" · ");
      head.appendChild(pl);
      head.appendChild(Object.assign(document.createElement("span"), { className: "grule" }));

      // A real distance when we have one — it is exact where the tier word is only a category.
      g.first.__from = (lastOrigin && lastOrigin.label) || null;
      if (g.first.metres != null) {
        const dm = document.createElement("span");
        dm.className = "gdist";
        dm.textContent = fmtDist(g.first.metres);
        dm.title = fmtDist(g.first.metres) + " in a straight line from "
          + (g.first.__from || "where we last saw you") + ". It is the distance, not a travel "
          + "time: it does not know about spooling up, landing, docking, or getting to your ship.";
        head.appendChild(dm);
      }
      const tp = tierPill(g);
      if (tp) head.appendChild(tp);
      gEl.appendChild(head);

      for (const q of g.quotes) {
        const row = document.createElement("div");
        row.className = "grow";

        const w = document.createElement("span");
        w.className = "gshop";
        w.textContent = shortName(q.terminal, q.place, q.body);
        // ⚠️ The FULL terminal name stays reachable on hover. Stripping is a display convenience;
        // the name UEX actually publishes is what a player would search for or report a problem
        // about, so it must not become unrecoverable.
        w.title = q.terminal;
        row.appendChild(w);

        const a = document.createElement("span");
        a.className = "age " + ageBand(q.asOf);
        a.textContent = ageOf(q.asOf);
        a.title = "Last reported to UEX " + ageOf(q.asOf).replace(/^(\d+)d$/, "$1 days ago")
          + ". Shop prices in Star Citizen are fixed rather than a live market — 99.6% of them were "
          + "never once seen to change over a month — so an old reading is usually still correct. "
          + "The colour is how recently someone checked, not how wrong it might be.";
        row.appendChild(a);

        // 🔑 THE UNIT IS NAMED (Sub: "it just says seven"). Dimmed child span so the AMOUNT is what
        // the eye compares down the column, and so `.price` still holds only the number.
        const p = document.createElement("span");
        p.className = "price";
        p.textContent = fmt(q.price);
        const u = document.createElement("span");
        u.className = "unit";
        u.textContent = " aUEC";
        p.appendChild(u);
        row.appendChild(p);

        gEl.appendChild(row);
      }
      shops.appendChild(gEl);
    }
    el.appendChild(shops);

    // 🔴 The spread, and the rest of the shops. Both exist because "the price of X" does not:
    // 68% of items sold in more than one place cost different amounts at different shops.
    const notes = [];
    if (r.shopCount > SHOPS_SHOWN) notes.push("+" + (r.shopCount - SHOPS_SHOWN) + " more shop" + (r.shopCount - SHOPS_SHOWN === 1 ? "" : "s"));
    if (r.low !== r.high) notes.push(fmt(r.low) + "–" + fmt(r.high) + " aUEC depending where you buy");
    if (notes.length) {
      const m = document.createElement("div");
      m.className = "more";
      m.textContent = notes.join("  ·  ");
      el.appendChild(m);
    }
    return el;
  }

  function showEmpty(html) {
    const box = $("results");
    box.textContent = "";
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = html;
    box.appendChild(e);
  }

  function render(data) {
    const box = $("results");
    // The eye is about the SESSION, not about these results, so it updates on every response —
    // including the empty ones. A player who searched something we do not stock still deserves to
    // know whether we can see where they are.
    lastOrigin = data.origin || null;
    renderEye(data.origin, data.order);
    if (!data.query) {
      showEmpty("Type an item name.<br />Weapons, armour, ship components, gear.");
      return;
    }
    if (!data.results.length) {
      // 🔴 "We don't know of a shop" and "no such item" are DIFFERENT answers, and the common case
      // is the first: roughly two thirds of the item catalogue has no reported shop at all. Saying
      // "not found" flatly would tell the player the item does not exist, which is usually false.
      showEmpty("No shop known for <b>" + escapeHtml(data.query) + "</b>."
        + "<br />That often means nobody has reported one — "
        + (data.catalogueOnly ? fmt(data.catalogueOnly) + " known items have no shop on record." : "not that it cannot be bought."));
      return;
    }
    box.textContent = "";
    for (const r of data.results) box.appendChild(itemNode(r));
    box.scrollTop = 0;
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  /** 🔑 The footer says which tier the table came from, always — Sub's requirement is that the
   *  user knows when they are on a fallback, and only the screen they are looking at can say so. */
  function renderSource(data) {
    const el = $("src");
    // ⚠️ WRITE TO #srctext, NEVER TO #src. This used to set `textContent` on the whole span, which
    // is now the credit block — doing that would delete the UEX mark and wordmark on the first
    // response and leave the attribution showing only for the instant before any data arrived.
    const t = $("srctext");
    const age = data.fetchedAt ? ageOf(Math.floor(data.fetchedAt / 1000)) : "unknown age";
    if (data.source === "live") {
      el.className = "";
      // 🔑 "UEX via" is gone from the sentence because the wordmark beside it already says UEX.
      // Repeating it made the credit read as part of a status line rather than as a credit.
      t.textContent = "via subliminal.gg · updated " + age;
    } else if (data.source === "cache") {
      el.className = "fallback";
      t.textContent = "offline — last download " + age;
    } else {
      el.className = "fallback";
      t.textContent = "offline — using the copy that shipped with the app";
    }
    el.title = (data.itemCount || 0) + " items across " + (data.terminalCount || 0) + " shops."
      + (data.droppedOffline ? "  " + data.droppedOffline + " price rows were dropped for sitting at terminals the game no longer has." : "")
      + (data.lastError ? "  Last refresh failed: " + data.lastError : "");
  }

  async function run(q) {
    const mine = ++seq;
    try {
      const r = await fetch("/api/verse/search?q=" + encodeURIComponent(q) + "&limit=20&shops=" + (SHOPS_SHOWN + 3));
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      // An earlier request landing late must not replace a newer answer.
      if (mine !== seq) return;
      render(data);
      renderSource(data);
    } catch (e) {
      if (mine !== seq) return;
      showEmpty("Couldn't reach the overlay's own service.<br />The widget needs it running.");
    }
  }

  async function status() {
    try {
      const r = await fetch("/api/verse/status");
      if (r.ok) {
        const j = await r.json();
        renderSource(j);
        // Status carries the origin too, so the eye is right from the first frame rather than
        // only after the player's first search.
        renderEye(j.origin, null);
      }
    } catch { /* the search will report it */ }
  }

  const qEl = $("q");
  qEl.addEventListener("input", () => {
    const v = qEl.value.trim();
    if (v === lastQuery) return;
    lastQuery = v;
    if (timer) clearTimeout(timer);
    if (!v) { render({ query: "", results: [] }); seq++; return; }
    timer = setTimeout(() => run(v), DEBOUNCE_MS);
  });
  /* 🔴 The search box takes the CANVAS-WIDE keyboard grab, so its release set has to be complete:
     focus arms it, blur lowers it, Escape is an explicit way out, and `__verseFinderExitTyping`
     covers the widget being hidden — hiding UNLOADS this page, so a grab stranded that way could
     never be lowered by anything left on screen. Same rule as notepad/party/chat/logview. */
  qEl.addEventListener("focus", () => { try { host()?.editStart?.(); } catch { /* standalone */ } });
  qEl.addEventListener("blur", () => { try { host()?.editEnd?.(); } catch { /* standalone */ } });
  qEl.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    e.stopPropagation();
    if (qEl.value) { qEl.value = ""; lastQuery = ""; seq++; render({ query: "", results: [] }); }
    else qEl.blur();
  });

  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  // The shell's hand-back once the held interact key is released — safe to focus now.
  window.__verseFinderFocus = () => { try { qEl.focus(); } catch { /* gone */ } };
  window.__verseFinderExitTyping = () => {
    try { document.activeElement?.blur?.(); } catch { /* nothing focused */ }
    try { host()?.editEnd?.(); } catch { /* not embedded */ }
  };

  render({ query: "", results: [] });
  void status();
  try { host()?.ready?.(); } catch { /* not embedded */ }
</script>
</body>
</html>
