name: Build r31 Linux alpha 12

on:
  push:
    branches:
      - integration/upstream-0.1.36-arch-fedora-r31
    paths:
      - .github/workflows/r31-linux-alpha12.yml
      - linux-port/build-r31-alpha5.sh
      - linux-port/r31-alpha2-hover-pid.patch
      - linux-port/r31-alpha3-dom-widget-hit.patch
      - linux-port/r31-alpha4-main-handshake.patch
      - linux-port/r31-alpha4-renderer-regions.patch
      - linux-port/r31-alpha5-latched-cursor-shiftf6.patch
      - linux-port/r31-alpha6-prefocus-pointer.patch
      - linux-port/r31-alpha7-global-pointer-hook.patch
      - linux-port/r31-alpha8-gamescope-pointer.patch
      - linux-port/r31-alpha9-stable-interaction.patch
      - linux-port/r31-alpha10-verified-handoff.patch
      - linux-port/r31-alpha11-idle-pointer-pin.patch
      - linux-port/r31-alpha12-explicit-interaction-ownership.patch
      - test/r31-alpha2-session-binding.test.cjs
      - test/r31-alpha4-region-handshake.test.cjs
      - test/r31-alpha5-latched-interaction.test.cjs
      - test/r31-alpha6-prefocus-pointer.test.cjs
      - test/r31-alpha7-global-pointer-hook.test.cjs
      - test/r31-alpha8-gamescope-pointer.test.cjs
      - test/r31-alpha9-stable-interaction.test.cjs
      - test/r31-alpha10-verified-handoff.test.cjs
      - test/r31-alpha11-idle-pointer-pin.test.cjs
      - test/r31-alpha12-explicit-ownership.test.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arch-alpha12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare Alpha 12 source build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("linux-port/build-r31-alpha5.sh")
          text = path.read_text()

          old_loop = '''for patch in \\
            linux-port/r31-alpha2-hover-pid.patch \\
            linux-port/r31-alpha3-dom-widget-hit.patch \\
            linux-port/r31-alpha4-main-handshake.patch \\
            linux-port/r31-alpha4-renderer-regions.patch \\
            linux-port/r31-alpha5-latched-cursor-shiftf6.patch; do
            git apply --recount --check "$patch"
            git apply --recount "$patch"
          done'''
          new_loop = '''for patch in \\
            linux-port/r31-alpha2-hover-pid.patch \\
            linux-port/r31-alpha3-dom-widget-hit.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done

          for patch in \\
            linux-port/r31-alpha4-main-handshake.patch \\
            linux-port/r31-alpha4-renderer-regions.patch \\
            linux-port/r31-alpha5-latched-cursor-shiftf6.patch \\
            linux-port/r31-alpha6-prefocus-pointer.patch \\
            linux-port/r31-alpha7-global-pointer-hook.patch \\
            linux-port/r31-alpha8-gamescope-pointer.patch \\
            linux-port/r31-alpha9-stable-interaction.patch \\
            linux-port/r31-alpha10-verified-handoff.patch \\
            linux-port/r31-alpha11-idle-pointer-pin.patch \\
            linux-port/r31-alpha12-explicit-interaction-ownership.patch; do
            git apply --recount --check "$patch"
            git apply --recount "$patch"
          done'''
          if old_loop not in text:
              raise SystemExit("Alpha 5 patch loop was not found exactly")
          text = text.replace(old_loop, new_loop, 1)

          replacements = {
              "r31-alpha5-build": "r31-alpha12-build",
              "/tmp/r31-alpha5-linux.tar.gz": "/tmp/r31-alpha12-linux.tar.gz",
              "/tmp/r31-alpha5-core.tar.gz": "/tmp/r31-alpha12-core.tar.gz",
              "ArchVerse-Overlay-0.1.36-r31-alpha.5": "ArchVerse-Overlay-0.1.36-r31-alpha.12",
              '"0.1.36-r31-alpha.5"': '"0.1.36-r31-alpha.12"',
              "'0.1.36-r31-alpha.5'": "'0.1.36-r31-alpha.12'",
              "archverse-overlay-r31-alpha5.log": "archverse-overlay-r31-alpha12.log",
              "r31 alpha 5 static verification passed.": "r31 alpha 12 static verification passed.",
              "r31 alpha 5 diagnostics": "r31 alpha 12 diagnostics",
              "# ArchVerse Overlay 0.1.36-r31 alpha 5": "# ArchVerse Overlay 0.1.36-r31 alpha 12",
              "r31 alpha 5": "r31 alpha 12",
              "Alpha 5 package created": "Alpha 12 package created",
              "- The session ends when the pointer leaves every widget, Escape is pressed, or another window takes focus.":
                  "- The session remains interactive across coordinate misses until Escape is pressed or another window takes focus.",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          test_anchor = "  test/r31-alpha5-latched-interaction.test.cjs"
          if test_anchor not in text:
              raise SystemExit("Alpha 5 test anchor was not found")
          continuation = " " + chr(92) + "\n  "
          text = text.replace(
              test_anchor,
              test_anchor
              + continuation + "test/r31-alpha6-prefocus-pointer.test.cjs"
              + continuation + "test/r31-alpha7-global-pointer-hook.test.cjs"
              + continuation + "test/r31-alpha8-gamescope-pointer.test.cjs"
              + continuation + "test/r31-alpha9-stable-interaction.test.cjs"
              + continuation + "test/r31-alpha10-verified-handoff.test.cjs"
              + continuation + "test/r31-alpha11-idle-pointer-pin.test.cjs"
              + continuation + "test/r31-alpha12-explicit-ownership.test.cjs",
              1,
          )

          verify_anchor = "grep -q 'requestOverlayRegionSnapshot' \"$root/app/electron/main.cjs\""
          if verify_anchor not in text:
              raise SystemExit("Alpha 5 verification anchor was not found")
          text = text.replace(
              verify_anchor,
              verify_anchor
              + "\n"
              + "grep -q 'function refreshFHoverPointer' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'xdotool-root' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'F-down pre-focus' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'fHoverHookPointer = { x, y }' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'uiohook-global' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'stopPointerWatch = hotkeys.onMouseMove' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'gamescope-display' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'moveHostPointer' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'getdisplaygeometry' \"$root/app/electron/linux/focus-controller.cjs\"\n"
              + "grep -q 'gamescopePointerLocation' \"$root/app/electron/window-manager.cjs\"\n"
              + "grep -q 'preferHost: true' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'F_HOVER_LEAVE_GRACE_MS' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'error?.code === \"EPIPE\"' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'beginFHoverHostHandoff' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'host pointer handoff verified' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'uiohook-host-pinned' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'coordinate misses never' \"$root/app/electron/main.cjs\"\n"
              + "! grep -q 'pointer left classified widget' \"$root/app/electron/main.cjs\"",
              1,
          )

          readme_anchor = "Input behavior:\n"
          if readme_anchor not in text:
              raise SystemExit("README input behavior anchor was not found")
          text = text.replace(
              readme_anchor,
              readme_anchor
              + "- Before first focus, the interaction pointer follows Star Citizen's nested Gamescope/XWayland cursor.\n"
              + "- After a widget is entered, the overlay focuses first and verifies the host pointer before changing coordinate sources.\n"
              + "- While that handoff is pending, stale host samples cannot cancel the initial widget latch.\n"
              + "- After compositor motion is verified, that point remains authoritative while the mouse is idle.\n"
              + "- After F is released, coordinate misses cannot revoke interaction ownership; Escape or an external click ends it.\n",
              1,
          )

          path.write_text(text)
          PY

          bash -n linux-port/build-r31-alpha5.sh
          grep -n 'r31-alpha12-explicit-interaction-ownership.patch' linux-port/build-r31-alpha5.sh
          grep -n '0.1.36-r31-alpha.12' linux-port/build-r31-alpha5.sh

      - name: Build and verify Alpha 12
        shell: bash
        run: bash linux-port/build-r31-alpha5.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Overlay-0.1.36-r31-alpha.12-arch
          path: |
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.12-arch.tar.gz
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.12-arch.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
