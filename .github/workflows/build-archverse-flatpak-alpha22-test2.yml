name: Build ArchVerse Alpha22 Flatpak Test2

on:
  push:
    branches: [integration/flatpak-alpha22-test2]
    paths:
      - 'archverse-flatpak/**'
      - '.github/workflows/build-archverse-flatpak-alpha22-test2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, install, and GUI-smoke-test Flatpak Test 2
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout Flatpak Test 2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build current upstream sidecar
        run: |
          set -euxo pipefail
          npm ci
          npm run build:server

      - name: Run upstream Linux-safe regressions
        run: |
          set -euxo pipefail
          npm run test:handover
          npm run test:mining
          npm run test:location
          npm run test:contracts

      - name: Reconstruct verified Alpha 22 Linux shell
        run: |
          set -euxo pipefail
          rm -rf /tmp/archverse-a20 /tmp/archverse-stage /tmp/archverse-alpha20.tar.gz
          mkdir -p /tmp/archverse-a20 /tmp/archverse-stage/{app,bin,flatpak,tests}
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/gbmccray32-boop/sc-overlay-for-Arch-Linux/releases/download/v0.1.42-r31-alpha.20/ArchVerse-Overlay-0.1.42-r31-alpha.20-arch.tar.gz \
            -o /tmp/archverse-alpha20.tar.gz
          echo 'f4256aeac8c13fb0a64fc6065a8869bf58015dbe694200a550aaf9e99e3dd0a6  /tmp/archverse-alpha20.tar.gz' | sha256sum -c -
          tar -xzf /tmp/archverse-alpha20.tar.gz -C /tmp/archverse-a20 \
            --strip-components=2 --wildcards '*/app/electron/*'
          test -f /tmp/archverse-a20/electron/capture.cjs
          cp -a /tmp/archverse-a20/electron /tmp/archverse-stage/app/
          patch --batch /tmp/archverse-stage/app/electron/capture.cjs < archverse-flatpak/patches/electron/capture.patch
          patch --batch /tmp/archverse-stage/app/electron/linux/focus-controller.cjs < archverse-flatpak/patches/electron/focus-controller.patch
          patch --batch /tmp/archverse-stage/app/electron/main.cjs < archverse-flatpak/patches/electron/main.patch
          patch --batch /tmp/archverse-stage/app/electron/window-manager.cjs < archverse-flatpak/patches/electron/window-manager.patch
          patch --batch /tmp/archverse-stage/app/electron/linux/star-citizen-session.cjs < archverse-flatpak/patches/electron/star-citizen-session.patch
          cp archverse-flatpak/files/runtime-env.cjs /tmp/archverse-stage/app/electron/linux/
          cp archverse-flatpak/files/flatpak-star-citizen-session.cjs /tmp/archverse-stage/app/electron/linux/

      - name: Apply Alpha 22 sidecar safety deltas
        run: |
          set -euxo pipefail
          patch --batch build/server/overlay/config.html < archverse-flatpak/patches/server/config.html.patch
          patch --batch build/server/overlay/mining.html < archverse-flatpak/patches/server/mining.html.patch
          patch --batch build/server/overlay/missions.html < archverse-flatpak/patches/server/missions.html.patch
          patch --batch build/server/server.mjs < archverse-flatpak/patches/server/server.mjs.patch
          cp archverse-flatpak/files/overlay/archverse-resource-scanner.js build/server/overlay/
          cp archverse-flatpak/files/overlay/archverse-widget-appearance.js build/server/overlay/

      - name: Stage production payload
        run: |
          set -euxo pipefail
          npm prune --omit=dev
          cp -a build/server /tmp/archverse-stage/app/server
          cp -a node_modules /tmp/archverse-stage/app/node_modules
          cp archverse-flatpak/files/app-package.json /tmp/archverse-stage/app/package.json
          cp archverse-flatpak/files/bin/sc-blueprint-tracker /tmp/archverse-stage/bin/
          chmod 0755 /tmp/archverse-stage/bin/sc-blueprint-tracker
          cp LICENSE.md /tmp/archverse-stage/LICENSE.md
          cp -a archverse-flatpak/packaging/. /tmp/archverse-stage/flatpak/
          cp archverse-flatpak/io.github.gbmccray32_boop.ArchVerseOverlay.yml /tmp/archverse-stage/
          cp archverse-flatpak/tests/flatpak-session-binder.test.cjs /tmp/archverse-stage/tests/

      - name: Verify Alpha 22 and Flatpak invariants
        working-directory: /tmp/archverse-stage
        run: |
          set -euxo pipefail
          cat > /tmp/archverse-expected.sha256 <<'EOF'
          f9c6b94acfc5bc9e8bc32c77dfb3b45b16bc6e007a98f82e0e004b94a989b446  app/electron/capture.cjs
          b8bc6646b7794287e5956617f92e12bbe5debb7d21829027d9cdba2accd593cd  app/electron/linux/focus-controller.cjs
          4001214d820487e79d6b0807c072d648c49b8649f00255bdd0b29802fb5de632  app/electron/main.cjs
          15e617027065b38ce579c31b48ce274b489d7a97e3ed226ed8b5a315829263c4  app/electron/window-manager.cjs
          271a6e1761552d3badf71028c23564147cd0d555c77e6584beaa33173e7e7c45  app/electron/linux/star-citizen-session.cjs
          fe73014a1598961212a296ebbee3ae811ac9d8753d3555005e3bda61a05c8ced  app/electron/linux/runtime-env.cjs
          318f0525387c45e91e92759cfa51be73522b5ddd5b9db561c473601f26db30fe  app/electron/linux/flatpak-star-citizen-session.cjs
          fcc0e3706c83108d82a24802dc29b67c93735604c8aca3acc9010a5e8051d49f  app/server/overlay/config.html
          d12a82ed44d4969b895f2b0d8207eb976ae2d1a436fa2698b54188d3fd24b742  app/server/overlay/mining.html
          94aa2af1afeb4f73ded9f88face6345a199958e79d580eb69dd18ffbb737ff03  app/server/overlay/missions.html
          d3894c6309785c69a59864ce021497ad4c60202188896d2478da0b09c2568e2a  app/server/server.mjs
          c583fcaa92adcf0033d4e5b21f938ac0486a97962da020ae38456853d8701dc7  app/server/overlay/archverse-resource-scanner.js
          9a751e5712b48b21a779974d8e3ae5bba65872f5bbce90500ce771bdf8569c76  app/server/overlay/archverse-widget-appearance.js
          8cdd1cb1c3d533eabd027f490c7f1c92d8f883ec5465424b81058777007ef8a1  bin/sc-blueprint-tracker
          EOF
          sha256sum -c /tmp/archverse-expected.sha256
          node --check app/electron/capture.cjs
          node --check app/electron/main.cjs
          node --check app/electron/window-manager.cjs
          node --check app/electron/linux/focus-controller.cjs
          node --check app/electron/linux/star-citizen-session.cjs
          node --check app/electron/linux/runtime-env.cjs
          node --check app/electron/linux/flatpak-star-citizen-session.cjs
          node tests/flatpak-session-binder.test.cjs
          grep -q 'salvageConfirmed === true' app/server/overlay/mining.html
          grep -q 'salvageConfirmed === true' app/server/overlay/archverse-resource-scanner.js
          grep -q 'SC_TRACKER_CONFIG_DIR' app/server/server.mjs
          grep -q 'strip-components: 0' io.github.gbmccray32_boop.ArchVerseOverlay.yml
          grep -q 'xrandr --current' flatpak/archverse-overlay
          grep -q 'SC_OVERLAY_DEFAULT_ZONE_WIDTH' flatpak/archverse-overlay
          ! grep -R --line-number -E 'flatpak-spawn[[:space:]]+--host|org\.freedesktop\.Flatpak' .

      - name: Install Flatpak and headless desktop tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder librsvg2-bin appstream xvfb curl dbus-x11
          command -v dbus-run-session
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Render icon and validate metadata
        run: |
          set -euxo pipefail
          rsvg-convert -w 512 -h 512 \
            /tmp/archverse-stage/flatpak/io.github.gbmccray32_boop.ArchVerseOverlay.svg \
            -o /tmp/archverse-stage/flatpak/io.github.gbmccray32_boop.ArchVerseOverlay.png
          mkdir -p /tmp/archverse-stage/app/build
          cp /tmp/archverse-stage/flatpak/io.github.gbmccray32_boop.ArchVerseOverlay.png /tmp/archverse-stage/app/build/icon.png
          cp /tmp/archverse-stage/flatpak/io.github.gbmccray32_boop.ArchVerseOverlay.png /tmp/archverse-stage/app/server/overlay/tray-icon.png
          appstreamcli validate --no-net /tmp/archverse-stage/flatpak/io.github.gbmccray32_boop.ArchVerseOverlay.metainfo.xml

      - name: Build Flatpak Test 2
        working-directory: /tmp/archverse-stage
        run: |
          set -euxo pipefail
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo \
            builddir io.github.gbmccray32_boop.ArchVerseOverlay.yml
          mkdir -p dist
          flatpak build-bundle repo \
            dist/ArchVerse-Overlay-0.1.42-r31-alpha.22-flatpak-test2-x86_64.flatpak \
            io.github.gbmccray32_boop.ArchVerseOverlay alpha22 \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          sha256sum dist/ArchVerse-Overlay-0.1.42-r31-alpha.22-flatpak-test2-x86_64.flatpak \
            > dist/ArchVerse-Overlay-0.1.42-r31-alpha.22-flatpak-test2-x86_64.flatpak.sha256

      - name: Install bundle and verify sandbox resources
        working-directory: /tmp/archverse-stage
        run: |
          set -euxo pipefail
          flatpak install --user -y --reinstall dist/ArchVerse-Overlay-0.1.42-r31-alpha.22-flatpak-test2-x86_64.flatpak
          flatpak run --command=sh io.github.gbmccray32_boop.ArchVerseOverlay -lc '
            set -eux
            test "${SC_TRACKER_FLATPAK:-}" = 1
            command -v xdotool
            command -v xrandr
            test -x /app/archverse/bin/sc-blueprint-tracker
            test -x /app/lib/archverse-electron/electron
            test -d /app/lib/archverse-electron/locales
            test -f /app/lib/archverse-electron/locales/en-US.pak
            test -f /app/lib/archverse-electron/icudtl.dat
            test -f /app/lib/archverse-electron/resources.pak
            test -f /app/lib/archverse-electron/v8_context_snapshot.bin
            test -f /app/archverse/app/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/onnxruntime_binding.node
            test -f /app/archverse/app/node_modules/uiohook-napi/prebuilds/linux-x64/uiohook-napi.node
            test -f /app/archverse/app/node_modules/@gutenye/ocr-models/assets/ch_PP-OCRv4_rec_infer.onnx
            test ! -f /app/archverse/app/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_cuda.so
            test ! -f /app/archverse/app/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_tensorrt.so
            /app/bin/archverse-node -e "console.log(\"Electron-as-Node\", process.versions.electron, process.version)"
          '

      - name: Launch real ArchVerse GUI under Xvfb, private runtime dir, and D-Bus
        run: |
          set -euxo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/archverse-xdg-runtime"
          rm -rf "$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          test -O "$XDG_RUNTIME_DIR"
          ls -ld "$XDG_RUNTIME_DIR"

          dbus-run-session -- bash -ceu '
            set -o pipefail
            echo "CI runtime dir: $XDG_RUNTIME_DIR"
            echo "CI session bus: ${DBUS_SESSION_BUS_ADDRESS:-missing}"
            test -n "${DBUS_SESSION_BUS_ADDRESS:-}"

            Xvfb :99 -screen 0 1280x720x24 -ac +extension RANDR >/tmp/archverse-xvfb.log 2>&1 &
            XVFB_PID=$!
            cleanup() {
              flatpak kill io.github.gbmccray32_boop.ArchVerseOverlay 2>/dev/null || true
              kill "$XVFB_PID" 2>/dev/null || true
            }
            trap cleanup EXIT
            export DISPLAY=:99
            sleep 1

            flatpak run --env=SC_TRACKER_RENDER_MODE=gpu-off \
              io.github.gbmccray32_boop.ArchVerseOverlay \
              >/tmp/archverse-flatpak-gui.log 2>&1 &
            GUI_PID=$!

            ready=0
            for i in $(seq 1 20); do
              if ! kill -0 "$GUI_PID" 2>/dev/null; then
                echo "ArchVerse exited before GUI liveness gate." >&2
                cat /tmp/archverse-flatpak-gui.log >&2 || true
                cat /tmp/archverse-xvfb.log >&2 || true
                exit 1
              fi
              if curl -fsS http://127.0.0.1:8778/api/config >/tmp/archverse-api-config.json 2>/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done

            if [ "$ready" != 1 ]; then
              echo "Sidecar did not become ready within 20 seconds." >&2
              cat /tmp/archverse-flatpak-gui.log >&2 || true
              cat /tmp/archverse-xvfb.log >&2 || true
              find "$XDG_RUNTIME_DIR" -maxdepth 3 -ls >&2 || true
              exit 1
            fi

            kill -0 "$GUI_PID"
            flatpak ps | grep -F io.github.gbmccray32_boop.ArchVerseOverlay
            grep -Fq "[flatpak] detected desktop canvas: 1280x720" /tmp/archverse-flatpak-gui.log
            grep -Fq "[launcher] canvas profile: 1280x720" /tmp/archverse-flatpak-gui.log
            ! grep -Fq "locale_file_path.empty()" /tmp/archverse-flatpak-gui.log
            ! grep -Fq "Assertion failed: bus" /tmp/archverse-flatpak-gui.log
            sleep 4
            kill -0 "$GUI_PID"
            curl -fsS http://127.0.0.1:8778/api/config >/tmp/archverse-api-config-final.json
            echo "ArchVerse Flatpak GUI remained alive and sidecar responded."
            cat /tmp/archverse-flatpak-gui.log
          '

      - name: Prepare Test 2 field-test package
        if: success()
        run: |
          set -euxo pipefail
          cp archverse-flatpak/tools/flatpak-doctor.sh /tmp/archverse-stage/dist/flatpak-doctor.sh
          cp archverse-flatpak/tools/flatpak-electron-gui-smoke.sh /tmp/archverse-stage/dist/flatpak-electron-gui-smoke.sh
          chmod 0755 /tmp/archverse-stage/dist/flatpak-doctor.sh /tmp/archverse-stage/dist/flatpak-electron-gui-smoke.sh
          cat > /tmp/archverse-stage/dist/FLATPAK-TEST2-INSTRUCTIONS.txt <<'EOF'
          ArchVerse Overlay 0.1.42-r31 Alpha 22 — Flatpak Test 2
          ======================================================

          Test 2 fixes the incomplete Electron resource extraction found by the first Nobara test.
          It dynamically detects the available X11/XWayland desktop canvas instead of inheriting
          6360x2160. The first-run safe zone is clamped on smaller desktops. Explicit canvas
          environment overrides remain supported.

          Target: x86_64 Flatpak Linux with X11/XWayland, including Fedora/Nobara,
          Debian/Ubuntu/Mint/Pop!_OS, and Arch/CachyOS.

          Install/replace Test 1:
            flatpak install --user --reinstall ./ArchVerse-Overlay-0.1.42-r31-alpha.22-flatpak-test2-x86_64.flatpak

          Run:
            flatpak run io.github.gbmccray32_boop.ArchVerseOverlay

          Diagnostic:
            ./flatpak-doctor.sh

          Expected launch lines use the actual machine desktop, e.g.:
            [flatpak] detected desktop canvas: 1920x1080
            [launcher] canvas profile: 1920x1080 origin=auto,auto

          If the Wine prefix is outside ~/Games, /mnt, /media, or /run/media:
            flatpak override --user --filesystem=/path/to/star-citizen:ro io.github.gbmccray32_boop.ArchVerseOverlay

          Priorities: launch/liveness, dynamic canvas, desktop focus handoff, held-F interaction,
          Shift+F6, Star Citizen close handoff, game.log tracking, payout scan, Resource Scanner OCR,
          strict no-false-salvage rule, chat/party, tray behavior, and settings persistence.

          This remains a field-test package, not the final public LUG release.
          EOF

      - name: Upload Flatpak Test 2 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha22-Flatpak-Test2
          path: /tmp/archverse-stage/dist/*
          if-no-files-found: error
          compression-level: 0
