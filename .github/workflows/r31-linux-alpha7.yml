name: Build r31 Linux alpha 7

on:
  push:
    branches:
      - integration/upstream-0.1.36-arch-fedora-r31
    paths:
      - .github/workflows/r31-linux-alpha7.yml
      - linux-port/build-r31-alpha5.sh
      - linux-port/r31-alpha2-hover-pid.patch
      - linux-port/r31-alpha3-dom-widget-hit.patch
      - linux-port/r31-alpha4-main-handshake.patch
      - linux-port/r31-alpha4-renderer-regions.patch
      - linux-port/r31-alpha5-latched-cursor-shiftf6.patch
      - linux-port/r31-alpha6-prefocus-pointer.patch
      - linux-port/r31-alpha7-global-pointer-hook.patch
      - test/r31-alpha2-session-binding.test.cjs
      - test/r31-alpha4-region-handshake.test.cjs
      - test/r31-alpha5-latched-interaction.test.cjs
      - test/r31-alpha6-prefocus-pointer.test.cjs
      - test/r31-alpha7-global-pointer-hook.test.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arch-alpha7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare Alpha 7 source build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("linux-port/build-r31-alpha5.sh")
          text = path.read_text()

          old_loop = '''for patch in \\
            linux-port/r31-alpha2-hover-pid.patch \\
            linux-port/r31-alpha3-dom-widget-hit.patch \\
            linux-port/r31-alpha4-main-handshake.patch \\
            linux-port/r31-alpha4-renderer-regions.patch \\
            linux-port/r31-alpha5-latched-cursor-shiftf6.patch; do
            git apply --recount --check "$patch"
            git apply --recount "$patch"
          done'''
          new_loop = '''for patch in \\
            linux-port/r31-alpha2-hover-pid.patch \\
            linux-port/r31-alpha3-dom-widget-hit.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done

          for patch in \\
            linux-port/r31-alpha4-main-handshake.patch \\
            linux-port/r31-alpha4-renderer-regions.patch \\
            linux-port/r31-alpha5-latched-cursor-shiftf6.patch \\
            linux-port/r31-alpha6-prefocus-pointer.patch \\
            linux-port/r31-alpha7-global-pointer-hook.patch; do
            git apply --recount --check "$patch"
            git apply --recount "$patch"
          done'''
          if old_loop not in text:
              raise SystemExit("Alpha 5 patch loop was not found exactly")
          text = text.replace(old_loop, new_loop, 1)

          replacements = {
              "r31-alpha5-build": "r31-alpha7-build",
              "/tmp/r31-alpha5-linux.tar.gz": "/tmp/r31-alpha7-linux.tar.gz",
              "/tmp/r31-alpha5-core.tar.gz": "/tmp/r31-alpha7-core.tar.gz",
              "ArchVerse-Overlay-0.1.36-r31-alpha.5": "ArchVerse-Overlay-0.1.36-r31-alpha.7",
              '"0.1.36-r31-alpha.5"': '"0.1.36-r31-alpha.7"',
              "'0.1.36-r31-alpha.5'": "'0.1.36-r31-alpha.7'",
              "archverse-overlay-r31-alpha5.log": "archverse-overlay-r31-alpha7.log",
              "r31 alpha 5 static verification passed.": "r31 alpha 7 static verification passed.",
              "r31 alpha 5 diagnostics": "r31 alpha 7 diagnostics",
              "# ArchVerse Overlay 0.1.36-r31 alpha 5": "# ArchVerse Overlay 0.1.36-r31 alpha 7",
              "r31 alpha 5": "r31 alpha 7",
              "Alpha 5 package created": "Alpha 7 package created",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          test_anchor = "  test/r31-alpha5-latched-interaction.test.cjs"
          if test_anchor not in text:
              raise SystemExit("Alpha 5 test anchor was not found")
          text = text.replace(
              test_anchor,
              test_anchor
              + " \\\n  test/r31-alpha6-prefocus-pointer.test.cjs"
              + " \\\n  test/r31-alpha7-global-pointer-hook.test.cjs",
              1,
          )

          verify_anchor = "grep -q 'requestOverlayRegionSnapshot' \"$root/app/electron/main.cjs\""
          if verify_anchor not in text:
              raise SystemExit("Alpha 5 verification anchor was not found")
          text = text.replace(
              verify_anchor,
              verify_anchor
              + "\n"
              + "grep -q 'function refreshFHoverPointer' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'xdotool-root' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'F-down pre-focus' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'fHoverHookPointer = { x, y }' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'uiohook-global' \"$root/app/electron/main.cjs\"\n"
              + "grep -q 'stopPointerWatch = hotkeys.onMouseMove' \"$root/app/electron/main.cjs\"",
              1,
          )

          path.write_text(text)
          PY

          bash -n linux-port/build-r31-alpha5.sh
          grep -n 'r31-alpha7-global-pointer-hook.patch' linux-port/build-r31-alpha5.sh
          grep -n '0.1.36-r31-alpha.7' linux-port/build-r31-alpha5.sh

      - name: Build and verify Alpha 7
        shell: bash
        run: bash linux-port/build-r31-alpha5.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Overlay-0.1.36-r31-alpha.7-arch
          path: |
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.7-arch.tar.gz
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.7-arch.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
