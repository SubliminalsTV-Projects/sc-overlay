name: Build and release r31 Linux alpha 18

on:
  push:
    branches:
      - integration/upstream-0.1.41-arch-r31-alpha18
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: r31-alpha18-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arch-alpha18:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Download the released Alpha 17 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha17"
          gh release download v0.1.36-r31-alpha.17 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ArchVerse-Overlay-0.1.36-r31-alpha.17-arch.tar.gz' \
            --dir "$RUNNER_TEMP/alpha17"
          sha256sum "$RUNNER_TEMP/alpha17/ArchVerse-Overlay-0.1.36-r31-alpha.17-arch.tar.gz"

      - name: Rebase Alpha 17 onto upstream 0.1.41 and verify
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          set -o pipefail
          bash linux-port/build-r31-alpha18-sidecar-hotfix.sh \
            "$RUNNER_TEMP/alpha17/ArchVerse-Overlay-0.1.36-r31-alpha.17-arch.tar.gz" \
            2>&1 | tee "$RUNNER_TEMP/alpha18-build.log"

      - name: Stage Alpha 18 release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a "$RUNNER_TEMP/dist/." dist/
          ls -lh dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Preserve merge conflicts on the branch
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/r31-alpha18-build/work"
          [[ -d "$src" ]] || exit 0
          rm -rf linux-port/debug-alpha18
          mkdir -p linux-port/debug-alpha18/electron linux-port/debug-alpha18/overlay
          for f in main.cjs capture.cjs preload.cjs config-preload.cjs mining-preload.cjs; do
            [[ -f "$src/electron/$f" ]] && cp "$src/electron/$f" "linux-port/debug-alpha18/electron/$f"
          done
          for f in missions.html config.html mining.html; do
            [[ -f "$src/overlay/$f" ]] && cp "$src/overlay/$f" "linux-port/debug-alpha18/overlay/$f"
          done
          if ! grep -R -q '^<<<<<<<' linux-port/debug-alpha18; then
            rm -rf linux-port/debug-alpha18
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linux-port/debug-alpha18
          git commit -m '[skip ci] debug: capture alpha18 conflict snapshot'
          git push origin HEAD:integration/upstream-0.1.41-arch-r31-alpha18

      - name: Report Alpha 18 validation to PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### Alpha 18 CI: ${BUILD_STATUS}"
            echo
            echo "Commit: \`${GITHUB_SHA}\` · Run: \`${GITHUB_RUN_ID}\`"
            echo
            echo '<details><summary>Build tail</summary>'
            echo
            echo '```text'
            if [[ -f "$RUNNER_TEMP/alpha18-build.log" ]]; then
              tail -n 180 "$RUNNER_TEMP/alpha18-build.log"
            else
              echo 'Build did not reach the merge script.'
            fi
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/alpha18-pr-comment.md"
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/alpha18-pr-comment.md"

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Overlay-0.1.41-r31-alpha.18-arch
          path: |
            dist/ArchVerse-Overlay-0.1.41-r31-alpha.18-arch.tar.gz
            dist/ArchVerse-Overlay-0.1.41-r31-alpha.18-arch.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release-alpha18:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/upstream-0.1.41-arch-r31-alpha18'
    needs: build-arch-alpha18
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Overlay-0.1.41-r31-alpha.18-arch
          path: dist

      - name: Publish Alpha 18 GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.41-r31-alpha.18
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: ArchVerse Overlay 0.1.41-r31 Alpha 18
          prerelease: true
          generate_release_notes: false
          body: |
            Alpha 18 rebases the tested ArchVerse r31 Alpha 17 Linux port onto SubliminalsTV SC Overlay 0.1.41.

            Upstream included:
            - Every developer change through upstream 0.1.41.
            - The 0.1.40 mining scanner rebuild: much faster locked reads, RapidOCR-authoritative signatures, adaptive crops, rotating capture paths, colour-independent glyph detection, and improved ambiguous ore/debris call-outs.
            - The new Global / Server / Shard social Chat widget with verified RSI identity gating.
            - Current mission, reputation, Verify-from-logs, setup, settings, canvas, and widget fixes from 0.1.37-0.1.41.
            - The 0.1.41 server.mjs sidecar design running under Electron's Node runtime, plus current data/package optimizations.
            - The 0.1.41 tray-download crash fix and Unlock Alert claim-row fix.
            - Alpha 18 Linux hotfix: restores the 0.1.41 sidecarLogStream helper and removes the stale Alpha 17 fs.closeSync(fd) merge remnant that could stop the sidecar during startup.

            ArchVerse Linux behavior preserved:
            - Alpha 17's mandatory F interaction route, one native cursor, physical pointer forwarding, and KDE/Gamescope focus handoff.
            - Shift+F6 arrange mode and hard click-through over transparent canvas.
            - Exact StarCitizen.exe session binding and Linux capture backends.
            - Alpha 14's bounded OCR resources and OpenGL default with software Safe Mode fallback.
            - Alpha 17's structural Scan Mode gate, false-positive regression fixtures, diagnostics, and the rule that Mining Analysis/signature OCR stays dormant outside Scan Mode.

            Install:
            1. Download the .tar.gz or .zip asset and extract it.
            2. Run `./install-cachyos.sh --clean-install`.
            3. Do not add `--reset-layout` if you want to preserve your existing widget positions.

            Keep Alpha 17 available as the immediate rollback point while testing this prerelease.
          files: |
            dist/ArchVerse-Overlay-0.1.41-r31-alpha.18-arch.tar.gz
            dist/ArchVerse-Overlay-0.1.41-r31-alpha.18-arch.zip
            dist/SHA256SUMS
