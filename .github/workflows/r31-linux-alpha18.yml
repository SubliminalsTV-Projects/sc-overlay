name: Build and audit r31 Linux alpha 18

on:
  push:
    branches:
      - integration/upstream-0.1.41-arch-r31-alpha18
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: r31-alpha18-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arch-alpha18:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Download the released Alpha 17 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha17"
          gh release download v0.1.36-r31-alpha.17 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ArchVerse-Overlay-0.1.36-r31-alpha.17-arch.tar.gz' \
            --dir "$RUNNER_TEMP/alpha17"
          sha256sum "$RUNNER_TEMP/alpha17/ArchVerse-Overlay-0.1.36-r31-alpha.17-arch.tar.gz"

      - name: Semantically rebase Alpha 17 onto upstream 0.1.41 and verify
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          set -o pipefail
          bash linux-port/build-r31-alpha18-resolved.sh \
            "$RUNNER_TEMP/alpha17/ArchVerse-Overlay-0.1.36-r31-alpha.17-arch.tar.gz" \
            2>&1 | tee "$RUNNER_TEMP/alpha18-build.log"

      - name: Deep runtime/static merge audit
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          set -o pipefail
          bash linux-port/alpha18-runtime-audit.sh 2>&1 | tee "$RUNNER_TEMP/alpha18-audit.log"

      - name: Stage Alpha 18 audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a "$RUNNER_TEMP/dist/." dist/
          ls -lh dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Retain reconstructed runtime files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha18-runtime-debug
          path: |
            ${{ runner.temp }}/r31-alpha18-build/work/electron/main.cjs
            ${{ runner.temp }}/r31-alpha18-build/work/electron/capture.cjs
            ${{ runner.temp }}/r31-alpha18-build/work/electron/preload.cjs
            ${{ runner.temp }}/alpha18-build.log
            ${{ runner.temp }}/alpha18-audit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report Alpha 18 audit to PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### Alpha 18 deep audit: ${BUILD_STATUS}"
            echo
            echo "Commit: \`${GITHUB_SHA}\` · Run: \`${GITHUB_RUN_ID}\`"
            echo
            echo '<details><summary>Build tail</summary>'
            echo
            echo '```text'
            [[ -f "$RUNNER_TEMP/alpha18-build.log" ]] && tail -n 120 "$RUNNER_TEMP/alpha18-build.log" || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>Audit tail</summary>'
            echo
            echo '```text'
            [[ -f "$RUNNER_TEMP/alpha18-audit.log" ]] && tail -n 220 "$RUNNER_TEMP/alpha18-audit.log" || echo 'Deep audit did not start.'
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/alpha18-pr-comment.md"
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/alpha18-pr-comment.md"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ArchVerse-Overlay-0.1.41-r31-alpha.18-audited
          path: |
            dist/ArchVerse-Overlay-0.1.41-r31-alpha.18-arch.tar.gz
            dist/ArchVerse-Overlay-0.1.41-r31-alpha.18-arch.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # Deliberately quarantined. Green CI creates an internal audit artifact only.
  # Publication is a separate explicit approval step after the packaged runtime audit is clean.
  release-alpha18:
    if: ${{ false }}
    needs: build-arch-alpha18
    runs-on: ubuntu-latest
    steps:
      - run: echo "Alpha 18 release is quarantined pending runtime audit approval."
