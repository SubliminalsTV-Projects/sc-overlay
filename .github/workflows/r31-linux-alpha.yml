name: Build and release r31 Linux alpha 15

on:
  push:
    branches:
      - integration/upstream-0.1.36-arch-fedora-r31
    tags:
      - v0.1.36-r31-alpha.15
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r31-alpha15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arch-alpha15:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build and verify Alpha 15
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: bash linux-port/build-r31-alpha5.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Overlay-0.1.36-r31-alpha.15-arch
          path: |
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.15-arch.tar.gz
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.15-arch.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release-alpha15:
    if: github.event_name == 'push'
    needs: build-arch-alpha15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Overlay-0.1.36-r31-alpha.15-arch
          path: dist

      - name: Publish Alpha 15 GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.36-r31-alpha.15
          target_commitish: ${{ github.sha }}
          name: ArchVerse Overlay 0.1.36-r31 Alpha 15
          prerelease: true
          generate_release_notes: false
          body: |
            Alpha 15 repairs Linux F interaction and Scan Mode recognition while preserving Alpha 14's resource budget.

            Highlights:
            - Linux always registers and enables the physical F widget-entry gate.
            - Migrated settings and live Settings controls can no longer disable F or leave the config inconsistent.
            - Scan Mode is recognized from the fixed Prospector cone control before a ping, target, or signature exists.
            - The Scan Mode gate is an in-memory color/brightness check and launches no OCR processes.
            - Mining Analysis and Signature OCR remain dormant outside Scan Mode.
            - ArchVerse log lines include timestamps and diagnostics retain eight recent frame/result pairs.
            - Alpha 14's two-thread OCR budget, OpenGL default, and software Safe Mode are preserved.

            Install:
            1. Download the .tar.gz or .zip asset and extract it.
            2. Run `./install-cachyos.sh --clean-install`.
            3. Do not add `--reset-layout` if you want to preserve your existing widget positions.

            Keep Alpha 14 available as the rollback point while testing this prerelease.
          files: |
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.15-arch.tar.gz
            dist/ArchVerse-Overlay-0.1.36-r31-alpha.15-arch.zip
            dist/SHA256SUMS
