name: Build r31 Linux alpha

on:
  push:
    branches:
      - integration/upstream-0.1.36-arch-fedora-r31
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arch-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct Linux port payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r31-linux /tmp/r31-core
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import glob
          import re

          def decode_parts(pattern: str, output: str) -> None:
              parts = sorted(glob.glob(pattern))
              if not parts:
                  raise SystemExit(f"No payload chunks matched: {pattern}")
              encoded = "".join(Path(part).read_text(encoding="utf-8") for part in parts)
              encoded = re.sub(r"[^A-Za-z0-9+/=]", "", encoded)
              encoded += "=" * (-len(encoded) % 4)
              decoded = base64.b64decode(encoded, validate=False)
              Path(output).write_bytes(decoded)
              print(f"Decoded {len(parts)} parts from {pattern}: {len(encoded)} base64 chars -> {len(decoded)} bytes")

          decode_parts("linux-port/payload/part-*", "/tmp/r31-linux.tar.gz")
          decode_parts("linux-port/core/part-*", "/tmp/r31-core.tar.gz")
          PY
          gzip -t /tmp/r31-linux.tar.gz
          gzip -t /tmp/r31-core.tar.gz
          tar -xzf /tmp/r31-linux.tar.gz -C /tmp/r31-linux
          tar -xzf /tmp/r31-core.tar.gz -C /tmp/r31-core
          test -s /tmp/r31-linux/electron/window-manager.cjs
          test -s /tmp/r31-linux/electron/linux/star-citizen-session.cjs
          test -s /tmp/r31-core/electron/main.cjs

      - name: Apply Linux core and alpha 2 fixes
        shell: bash
        run: |
          set -euo pipefail
          BASE=5b70715f0958f01ab5d0b79124760c016c9410cd
          mkdir -p /tmp/r31-base /tmp/r31-conflicts
          merge_one() {
            local file="$1"
            mkdir -p "/tmp/r31-base/$(dirname "$file")"
            if git cat-file -e "$BASE:$file" 2>/dev/null && [[ -f "$file" ]]; then
              git show "$BASE:$file" > "/tmp/r31-base/$file"
              set +e
              git merge-file -p "$file" "/tmp/r31-base/$file" "/tmp/r31-core/$file" > "$file.merged"
              rc=$?
              set -e
              mv "$file.merged" "$file"
              if (( rc > 0 )); then
                cp "$file" "/tmp/r31-conflicts/$(basename "$file").conflict"
                echo "Merge conflict in $file" >&2
              elif (( rc < 0 )); then
                echo "Merge failure in $file" >&2
                exit 2
              fi
            else
              cp -a "/tmp/r31-core/$file" "$file"
            fi
          }

          for file in \
            electron/config-preload.cjs \
            electron/mining-preload.cjs; do
            merge_one "$file"
          done

          cp -a /tmp/r31-core/electron/browser-widget.cjs electron/browser-widget.cjs
          cp -a /tmp/r31-linux/electron/linux electron/
          cp -a /tmp/r31-linux/electron/hotkeys.cjs electron/hotkeys.cjs
          cp -a /tmp/r31-linux/electron/window-manager.cjs electron/window-manager.cjs
          cp -a /tmp/r31-linux/electron/rapidocr-client.cjs electron/rapidocr-client.cjs
          cp -a /tmp/r31-linux/electron/rapidocr-worker.cjs electron/rapidocr-worker.cjs

          if compgen -G '/tmp/r31-conflicts/*' >/dev/null; then
            printf '\nUnresolved merge markers:\n' >&2
            grep -R -n '^<<<<<<<\|^=======\|^>>>>>>>' /tmp/r31-conflicts >&2 || true
            exit 1
          fi

          git apply --check linux-port/r31-alpha2-hover-pid.patch
          git apply linux-port/r31-alpha2-hover-pid.patch

      - name: Apply alpha 2 package metadata and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          data['version'] = '0.1.36-r31-alpha.2'
          data['productName'] = 'ArchVerse Overlay'
          pkg.write_text(json.dumps(data, indent=2) + '\n')
          PY

          if grep -R -n '^<<<<<<<\|^=======\|^>>>>>>>' electron; then exit 1; fi
          node --check electron/main.cjs
          node --check electron/capture.cjs
          node --check electron/hotkeys.cjs
          node --check electron/window-manager.cjs
          node --check electron/linux/star-citizen-session.cjs
          node --check electron/rapidocr-client.cjs
          node --check electron/rapidocr-worker.cjs
          grep -n 'let registeredInteractKey = "F"' electron/main.cjs
          ! grep -n 'let registeredInteractKey = "RightAlt"' electron/main.cjs
          grep -n 'startFHoverPolling' electron/main.cjs
          grep -n 'directly (Wine detached from Gamescope ancestry)' electron/linux/star-citizen-session.cjs
          node --test test/r31-alpha2-session-binding.test.cjs

      - name: Install and build upstream server
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build:server

      - name: Assemble Arch/CachyOS alpha 2
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ArchVerse-Overlay-0.1.36-r31-alpha.2"
          mkdir -p "$OUT/app" "$OUT/bin" "$OUT/docs"
          cp -a electron "$OUT/app/"
          cp -a build/server "$OUT/app/"
          mkdir -p "$OUT/app/build"
          cp -a build/icon.png "$OUT/app/build/icon.png"

          node - "$OUT/app/package.json" <<'NODE'
          const fs = require('node:fs');
          const out = process.argv[2];
          const src = require('./package.json');
          fs.writeFileSync(out, JSON.stringify({
            name: 'archverse-overlay',
            version: '0.1.36-r31-alpha.2',
            description: 'Community Linux port of SC Overlay',
            main: 'electron/main.cjs',
            type: 'module',
            dependencies: {
              '@gutenye/ocr-node': src.dependencies['@gutenye/ocr-node'],
              'electron-updater': src.dependencies['electron-updater'],
              'uiohook-napi': src.dependencies['uiohook-napi']
            }
          }, null, 2) + '\n');
          NODE

          cp -a /tmp/r31-linux/sc-blueprint-tracker "$OUT/bin/sc-blueprint-tracker"
          cp -a /tmp/r31-linux/install-cachyos.sh "$OUT/install-cachyos.sh"
          cp -a /tmp/r31-linux/uninstall-cachyos.sh "$OUT/uninstall-cachyos.sh"
          cp -a /tmp/r31-linux/doctor.sh "$OUT/doctor.sh"
          cp -a /tmp/r31-linux/install-input-access.sh "$OUT/install-input-access.sh"
          cp -a LICENSE.md "$OUT/LICENSE.md"
          [[ -f FORK-NOTICE.md ]] && cp FORK-NOTICE.md "$OUT/FORK-NOTICE.md" || true
          cp LINUX-PORT-PLAN.md "$OUT/docs/"
          cp docs/R31-INPUT-DESIGN.md "$OUT/docs/"

          python3 - "$OUT/install-cachyos.sh" "$OUT/doctor.sh" <<'PY'
          from pathlib import Path
          import sys

          installer = Path(sys.argv[1])
          text = installer.read_text()
          text = text.replace('0.1.33-r30.2-rapidocr-worker-isolation', '0.1.36-r31-alpha.2')
          text = text.replace("data.holdToInteract = true;", "data.holdToInteract = true;\ndata.interactHotkey = 'F';")
          text = text.replace('Hold F + click', 'Hold F while the pointer is over a widget + click')
          text = text.replace('archverse-overlay-r30.2.log', 'archverse-overlay-r31-alpha2.log')
          text = text.replace('r30.2', 'r31 alpha 2')
          installer.write_text(text)

          doctor = Path(sys.argv[2])
          doctor.write_text(doctor.read_text().replace(
              '0.1.33-r30 diagnostics', '0.1.36-r31 alpha 2 diagnostics'))
          PY

          cat > "$OUT/README.md" <<'DOC'
          # ArchVerse Overlay 0.1.36-r31 alpha 2

          Arch/CachyOS test build for hover-gated F interaction and direct Star Citizen PID binding.

          Input behavior:
          - Hold F while the pointer is over a visible widget to interact.
          - Pressing F over empty transparent canvas leaves Star Citizen focused.
          - Leaving every widget or releasing F restores click-through and the prior window focus.
          - Right Alt is no longer used as the Linux interaction key.
          - Ctrl+Alt+M arranges widgets.
          - Escape restores click-through.

          Screen reader behavior:
          - Uses strict StarCitizen.exe -> Gamescope validation when that ancestry exists.
          - Falls back to the exact StarCitizen.exe PID and /proc start time when Wine detaches.

          This is an alpha. Keep the previous working archive available for rollback.

          Install:
              ./install-cachyos.sh --clean-install

          Launch with logging:
              sc-blueprint-tracker 2>&1 | tee ~/archverse-overlay-r31-alpha2.log
          DOC

          cat > "$OUT/verify-alpha.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          for f in \
            app/electron/main.cjs \
            app/electron/capture.cjs \
            app/electron/window-manager.cjs \
            app/electron/linux/star-citizen-session.cjs \
            app/electron/rapidocr-client.cjs \
            app/electron/rapidocr-worker.cjs \
            app/server/sc-overlay-server.mjs \
            install-cachyos.sh \
            bin/sc-blueprint-tracker; do
            [[ -s "$root/$f" ]] || { echo "missing $f" >&2; exit 1; }
          done
          find "$root/app/electron" -type f \( -name '*.cjs' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          grep -q 'let registeredInteractKey = "F"' "$root/app/electron/main.cjs"
          ! grep -q 'let registeredInteractKey = "RightAlt"' "$root/app/electron/main.cjs"
          grep -q 'startFHoverPolling' "$root/app/electron/main.cjs"
          grep -q 'directly (Wine detached from Gamescope ancestry)' "$root/app/electron/linux/star-citizen-session.cjs"
          bash -n "$root/install-cachyos.sh" "$root/bin/sc-blueprint-tracker" "$root/doctor.sh"
          echo 'r31 alpha 2 static verification passed.'
          SH

          chmod +x "$OUT"/*.sh "$OUT/bin/sc-blueprint-tracker"
          "$OUT/verify-alpha.sh"
          tar -czf "$RUNNER_TEMP/ArchVerse-Overlay-0.1.36-r31-alpha.2-arch.tar.gz" -C "$RUNNER_TEMP" "$(basename "$OUT")"
          (cd "$RUNNER_TEMP" && sha256sum ArchVerse-Overlay-0.1.36-r31-alpha.2-arch.tar.gz > ArchVerse-Overlay-0.1.36-r31-alpha.2-arch.tar.gz.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Overlay-0.1.36-r31-alpha.2-arch
          path: |
            ${{ runner.temp }}/ArchVerse-Overlay-0.1.36-r31-alpha.2-arch.tar.gz
            ${{ runner.temp }}/ArchVerse-Overlay-0.1.36-r31-alpha.2-arch.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
